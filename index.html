so that total error on new data is low.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>Explain how 5-fold cross-validation works.<\/p>\n","answer":"<p>Split the data into five equal groups. Train on four and test on the fifth, and repeat so that each group is the test set once. The cross-validated MSE is the average of the five test errors.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>Why can you not use HDI and <code>expected_years_schooling<\/code> as predictors in the same model?<\/p>\n","answer":"<p>The HDI is built from expected years of schooling. Including both means entering the same information twice, so the model could not distinguish their contributions.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>In a gravity model in logs, how do you interpret a coefficient of $-1.5$ on distance?<\/p>\n","answer":"<p>A 1 percent greater distance is associated with about 1.5 percent less trade, on average.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>Why do log-linear gravity models exclude pairs of countries that do not trade?<\/p>\n","answer":"<p>The logarithm of zero does not exist, so those pairs cannot be included. This excludes observations that may carry information.<\/p>\n"},{"kind":"q","n":25,"ask":"<p>Why should an estimate of &quot;export potential&quot; be treated with caution?<\/p>\n","answer":"<p>The model omits trade agreements, supply chains, shared history and products. Prediction intervals are very wide, and actual trade below the prediction can be just noise. Whether promotion would close any gap is a causal question.<\/p>\n"},{"kind":"q","n":26,"ask":"<p>Name four checks you should make on a regression produced with the help of an AI chatbot.<\/p>\n","answer":"<p>Any four of these: check the formula; count the observations; check column names; recalculate one prediction by hand; check for causal language; look at test error and a baseline; and look for transformations.<\/p>\n"},{"kind":"q","n":27,"ask":"<p>Why might a good model for prediction be a poor one for explanation?<\/p>\n","answer":"<p>Prediction needs a small error on new cases, even if individual coefficients are unstable or biased. Explanation needs believable coefficients, and a predictive model may contain highly correlated variables that make its coefficients uninterpretable.<\/p>\n"},{"kind":"q","n":28,"ask":"<p>Why might we accept some bias in a prediction policy problem?<\/p>\n","answer":"<p>Because what matters is the total error on new cases. A small increase in bias is worth accepting if it reduces variance by more.<\/p>\n"},{"kind":"q","n":29,"ask":"<p>Which part of the export potential calculation is a prediction, and which part requires a causal claim?<\/p>\n","answer":"<p>Predicting how much trade would be normal given GDP and distance is the prediction. Claiming that promotion spending would close the gap is a causal claim, on which the model is silent.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: Income and life expectancy (World Bank).<\/strong> Using the <code>WDI<\/code> package in R, download data for all countries for 2022 on <code>SP.DYN.LE00.IN<\/code> (life expectancy, years) and <code>NY.GDP.PCAP.CD<\/code> (GDP per person, current US$). After cleaning the data, estimate a simple linear regression with life expectancy as the dependent variable and GDP per person as the independent variable. Draw a scatter plot with the regression line and interpret the coefficients. Then repeat with the logarithm of GDP per person. Which is the better fit, and why?<\/p>\n","answer":"<p>World Bank data, downloaded on 10 November 2026. There are <strong>206 countries<\/strong> with complete data.<\/p>\n<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(gdp))\nm1 &lt;- lm(life ~ gdp, d)\nm2 &lt;- lm(life ~ log(gdp), d)\nsummary(m1); summary(m2)\nplot(life ~ log(gdp), d); abline(m2)\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Model<\/th>\n<th align=\"right\">Slope<\/th>\n<th align=\"right\">R²<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Life expectancy on GDP per person<\/td>\n<td align=\"right\">0.000143<\/td>\n<td align=\"right\">0.327<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Life expectancy on log GDP per person<\/td>\n<td align=\"right\">4.255<\/td>\n<td align=\"right\">0.631<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>In the first model, an extra US$10,000 of GDP per person is associated with about 1.4 more years of life. In the second model, a 1 percent higher income is associated with about 0.043 more years, so a doubling is associated with about 4.255 × ln 2 = 2.9 more years.<\/p>\n<p><strong>The log model fits better<\/strong>, because the relationship is curved: life expectancy rises quickly at low incomes and then flattens. A straight line in logs captures this.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Adding health spending (World Bank).<\/strong> Download data for all countries for 2022 on <code>SP.DYN.LE00.IN<\/code> (life expectancy), <code>NY.GDP.PCAP.CD<\/code> (GDP per person) and <code>SH.XPD.CHEX.GD.ZS<\/code> (current health expenditure, % of GDP). After cleaning the data, estimate a multiple linear regression with life expectancy as the dependent variable and GDP per person and health expenditure as independent variables. Compare this model with the simple regression that uses only GDP per person. Does including health expenditure improve the explanation of differences in life expectancy between countries?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;, health = &quot;SH.XPD.CHEX.GD.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(gdp), !is.na(health))\nm1 &lt;- lm(life ~ log(gdp), d)\nm2 &lt;- lm(life ~ log(gdp) + health, d)\nsummary(m1)$adj.r.squared\nsummary(m2)$adj.r.squared\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>186 countries<\/strong> with complete data.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Model<\/th>\n<th align=\"right\">Adjusted R²<\/th>\n<th align=\"right\">Coefficient on health spending<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">GDP per person<\/td>\n<td align=\"right\">0.310<\/td>\n<td align=\"right\"><\/td>\n<\/tr>\n<tr>\n<td align=\"left\">GDP per person and health spending<\/td>\n<td align=\"right\">0.315<\/td>\n<td align=\"right\">0.23 (p = 0.12)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Log GDP per person<\/td>\n<td align=\"right\">0.625<\/td>\n<td align=\"right\"><\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Log GDP per person and health spending<\/td>\n<td align=\"right\">0.623<\/td>\n<td align=\"right\">0.015 (p = 0.90)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Health spending adds almost nothing.<\/strong> With income in dollars, adjusted R² rises by only 0.005, and with income in logs it falls slightly. Either way the coefficient is not significant, and income already contains most of the information.<\/p>\n<p>Interpret the coefficient as an association. Countries that spend more on health differ in many ways, and countries with sicker populations may need to spend more, so the coefficient is not evidence of what extra spending would achieve.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: Predicting unemployment (World Bank).<\/strong> Download data for all countries for 2022 on <code>SL.UEM.TOTL.ZS<\/code> (unemployment rate, %), <code>NY.GDP.PCAP.CD<\/code> (GDP per person) and <code>SP.URB.TOTL.IN.ZS<\/code> (urban population, % of total). Estimate a model with unemployment as the dependent variable and GDP per person and urban population as the independent variables. Then calculate the predicted unemployment rate for a hypothetical country with GDP per person of 15,000 and an urban population share of 65, and briefly interpret the result.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(unemp = &quot;SL.UEM.TOTL.ZS&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;, urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(unemp), !is.na(gdp), !is.na(urban))\nm &lt;- lm(unemp ~ gdp + urban, d)\nsummary(m)\npredict(m, newdata = data.frame(gdp = 15000, urban = 65), interval = &quot;prediction&quot;)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>179 countries<\/strong> with complete data.<\/p>\n<p>The estimated equation is: unemployment = 4.37 − 0.000082 × GDP per person + 0.0685 × urban share. Both slopes are statistically significant, but <strong>R² is only 0.086<\/strong>.<\/p>\n<p>For GDP per person of 15,000 and an urban share of 65, the prediction is <strong>7.59 percent<\/strong>, with a 95 percent prediction interval from <strong>−3.47 to 18.64 percent<\/strong>. The interval contains impossible negative values, and it is so wide that the point estimate tells us little. GDP per person and urbanisation explain very little of the differences in unemployment between countries, so this should not be read as a forecast of any particular country.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: Which model predicts better? (World Bank).<\/strong> Download data for all countries for 2022 on life expectancy (<code>SP.DYN.LE00.IN<\/code>), GDP per person (<code>NY.GDP.PCAP.CD<\/code>), health expenditure (<code>SH.XPD.CHEX.GD.ZS<\/code>) and urban population (<code>SP.URB.TOTL.IN.ZS<\/code>). After cleaning the data, split them into a training set (70 percent of observations) and a test set (30 percent), with a fixed seed <code>set.seed(123)<\/code>. Estimate two models for predicting life expectancy: (a) a simple linear regression with GDP per person; (b) a multiple linear regression with GDP per person, health expenditure and urban population. For both models, show the <code>summary()<\/code> results, calculate the MSE on the training set, calculate the MSE on the test set, and compare the models, explaining which you would choose if the aim is better prediction of new data. Finally, carry out 5-fold cross-validation for both models and compare the cross-validated MSE. Does the conclusion from cross-validation match the conclusion from the training and test split?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nlibrary(boot)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;,\n                       health = &quot;SH.XPD.CHEX.GD.ZS&quot;, urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(gdp), !is.na(health), !is.na(urban))\n\nset.seed(123)\nidx &lt;- sample(nrow(d), floor(0.7 * nrow(d)))\ntrain &lt;- d[idx, ]; test &lt;- d[-idx, ]\na &lt;- lm(life ~ gdp, train)\nb &lt;- lm(life ~ gdp + health + urban, train)\nmse &lt;- function(m, x) mean((predict(m, x) - x$life)^2)\nc(a_train = mse(a, train), a_test = mse(a, test),\n  b_train = mse(b, train), b_test = mse(b, test))\n\nset.seed(123)\ncv.glm(d, glm(life ~ gdp, data = d), K = 5)$delta[2]\ncv.glm(d, glm(life ~ gdp + health + urban, data = d), K = 5)$delta[2]\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>186 countries<\/strong> with complete data (130 in training and 56 in test).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Model<\/th>\n<th align=\"right\">R² (training)<\/th>\n<th align=\"right\">Training MSE<\/th>\n<th align=\"right\">Test MSE<\/th>\n<th align=\"right\">5-fold CV MSE<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">(a) GDP per person<\/td>\n<td align=\"right\">0.438<\/td>\n<td align=\"right\">22.84<\/td>\n<td align=\"right\">91.89<\/td>\n<td align=\"right\">44.35<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(b) GDP, health spending and urban population<\/td>\n<td align=\"right\">0.614<\/td>\n<td align=\"right\">15.67<\/td>\n<td align=\"right\">83.29<\/td>\n<td align=\"right\">36.99<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Choose model (b).<\/strong> It has the lower error on the test set and in cross-validation, and over 100 seeds it beats (a) in 99 percent of cases, with average MSEs of 37.6 against 45.3. The two conclusions match.<\/p>\n<p>Notice how far the test error is above the training error, and above the cross-validated error. In this split the test set happens to contain cases that are hard to predict, which shows why a single 70/30 split can be misleading. Only urban population and GDP are clearly significant in model (b). Health spending is not (p = 0.15).<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: Inflation and unemployment in the EU (Eurostat).<\/strong> Using the <code>eurostat<\/code> package in R, download data for the countries of the European Union for 2022 on the unemployment rate and annual inflation. After cleaning and merging the data, split them into a training set (70 percent) and a test set (30 percent), with <code>set.seed(123)<\/code>. Estimate two models for predicting the unemployment rate: (a) a simple linear regression with inflation as the independent variable; (b) a simple linear regression with inflation, after removing the countries with extreme values of inflation. For both models, draw a scatter plot with a regression line, calculate the MSE on the training set and on the test set, and compare whether removing the extreme values leads to a better predictive model. Then carry out 5-fold cross-validation for both models and compare the values. Comment briefly on whether the results show that the simpler and cleaner model has better ability to generalise. Why might excluding those countries be a questionable decision? (See Chapter 5.)<\/p>\n","answer":"<p>Using the 27 EU members from <code>eurostat_2022_tidy.csv<\/code> with <code>set.seed(123)<\/code> for the split (18 training countries and 9 test countries). &quot;Extreme&quot; here means inflation above 17 percent, which covers Estonia, Lithuania and Latvia. The strict 1.5 × IQR rule would flag only Estonia.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Model<\/th>\n<th align=\"right\">Slope<\/th>\n<th align=\"right\">Training MSE<\/th>\n<th align=\"right\">Test MSE<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">(a) All training countries<\/td>\n<td align=\"right\">−0.113<\/td>\n<td align=\"right\">4.96<\/td>\n<td align=\"right\">7.93<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(b) Without extreme inflation (15 countries)<\/td>\n<td align=\"right\">−0.336<\/td>\n<td align=\"right\">5.20<\/td>\n<td align=\"right\">7.24<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The 5-fold cross-validated MSE with this seed is 6.90 for all countries and 6.35 without the Baltic states. Over 200 different seeds the averages are <strong>6.74 and 6.73<\/strong>, which are practically identical. The first comparison is therefore mostly noise from a very small sample, and removing the extreme values does not clearly improve the model's ability to generalise.<\/p>\n<p>Excluding them is questionable because the Baltic states' inflation is real, not an error. Under Chapter 5's framework, you need a reason for treating real observations as irrelevant to the question. Also, cross-validation on a different set of countries is not strictly comparable.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6: Okun's law in Europe (Eurostat).<\/strong> Download annual real GDP growth (<code>nama_10_gdp<\/code>) and unemployment rates (<code>une_rt_a<\/code>) for 2005 to 2023 for Greece, Spain, Germany and at least one Western Balkan country. Estimate Okun's law for each, with and without 2020 and 2021. Which country's unemployment is most responsive to growth? Why might North Macedonia's relationship be weak?<\/p>\n","answer":"<p>Eurostat's data give comparable values for 2010 to 2023 (13 or 14 years for each country). The table shows the slope of the change in unemployment on real GDP growth.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">Slope, all years<\/th>\n<th align=\"right\">R²<\/th>\n<th align=\"right\">Slope, without 2020 and 2021<\/th>\n<th align=\"right\">R²<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Greece<\/td>\n<td align=\"right\">−0.45<\/td>\n<td align=\"right\">0.66<\/td>\n<td align=\"right\">−0.65<\/td>\n<td align=\"right\">0.88<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Spain<\/td>\n<td align=\"right\">−0.29<\/td>\n<td align=\"right\">0.43<\/td>\n<td align=\"right\">−0.70<\/td>\n<td align=\"right\">0.75<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Germany<\/td>\n<td align=\"right\">−0.14<\/td>\n<td align=\"right\">0.60<\/td>\n<td align=\"right\">−0.16<\/td>\n<td align=\"right\">0.64<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">North Macedonia<\/td>\n<td align=\"right\">−0.13<\/td>\n<td align=\"right\">0.12<\/td>\n<td align=\"right\">−0.37<\/td>\n<td align=\"right\">0.27<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Serbia<\/td>\n<td align=\"right\">+0.10<\/td>\n<td align=\"right\">0.02<\/td>\n<td align=\"right\">−0.16<\/td>\n<td align=\"right\">0.03<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Spain and Greece are the most responsive<\/strong>, especially without the pandemic years. The pandemic flattens the relationship, particularly in Spain, because furlough schemes cut output more than recorded unemployment. Germany's labour market is much less responsive.<\/p>\n<p>North Macedonia's relationship may be weak because of a large informal sector, emigration (which lowers unemployment independently of growth), active employment programmes, measurement changes in survey data and the short sample. With 14 observations, all these results are imprecise.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7: Beyond GDP and distance (CEPII).<\/strong> CEPII's Gravity database provides variables for contiguity, common language, colonial ties and trade agreements. Merge some of them with <code>gravity_data.xlsx<\/code> and estimate an augmented gravity model. Does the cross-validated MSE improve? Does Egypt remain at the top of North Macedonia's list? Repeat with a dummy variable for each exporter.<\/p>\n","answer":"<p><em>CEPII's Gravity database is a very large download and was not used in preparing these solutions, so no figures are given.<\/em><\/p>\n<p>Merge by exporter and importer and add variables such as <code>contig<\/code> (shared border), <code>comlang_off<\/code> (common language), <code>col_dep_ever<\/code> (colonial ties) and <code>fta_wto<\/code> (trade agreement). Check that the country codes match, and check the row count after merging. Then:<\/p>\n<pre><code class=\"language-r\">augmented &lt;- glm(log_trade ~ log_gdp_o + log_gdp_d + log_distance +\n                   contig + comlang_off + col_dep_ever + fta_wto, data = merged)\ncv.glm(merged, augmented, K = 10)$delta[1]\n<\/code><\/pre>\n<p>Compare the result with the book's MSE of 7.16. Expect the error to fall, and expect the potential ranking to change, since neighbours with trade agreements will now be predicted more accurately. With a dummy variable for each exporter, use <code>factor(origin)<\/code>. This absorbs everything about the exporter, including its GDP, so you must remove <code>log_gdp_o<\/code>.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8: Export potential for a neighbour.<\/strong> Repeat the export potential calculation for Albania or Serbia. Calculate prediction intervals for the top three destinations. Would you recommend any of them to a minister? On what evidence?<\/p>\n","answer":"<p>Using <code>gravity_data.xlsx<\/code> and the model in this chapter:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"left\">Destination<\/th>\n<th align=\"right\">Actual ($m)<\/th>\n<th align=\"right\">Predicted ($m)<\/th>\n<th align=\"left\">95% prediction interval ($m)<\/th>\n<th align=\"right\">Potential ($m)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Albania<\/td>\n<td align=\"left\">United Kingdom<\/td>\n<td align=\"right\">8.03<\/td>\n<td align=\"right\">87.85<\/td>\n<td align=\"left\">0.46 to 16,678<\/td>\n<td align=\"right\">79.82<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Albania<\/td>\n<td align=\"left\">France<\/td>\n<td align=\"right\">30.89<\/td>\n<td align=\"right\">106.82<\/td>\n<td align=\"left\">0.56 to 20,281<\/td>\n<td align=\"right\">75.93<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Albania<\/td>\n<td align=\"left\">Türkiye<\/td>\n<td align=\"right\">57.79<\/td>\n<td align=\"right\">93.30<\/td>\n<td align=\"left\">0.49 to 17,718<\/td>\n<td align=\"right\">35.51<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Serbia<\/td>\n<td align=\"left\">United Kingdom<\/td>\n<td align=\"right\">447.57<\/td>\n<td align=\"right\">555.38<\/td>\n<td align=\"left\">2.93 to 105,448<\/td>\n<td align=\"right\">107.81<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Serbia<\/td>\n<td align=\"left\">Switzerland<\/td>\n<td align=\"right\">245.42<\/td>\n<td align=\"right\">347.38<\/td>\n<td align=\"left\">1.83 to 65,959<\/td>\n<td align=\"right\">101.96<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Serbia<\/td>\n<td align=\"left\">India<\/td>\n<td align=\"right\">24.84<\/td>\n<td align=\"right\">99.10<\/td>\n<td align=\"left\">0.52 to 18,812<\/td>\n<td align=\"right\">74.26<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">top3 &lt;- subset(data, origin == &quot;Albania&quot;)\ntop3 &lt;- top3[order(-top3$export_potential), ][1:3, ]\nexp(predict(model, top3, interval = &quot;prediction&quot;)) / 1e6\n<\/code><\/pre>\n<p>Do not recommend any of them on this evidence alone. Actual trade lies inside every prediction interval, so &quot;potential&quot; is statistically indistinguishable from noise. As with North Macedonia, both countries export far more in total than the model predicts. The list can only be a starting point for looking at products, trade agreements and market access.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Exercise 9 (AI): Catch the causal language.<\/strong> Give a chatbot the regression output from Exercise 2 and ask it to write a paragraph for a minister of health. Underline every causal claim and rewrite the paragraph so that it says only what the data support.<\/p>\n","answer":"<p>The result depends on the chatbot, but you will often see phrases such as &quot;increasing health spending will improve life expectancy&quot;. Rewrite them as associations. For example: &quot;Countries with higher health spending, at the same GDP per person, had on average longer life expectancy. These data cannot show whether more spending would raise life expectancy, because countries that spend more also differ in other ways.&quot;<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Exercise 10 (AI): Audit a cross-validation.<\/strong> Ask a chatbot to write 5-fold cross-validation code from memory for the models in Section 9.9, without using <code>boot<\/code>. Run it. Does it reproduce results of a similar size to those in the book? Find one thing in the code that you had to check, and explain how you checked it.<\/p>\n","answer":"<p>This self-written version of 5-fold cross-validation gives results of a similar size to the book's:<\/p>\n<pre><code class=\"language-r\">library(readxl)\nd &lt;- read_excel(&quot;data/regression_example_data.xlsx&quot;)\nnames(d)[7] &lt;- &quot;electricity_access&quot;\ncv &lt;- function(f, k = 5, seed = 1) {\n  set.seed(seed)\n  fold &lt;- sample(rep(1:k, length.out = nrow(d)))\n  mean(sapply(1:k, function(i) {\n    m &lt;- lm(f, d[fold != i, ])\n    mean((predict(m, d[fold == i, ]) - d$internet_penetration[fold == i])^2)\n  }))\n}\n<\/code><\/pre>\n<p>With this code and seed 1, the MSEs for the six-variable, five-variable and HDI models are <strong>100.9, 100.4 and 95.6<\/strong>. These are not identical to the book's figures, because <code>cv.glm<\/code> uses a different random assignment of folds. You should check that each observation is used exactly once for testing (<code>table(fold)<\/code> shows equal groups) and that the test predictions come from a model that did not see those observations. A common mistake by chatbots is to fit the model on all data before splitting.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Exercise 11: A budget as an umbrella.<\/strong> A finance ministry must predict next year's value-added tax revenue. Using the five questions in Section 7.2, set out the decision and the costs of predicting too high and too low. Which variables would be known when the budget is written? Which of those in a regression on past data would not be?<\/p>\n","answer":"<ol>\n<li><strong>Decision:<\/strong> the ministry sets VAT revenue in the budget, and hence spending and borrowing.<\/li>\n<li><strong>Outcome:<\/strong> VAT receipts for next year, in denars.<\/li>\n<li><strong>Does the decision change the outcome?<\/strong> Only a little if tax rules stay the same. A change in rates would make it causal as well.<\/li>\n<li><strong>Costs:<\/strong> predicting too high leads to cuts or unplanned borrowing during the year, and predicting too low leads to unnecessary cuts or borrowing beforehand and unused room in the budget.<\/li>\n<li><strong>Known at the time:<\/strong> past VAT receipts, recent consumption and imports, inflation and growth forecasts.<\/li>\n<\/ol>\n<p>Next year's actual GDP, consumption and inflation may enter a regression on past data as strong predictors, but they would <strong>not be known<\/strong> when the budget is written. Forecasts of them could be used instead, and the model should be tested as though it were being used at budget time.<\/p>\n"},{"kind":"e","n":12,"ask":"<p><strong>Exercise 12 (AI): Explain or predict?<\/strong> Give a chatbot the regression output from Exercise 4 and ask which model the ministry of health should use (a) to forecast life expectancy for planning and (b) to decide whether to raise health spending. Does it give different answers to the two questions? Should it?<\/p>\n","answer":"<p>Yes, it should give different answers. <strong>(a)<\/strong> For planning forecasts, choose the model with the lowest cross-validated error. <strong>(b)<\/strong> Deciding whether to raise spending is a causal rain-dance question, and neither regression can answer it, because the health coefficient may reflect income, institutions or reverse causation. A good chatbot should say so. If it recommends using the same model for both, that is a mistake.<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што е зависна, а што независна променлива во регресионата анализа?<\/p>\n","answer":"<p>Зависната променлива е онаа што сакаме да ја предвидиме или објасниме. Независните променливи се оние што ги користиме како информација за тоа предвидување.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Која е разликата меѓу регресиона анализа и класификација?<\/p>\n","answer":"<p>Регресијата предвидува квантитативна променлива, а класификацијата предвидува категорија.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Што претставува наклонот во едноставната линеарна регресија?<\/p>\n","answer":"<p>Просечната промена на зависната променлива при зголемување на независната променлива за една единица.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Што претставува пресекот во линеарен модел?<\/p>\n","answer":"<p>Предвидената вредност на зависната променлива кога независната променлива е нула. Може да нема вистинско значење ако нулата е надвор од податоците, како кај негативниот извоз на правата во ова поглавје.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Што се резидуали?<\/p>\n","answer":"<p>Разликите меѓу набљудуваните вредности и вредностите што ги предвидува моделот.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Што е RSS и зошто се минимизира во линеарната регресија?<\/p>\n","answer":"<p>Збирот на квадратите на резидуалите е збирот на квадрираните резидуали. Методот на обични најмали квадрати ги избира коефициентите што го прават што е можно помал, така што правата да биде што поблиску до податоците.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Што е MSE и како се толкува?<\/p>\n","answer":"<p>Средната квадратна грешка е просечниот квадриран резидуал. Пониските вредности значат попрецизни предвидувања, а се изразува во квадратни единици на зависната променлива.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Што е коефициентот на детерминација, $R^2$?<\/p>\n","answer":"<p>Мерка на приспособеност меѓу 0 и 1, која го покажува уделот од варијацијата на зависната променлива објаснет со моделот. Не зависи од единиците.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Како се толкува коефициентот на <code>mean_years_schooling<\/code> во едноставната регресија во ова поглавје?<\/p>\n","answer":"<p>Државите со една година повеќе просечно школување имаат во просек за 6.379 процентни поени поголема интернет-пенетрација.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Зошто коефициентот на <code>mean_years_schooling<\/code> се менува кога преминуваме од едноставна на повеќекратна регресија?<\/p>\n","answer":"<p>Со пристапот до електрична енергија во моделот, коефициентот ја мери поврзаноста на школувањето со користењето интернет кога пристапот до електрична енергија е константен. Школувањето и електричната енергија се поврзани, па дел од едноставниот коефициент ја одразувал електричната енергија.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Како се толкува коефициентот на независна променлива во повеќекратна регресија?<\/p>\n","answer":"<p>Тоа е просечната промена на зависната променлива при зголемување на таа независна променлива за една единица, кога другите вклучени променливи се константни.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Зошто модел со повисок $R^2$ не е нужно подобар за предвидување?<\/p>\n","answer":"<p>R² врз податоците употребени за проценка може само да расте кога се додаваат променливи, дури и бескорисни. Ја мери приспособеноста кон познати податоци, а не точноста врз нови податоци.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Што е прекумерно приспособување и зошто се јавува кога моделот има премногу независни променливи?<\/p>\n","answer":"<p>Прекумерното приспособување настанува кога моделот се приспособува на шумот во податоците за проценка и лошо предвидува нови податоци. Со многу променливи, особено во однос на бројот на набљудувања, некои ќе бидат поврзани со исходот само случајно.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Зошто MSE врз множеството за обучување обично е пониска од MSE врз тест-множеството?<\/p>\n","answer":"<p>Коефициентите на моделот се избрани за да се приспособат на податоците за обучување, вклучувајќи го нивниот шум, па моделот подобро работи врз овие податоци отколку врз податоци што не ги видел.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Зошто модел со помалку променливи понекогаш може да предвидува подобро од посложен модел?<\/p>\n","answer":"<p>Поедноставен модел има помала варијанса и е помалку веројатно да се приспособи на шумот. Намалувањето на варијансата може повеќе од надомести дополнителната пристрасност.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Што ви кажува p-вредноста, а што не ви кажува?<\/p>\n","answer":"<p>p-вредноста е веројатноста за t-вредност барем толку голема ако вистинскиот коефициент е нула. Не покажува дека поврзаноста е голема, важна или причинска и не е веројатност дека коефициентот е нула.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Што е регресија кон средната вредност (regression to the mean)? Дајте пример од економијата.<\/p>\n","answer":"<p>По невообичаено високи или ниски вредности обично следат вредности поблиску до просекот, бидејќи делумно се должат на среќа. Компанија со рекордна година обично следната година постигнува послаб резултат, а регион што добива помош по својата најлоша година обично и онака се подобрува.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Зошто корелацијата меѓу потрошувачката на чоколадо и Нобеловите награди не покажува дека чоколадото ја зголемува интелигенцијата?<\/p>\n","answer":"<p>Богатите држави можат да си дозволат и чоколадо и истражувања. Приходот е веројатна заедничка причина. Корелацијата не е доказ дека јадењето чоколадо зголемува нешто.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Како би ја протолкувале регресионата анализа на Окуновиот закон во ова поглавје?<\/p>\n","answer":"<p>Секој дополнителен процентен поен раст е поврзан со стапка на невработеност пониска за околу 0.44 поени. Поставувањето на промената на нула покажува дека бил потребен раст од околу 3.1 проценти за невработеноста да остане константна, а моделот добро се приспособува, со R² од 0.66. Поврзаноста е набљудувана, а 2020 е многу далеку од правата.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Објаснете го компромисот меѓу пристрасност и варијанса со свои зборови.<\/p>\n","answer":"<p>Едноставен модел пропушта дел од вистината (висока пристрасност), но малку се менува со нови податоци. Сложен модел тесно се приспособува на примерокот, но многу се менува со нови податоци (висока варијанса). Намалувањето на едното обично го зголемува другото, а добриот модел ги балансира двете за вкупната грешка врз нови податоци да биде мала.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>Објаснете како функционира 5-кратната вкрстена валидација.<\/p>\n","answer":"<p>Поделете ги податоците на пет еднакви групи. Обучете на четири и тестирајте на петтата и повторете така што секоја група еднаш да биде тест-множество. Вкрстено валидираната MSE е просекот на петте тест-грешки.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>Зошто не можете да ги користите HDI и <code>expected_years_schooling<\/code> како предиктори во ист модел?<\/p>\n","answer":"<p>HDI е изграден од очекуваните години школување. Вклучувањето на двете значи двапати внесување на истата информација, па моделот не би можел да ги разликува нивните придонеси.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>Како толкувате коефициент од $-1.5$ за растојанието во гравитациски модел во логаритми?<\/p>\n","answer":"<p>За 1 процент поголемо растојание е поврзано со околу 1.5 проценти помалку трговија, во просек.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>Зошто лог-линеарните гравитациски модели ги исклучуваат паровите држави што не тргуваат?<\/p>\n","answer":"<p>Логаритам од нула не постои, па тие парови не можат да се вклучат. Со тоа се исклучуваат набљудувања што може да носат информација.<\/p>\n"},{"kind":"q","n":25,"ask":"<p>Зошто процената на „извозниот потенцијал“ треба да се третира претпазливо?<\/p>\n","answer":"<p>Моделот ги изоставува трговските договори, синџирите на снабдување, заедничката историја и производите. Интервалите на предвидување се многу широки, а вистинската трговија под предвидувањето може да биде само шум. Дали промоцијата би го затворила јазот е причинско-последично прашање.<\/p>\n"},{"kind":"q","n":26,"ask":"<p>Наведете четири проверки што треба да ги направите кај регресиона анализа создадена со помош на разговорен бот со AI.<\/p>\n","answer":"<p>Кои било четири од овие: проверете ја формулата; избројте ги набљудувањата; проверете ги имињата на колоните; пресметајте едно предвидување рачно; проверете дали има причинско-последичен јазик; погледнете ја тест-грешката и основен модел; и барајте трансформации.<\/p>\n"},{"kind":"q","n":27,"ask":"<p>Зошто добар модел за предвидување може да биде слаб модел за објаснување?<\/p>\n","answer":"<p>На предвидувањето му треба мала грешка врз нови случаи, дури и ако поединечните коефициенти се нестабилни или пристрасни. На објаснувањето му требаат веродостојни коефициенти, а модел за предвидување може да содржи високо корелирани променливи што ги прават неговите коефициенти неупотребливи за толкување.<\/p>\n"},{"kind":"q","n":28,"ask":"<p>Зошто би прифатиле извесна пристрасност во проблем на јавните политики заснован врз предвидување?<\/p>\n","answer":"<p>Затоа што важна е вкупната грешка врз нови случаи. Мало зголемување на пристрасноста вреди да се прифати ако ја намалува варијансата за повеќе.<\/p>\n"},{"kind":"q","n":29,"ask":"<p>Кој дел од пресметката на извозниот потенцијал е предвидување, а кој дел бара тврдење за причинско-последична врска?<\/p>\n","answer":"<p>Предвидувањето колку трговија би било нормално со оглед на БДП и растојанието е предвидување. Тврдењето дека трошењето за промоција би го затворило јазот е причинско-последично тврдење, за кое моделот не кажува ништо.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Приход и очекувано траење на животот (Светска банка).<\/strong> Со пакетот <code>WDI<\/code> во R, преземете податоци за сите држави за 2022 за <code>SP.DYN.LE00.IN<\/code> (очекувано траење на животот, години) и <code>NY.GDP.PCAP.CD<\/code> (БДП по жител, тековни US$). По чистењето на податоците, проценете едноставна линеарна регресија со очекуваното траење на животот како зависна променлива и БДП по жител како независна променлива. Нацртајте дијаграм на расејување со регресионата права и протолкувајте ги коефициентите. Потоа повторете со логаритамот од БДП по жител. Кое приспособување е подобро и зошто?<\/p>\n","answer":"<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>206 држави<\/strong> со целосни податоци.<\/p>\n<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(gdp))\nm1 &lt;- lm(life ~ gdp, d)\nm2 &lt;- lm(life ~ log(gdp), d)\nsummary(m1); summary(m2)\nplot(life ~ log(gdp), d); abline(m2)\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Модел<\/th>\n<th align=\"right\">Наклон<\/th>\n<th align=\"right\">R²<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Очекуван животен век врз БДП по жител<\/td>\n<td align=\"right\">0.000143<\/td>\n<td align=\"right\">0.327<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Очекуван животен век врз логаритам од БДП по жител<\/td>\n<td align=\"right\">4.255<\/td>\n<td align=\"right\">0.631<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Во првиот модел, дополнителни US$10,000 БДП по жител се поврзани со околу 1.4 години подолг живот. Во вториот модел, за 1 процент повисок приход е поврзан со околу 0.043 години подолг живот, па удвојувањето е поврзано со околу 4.255 × ln 2 = 2.9 години подолг живот.<\/p>\n<p><strong>Логаритамскиот модел подобро се приспособува<\/strong>, бидејќи врската е закривена: очекуваниот животен век брзо расте при ниски приходи, а потоа се израмнува. Права линија во логаритми го опфаќа тоа.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Додавање здравствени расходи (Светска банка).<\/strong> Преземете податоци за сите држави за 2022 за <code>SP.DYN.LE00.IN<\/code> (очекувано траење на животот), <code>NY.GDP.PCAP.CD<\/code> (БДП по жител) и <code>SH.XPD.CHEX.GD.ZS<\/code> (тековни здравствени расходи, % од БДП). По чистењето на податоците, проценете повеќекратна линеарна регресија со очекуваното траење на животот како зависна променлива и БДП по жител и здравствените расходи како независни променливи. Споредете го овој модел со едноставната регресија што користи само БДП по жител. Дали вклучувањето на здравствените расходи го подобрува објаснувањето на разликите во очекуваното траење на животот меѓу државите?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;, health = &quot;SH.XPD.CHEX.GD.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(gdp), !is.na(health))\nm1 &lt;- lm(life ~ log(gdp), d)\nm2 &lt;- lm(life ~ log(gdp) + health, d)\nsummary(m1)$adj.r.squared\nsummary(m2)$adj.r.squared\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>186 држави<\/strong> со целосни податоци.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Модел<\/th>\n<th align=\"right\">Приспособен R²<\/th>\n<th align=\"right\">Коефициент на здравствените трошоци<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">БДП по жител<\/td>\n<td align=\"right\">0.310<\/td>\n<td align=\"right\"><\/td>\n<\/tr>\n<tr>\n<td align=\"left\">БДП по жител и здравствени трошоци<\/td>\n<td align=\"right\">0.315<\/td>\n<td align=\"right\">0.23 (p = 0.12)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Логаритам од БДП по жител<\/td>\n<td align=\"right\">0.625<\/td>\n<td align=\"right\"><\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Логаритам од БДП по жител и здравствени трошоци<\/td>\n<td align=\"right\">0.623<\/td>\n<td align=\"right\">0.015 (p = 0.90)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Здравствените трошоци не додаваат речиси ништо.<\/strong> Со приход во долари, приспособениот R² се зголемува за само 0.005, а со приход во логаритми малку се намалува. Во секој случај, коефициентот не е значаен, а приходот веќе ги содржи повеќето информации.<\/p>\n<p>Толкувајте го коефициентот како поврзаност. Државите што трошат повеќе за здравство се разликуваат на многу начини, а државите со поболно население можеби мора да трошат повеќе, па коефициентот не е доказ за тоа што би постигнало дополнителното трошење.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Предвидување невработеност (Светска банка).<\/strong> Преземете податоци за сите држави за 2022 за <code>SL.UEM.TOTL.ZS<\/code> (стапка на невработеност, %), <code>NY.GDP.PCAP.CD<\/code> (БДП по жител) и <code>SP.URB.TOTL.IN.ZS<\/code> (урбано население, % од вкупното). Проценете модел со невработеноста како зависна променлива и БДП по жител и урбаното население како независни променливи. Потоа пресметајте ја предвидената стапка на невработеност за хипотетичка држава со БДП по жител од 15,000 и удел на урбано население од 65 и накратко протолкувајте го резултатот.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(unemp = &quot;SL.UEM.TOTL.ZS&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;, urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(unemp), !is.na(gdp), !is.na(urban))\nm &lt;- lm(unemp ~ gdp + urban, d)\nsummary(m)\npredict(m, newdata = data.frame(gdp = 15000, urban = 65), interval = &quot;prediction&quot;)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>179 држави<\/strong> со целосни податоци.<\/p>\n<p>Проценетата равенка е: невработеност = 4.37 − 0.000082 × БДП по жител + 0.0685 × удел на градско население. Двата наклона се статистички значајни, но <strong>R² е само 0.086<\/strong>.<\/p>\n<p>За БДП по жител од 15,000 и удел на градско население од 65, предвидувањето е <strong>7.59 проценти<\/strong>, со 95-процентен интервал на предвидување од <strong>−3.47 до 18.64 проценти<\/strong>. Интервалот содржи невозможни негативни вредности и е толку широк што точкестата проценка ни кажува малку. БДП по жител и урбанизацијата објаснуваат многу малку од разликите во невработеноста меѓу државите, па ова не треба да се чита како прогноза за која било конкретна држава.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Кој модел предвидува подобро? (Светска банка).<\/strong> Преземете податоци за сите држави за 2022 за очекуваното траење на животот (<code>SP.DYN.LE00.IN<\/code>), БДП по жител (<code>NY.GDP.PCAP.CD<\/code>), здравствените расходи (<code>SH.XPD.CHEX.GD.ZS<\/code>) и урбаното население (<code>SP.URB.TOTL.IN.ZS<\/code>). По чистењето на податоците, поделете ги на множество за обучување (70 проценти од набљудувањата) и тест-множество (30 проценти), со фиксна почетна вредност <code>set.seed(123)<\/code>. Проценете два модела за предвидување на очекуваното траење на животот: (a) едноставна линеарна регресија со БДП по жител; (b) повеќекратна линеарна регресија со БДП по жител, здравствените расходи и урбаното население. За двата модела прикажете ги резултатите од <code>summary()<\/code>, пресметајте ја MSE врз множеството за обучување, пресметајте ја MSE врз тест-множеството и споредете ги моделите, објаснувајќи кој би го избрале ако целта е подобро предвидување нови податоци. На крајот спроведете 5-кратна вкрстена валидација за двата модела и споредете ја MSE од вкрстената валидација. Дали заклучокот од вкрстената валидација се совпаѓа со заклучокот од поделбата на обучување и тестирање?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nlibrary(boot)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;,\n                       health = &quot;SH.XPD.CHEX.GD.ZS&quot;, urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(gdp), !is.na(health), !is.na(urban))\n\nset.seed(123)\nidx &lt;- sample(nrow(d), floor(0.7 * nrow(d)))\ntrain &lt;- d[idx, ]; test &lt;- d[-idx, ]\na &lt;- lm(life ~ gdp, train)\nb &lt;- lm(life ~ gdp + health + urban, train)\nmse &lt;- function(m, x) mean((predict(m, x) - x$life)^2)\nc(a_train = mse(a, train), a_test = mse(a, test),\n  b_train = mse(b, train), b_test = mse(b, test))\n\nset.seed(123)\ncv.glm(d, glm(life ~ gdp, data = d), K = 5)$delta[2]\ncv.glm(d, glm(life ~ gdp + health + urban, data = d), K = 5)$delta[2]\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>186 држави<\/strong> со целосни податоци (130 за обучување и 56 за тестирање).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Модел<\/th>\n<th align=\"right\">R² (обучување)<\/th>\n<th align=\"right\">MSE при обучување<\/th>\n<th align=\"right\">Тест-MSE<\/th>\n<th align=\"right\">MSE со 5-кратна CV<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">(а) БДП по жител<\/td>\n<td align=\"right\">0.438<\/td>\n<td align=\"right\">22.84<\/td>\n<td align=\"right\">91.89<\/td>\n<td align=\"right\">44.35<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(б) БДП, здравствени трошоци и градско население<\/td>\n<td align=\"right\">0.614<\/td>\n<td align=\"right\">15.67<\/td>\n<td align=\"right\">83.29<\/td>\n<td align=\"right\">36.99<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Изберете го моделот (б).<\/strong> Има помала грешка на тест-множеството и при вкрстена валидација, а низ 100 почетни вредности (seeds) е подобар од (а) во 99 проценти од случаите, со просечни MSE од 37.6 наспроти 45.3. Двата заклучоци се совпаѓаат.<\/p>\n<p>Забележете колку тест-грешката е над грешката при обучување и над вкрстено валидираната грешка. Во оваа поделба, тест-множеството случајно содржи случаи што тешко се предвидуваат, што покажува зошто една поделба 70/30 може да заведе. Само градското население и БДП се јасно значајни во моделот (б). Здравствените трошоци не се (p = 0.15).<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: Инфлација и невработеност во ЕУ (Eurostat).<\/strong> Со пакетот <code>eurostat<\/code> во R, преземете податоци за државите од Европската Унија за 2022 за стапката на невработеност и годишната инфлација. По чистењето и спојувањето на податоците, поделете ги на множество за обучување (70 проценти) и тест-множество (30 проценти), со <code>set.seed(123)<\/code>. Проценете два модела за предвидување на стапката на невработеност: (a) едноставна линеарна регресија со инфлацијата како независна променлива; (b) едноставна линеарна регресија со инфлацијата, по отстранување на државите со екстремни вредности на инфлацијата. За двата модела нацртајте дијаграм на расејување со регресиона права, пресметајте ја MSE врз множеството за обучување и врз тест-множеството и споредете дали отстранувањето на екстремните вредности води кон подобар предвидувачки модел. Потоа спроведете 5-кратна вкрстена валидација за двата модела и споредете ги вредностите. Накратко коментирајте дали резултатите покажуваат дека поедноставниот и почист модел има подобра способност за генерализација. Зошто исклучувањето на тие држави би можело да биде спорна одлука? (Видете Поглавје 5.)<\/p>\n","answer":"<p>Со 27-те членки на ЕУ од <code>eurostat_2022_tidy.csv<\/code> и <code>set.seed(123)<\/code> за поделбата (18 држави за обучување и 9 држави за тестирање). „Екстремна“ овде значи инфлација над 17 проценти, што ги опфаќа Естонија, Литванија и Латвија. Строгото правило 1.5 × IQR би ја означило само Естонија.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Модел<\/th>\n<th align=\"right\">Наклон<\/th>\n<th align=\"right\">MSE при обучување<\/th>\n<th align=\"right\">Тест-MSE<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">(а) Сите држави за обучување<\/td>\n<td align=\"right\">−0.113<\/td>\n<td align=\"right\">4.96<\/td>\n<td align=\"right\">7.93<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(б) Без екстремна инфлација (15 држави)<\/td>\n<td align=\"right\">−0.336<\/td>\n<td align=\"right\">5.20<\/td>\n<td align=\"right\">7.24<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>MSE со 5-кратна вкрстена валидација со оваа почетна вредност е 6.90 за сите држави и 6.35 без балтичките држави. Низ 200 различни почетни вредности, просеците се <strong>6.74 и 6.73<\/strong>, што е практично идентично. Првата споредба затоа е главно шум од многу мал примерок, а отстранувањето на екстремните вредности не ја подобрува јасно способноста на моделот да генерализира.<\/p>\n<p>Нивното исклучување е спорно бидејќи инфлацијата во балтичките држави е вистинска, а не грешка. Според рамката од Поглавје 5, потребна ви е причина за да третирате вистински набљудувања како неважни за прашањето. Покрај тоа, вкрстената валидација на различно множество држави не е строго споредлива.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6: Окуновиот закон во Европа (Eurostat).<\/strong> Преземете годишен реален раст на БДП (<code>nama_10_gdp<\/code>) и стапки на невработеност (<code>une_rt_a<\/code>) за 2005 до 2023 за Грција, Шпанија, Германија и барем една држава од Западен Балкан. Проценете го Окуновиот закон за секоја, со и без 2020 и 2021. Во која држава невработеноста најсилно реагира на растот? Зошто поврзаноста во Северна Македонија би можела да биде слаба?<\/p>\n","answer":"<p>Податоците на Eurostat даваат споредливи вредности за 2010 до 2023 (13 или 14 години за секоја држава). Табелата го прикажува наклонот на промената на невработеноста врз реалниот раст на БДП.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">Наклон, сите години<\/th>\n<th align=\"right\">R²<\/th>\n<th align=\"right\">Наклон, без 2020 и 2021<\/th>\n<th align=\"right\">R²<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Грција<\/td>\n<td align=\"right\">−0.45<\/td>\n<td align=\"right\">0.66<\/td>\n<td align=\"right\">−0.65<\/td>\n<td align=\"right\">0.88<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Шпанија<\/td>\n<td align=\"right\">−0.29<\/td>\n<td align=\"right\">0.43<\/td>\n<td align=\"right\">−0.70<\/td>\n<td align=\"right\">0.75<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Германија<\/td>\n<td align=\"right\">−0.14<\/td>\n<td align=\"right\">0.60<\/td>\n<td align=\"right\">−0.16<\/td>\n<td align=\"right\">0.64<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Северна Македонија<\/td>\n<td align=\"right\">−0.13<\/td>\n<td align=\"right\">0.12<\/td>\n<td align=\"right\">−0.37<\/td>\n<td align=\"right\">0.27<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Србија<\/td>\n<td align=\"right\">+0.10<\/td>\n<td align=\"right\">0.02<\/td>\n<td align=\"right\">−0.16<\/td>\n<td align=\"right\">0.03<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Шпанија и Грција реагираат најсилно<\/strong>, особено без годините на пандемијата. Пандемијата ја израмнува врската, особено во Шпанија, бидејќи програмите за привремено отсуство од работа го намалија производството повеќе од евидентираната невработеност. Пазарот на труд во Германија реагира многу помалку.<\/p>\n<p>Врската во Северна Македонија може да е слаба поради голем неформален сектор, емиграција (која ја намалува невработеноста независно од растот), активни програми за вработување, промени во мерењето кај анкетните податоци и краткиот примерок. Со 14 набљудувања, сите овие резултати се непрецизни.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7: Надвор од БДП и растојанието (CEPII).<\/strong> Базата Gravity на CEPII обезбедува променливи за заедничка граница, заеднички јазик, колонијални врски и трговски договори. Спојте некои од нив со <code>gravity_data.xlsx<\/code> и проценете проширен гравитациски модел. Дали се подобрува MSE од вкрстената валидација? Дали Египет останува на врвот на листата на Северна Македонија? Повторете со индикаторска променлива (dummy variable) за секој извозник.<\/p>\n","answer":"<p><em>Базата CEPII Gravity е многу голема за преземање и не е употребена при подготовката на овие решенија, па не се дадени бројки.<\/em><\/p>\n<p>Спојте според извозник и увозник и додадете променливи како <code>contig<\/code> (заедничка граница), <code>comlang_off<\/code> (заеднички јазик), <code>col_dep_ever<\/code> (колонијални врски) и <code>fta_wto<\/code> (трговски договор). Проверете дали шифрите на државите се совпаѓаат и проверете го бројот на редови по спојувањето. Потоа:<\/p>\n<pre><code class=\"language-r\">augmented &lt;- glm(log_trade ~ log_gdp_o + log_gdp_d + log_distance +\n                   contig + comlang_off + col_dep_ever + fta_wto, data = merged)\ncv.glm(merged, augmented, K = 10)$delta[1]\n<\/code><\/pre>\n<p>Споредете го резултатот со MSE од книгата, 7.16. Очекувајте грешката да падне и очекувајте да се промени рангирањето на потенцијалот, бидејќи соседите со трговски договори сега ќе се предвидуваат попрецизно. Со вештачка променлива за секој извозник, користете <code>factor(origin)<\/code>. Таа апсорбира сè за извозникот, вклучувајќи го неговиот БДП, па мора да го отстраните <code>log_gdp_o<\/code>.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8: Извозен потенцијал за сосед.<\/strong> Повторете ја пресметката на извозниот потенцијал за Албанија или Србија. Пресметајте интервали на предвидување за првите три одредишта. Дали би му препорачале некое од нив на министер? Врз основа на кои докази?<\/p>\n","answer":"<p>Со <code>gravity_data.xlsx<\/code> и моделот од ова поглавје:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"left\">Дестинација<\/th>\n<th align=\"right\">Вистинска ($m)<\/th>\n<th align=\"right\">Предвидена ($m)<\/th>\n<th align=\"left\">95% интервал на предвидување ($m)<\/th>\n<th align=\"right\">Потенцијал ($m)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Албанија<\/td>\n<td align=\"left\">Обединето Кралство<\/td>\n<td align=\"right\">8.03<\/td>\n<td align=\"right\">87.85<\/td>\n<td align=\"left\">0.46 до 16,678<\/td>\n<td align=\"right\">79.82<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Албанија<\/td>\n<td align=\"left\">Франција<\/td>\n<td align=\"right\">30.89<\/td>\n<td align=\"right\">106.82<\/td>\n<td align=\"left\">0.56 до 20,281<\/td>\n<td align=\"right\">75.93<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Албанија<\/td>\n<td align=\"left\">Турција<\/td>\n<td align=\"right\">57.79<\/td>\n<td align=\"right\">93.30<\/td>\n<td align=\"left\">0.49 до 17,718<\/td>\n<td align=\"right\">35.51<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Србија<\/td>\n<td align=\"left\">Обединето Кралство<\/td>\n<td align=\"right\">447.57<\/td>\n<td align=\"right\">555.38<\/td>\n<td align=\"left\">2.93 до 105,448<\/td>\n<td align=\"right\">107.81<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Србија<\/td>\n<td align=\"left\">Швајцарија<\/td>\n<td align=\"right\">245.42<\/td>\n<td align=\"right\">347.38<\/td>\n<td align=\"left\">1.83 до 65,959<\/td>\n<td align=\"right\">101.96<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Србија<\/td>\n<td align=\"left\">Индија<\/td>\n<td align=\"right\">24.84<\/td>\n<td align=\"right\">99.10<\/td>\n<td align=\"left\">0.52 до 18,812<\/td>\n<td align=\"right\">74.26<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">top3 &lt;- subset(data, origin == &quot;Albania&quot;)\ntop3 &lt;- top3[order(-top3$export_potential), ][1:3, ]\nexp(predict(model, top3, interval = &quot;prediction&quot;)) / 1e6\n<\/code><\/pre>\n<p>Не препорачувајте ниту една само врз основа на овие докази. Вистинската трговија е внатре во секој интервал на предвидување, па „потенцијалот“ статистички не може да се разликува од шум. Како и кај Северна Македонија, двете држави вкупно извезуваат многу повеќе отколку што предвидува моделот. Листата може да биде само почетна точка за разгледување на производите, трговските договори и пристапот до пазарите.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Вежба 9 (AI): Фатете го јазикот на причинско-последични врски.<\/strong> Дајте му го на разговорен бот излезот од регресионата анализа од Вежба 2 и побарајте да напише пасус за министер за здравство. Подвлечете го секое тврдење за причинско-последична врска и преработете го пасусот така што ќе го кажува само она што го поткрепуваат податоците.<\/p>\n","answer":"<p>Резултатот зависи од четботот, но често ќе видите изрази како „зголемувањето на здравствените трошоци ќе го подобри очекуваниот животен век“. Препишете ги како поврзаности. На пример: „Државите со повисоки здравствени трошоци, при ист БДП по жител, имаа во просек подолг очекуван животен век. Овие податоци не можат да покажат дали поголемото трошење би го зголемило очекуваниот животен век, бидејќи државите што трошат повеќе се разликуваат и на други начини.“<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Вежба 10 (AI): Проверка на вкрстена валидација.<\/strong> Побарајте од разговорен бот по сеќавање да напише код за 5-кратна вкрстена валидација за моделите во Оддел 9.9, без употреба на <code>boot<\/code>. Извршете го. Дали репродуцира резултати со слична големина како оние во книгата? Најдете едно нешто во кодот што моравте да го проверите и објаснете како го проверивте.<\/p>\n","answer":"<p>Оваа сопствена верзија на 5-кратна вкрстена валидација дава резултати со слична големина како оние во книгата:<\/p>\n<pre><code class=\"language-r\">library(readxl)\nd &lt;- read_excel(&quot;data/regression_example_data.xlsx&quot;)\nnames(d)[7] &lt;- &quot;electricity_access&quot;\ncv &lt;- function(f, k = 5, seed = 1) {\n  set.seed(seed)\n  fold &lt;- sample(rep(1:k, length.out = nrow(d)))\n  mean(sapply(1:k, function(i) {\n    m &lt;- lm(f, d[fold != i, ])\n    mean((predict(m, d[fold == i, ]) - d$internet_penetration[fold == i])^2)\n  }))\n}\n<\/code><\/pre>\n<p>Со овој код и почетна вредност 1, MSE за моделите со шест променливи, со пет променливи и со HDI се <strong>100.9, 100.4 и 95.6<\/strong>. Тие не се идентични со бројките во книгата, бидејќи <code>cv.glm<\/code> користи поинаква случајна распределба на групите. Треба да проверите дали секое набљудување е употребено точно еднаш за тестирање (<code>table(fold)<\/code> покажува еднакви групи) и дали тест-предвидувањата доаѓаат од модел што не ги видел тие набљудувања. Честа грешка на четботите е приспособување на моделот на сите податоци пред поделбата.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Вежба 11: Буџет како чадор.<\/strong> Министерство за финансии мора да ги предвиди приходите од данокот на додадена вредност за следната година. Користејќи ги петте прашања во Оддел 7.2, изложете ја одлуката и трошоците од превисоко и прениско предвидување. Кои променливи би биле познати при составувањето на буџетот? Кои од оние во регресиона анализа врз минати податоци не би биле познати?<\/p>\n","answer":"<ol>\n<li><strong>Одлука:<\/strong> министерството ги утврдува приходите од ДДВ во буџетот, а со тоа и трошењето и задолжувањето.<\/li>\n<li><strong>Исход:<\/strong> приливите од ДДВ за следната година, во денари.<\/li>\n<li><strong>Дали одлуката го менува исходот?<\/strong> Само малку ако даночните правила останат исти. Промена на стапките би го направила и причинско-последично прашање.<\/li>\n<li><strong>Трошоци:<\/strong> предвидување превисоко води кон кратења или непланирано задолжување во текот на годината, а предвидување прениско води кон непотребни кратења или задолжување однапред и неискористен простор во буџетот.<\/li>\n<li><strong>Познато во тој момент:<\/strong> минатите приливи од ДДВ, неодамнешната потрошувачка и увоз, прогнозите за инфлација и раст.<\/li>\n<\/ol>\n<p>Вистинскиот БДП, потрошувачката и инфлацијата за следната година може да влезат во регресија врз минати податоци како силни предиктори, но <strong>нема да бидат познати<\/strong> кога се пишува буџетот. Наместо нив може да се користат нивни прогнози, а моделот треба да се тестира како да се користи во времето на буџетот.<\/p>\n"},{"kind":"e","n":12,"ask":"<p><strong>Вежба 12 (AI): Објаснување или предвидување?<\/strong> Дајте му го на разговорен бот излезот од регресионата анализа од Вежба 4 и прашајте кој модел треба да го користи министерството за здравство (a) за прогнозирање на очекуваното траење на животот за планирање и (b) за да одлучи дали да ги зголеми здравствените расходи. Дали дава различни одговори на двете прашања? Дали треба?<\/p>\n","answer":"<p>Да, треба да даде различни одговори. <strong>(а)<\/strong> За прогнози за планирање, изберете го моделот со најмала вкрстено валидирана грешка. <strong>(б)<\/strong> Одлуката дали да се зголеми трошењето е причинско-последично прашање од типот танц за дожд и ниту една од регресиите не може да одговори на него, бидејќи коефициентот на здравството може да ги одразува приходот, институциите или обратната причинска врска. Добар четбот треба да го каже тоа. Ако препорача ист модел за двете, тоа е грешка.<\/p>\n"}],"title_mk":"Линеарна регресија","part_mk":"III. Статистичко учење и предвидување за јавните политики","check":{"status":"Reproduced","seconds":2.2,"book_lines":143,"matched":143,"message":""},"zip_kb":1415},{"number":10,"title":"Classification","part":"III. Statistical learning and policy prediction","folder":"ch10-classification","has_code":true,"code_lines":105,"datasets":["regression_example_data.xlsx","trade_cars_2022.xlsx","us_yield_recession.csv"],"packages":["boot","dplyr","ggplot2","knitr","moments","readxl","scales","tidyverse"],"figures":3,"tables":1,"stories":1,"closers":1,"prompts":3,"exercises":10,"questions":20,"solutions":[{"kind":"q","n":1,"ask":"<p>What is classification in statistical learning?<\/p>\n","answer":"<p>A family of methods that predict the category or class an observation belongs to, using a number of independent variables.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>What is the difference between a regression problem and a classification problem?<\/p>\n","answer":"<p>A regression problem has a quantitative response, while a classification problem has a qualitative one (a category).<\/p>\n"},{"kind":"q","n":3,"ask":"<p>What is a binary dependent variable and how is it constructed?<\/p>\n","answer":"<p>A variable taking only the values 0 and 1, indicating the absence or presence of a class. It is constructed with a rule, for example <code>ifelse(internet_penetration &gt; 75, 1, 0)<\/code>.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Why is linear regression not suitable for directly predicting a binary dependent variable?<\/p>\n","answer":"<p>Linear regression produces continuous predictions that can fall below 0 or above 1, so they cannot be read as true probabilities.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>What is the role of the logistic function in logistic regression?<\/p>\n","answer":"<p>It turns any number from the linear part of the model into a value between 0 and 1, which can be read as a probability.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>How is the sign of a coefficient interpreted in logistic regression?<\/p>\n","answer":"<p>A positive coefficient means a positive association with the probability of the class coded 1, and a negative coefficient means a negative association. The direction depends on how the variable is coded.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>What do the predicted probabilities in logistic regression represent?<\/p>\n","answer":"<p>The estimated probability that each observation belongs to the positive class.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>How can predicted probabilities be converted into predicted classes?<\/p>\n","answer":"<p>Choose a threshold such as 0.5. Assign the positive class if the predicted probability is above the threshold, and the negative class otherwise.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>What is a confusion matrix and what possible outcomes does it contain?<\/p>\n","answer":"<p>A 2×2 table comparing actual and predicted classes. It contains true positives, false positives, false negatives and true negatives.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>What is the accuracy of a model, and why is 5-fold cross-validation useful in choosing a classification model?<\/p>\n","answer":"<p>Accuracy is the share of correct classifications. Five-fold cross-validation tests each model on data it has not seen, so the comparison is about predicting new cases, not about fit to known data.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>What is the base rate, and why must accuracy be compared with it?<\/p>\n","answer":"<p>The accuracy you would achieve with no model, by always choosing the most common class. An accuracy has meaning only relative to this.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>What is the difference between precision and recall? Give an example where each one matters more.<\/p>\n","answer":"<p><strong>Precision<\/strong> is the share of predicted positives that are really positive, while <strong>recall<\/strong> is the share of real positives the model finds. Precision matters more when acting on a false alarm is costly, as in accusing someone of fraud. Recall matters more when missing a case is costly, as in screening for a serious disease.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Why might a model that predicts recessions have lower accuracy at a lower threshold and still be more useful?<\/p>\n","answer":"<p>Recessions are rare, so a lower threshold causes more false alarms and lowers overall accuracy. But it catches far more of the real recession months, and an early warning can be worth the false alarms.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>What does <code>cv.glm()<\/code> calculate by default for a binary model?<\/p>\n","answer":"<p>The average squared difference between the actual value (0 or 1) and the predicted probability. It is not a misclassification rate, so 1 − delta is not an accuracy.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>What is data leakage? How did it arise in the car exports example?<\/p>\n","answer":"<p>Data leakage occurs when a predictor contains the answer or information not available at the moment of prediction. In the car example, <code>is_exporter<\/code> was defined as <code>exports_pc<\/code> above its median, so using <code>exports_pc<\/code> as a predictor gave the model the answer.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Why did Altman's sample of 33 failed and 33 surviving firms differ from the real world? Why does that matter?<\/p>\n","answer":"<p>Half of Altman's firms were bankrupt, whereas only a small share of firms fail in any given year. A method that works when groups are equally common has a much harder task when one group is rare, so accuracy in the sample overstates real-world performance.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Name four checks you should make on a classifier built with the help of an AI chatbot.<\/p>\n","answer":"<p>Any four of these: compare with the base rate; check which class is coded 1; check <code>type = &quot;response&quot;<\/code>; check what cross-validation measures; read coefficients as changes in log-odds; be suspicious of near-perfection; and look at the misclassified cases.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Why is the threshold in a prediction policy problem a policy decision and not a statistical one?<\/p>\n","answer":"<p>The threshold decides how many false alarms are accepted in exchange for how many missed cases. The statistics supply the trade-off, but how to value each kind of mistake is a decision about costs and people.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>In the joint replacement example, who are the false positives and what do they lose?<\/p>\n","answer":"<p>They are the 38,533 high-risk patients who would <em>not<\/em> have died within a year. Their surgery would be postponed, so they live with pain for longer.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Why is a recession forecast not a pure umbrella problem?<\/p>\n","answer":"<p>A central bank's response to a forecast may change whether the recession happens. The forecast can influence the outcome it predicts, and the model also learns from a past in which policy reacted in its own way.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: High internet use (World Bank).<\/strong> Using the <code>WDI<\/code> package in R, download data for all countries for 2022 on <code>IT.NET.USER.ZS<\/code> (individuals using the Internet, % of population), <code>SE.SEC.ENRR<\/code> (secondary enrolment, gross, %) and <code>EG.ELC.ACCS.ZS<\/code> (access to electricity, % of population). After cleaning the data, create a binary dependent variable <code>high_internet<\/code>, with the value 1 if <code>IT.NET.USER.ZS<\/code> &gt; 75, and 0 otherwise. Then estimate a logistic regression with <code>high_internet<\/code> as the dependent variable and <code>SE.SEC.ENRR<\/code> and <code>EG.ELC.ACCS.ZS<\/code> as the independent variables. Show the results of <code>summary()<\/code>, calculate the predicted probabilities, convert them into classes with a threshold of 0.5, construct a confusion matrix and calculate the accuracy of the model.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(internet = &quot;IT.NET.USER.ZS&quot;, enrol = &quot;SE.SEC.ENRR&quot;, electricity = &quot;EG.ELC.ACCS.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(internet), !is.na(enrol), !is.na(electricity)) %&gt;%\n  mutate(high_internet = ifelse(internet &gt; 75, 1, 0))\n\nm &lt;- glm(high_internet ~ enrol + electricity, data = d, family = binomial(logit))\nsummary(m)\nprob &lt;- predict(m, type = &quot;response&quot;)\npred &lt;- ifelse(prob &gt; 0.5, 1, 0)\ntable(Predicted = pred, Actual = d$high_internet)\nmean(pred == d$high_internet)\nmean(d$high_internet)    # compare accuracy with the base rate\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>127 countries<\/strong> with complete data, of which 70.1 percent have high internet use.<\/p>\n<p>Both coefficients are positive and significant: 0.047 for enrolment and 0.207 for electricity access.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Actual high<\/th>\n<th align=\"right\">Actual not high<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Predicted high<\/td>\n<td align=\"right\">85<\/td>\n<td align=\"right\">19<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Predicted not high<\/td>\n<td align=\"right\">4<\/td>\n<td align=\"right\">19<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Accuracy is 81.9 percent, against a base rate of 70.1 percent<\/strong> from always predicting high. This is measured on the data used to fit the model. The model finds most high-use countries, with a recall of 96 percent, but correctly identifies only half of the others.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Three models of life expectancy (World Bank).<\/strong> Download data for all countries for 2022 on <code>SP.DYN.LE00.IN<\/code> (life expectancy), <code>NY.GDP.PCAP.CD<\/code> (GDP per person, current US$), <code>SH.XPD.CHEX.GD.ZS<\/code> (current health expenditure, % of GDP) and <code>SP.URB.TOTL.IN.ZS<\/code> (urban population, % of total). After cleaning the data, create a binary dependent variable <code>high_lifeexp<\/code>, with the value 1 if life expectancy is greater than the median of <code>SP.DYN.LE00.IN<\/code>, and 0 otherwise. Then estimate three logistic models. In the first, use only <code>NY.GDP.PCAP.CD<\/code> as the independent variable. In the second, use <code>NY.GDP.PCAP.CD<\/code> and <code>SH.XPD.CHEX.GD.ZS<\/code>. In the third, use <code>NY.GDP.PCAP.CD<\/code>, <code>SH.XPD.CHEX.GD.ZS<\/code> and <code>SP.URB.TOTL.IN.ZS<\/code>. For each model, calculate the predicted classes with a threshold of 0.5, make a confusion matrix and calculate the accuracy. Finally, compare the three models and explain whether adding new variables leads to better classification.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;,\n                       health = &quot;SH.XPD.CHEX.GD.ZS&quot;, urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(gdp), !is.na(health), !is.na(urban)) %&gt;%\n  mutate(high_lifeexp = ifelse(life &gt; median(life), 1, 0))\n\nmodels &lt;- list(glm(high_lifeexp ~ gdp, d, family = binomial),\n               glm(high_lifeexp ~ gdp + health, d, family = binomial),\n               glm(high_lifeexp ~ gdp + health + urban, d, family = binomial))\nsapply(models, function(m) mean((predict(m, type = &quot;response&quot;) &gt; 0.5) == d$high_lifeexp))\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>186 countries<\/strong> with complete data, split evenly, so the base rate is 50 percent.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Model<\/th>\n<th align=\"right\">Correct<\/th>\n<th align=\"right\">Accuracy<\/th>\n<th align=\"right\">Cross-validated accuracy (100 seeds)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">GDP<\/td>\n<td align=\"right\">153<\/td>\n<td align=\"right\">82.3%<\/td>\n<td align=\"right\">80.8%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">GDP and health spending<\/td>\n<td align=\"right\">153<\/td>\n<td align=\"right\">82.3%<\/td>\n<td align=\"right\">80.2%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">GDP, health spending and urban population<\/td>\n<td align=\"right\">154<\/td>\n<td align=\"right\">82.8%<\/td>\n<td align=\"right\">81.5%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Adding variables barely improves the classification.<\/strong> Health spending gives identical in-sample results and slightly lowers cross-validated accuracy. Urban population adds about one percentage point, which is a small difference relative to the noise from random splits.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: High unemployment (World Bank).<\/strong> Download data for all countries for 2022 on <code>SL.UEM.TOTL.ZS<\/code> (unemployment rate, %), <code>NY.GDP.PCAP.CD<\/code> (GDP per person) and <code>SP.URB.TOTL.IN.ZS<\/code> (urban population, % of total). After cleaning the data, create a binary dependent variable <code>high_unemployment<\/code>, with the value 1 if the unemployment rate is greater than 10 percent, and 0 otherwise. Then split the dataset into a training set (70 percent) and a test set (30 percent) with <code>set.seed(123)<\/code>. Estimate two logistic models on the training set: the first using only <code>NY.GDP.PCAP.CD<\/code> as the independent variable, and the second using <code>NY.GDP.PCAP.CD<\/code> and <code>SP.URB.TOTL.IN.ZS<\/code>. For both models, calculate the predicted classes for the test set with a threshold of 0.5, make a confusion matrix and calculate the accuracy on the test set. Then carry out 5-fold cross-validation for both models, using a misclassification cost function, and compare the results. Explain which model you would choose if the aim is better prediction of new data. How does the accuracy compare with the base rate?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nlibrary(boot)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(unemp = &quot;SL.UEM.TOTL.ZS&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;, urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(unemp), !is.na(gdp), !is.na(urban)) %&gt;%\n  mutate(high_unemployment = ifelse(unemp &gt; 10, 1, 0))\ncost &lt;- function(r, pi = 0) mean(abs(r - pi) &gt; 0.5)\n\nset.seed(123)\ni &lt;- sample(nrow(d), floor(0.7 * nrow(d)))\na &lt;- glm(high_unemployment ~ gdp, d[i, ], family = binomial)\nb &lt;- glm(high_unemployment ~ gdp + urban, d[i, ], family = binomial)\nmean((predict(a, d[-i, ], type = &quot;response&quot;) &gt; 0.5) == d$high_unemployment[-i])\nmean((predict(b, d[-i, ], type = &quot;response&quot;) &gt; 0.5) == d$high_unemployment[-i])\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>179 countries<\/strong> with complete data. High unemployment applies to 41 of them, so the base rate of &quot;not high&quot; is <strong>77.1 percent<\/strong>. In the 54 test countries it is 81.5 percent.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Model<\/th>\n<th align=\"right\">Test accuracy<\/th>\n<th align=\"right\">5-fold CV accuracy (100 seeds)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">GDP only<\/td>\n<td align=\"right\">81.5%<\/td>\n<td align=\"right\">77.1%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">GDP and urban population<\/td>\n<td align=\"right\">83.3%<\/td>\n<td align=\"right\">78.3%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The first model <strong>simply predicts &quot;not high&quot; for every country<\/strong>, so it has no value at all, and its accuracy equals the base rate exactly. The second model flags a few countries and does slightly better, identifying 2 of the 10 high-unemployment countries in the test set. If the aim is predicting new data, it is the better choice. But neither model is useful for finding countries with high unemployment, and the improvement over the base rate is small.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: High inflation in the EU (Eurostat).<\/strong> Using the <code>eurostat<\/code> package in R, download data for the countries of the European Union for 2022 on the unemployment rate, annual inflation and GDP per person. After cleaning and merging the data, create a binary dependent variable <code>high_inflation<\/code>, with the value 1 if annual inflation is greater than the median for the EU countries, and 0 otherwise. Then split the dataset into a training set (70 percent) and a test set (30 percent) with <code>set.seed(123)<\/code>, estimate a logistic regression on the training set with <code>high_inflation<\/code> as the dependent variable and the unemployment rate and GDP per person as independent variables, calculate the predicted classes for the test set with a threshold of 0.5, make a confusion matrix and calculate accuracy on the test set, and then carry out 5-fold cross-validation. Finally, compare the accuracy from the test set with the accuracy from cross-validation and briefly explain what these two measures tell us about the quality of the model. With only 27 observations, how much do you trust either figure?<\/p>\n","answer":"<p>Data: <code>eurostat_2022_tidy.csv<\/code> for unemployment and inflation, and Eurostat's <code>nama_10_pc<\/code> for GDP per person in current euros, downloaded on 10 November 2026. There are 27 countries, the median inflation rate is 9.3 percent and 12 countries are a
