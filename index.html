на прогноза на приходите.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Пет прашања за <strong>(б)<\/strong>: Одлуката е редоследот на инспекциите, што го одредува агенцијата за безбедност на храната. Исходот е сериозен прекршок при следната инспекција. Инспекцијата може да го промени подоцнежното однесување, но непосредната цел е да се најдат постоечки прекршоци, па проблемот е близок до чадор. Лажната тревога троши една инспекција, а пропуштен случај може да остави здравствена опасност. Може да се користат само минатите инспекции, поплаките и информациите за лиценците, и тоа само ако се достапни пред инспекцијата.<\/p>\n<p>Пет прашања за <strong>(д)<\/strong>: Министерството за финансии одлучува за буџетот, а неговите алтернативи се нивоата на трошење. Исходот се вкупните даночни приходи следната година. Буџетот има извесен ефект врз економијата, а со тоа и врз приходите, што е причинско-последичен елемент. Преценувањето води кон непланирано задолжување или кратења, а потценувањето кон непотребни кратења на трошењето. Може да се користат само податоците достапни кога се подготвува буџетот.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Прогнозирање, проценување на сегашната состојба или ретроспективно предвидување?<\/strong> За БДП, невработеноста и извозот на Северна Македонија, дајте по еден пример за секој вид процена. Кои податоци би биле достапни во моментот на процената? Кој од примерите би бил најкорисен за министерството за финансии и зошто?<\/p>\n","answer":"<p>Примери се:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Серија<\/th>\n<th align=\"left\">Прогноза<\/th>\n<th align=\"left\">Тековна проценка<\/th>\n<th align=\"left\">Обратна прогноза<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">БДП<\/td>\n<td align=\"left\">Растот следната година, од тековните показатели и странската побарувачка<\/td>\n<td align=\"left\">БДП за овој квартал, од индустриското производство, трговијата и даночните приливи<\/td>\n<td align=\"left\">Патот на инвестициите потребен за да се достигне целниот БДП во 2035<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Невработеност<\/td>\n<td align=\"left\">Стапката за две години, од демографијата и растот<\/td>\n<td align=\"left\">Стапката за овој квартал, од евиденцијата на службата за вработување<\/td>\n<td align=\"left\">Обуката потребна за да се достигне целната стапка<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Извоз<\/td>\n<td align=\"left\">Извозот следната година, од прогнозите за БДП на партнерите<\/td>\n<td align=\"left\">Извозот овој месец, од царинските податоци и увозот на партнерите<\/td>\n<td align=\"left\">Секторските промени потребни за да се достигне извозната цел<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Тековната проценка на БДП и прогнозата важна за приходите би биле најкорисни за Министерството за финансии, бидејќи директно влегуваат во планирањето на буџетот и приходите, а официјалните податоци за БДП пристигнуваат со задоцнување.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Надгледувано или ненадгледувано?<\/strong> За секоја задача кажете кој вид учење се применува и, кога е релевантно, дали станува збор за регресиона анализа или класификација: (а) групирање општини со слични економии; (б) предвидување на извозот за следната година; (в) предвидување дали некоја фирма нема да го отплати долгот; (г) комбинирање десет показатели во еден индекс. Објаснете кој е излезот во секој надгледуван случај.<\/p>\n","answer":"<ul>\n<li>(а) <strong>Ненадгледувано<\/strong> учење: групирање, без излез.<\/li>\n<li>(б) <strong>Надгледувано, регресија:<\/strong> излезот е вредноста на извозот следната година.<\/li>\n<li>(в) <strong>Надгледувано, класификација:<\/strong> излезот е неплаќање или плаќање.<\/li>\n<li>(г) <strong>Ненадгледувано<\/strong> учење: на пример, анализа на главни компоненти, без излез.<\/li>\n<\/ul>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Цената на грешките.<\/strong> Даночна управа може да изврши ревизија на 500 од 20,000 фирми. Запишете колкава е цената на лажна тревога и на пропуштен случај и за кого. Зошто „точноста“ е слаб начин на мерење успех во оваа ситуација? Што би мереле наместо неа?<\/p>\n","answer":"<p><strong>Лажна тревога<\/strong> (ревизија на фирма што ги почитува прописите) го троши ограниченото време на органот и наметнува трошоци на фирмата. <strong>Пропуштен случај<\/strong> (неревидирање на фирма што избегнува данок) предизвикува губење даночни приходи, нефер е кон фирмите што ги почитуваат прописите и може да поттикне повеќе избегнување.<\/p>\n<p>„Точноста“ е лоша мерка бидејќи само неколку фирми избегнуваат данок и само 500 од 20,000 може да се ревидираат. Ако 5 проценти од фирмите избегнуваат данок, правилото „ниту една фирма не избегнува“ е 95 проценти точно и бескорисно.<\/p>\n<p>Подобри мерки се <strong>уделот од 500-те ревизии што откриваат избегнување<\/strong> (прецизност меѓу ревидираните фирми), <strong>дополнителниот наплатен данок по ревизија<\/strong> и уделот од вкупното избегнување што е опфатено. Споредете ги со случајни ревизии и со тековните правила за избор на органот. Запомнете дека исходите може да се набљудуваат само за ревидираните фирми, што е проблемот на селективни ознаки.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5 (AI): Формулирајте македонска одлука.<\/strong> Изберете реална одлука на јавна институција во Северна Македонија и употребете го првото барање во Оддел 5.7-learning. Означете го секое тврдење што би можеле да го проверите од јавен извор. Кои податоци би ѝ требале на институцијата и дали располага со нив?<\/p>\n","answer":"<p>Одговорот зависи од вашата одлука. Добриот одговор ги одделува потврдените тврдења од претпоставките на четботот и дава врска до јавен извор за секое потврдено тврдење. Наведува и кои податоци се потребни и кој ги има (на пример, Агенцијата за вработување за регистрираната невработеност). Треба да ги наведе правната основа и заштитата на личните податоци. Не вметнувајте поединечни записи во четбот.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6 (AI): Откријте ја каузалната приказна.<\/strong> Најдете новинарски напис што известува за модел за предвидување или статистички наод и употребете го третото барање во Оддел 5.7-learning. Дали се согласувате со разговорниот бот околу тоа каде текстот преминува од предвидување кон причина? Преформулирајте една реченица така што ќе го тврди само она што е поткрепено со доказите.<\/p>\n","answer":"<p>Одговорот зависи од статијата. Барајте изрази како „предизвикува“, „води до“, „бидејќи“ или „намалува“ поврзани со корелација или резултат на предвидување. На пример, може да го замените „Учениците што ја користат апликацијата постигнуваат подобри резултати поради апликацијата“ со „Учениците што ја користат апликацијата имаа повисоки резултати во просек, но студијата не покажува дека апликацијата ја предизвикала разликата.“<\/p>\n"}],"title_mk":"Статистичко учење и предвидување за јавните политики","part_mk":"III. Статистичко учење и предвидување за јавните политики","check":{"status":"No code","seconds":null,"book_lines":0,"matched":0,"message":""}},{"number":8,"title":"Unsupervised Learning","part":"III. Statistical learning and policy prediction","folder":"ch08-unsupervised","has_code":true,"code_lines":224,"datasets":["cfnai.csv","eurostat_regions_2022.csv","us_treasury_yields.csv","usa_imports_machinery_2023.xlsx","wdi_hdi_clean_2022.csv"],"packages":["dplyr","ggplot2","ggrepel","knitr","moments","readxl","scales","tidyr","treemapify"],"figures":12,"tables":1,"stories":3,"closers":1,"prompts":3,"exercises":12,"questions":33,"solutions":[{"kind":"q","n":1,"ask":"<p>What is unsupervised learning and how does it differ from supervised learning?<\/p>\n","answer":"<p>Unsupervised learning looks for structure in data when there is no dependent variable. Supervised learning has a known answer for each observation and learns to predict it.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>In what situations is it appropriate to use unsupervised learning?<\/p>\n","answer":"<p>When we want to discover structure rather than predict an outcome: to reduce many indicators to a few, to visualise data, to find groups of similar observations, or to prepare inputs for a later model.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Why is there no dependent variable in unsupervised learning?<\/p>\n","answer":"<p>Because the aim is not to predict one variable from others. All variables are treated alike, and the method looks for patterns among them.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Give two examples from economics in which unsupervised learning could be useful.<\/p>\n","answer":"<p>Two examples are building a single index from many activity indicators, as with the Chicago Fed index, and grouping European regions with similar labour markets.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>What is the goal of principal component analysis?<\/p>\n","answer":"<p>To reduce the number of indicators without losing much information, by creating new uncorrelated variables that capture as much of the variation as possible.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>How does PCA help us to reduce the dimensionality of data?<\/p>\n","answer":"<p>It replaces the original variables with components ordered by the share of variance they explain. Keeping only the first few retains most of the structure with fewer dimensions.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>What does the first principal component represent?<\/p>\n","answer":"<p>It is the linear combination of the standardised variables that captures the largest share of their variation. Often it represents what the variables have in common, such as overall development.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>What are loadings in PCA and how are they interpreted?<\/p>\n","answer":"<p>Loadings show how much each variable contributes to a component. A large loading in absolute value means that the variable strongly shapes the component, and the sign indicates direction relative to the other variables.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>What are component scores in PCA?<\/p>\n","answer":"<p>They are each observation's values on the new components: its position on the new axes.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Why is it important to standardise variables before applying PCA?<\/p>\n","answer":"<p>So that the components are based on variation rather than on units. Without it, the variables with the largest numbers would dominate.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>What can happen if we apply PCA to variables measured in different units without standardising them?<\/p>\n","answer":"<p>Variables with large numerical ranges, such as GDP in dollars, dominate the first component, so the result reflects the units of measurement rather than the structure of the data.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>How can PCA be used in constructing a composite index?<\/p>\n","answer":"<p>Take the loadings of the first component, check their signs, take their absolute values and rescale so they sum to 1. Then use them as weights for the standardised or normalised indicators. These weights describe shared variation, not importance.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>What is the difference between the original variables and the principal components?<\/p>\n","answer":"<p>The original variables are the measured quantities. The components are new variables built as linear combinations of them, are uncorrelated with one another and are ordered by the variance they explain.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>What is cluster analysis?<\/p>\n","answer":"<p>A family of methods for identifying unknown subgroups of similar observations in data.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>What is the goal of cluster analysis in data analysis?<\/p>\n","answer":"<p>To group observations so that those in the same cluster are similar and those in different clusters are different, without predefined categories.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>How do we interpret the fact that two observations belong to the same cluster?<\/p>\n","answer":"<p>They are similar on the variables used in the analysis. It does not mean that they are the same in other respects or share a causal mechanism.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>What is k-means cluster analysis?<\/p>\n","answer":"<p>An algorithm that divides observations into K groups by repeatedly assigning each observation to the nearest centre and recalculating the centres, to minimise within-cluster variation.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Why does k-means require the number of clusters to be chosen in advance?<\/p>\n","answer":"<p>K determines how many centres the algorithm starts with, and the method has no way of deciding by itself how many groups there should be.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>What is the elbow method and how does it help in choosing the number of clusters?<\/p>\n","answer":"<p>It plots total within-cluster variation against K and looks for the point beyond which adding clusters brings little improvement. That point is a matter of judgement.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>What is the difference between visualising with PCA and grouping with cluster analysis?<\/p>\n","answer":"<p>PCA gives each observation a position on continuous new axes. Clustering assigns each observation to a discrete group. They are often combined, with clusters shown on a chart of the first two components.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>How can the results of unsupervised learning be used in supervised models?<\/p>\n","answer":"<p>Component scores can serve as independent variables in a regression, and cluster labels can be used as inputs or to choose comparisons.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>Imagine that two variables are very strongly related. How might this be reflected in PCA?<\/p>\n","answer":"<p>Both will have large loadings on the same component, and that component will explain a large share of the variance. Their shared information receives extra weight.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>If a country has a very high score on the first principal component, what might that mean?<\/p>\n","answer":"<p>The country lies far along the main dimension of variation, but you must check the signs of the loadings. In this chapter's example, high values of PC1 mean <em>lower<\/em> development.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>If two countries are close to each other on a chart of the first two principal components, what does that tell us?<\/p>\n","answer":"<p>They have similar values on the dimensions that matter most for the variance, so they have similar profiles on the indicators used.<\/p>\n"},{"kind":"q","n":25,"ask":"<p>Do PCA and cluster analysis give a &quot;correct answer&quot; or do they help us to discover structure in the data? Explain.<\/p>\n","answer":"<p>They help to discover structure. They always produce an answer, but no &quot;correct answer&quot; exists against which to check them, so the results must be interpreted and tested.<\/p>\n"},{"kind":"q","n":26,"ask":"<p>What are the main limitations of unsupervised learning when interpreting results?<\/p>\n","answer":"<p>Results depend on the variables and scaling chosen. Components and clusters have no built-in meaning. K-means finds clusters even in random data. Results can be unstable, and there is no outcome against which to test them.<\/p>\n"},{"kind":"q","n":27,"ask":"<p>Why might adding a second measure of income to a PCA raise the total weight on income? Is that a good thing?<\/p>\n","answer":"<p>PC1 rewards indicators that move together, so a second income measure strengthens the shared income pattern. In the book's example, income's combined weight rises from a third to over half, although nothing new was measured. That is a problem if you want to measure importance.<\/p>\n"},{"kind":"q","n":28,"ask":"<p>Why can the sign of a principal component be reversed without changing the analysis?<\/p>\n","answer":"<p>PCA fixes the line along which a component runs, not which way along it counts as positive. Multiplying all the loadings and scores by −1 gives an equivalent component.<\/p>\n"},{"kind":"q","n":29,"ask":"<p>What do the level, slope and curvature components of the yield curve represent?<\/p>\n","answer":"<p><strong>Level<\/strong> is a parallel shift of yields at all maturities. <strong>Slope<\/strong> moves short-term and long-term yields in opposite directions, so the curve tilts. <strong>Curvature<\/strong> moves middle maturities against both ends, so the curve bends.<\/p>\n"},{"kind":"q","n":30,"ask":"<p>Why does k-means use several random starts?<\/p>\n","answer":"<p>Different starting centres can lead to different final groups. Using many starts and keeping the solution with the lowest within-cluster variation produces a better and more stable result.<\/p>\n"},{"kind":"q","n":31,"ask":"<p>What did you learn from applying k-means to random numbers?<\/p>\n","answer":"<p>K-means still returned clusters, and the curve still appeared to bend. The existence of clusters is not evidence of real groups.<\/p>\n"},{"kind":"q","n":32,"ask":"<p>Name four checks you should make on a chatbot's PCA or cluster analysis.<\/p>\n","answer":"<p>Any four of these: check standardisation; read the signs of the loadings; reject the claim that PCA weights are objective; compare clusters by their means in original units; judge the elbow yourself; check any invented cluster labels; and count the observations before and after cleaning.<\/p>\n"},{"kind":"q","n":33,"ask":"<p>What role does unsupervised learning play in a prediction policy problem?<\/p>\n","answer":"<p>It prepares inputs and compact signals, and it helps choose comparisons. It predicts nothing by itself: a link to an outcome comes from a separate supervised step.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: A PCA index (World Bank).<\/strong> Using the <code>WDI<\/code> package in R, download data from the World Bank for all countries for 2022 on <code>IT.NET.USER.ZS<\/code> (individuals using the Internet, % of population), <code>EG.ELC.ACCS.ZS<\/code> (access to electricity, % of population) and <code>SP.URB.TOTL.IN.ZS<\/code> (urban population, % of total). Clean the data, standardise the variables and apply PCA. Use the weights of the first principal component to construct a composite index for each country. Show the 10 countries with the highest value of the index and briefly interpret what the index measures.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(internet = &quot;IT.NET.USER.ZS&quot;, electricity = &quot;EG.ELC.ACCS.ZS&quot;,\n                       urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;) %&gt;%\n  filter(!is.na(internet), !is.na(electricity), !is.na(urban))\n\ns &lt;- scale(d[, c(&quot;internet&quot;, &quot;electricity&quot;, &quot;urban&quot;)])\np &lt;- prcomp(s)\nw &lt;- abs(p$rotation[, 1]) / sum(abs(p$rotation[, 1]))\nd$index &lt;- as.numeric(s %*% w)\nd %&gt;% arrange(desc(index)) %&gt;% select(country, index) %&gt;% head(10)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>179 countries<\/strong> with complete data. All three loadings have the same sign (0.62, 0.58 and 0.53 in absolute value), and PC1 explains <strong>79.3 percent<\/strong> of the variance. The weights are 0.361 for internet use, 0.334 for electricity and 0.305 for urban population.<\/p>\n<p><strong>Top 10:<\/strong> Bahrain, Kuwait, Monaco, Qatar, Singapore, Hong Kong, San Marino, Luxembourg, Iceland and Macao. North Macedonia is 78th of 179.<\/p>\n<p>The index measures <strong>access to modern infrastructure and urbanised, connected living<\/strong>. Note the top of the list: small, very urban economies with universal electricity. Countries with larger rural populations, however rich, score lower, so it measures urban connectedness rather than development overall.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Clusters of economic conditions (World Bank).<\/strong> Download data for all countries for 2022 on <code>NY.GDP.PCAP.CD<\/code> (GDP per person), <code>SL.UEM.TOTL.ZS<\/code> (unemployment rate) and <code>FP.CPI.TOTL.ZG<\/code> (inflation, %). After cleaning and standardising the data, apply k-means with 3 clusters. Show how many countries there are in each cluster and describe the differences between the clusters through the mean values of the indicators. Which countries end up alone or nearly alone in a cluster, and why? What does that say about k-means and outliers?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(gdp = &quot;NY.GDP.PCAP.CD&quot;, unemp = &quot;SL.UEM.TOTL.ZS&quot;, infl = &quot;FP.CPI.TOTL.ZG&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(gdp), !is.na(unemp), !is.na(infl))\nset.seed(123)\nk &lt;- kmeans(scale(d[, c(&quot;gdp&quot;, &quot;unemp&quot;, &quot;infl&quot;)]), centers = 3, nstart = 25)\nd$cluster &lt;- k$cluster\nd %&gt;% group_by(cluster) %&gt;%\n  summarise(n = n(), gdp = mean(gdp), unemp = mean(unemp), infl = mean(infl))\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>167 countries<\/strong> with complete data.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Cluster<\/th>\n<th align=\"right\">Countries<\/th>\n<th align=\"right\">GDP per person (US$)<\/th>\n<th align=\"right\">Unemployment (%)<\/th>\n<th align=\"right\">Inflation (%)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">High income<\/td>\n<td align=\"right\">31<\/td>\n<td align=\"right\">60,052<\/td>\n<td align=\"right\">4.0<\/td>\n<td align=\"right\">5.9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Most countries<\/td>\n<td align=\"right\">131<\/td>\n<td align=\"right\">7,816<\/td>\n<td align=\"right\">7.5<\/td>\n<td align=\"right\">11.1<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Extreme inflation<\/td>\n<td align=\"right\">5<\/td>\n<td align=\"right\">6,419<\/td>\n<td align=\"right\">9.2<\/td>\n<td align=\"right\">112<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The <strong>five countries in the small cluster are Lebanon (171 percent), Sudan (139), Zimbabwe (105), Argentina (72) and Türkiye (72)<\/strong>. They are together only because of inflation, even though their incomes and unemployment rates differ widely. K-means minimises squared distances, so a few extreme values can claim a whole cluster, while 131 quite different countries share another. Consider using logarithms or a robust transformation of inflation, or reporting the outliers separately.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: PCA and clusters together (World Bank).<\/strong> Download data for all countries for 2022 on <code>SP.DYN.LE00.IN<\/code> (life expectancy), <code>SE.SEC.ENRR<\/code> (secondary enrolment) and <code>SH.XPD.CHEX.GD.ZS<\/code> (current health expenditure, % of GDP). First apply PCA and draw a scatter plot of the first two components. Then, on the same standardised data, apply k-means with 3 clusters and show the clusters on the same chart. Compare what PCA and cluster analysis each tell us about the similarities and differences between countries.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nlibrary(ggplot2)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, enrol = &quot;SE.SEC.ENRR&quot;, health = &quot;SH.XPD.CHEX.GD.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(enrol), !is.na(health))\ns &lt;- scale(d[, c(&quot;life&quot;, &quot;enrol&quot;, &quot;health&quot;)])\np &lt;- prcomp(s)\nset.seed(123)\nd$cluster &lt;- factor(kmeans(s, 3, nstart = 25)$cluster)\nd$PC1 &lt;- p$x[, 1]\nd$PC2 &lt;- p$x[, 2]\nggplot(d, aes(PC1, PC2, color = cluster, label = iso3c)) + geom_text(size = 2.5)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>132 countries<\/strong> with complete data. PC1 explains 61.5 percent of the variance, with loadings of similar sign on all three variables, so it reflects <strong>general human development<\/strong>. PC2 explains 26.4 percent and is dominated by health spending (0.89).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Cluster<\/th>\n<th align=\"right\">Countries<\/th>\n<th align=\"right\">Life expectancy<\/th>\n<th align=\"right\">Secondary enrolment (%)<\/th>\n<th align=\"right\">Health spending (% of GDP)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Middle<\/td>\n<td align=\"right\">72<\/td>\n<td align=\"right\">74.7<\/td>\n<td align=\"right\">94.4<\/td>\n<td align=\"right\">5.9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">High<\/td>\n<td align=\"right\">41<\/td>\n<td align=\"right\">79.7<\/td>\n<td align=\"right\">110<\/td>\n<td align=\"right\">10.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Low<\/td>\n<td align=\"right\">19<\/td>\n<td align=\"right\">66.8<\/td>\n<td align=\"right\">52.7<\/td>\n<td align=\"right\">5.4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>North Macedonia is in the middle group. PCA shows continuous positions and which indicators drive the main directions of variation, while k-means gives discrete groups, which cut through that cloud and may place similar countries on opposite sides of a boundary. Describe clusters by their means, not by their numbers.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: The digital world in clusters (World Bank).<\/strong> Using the indicators from Exercise 1, apply k-means with 3 clusters, show how many countries there are in each cluster and describe the differences between them. Submit a short document with the chart and a description of the composition of each cluster, together with your R code.<\/p>\n","answer":"<p>Use the cleaned data from Exercise 1 with the following code. Then report the number of countries per cluster and the means in original units.<\/p>\n<pre><code class=\"language-r\">set.seed(123)\nd$cluster &lt;- kmeans(s, centers = 3, nstart = 25)$cluster\nd %&gt;% group_by(cluster) %&gt;%\n  summarise(n = n(), internet = mean(internet), electricity = mean(electricity), urban = mean(urban))\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. With the 179 countries from Exercise 1:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Cluster<\/th>\n<th align=\"right\">Countries<\/th>\n<th align=\"right\">Internet users (%)<\/th>\n<th align=\"right\">Electricity access (%)<\/th>\n<th align=\"right\">Urban (%)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Connected and urban<\/td>\n<td align=\"right\">81<\/td>\n<td align=\"right\">88.0<\/td>\n<td align=\"right\">99.4<\/td>\n<td align=\"right\">81.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Connected but less urban<\/td>\n<td align=\"right\">62<\/td>\n<td align=\"right\">71.5<\/td>\n<td align=\"right\">95.3<\/td>\n<td align=\"right\">48.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Low access<\/td>\n<td align=\"right\">36<\/td>\n<td align=\"right\">28.4<\/td>\n<td align=\"right\">44.9<\/td>\n<td align=\"right\">39.9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>North Macedonia is in the middle group. The middle group has near-universal electricity, and it differs from the first mainly in urbanisation and internet use. The low-access group's main problem is electricity itself.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: A full workflow.<\/strong> Choose your own three or four indicators and follow these eight steps: (1) set the working directory; (2) load the required libraries; (3) download the data; (4) clean the data; (5) standardise the indicators; (6) apply PCA and k-means; (7) analyse and visualise the results; (8) save the results with <code>write.csv()<\/code> and <code>ggsave()<\/code>.<\/p>\n","answer":"<p>The answer depends on your indicators. A good submission uses an RStudio Project, shows the number of rows before and after cleaning, standardises the indicators before both PCA and k-means, uses <code>nstart = 25<\/code> and <code>set.seed()<\/code>, checks the signs of the loadings and describes each cluster by its means. It should save the results with <code>write.csv()<\/code> and the charts with <code>ggsave()<\/code>.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6: The yield curve in other periods (FRED).<\/strong> Repeat the PCA on Treasury yield changes using <code>data/us_treasury_yields.csv<\/code> separately for 1976 to 2000 and for 2001 onwards. Do the loadings change? Does PC1 explain more or less of the variation? Add a series such as <code>GS20<\/code> or <code>GS30<\/code> and explain how you deal with its gaps.<\/p>\n","answer":"<p>Using <code>us_treasury_yields.csv<\/code> (monthly changes):<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Period<\/th>\n<th align=\"right\">Months<\/th>\n<th align=\"right\">PC1<\/th>\n<th align=\"right\">PC2<\/th>\n<th align=\"right\">PC3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Before 2001<\/td>\n<td align=\"right\">294<\/td>\n<td align=\"right\">95.5%<\/td>\n<td align=\"right\">3.9%<\/td>\n<td align=\"right\">0.3%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2001 onwards<\/td>\n<td align=\"right\">310<\/td>\n<td align=\"right\">87.6%<\/td>\n<td align=\"right\">10.4%<\/td>\n<td align=\"right\">1.6%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Whole sample<\/td>\n<td align=\"right\">604<\/td>\n<td align=\"right\">93.7%<\/td>\n<td align=\"right\">5.5%<\/td>\n<td align=\"right\">0.6%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The shapes barely change. PC1 is almost flat, PC2 still tilts and PC3 still bends, but the signs of PC2 and PC3 can flip, which means nothing. <strong>PC1 explains less after 2001<\/strong>, while slope and curvature explain more. Near-zero short-term rates after 2008 are one possible reason, since short rates then moved very little while long rates still did.<\/p>\n<pre><code class=\"language-r\">y &lt;- read.csv(&quot;data/us_treasury_yields.csv&quot;)\ndates &lt;- as.Date(y$date)[-1]\nchanges &lt;- apply(y[, -1], 2, diff)\nsummary(prcomp(changes[dates &lt; as.Date(&quot;2001-01-01&quot;), ], scale. = TRUE))\nsummary(prcomp(changes[dates &gt;= as.Date(&quot;2001-01-01&quot;), ], scale. = TRUE))\n<\/code><\/pre>\n<p><strong>Adding a series.<\/strong> <code>GS30<\/code> begins in February 1977 and had no missing values in the file used here, so the join simply shortens the sample. PC1 then explains 91.9 percent, over 596 months, and the 30-year loading on PC2 is the largest in size, extending the tilt. <code>GS20<\/code> has 81 missing values in its history. Do not fill those with guesses, and do not take differences across a gap. Either use only the period with no gaps, or drop the series, and state which.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7: A small activity index of your own (FRED).<\/strong> Choose 8 to 10 monthly US series from FRED on production, employment, housing and sales. Transform each into a growth rate, compute the first principal component, and compare it with <code>CFNAI<\/code>. Flip the sign if necessary. In which periods do they differ most?<\/p>\n","answer":"<p>Example with ten series from January 1992 to September 2026: <code>INDPRO<\/code>, <code>PAYEMS<\/code>, <code>HOUST<\/code>, <code>PERMIT<\/code>, <code>RSAFS<\/code>, <code>DSPIC96<\/code>, <code>IPMAN<\/code>, <code>AWHMAN<\/code>, <code>UNRATE<\/code> and <code>CE16OV<\/code>. Log growth rates were used, with first differences for <code>UNRATE<\/code> and <code>AWHMAN<\/code>.<\/p>\n<p>PC1 explains <strong>56.8 percent<\/strong> of the variance. Loadings are similar in size except for housing and income, and <code>UNRATE<\/code> has the opposite sign as expected. After flipping the sign, the correlation with <code>CFNAI<\/code> is <strong>0.97 over 415 months<\/strong>. Without 2020, it is <strong>0.86<\/strong>, which shows how much a single extreme episode can inflate a correlation.<\/p>\n<p>Standardised differences are largest in <strong>January to June 2009 and April 2020<\/strong>. Our index has far fewer series, and only one of them concerns income, so it reacts differently in downturns.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8: How many European regions? (Eurostat).<\/strong> Using <code>data/eurostat_regions_2022.csv<\/code>, draw the elbow chart. Then run k-means with 3, 4 and 5 clusters. Which regions change group? Remove one variable at a time and report whether the north-south split in Italy survives.<\/p>\n","answer":"<p>Results for <code>eurostat_regions_2022.csv<\/code> (269 regions, four variables).<\/p>\n<p>The within-cluster sum of squares for K = 1 to 6 is 1,072, 604, 431, 358, 307 and 264. Each extra cluster removes 44, 29, 17, 14 and 14 percent of what remains. There is a bend around K = 3 or 4, and it is a matter of judgement.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">K<\/th>\n<th align=\"left\">Groups, by average GDP per head (PPS)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">3<\/td>\n<td align=\"left\">Low employment (71 regions, 20,600); middle (142, 31,300); rich, educated (56, 50,100)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4<\/td>\n<td align=\"left\">Low employment (69, 20,300); high employment, few graduates (109, 32,100); many graduates (62, 33,300); rich, metropolitan (29, 60,000)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">5<\/td>\n<td align=\"left\">Adds a split among the less-rich regions, with low-employment 61, 53 and 54 regions, then 74 and 27<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Moving from K = 3 to K = 4 mainly splits the middle group: 107 of its regions go to the high-employment group and 35 to the graduate group, while 25 rich regions join the graduates. Regions on boundaries change most.<\/p>\n<p>For K = 4, removing each variable in turn gives this result for Italy:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Variable removed<\/th>\n<th align=\"left\">Do the eight southern regions stay together?<\/th>\n<th align=\"left\">North<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">None<\/td>\n<td align=\"left\">Yes<\/td>\n<td align=\"left\">13 regions together<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">GDP per head<\/td>\n<td align=\"left\"><strong>No, split 4 and 4<\/strong><\/td>\n<td align=\"left\">Split 4 and 9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Employment<\/td>\n<td align=\"left\"><strong>No, split 6 and 2<\/strong><\/td>\n<td align=\"left\">13 together<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Tertiary<\/td>\n<td align=\"left\">Yes<\/td>\n<td align=\"left\">Split into three groups<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Unemployment<\/td>\n<td align=\"left\">Yes<\/td>\n<td align=\"left\">13 together<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The north-south split is therefore partly robust. It depends on GDP and employment, while it survives removing tertiary education or unemployment.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Exercise 9: Structure rather than size.<\/strong> Repeat the machinery example, but with each product measured as a share of each country's total before standardising. Which countries are now in North Macedonia's cluster? Why might you drop countries that export only one or two products?<\/p>\n","answer":"<pre><code class=\"language-r\">library(readxl)\ndf &lt;- read_excel(&quot;data/usa_imports_machinery_2023.xlsx&quot;)\nM &lt;- as.matrix(df[, -1])\nshares &lt;- M / rowSums(M)\ns &lt;- scale(shares[, apply(shares, 2, sd) &gt; 0])\nset.seed(123)\nk &lt;- kmeans(s, 4, nstart = 25)\ntable(k$cluster)\n<\/code><\/pre>\n<p>The result is very different from the chapter. Clusters have sizes <strong>172, 3, 1 and 1<\/strong>, and North Macedonia is in the group of 172, which includes almost everyone. With shares, a country that exports only one or two products has a 100 percent or nearly 100 percent share in them, which is extreme after standardisation. Those few countries take clusters for themselves. For example, Benin's value is essentially all cars.<\/p>\n<p>Dropping countries with fewer than five products removes much of this noise, leaving 117 countries, but North Macedonia's cluster still has 105 members. Countries with one or two products should be dropped because their shares reflect a few shipments and tell us nothing about export structure. North Macedonia has 10 products, and 94 percent of its value is buses. The honest conclusion is that this simple method gives little useful structure, and alternatives such as measures of similarity between product shares may be needed.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Exercise 10: North Macedonia's regions (MakStat).<\/strong> From the State Statistical Office's MakStat database, collect at least four indicators for the eight planning regions. Run a PCA and interpret the first two components. Why is k-means of little use with only eight observations? What could you do in its place?<\/p>\n","answer":"<p>The specific figures depend on what you find in MakStat. A good answer uses regional indicators such as GDP per head, employment and education, standardises them, and interprets PC1 and PC2 through loadings. With only eight observations, PCA is descriptive at best, and k-means has too few observations to give stable groups, since a single region could change everything. Instead, present a table or chart of the regions, compare them directly with a composite index, or use a hierarchical diagram to show which regions are similar.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Exercise 11 (AI): Audit a chatbot's PCA.<\/strong> Give a chatbot <code>wdi_hdi_clean_2022.csv<\/code> and the first prompt in Section 5.7-unsup. Run the code. Did it standardise? Did it describe the weights as &quot;objective&quot;? Now add a column of random numbers and rerun the code. Did the chatbot's description of what the weights mean still hold?<\/p>\n","answer":"<p>A good chatbot should standardise the variables and use <code>prcomp<\/code> with <code>scale. = TRUE<\/code>. Watch for the words &quot;objective&quot; or &quot;importance&quot;. Adding a random column should change little in PC1 weights: the random variable gets a loading near zero, just as in this chapter's experiment. This means that PC1 weights describe agreement between variables, and any description of them as importance is shown to be false: an unrelated indicator receives no weight, whether it is noise or the most important thing about a country.<\/p>\n"},{"kind":"e","n":12,"ask":"<p><strong>Exercise 12 (AI): Name the clusters, then check.<\/strong> Paste your cluster means and member lists for one of the exercises above and ask a chatbot to name the clusters. Using the group means, mark each name as supported or unsupported. Then ask it which countries are misplaced, and verify two of its claims by looking up the data.<\/p>\n","answer":"<p>The result depends on your clusters. For each name, compare it with the group means. &quot;High income&quot; needs a high GDP mean, and &quot;digital leaders&quot; needs high internet use. Mark other claims as unsupported. A claim that a country is &quot;misplaced&quot; should be checked against the data, and you should remember that a cluster has no truth against which a placement could be judged wrong: the only question is whether its values are close to its group's centre.<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што е ненадгледувано учење и по што се разликува од надгледуваното учење (supervised learning)?<\/p>\n","answer":"<p>Ненадгледуваното учење бара структура во податоците кога нема зависна променлива. Надгледуваното учење има познат одговор за секое набљудување и учи да го предвидува.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Во кои ситуации е соодветно да се користи ненадгледувано учење?<\/p>\n","answer":"<p>Кога сакаме да откриеме структура, а не да предвидиме исход: за да намалиме многу показатели на неколку, да ги визуелизираме податоците, да најдеме групи слични набљудувања или да подготвиме влезови за подоцнежен модел.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Зошто во ненадгледуваното учење нема зависна променлива?<\/p>\n","answer":"<p>Затоа што целта не е да се предвиди една променлива од другите. Сите променливи се третираат еднакво, а методот бара шеми меѓу нив.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Дајте два примера од економијата во кои ненадгледуваното учење би можело да биде корисно.<\/p>\n","answer":"<p>Два примери се изградба на еден индекс од многу показатели на активност, како индексот на Федералните резерви од Чикаго, и групирање на европски региони со слични пазари на труд.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Која е целта на анализата на главни компоненти?<\/p>\n","answer":"<p>За да се намали бројот на показатели без да се изгуби многу информација, со создавање нови некорелирани променливи што опфаќаат што е можно повеќе од варијацијата.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Како PCA ни помага да ја намалиме димензионалноста на податоците?<\/p>\n","answer":"<p>Ги заменува изворните променливи со компоненти подредени според уделот на варијансата што го објаснуваат. Со задржување само на првите неколку, поголемиот дел од структурата се зачувува со помалку димензии.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Што претставува првата главна компонента?<\/p>\n","answer":"<p>Тоа е линеарната комбинација на стандардизираните променливи што го опфаќа најголемиот удел од нивната варијација. Често го претставува она што променливите го имаат заедничко, како општиот развој.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Што се компонентните оптоварувања во PCA и како се толкуваат?<\/p>\n","answer":"<p>Оптоварувањата покажуваат колку секоја променлива придонесува кон компонентата. Големо оптоварување по апсолутна вредност значи дека променливата силно ја обликува компонентата, а знакот ја покажува насоката во однос на другите променливи.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Што се компонентните резултати во PCA?<\/p>\n","answer":"<p>Тоа се вредностите на секое набљудување на новите компоненти: неговата положба на новите оски.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Зошто е важно променливите да се стандардизираат пред да се примени PCA?<\/p>\n","answer":"<p>За компонентите да се засноваат на варијација, а не на единици. Без тоа, би доминирале променливите со најголеми бројки.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Што може да се случи ако примениме PCA врз променливи измерени во различни единици без да ги стандардизираме?<\/p>\n","answer":"<p>Променливите со големи бројчани опсези, како БДП во долари, доминираат во првата компонента, па резултатот ги одразува мерните единици, а не структурата на податоците.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Како може PCA да се користи при конструирање композитен индекс?<\/p>\n","answer":"<p>Земете ги оптоварувањата на првата компонента, проверете ги нивните знаци, земете ги нивните апсолутни вредности и прескалирајте ги така што збирот да биде 1. Потоа користете ги како пондери за стандардизираните или нормализираните показатели. Овие пондери ја опишуваат заедничката варијација, а не важноста.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Која е разликата меѓу првичните променливи и главните компоненти?<\/p>\n","answer":"<p>Изворните променливи се измерените величини. Компонентите се нови променливи изградени како нивни линеарни комбинации, некорелирани се меѓу себе и подредени се според варијансата што ја објаснуваат.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Што е кластерска анализа?<\/p>\n","answer":"<p>Група методи за откривање непознати подгрупи од слични набљудувања во податоците.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Која е целта на кластерската анализа во анализата на податоци?<\/p>\n","answer":"<p>Да се групираат набљудувањата така што оние во ист кластер да се слични, а оние во различни кластери различни, без однапред зададени категории.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Како го толкуваме фактот дека две набљудувања припаѓаат на ист кластер?<\/p>\n","answer":"<p>Слични се според променливите употребени во анализата. Тоа не значи дека се исти во други погледи или дека делат причински механизам.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Што е кластерска анализа со к-средни вредности?<\/p>\n","answer":"<p>Алгоритам што ги дели набљудувањата во K групи така што повторено го доделува секое набљудување на најблискиот центар и повторно ги пресметува центрите, за да се минимизира варијацијата во кластерите.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Зошто к-средни вредности бара бројот на кластери да се избере однапред?<\/p>\n","answer":"<p>K одредува со колку центри почнува алгоритмот, а методот нема начин сам да одлучи колку групи треба да има.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Што е методот на лактот и како помага при изборот на бројот на кластери?<\/p>\n","answer":"<p>Ја прикажува вкупната варијација во кластерите во однос на K и ја бара точката по која додавањето кластери носи мало подобрување. Таа точка е прашање на проценка.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Која е разликата меѓу визуализација со PCA и групирање со кластерска анализа?<\/p>\n","answer":"<p>PCA му дава на секое набљудување положба на непрекинати нови оски. Групирањето го доделува секое набљудување на дискретна група. Често се комбинираат, со кластери прикажани на график од првите две компоненти.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>Како резултатите од ненадгледуваното учење можат да се користат во надгледувани модели?<\/p>\n","answer":"<p>Вредностите на компонентите може да служат како независни променливи во регресија, а ознаките на кластерите може да се користат како влезови или за избор на споредби.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>Замислете дека две променливи се многу силно поврзани. Како може ова да се одрази во PCA?<\/p>\n","answer":"<p>Двете ќе имаат големи оптоварувања на истата компонента, а таа компонента ќе објаснува голем удел од варијансата. Нивната заедничка информација добива дополнителна тежина.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>Ако некоја држава има многу висок резултат на првата главна компонента, што би можело да значи тоа?<\/p>\n","answer":"<p>Државата е многу далеку по главната димензија на варијација, но мора да ги проверите знаците на оптоварувањата. Во примерот од ова поглавје, високи вредности на PC1 значат <em>понизок<\/em> развој.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>Ако две држави се блиску една до друга на графикон на првите две главни компоненти, што ни кажува тоа?<\/p>\n","answer":"<p>Имаат слични вредности на димензиите што се најважни за варијансата, па имаат слични профили според употребените показатели.<\/p>\n"},{"kind":"q","n":25,"ask":"<p>Дали PCA и кластерската анализа даваат „точен одговор“ или ни помагаат да откриеме структура во податоците? Објаснете.<\/p>\n","answer":"<p>Помагаат да се открие структура. Секогаш даваат одговор, но не постои „точен одговор“ со кој може да се проверат, па резултатите мора да се толкуваат и тестираат.<\/p>\n"},{"kind":"q","n":26,"ask":"<p>Кои се главните ограничувања на ненадгледуваното учење при толкување на резултатите?<\/p>\n","answer":"<p>Резултатите зависат од избраните променливи и скалирање. Компонентите и кластерите немаат вградено значење. K-средните вредности наоѓаат кластери дури и во случајни податоци. Резултатите може да бидат нестабилни и нема исход со кој може да се тестираат.<\/p>\n"},{"kind":"q","n":27,"ask":"<p>Зошто додавањето втора мерка на доходот во PCA може да го зголеми вкупниот пондер на доходот? Дали тоа е добро?<\/p>\n","answer":"<p>PC1 ги наградува показателите што се движат заедно, па втора мерка на приход ја зајакнува заедничката шема на приходот. Во примерот од книгата, комбинираниот пондер на приходот се зголемува од една третина на над половина, иако ништо ново не е измерено. Тоа е проблем ако сакате да мерите важност.<\/p>\n"},{"kind":"q","n":28,"ask":"<p>Зошто знакот на главната компонента може да се преврти без да се промени анализата?<\/p>\n","answer":"<p>PCA ја одредува линијата по која се протега компонентата, но не и која насока по неа се смета за позитивна. Множењето на сите оптоварувања и вредности со −1 дава еквивалентна компонента.<\/p>\n"},{"kind":"q","n":29,"ask":"<p>Што претставуваат компонентите ниво, наклон и закривеност на кривата на принос?<\/p>\n","answer":"<p><strong>Ниво<\/strong> е паралелно поместување на приносите на сите доспевања. <strong>Наклон<\/strong> ги поместува краткорочните и долгорочните приноси во спротивни насоки, па кривата се накосува. <strong>Искривеност<\/strong> ги поместува средните доспевања наспроти двата краја, па кривата се свиткува.<\/p>\n"},{"kind":"q","n":30,"ask":"<p>Зошто к-средни вредности користи неколку случајни почнувања?<\/p>\n","answer":"<p>Различни почетни центри може да доведат до различни конечни групи. Користењето многу почетоци и задржувањето на решението со најмала варијација во кластерите дава подобар и постабилен резултат.<\/p>\n"},{"kind":"q","n":31,"ask":"<p>Што научивте од примената на к-средни вредности врз случајни броеви?<\/p>\n","answer":"<p>K-средните вредности сепак вратија кластери, а кривата сепак изгледаше свиткана. Постоењето кластери не е доказ за вистински групи.<\/p>\n"},{"kind":"q","n":32,"ask":"<p>Наведете четири проверки што треба да ги направите на PCA или кластерска анализа од разговорен бот.<\/p>\n","answer":"<p>Кои било четири од овие: проверете ја стандардизацијата; прочитајте ги знаците на оптоварувањата; отфрлете го тврдењето дека пондерите од PCA се објективни; споредете ги кластерите според нивните средни вредности во изворните единици; сами проценете го лактот; проверете ги евентуално измислените ознаки на кластерите; и избројте ги набљудувањата пред и по чистењето.<\/p>\n"},{"kind":"q","n":33,"ask":"<p>Каква улога има ненадгледуваното учење во проблем на јавната политика што бара предвидување?<\/p>\n","answer":"<p>Подготвува влезови и збиени сигнали и помага при изборот на споредби. Сама по себе не предвидува ништо: врската со исходот доаѓа од посебен чекор на надгледувано учење.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Индекс со PCA (Светска банка).<\/strong> Користејќи го пакетот <code>WDI<\/code> во R, преземете податоци од Светската банка за сите држави за 2022 година за <code>IT.NET.USER.ZS<\/code> (поединци што користат интернет, % од населението), <code>EG.ELC.ACCS.ZS<\/code> (пристап до електрична енергија, % од населението) и <code>SP.URB.TOTL.IN.ZS<\/code> (урбано население, % од вкупното). Исчистете ги податоците, стандардизирајте ги променливите и применете PCA. Користете ги пондерите на првата главна компонента за да конструирате композитен индекс за секоја држава. Прикажете ги 10 држави со највисока вредност на индексот и накратко протолкувајте што мери индексот.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(internet = &quot;IT.NET.USER.ZS&quot;, electricity = &quot;EG.ELC.ACCS.ZS&quot;,\n                       urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;) %&gt;%\n  filter(!is.na(internet), !is.na(electricity), !is.na(urban))\n\ns &lt;- scale(d[, c(&quot;internet&quot;, &quot;electricity&quot;, &quot;urban&quot;)])\np &lt;- prcomp(s)\nw &lt;- abs(p$rotation[, 1]) / sum(abs(p$rotation[, 1]))\nd$index &lt;- as.numeric(s %*% w)\nd %&gt;% arrange(desc(index)) %&gt;% select(country, index) %&gt;% head(10)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>179 држави<\/strong> со целосни податоци. Сите три оптоварувања имаат ист знак (0.62, 0.58 и 0.53 по апсолутна вредност), а PC1 објаснува <strong>79.3 проценти<\/strong> од варијансата. Пондерите се 0.361 за користење интернет, 0.334 за електрична енергија и 0.305 за градско население.<\/p>\n<p><strong>Првите 10:<\/strong> Бахреин, Кувајт, Монако, Катар, Сингапур, Хонгконг, Сан Марино, Луксембург, Исланд и Макао. Северна Македонија е 78-ма од 179.<\/p>\n<p>Индексот мери <strong>пристап до модерна инфраструктура и урбанизиран, поврзан живот<\/strong>. Забележете го врвот на листата: мали, многу урбани економии со универзален пристап до електрична енергија. Државите со поголемо селско население, колку и да се богати, имаат понизок резултат, па индексот мери урбана поврзаност, а не општ развој.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Кластери на економски услови (Светска банка).<\/strong> Преземете податоци за сите држави за 2022 година за <code>NY.GDP.PCAP.CD<\/code> (БДП по жител), <code>SL.UEM.TOTL.ZS<\/code> (стапка на невработеност) и <code>FP.CPI.TOTL.ZG<\/code> (инфлација, %). По чистењето и стандардизацијата на податоците, применете к-средни вредности со 3 кластери. Прикажете колку држави има во секој кластер и опишете ги разликите меѓу кластерите преку средните вредности на показателите. Кои држави завршуваат сами или речиси сами во кластер и зошто? Што кажува тоа за к-средни вредности и аутлајерите, односно екстремните вредности (outliers)?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(gdp = &quot;NY.GDP.PCAP.CD&quot;, unemp = &quot;SL.UEM.TOTL.ZS&quot;, infl = &quot;FP.CPI.TOTL.ZG&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(gdp), !is.na(unemp), !is.na(infl))\nset.seed(123)\nk &lt;- kmeans(scale(d[, c(&quot;gdp&quot;, &quot;unemp&quot;, &quot;infl&quot;)]), centers = 3, nstart = 25)\nd$cluster &lt;- k$cluster\nd %&gt;% group_by(cluster) %&gt;%\n  summarise(n = n(), gdp = mean(gdp), unemp = mean(unemp), infl = mean(infl))\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>167 држави<\/strong> со целосни податоци.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Кластер<\/th>\n<th align=\"right\">Држави<\/th>\n<th align=\"right\">БДП по жител (US$)<\/th>\n<th align=\"right\">Невработеност (%)<\/th>\n<th align=\"right\">Инфлација (%)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Висок приход<\/td>\n<td align=\"right\">31<\/td>\n<td align=\"right\">60,052<\/td>\n<td align=\"right\">4.0<\/td>\n<td align=\"right\">5.9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Повеќето држави<\/td>\n<td align=\"right\">131<\/td>\n<td align=\"right\">7,816<\/td>\n<td align=\"right\">7.5<\/td>\n<td align=\"right\">11.1<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Екстремна инфлација<\/td>\n<td align=\"right\">5<\/td>\n<td align=\"right\">6,419<\/td>\n<td align=\"right\">9.2<\/td>\n<td align=\"right\">112<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Петте држави во малиот кластер се Либан (171 проценти), Судан (139), Зимбабве (105), Аргентина (72) и Турција (72)<\/strong>. Заедно се само поради инфлацијата, иако нивните приходи и стапки на невработеност многу се разликуваат. K-средните вредности ги минимизираат квадратните растојанија, па неколку екстремни вредности може да заземат цел кластер, додека 131 прилично различна држава делат друг. Размислете за користење логаритми или робусна трансформација на инфлацијата или за посебно прикажување на екстремните вредности.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: PCA и кластери заедно (Светска банка).<\/strong> Преземете податоци за сите држави за 2022 година за <code>SP.DYN.LE00.IN<\/code> (очекувано траење на животот), <code>SE.SEC.ENRR<\/code> (опфат со средно образование) и <code>SH.XPD.CHEX.GD.ZS<\/code> (тековни расходи за здравство, % од БДП). Прво применете PCA и нацртајте дијаграм на расејување на првите две компоненти. Потоа, врз истите стандардизирани податоци, применете к-средни вредности со 3 кластери и прикажете ги кластерите на истиот графикон. Споредете што ни кажуваат PCA и кластерската анализа за сличностите и разликите меѓу државите.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nlibrary(ggplot2)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, enrol = &quot;SE.SEC.ENRR&quot;, health = &quot;SH.XPD.CHEX.GD.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(enrol), !is.na(health))\ns &lt;- scale(d[, c(&quot;life&quot;, &quot;enrol&quot;, &quot;health&quot;)])\np &lt;- prcomp(s)\nset.seed(123)\nd$cluster &lt;- factor(kmeans(s, 3, nstart = 25)$cluster)\nd$PC1 &lt;- p$x[, 1]\nd$PC2 &lt;- p$x[, 2]\nggplot(d, aes(PC1, PC2, color = cluster, label = iso3c)) + geom_text(size = 2.5)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>132 држави<\/strong> со целосни податоци. PC1 објаснува 61.5 проценти од варијансата, со оптоварувања со сличен знак на сите три променливи, па го одразува <strong>општиот човечки развој<\/strong>. PC2 објаснува 26.4 проценти и во неа доминираат здравствените трошоци (0.89).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Кластер<\/th>\n<th align=\"right\">Држави<\/th>\n<th align=\"right\">Очекуван животен век<\/th>\n<th align=\"right\">Запишаност во средно образование (%)<\/th>\n<th align=\"right\">Здравствени трошоци (% од БДП)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Среден<\/td>\n<td align=\"right\">72<\/td>\n<td align=\"right\">74.7<\/td>\n<td align=\"right\">94.4<\/td>\n<td align=\"right\">5.9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Висок<\/td>\n<td align=\"right\">41<\/td>\n<td align=\"right\">79.7<\/td>\n<td align=\"right\">110<\/td>\n<td align=\"right\">10.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Низок<\/td>\n<td align=\"right\">19<\/td>\n<td align=\"right\">66.8<\/td>\n<td align=\"right\">52.7<\/td>\n<td align=\"right\">5.4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Северна Македонија е во средната група. PCA покажува непрекинати положби и кои показатели ги водат главните насоки на варијација, додека k-средните вредности даваат дискретни групи, кои го сечат тој облак и може слични држави да ги стават на спротивните страни од границата. Опишувајте ги кластерите според нивните средни вредности, а не според нивните броеви.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Дигиталниот свет во кластери (Светска банка).<\/strong> Користејќи ги показателите од Вежба 1, применете к-средни вредности со 3 кластери, прикажете колку држави има во секој кластер и опишете ги разликите меѓу нив. Предадете краток документ со графиконот и опис на составот на секој кластер, заедно со вашиот R-код.<\/p>\n","answer":"<p>Користете ги исчистените податоци од Вежба 1 со следниов код. Потоа наведете го бројот на држави по кластер и средните вредности во изворните единици.<\/p>\n<pre><code class=\"language-r\">set.seed(123)\nd$cluster &lt;- kmeans(s, centers = 3, nstart = 25)$cluster\nd %&gt;% group_by(cluster) %&gt;%\n  summarise(n = n(), internet = mean(internet), electricity = mean(electricity), urban = mean(urban))\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Со 179-те држави од Вежба 1:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Кластер<\/th>\n<th align=\"right\">Држави<\/th>\n<th align=\"right\">Корисници на интернет (%)<\/th>\n<th align=\"right\">Пристап до електрична енергија (%)<\/th>\n<th align=\"right\">Градско население (%)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Поврзани и урбани<\/td>\n<td align=\"right\">81<\/td>\n<td align=\"right\">88.0<\/td>\n<td align=\"right\">99.4<\/td>\n<td align=\"right\">81.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Поврзани, но помалку урбани<\/td>\n<td align=\"right\">62<\/td>\n<td align=\"right\">71.5<\/td>\n<td align=\"right\">95.3<\/td>\n<td align=\"right\">48.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Низок пристап<\/td>\n<td align=\"right\">36<\/td>\n<td align=\"right\">28.4<\/td>\n<td align=\"right\">44.9<\/td>\n<td align=\"right\">39.9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Северна Македонија е во средната група. Средната група има речиси универзален пристап до електрична енергија и се разликува од првата главно по урбанизацијата и користењето интернет. Главниот проблем на групата со низок пристап е самата електрична енергија.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: Целосен работен тек (workflow).<\/strong> Изберете сопствени три или четири показатели и следете ги овие осум чекори: (1) поставете го работниот директориум; (2) вчитајте ги потребните библиотеки; (3) преземете ги податоците; (4) исчистете ги податоците; (5) стандардизирајте ги показателите; (6) применете PCA и к-средни вредности; (7) анализирајте ги и визуализирајте ги резултатите; (8) зачувајте ги резултатите со <code>write.csv()<\/code> и <code>ggsave()<\/code>.<\/p>\n","answer":"<p>Одговорот зависи од вашите показатели. Добрата работа користи проект во RStudio, го прикажува бројот на редови пред и по чистењето, ги стандардизира показателите и пред PCA и пред k-средните вредности, користи <code>nstart = 25<\/code> и <code>set.seed()<\/code>, ги проверува знаците на оптоварувањата и го опишува секој кластер според неговите средни вредности. Треба да ги зачува резултатите со <code>write.csv()<\/code> и графиците со <code>ggsave()<\/code>.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6: Кривата на принос во други периоди (FRED).<\/strong> Повторете ја PCA врз промените во приносите на американските државни обврзници користејќи <code>data/us_treasury_yields.csv<\/code> одделно за периодот од 1976 до 2000 година и за периодот од 2001 година наваму. Дали оптоварувањата се менуваат? Дали PC1 објаснува повеќе или помалку од варијацијата? Додајте серија како <code>GS20<\/code> или <code>GS30<\/code> и објаснете како се справувате со нејзините празнини.<\/p>\n","answer":"<p>Со <code>us_treasury_yields.csv<\/code> (месечни промени):<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Период<\/th>\n<th align=\"right\">Месеци<\/th>\n<th align=\"right\">PC1<\/th>\n<th align=\"right\">PC2<\/th>\n<th align=\"right\">PC3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Пред 2001<\/td>\n<td align=\"right\">294<\/td>\n<td align=\"right\">95.5%<\/td>\n<td align=\"right\">3.9%<\/td>\n<td align=\"right\">0.3%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Од 2001 наваму<\/td>\n<td align=\"right\">310<\/td>\n<td align=\"right\">87.6%<\/td>\n<td align=\"right\">10.4%<\/td>\n<td align=\"right\">1.6%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Целиот примерок<\/td>\n<td align=\"right\">604<\/td>\n<td align=\"right\">93.7%<\/td>\n<td align=\"right\">5.5%<\/td>\n<td align=\"right\">0.6%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Формите речиси не се менуваат. PC1 е речиси рамна, PC2 и понатаму се накосува, а PC3 и понатаму се свиткува, но знаците на PC2 и PC3 може да се превртат, што не значи ништо. <strong>PC1 објаснува помалку по 2001<\/strong>, додека наклонот и искривеноста објаснуваат повеќе. Краткорочните стапки блиску до нула по 2008 се една можна причина, бидејќи тогаш краткорочните стапки многу малку се движеа, а долгорочните сè уште се движеа.<\/p>\n<pre><code class=\"language-r\">y &lt;- read.csv(&quot;data/us_treasury_yields.csv&quot;)\ndates &lt;- as.Date(y$date)[-1]\nchanges &lt;- apply(y[, -1], 2, diff)\nsummary(prcomp(changes[dates &lt; as.Date(&quot;2001-01-01&quot;), ], scale. = TRUE))\nsummary(prcomp(changes[dates &gt;= as.Date(&quot;2001-01-01&quot;), ], scale. = TRUE))\n<\/code><\/pre>\n<p><strong>Додавање серија.<\/strong> <code>GS30<\/code> почнува во февруари 1977 и немаше недостасувачки вредности во употребената датотека, па спојувањето само го скратува примерокот. Тогаш PC1 објаснува 91.9 проценти, низ 596 месеци, а 30-годишното оптоварување на PC2 е најголемо по големина, со што се продолжува накосувањето. <code>GS20<\/code> има 81 недостасувачка вредност во својата историја. Не пополнувајте ги со претпоставки и не земајте разлики преку празнина. Или користете го само периодот без празнини или отстранете ја серијата и наведете што сте направиле.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7: Сопствен мал индекс на активност (FRED).<\/strong> Изберете 8 до 10 месечни американски серии од FRED за производство, вработеност, домување и продажба. Трансформирајте ја секоја во стапка на раст, пресметајте ја првата главна компонента и споредете ја со <code>CFNAI<\/code>. Превртете го знакот ако е потребно. Во кои периоди најмногу се разликуваат?<\/p>\n","answer":"<p>Пример со десет серии од јануари 1992 до септември 2026: <code>INDPRO<\/code>, <code>PAYEMS<\/code>, <code>HOUST<\/code>, <code>PERMIT<\/code>, <code>RSAFS<\/code>, <code>DSPIC96<\/code>, <code>IPMAN<\/code>, <code>AWHMAN<\/code>, <code>UNRATE<\/code> и <code>CE16OV<\/code>. Користени се логаритамски стапки на раст, со први разлики за <code>UNRATE<\/code> и <code>AWHMAN<\/code>.<\/p>\n<p>PC1 објаснува <strong>56.8 проценти<\/strong> од варијансата. Оптоварувањата се слични по големина, освен кај домувањето и приходот, а <code>UNRATE<\/code> има спротивен знак, како што се очекува. По превртување на знакот, корелацијата со <code>CFNAI<\/code> е <strong>0.97 низ 415 месеци<\/strong>. Без 2020 е <strong>0.86<\/strong>, што покажува колку една екстремна епизода може да ја надуе корелацијата.<\/p>\n<p>Стандардизираните разлики се најголеми во <strong>јануари до јуни 2009 и април 2020<\/strong>. Нашиот индекс има многу помалку серии и само една од нив се однесува на приходот, па реагира поинаку во падовите.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8: Колку европски региони? (Евростат).<\/strong> Користејќи <code>data/eurostat_regions_2022.csv<\/code>, нацртајте го графиконот со лакт. Потоа извршете к-средни вредности со 3, 4 и 5 кластери. Кои региони ја менуваат групата? Отстранувајте по една променлива и пријавете дали поделбата север–југ во Италија опстојува.<\/p>\n","answer":"<p>Резултати за <code>eurostat_regions_2022.csv<\/code> (269 региони, четири променливи).<\/p>\n<p>Збирот на квадрати во кластерите за K = 1 до 6 е 1,072, 604, 431, 358, 307 и 264. Секој дополнителен кластер отстранува 44, 29, 17, 14 и 14 проценти од она што останува. Има свиткување околу K = 3 или 4, а тоа е прашање на проценка.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">K<\/th>\n<th align=\"left\">Групи, според просечниот БДП по жител (PPS)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">3<\/td>\n<td align=\"left\">Ниска вработеност (71 регион, 20,600); средна група (142, 31,300); богати, образовани (56, 50,100)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">4<\/td>\n<td align=\"left\">Ниска вработеност (69, 20,300); висока вработеност, малку дипломирани (109, 32,100); многу дипломирани (62, 33,300); богати, метрополитенски (29, 60,000)<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">5<\/td>\n<td align=\"left\">Додава поделба меѓу помалку богатите региони, со ниска вработеност 61, 53 и 54 региони, потоа 74 и 27<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Преминот од K = 3 на K = 4 главно ја дели средната група: 107 нејзини региони одат во групата со висока вработеност и 35 во групата на дипломирани, додека 25 богати региони им се придружуваат на дипломираните. Регионите на границите најмногу се менуваат.<\/p>\n<p>За K = 4, отстранувањето на секоја променлива поединечно го дава овој резултат за Италија:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Отстранета променлива<\/th>\n<th align=\"left\">Дали осумте јужни региони остануваат заедно?<\/th>\n<th align=\"left\">Север<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Ниту една<\/td>\n<td align=\"left\">Да<\/td>\n<td align=\"left\">13 региони заедно<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">БДП по жител<\/td>\n<td align=\"left\"><strong>Не, поделени 4 и 4<\/strong><\/td>\n<td align=\"left\">Поделени 4 и 9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Вработеност<\/td>\n<td align=\"left\"><strong>Не, поделени 6 и 2<\/strong><\/td>\n<td align=\"left\">13 заедно<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Терцијарно образование<\/td>\n<td align=\"left\">Да<\/td>\n<td align=\"left\">Поделени во три групи<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Невработеност<\/td>\n<td align=\"left\">Да<\/td>\n<td align=\"left\">13 заедно<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Поделбата север-југ затоа е делумно робусна. Зависи од БДП и вработеноста, а опстојува кога ќе се отстрани терцијарното образование или невработеноста.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Вежба 9: Структура наместо големина.<\/strong> Повторете го примерот со машини, но со секој производ измерен како удел во вкупниот извоз на секоја држава пред стандардизацијата. Кои држави сега се во кластерот на Северна Македонија? Зошто би можеле да ги исклучите државите што извезуваат само еден или два производа?<\/p>\n","answer":"<pre><code class=\"language-r\">library(readxl)\ndf &lt;- read_excel(&quot;data/usa_imports_machinery_2023.xlsx&quot;)\nM &lt;- as.matrix(df[, -1])\nshares &lt;- M / rowSums(M)\ns &lt;- scale(shares[, apply(shares, 2, sd) &gt; 0])\nset.seed(123)\nk &lt;- kmeans(s, 4, nstart = 25)\ntable(k$cluster)\n<\/code><\/pre>\n<p>Резултатот е многу различен од поглавјето. Кластерите имаат големина <strong>172, 3, 1 и 1<\/strong>, а Северна Македонија е во групата од 172, која вклучува речиси сите. Со удели, држава што извезува само еден или два производа има удел од 100 проценти или речиси 100 проценти во нив, што е екстремно по стандардизацијата. Тие неколку држави заземаат кластери само за себе. На пример, вредноста на Бенин речиси целосно се автомобили.<\/p>\n<p>Отстранувањето на државите со помалку од пет производи отстранува голем дел од овој шум и остануваат 117 држави, но кластерот на Северна Македонија сепак има 105 членови. Државите со еден или два производа треба да се отстранат бидејќи нивните удели одразуваат неколку пратки и не ни кажуваат ништо за извозната структура. Северна Македонија има 10 производи, а 94 проценти од нејзината вредност се автобуси. Искрениот заклучок е дека овој едноставен метод дава малку корисна структура и можеби се потребни алтернативи како мерки на сличност меѓу уделите на производите.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Вежба 10: Регионите на Северна Македонија (МакСтат).<\/strong> Од базата МакСтат на Државниот завод за статистика, соберете најмалку четири показатели за осумте плански региони. Извршете PCA и протолкувајте ги првите две компоненти. Зошто к-средни вредности е од мала корист со само осум набљудувања? Што би можеле да направите наместо тоа?<\/p>\n","answer":"<p>Конкретните бројки зависат од она што ќе го најдете во МакСтат. Добриот одговор користи регионални показатели како БДП по жител, вработеност и образование, ги стандардизира и ги толкува PC1 и PC2 преку оптоварувањата. Со само осум набљудувања, PCA е во најдобар случај описна, а k-средните вредности имаат премалку набљудувања за да дадат стабилни групи, бидејќи еден регион може да промени сè. Наместо тоа, прикажете табела или график на регионите, споредете ги директно со композитен индекс или користете хиерархиски дијаграм за да покажете кои региони се слични.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Вежба 11 (AI): Проверете ја PCA на разговорен бот.<\/strong> Дајте му на разговорен бот <code>wdi_hdi_clean_2022.csv<\/code> и првото барање во Оддел 5.7-unsup. Извршете го кодот. Дали стандардизираше? Дали ги опиша пондерите како „објективни“? Сега додајте колона со случајни броеви и повторно извршете го кодот. Дали описот на разговорниот бот за значењето на пондерите сè уште важеше?<\/p>\n","answer":"<p>Добар четбот треба да ги стандардизира променливите и да користи <code>prcomp<\/code> со <code>scale. = TRUE<\/code>. Внимавајте на зборовите „објективно“ или „важност“. Додавањето случајна колона треба малку да ги промени пондерите на PC1: случајната променлива добива оптоварување блиску до нула, исто како во експериментот од ова поглавје. Тоа значи дека пондерите на PC1 опишуваат согласност меѓу променливите, а секој опис на нив како важност се покажува како погрешен: неповрзан показател не добива пондер, без разлика дали е шум или најважното нешто за една држава.<\/p>\n"},{"kind":"e","n":12,"ask":"<p><strong>Вежба 12 (AI): Именувајте ги кластерите, па проверете.<\/strong> Вметнете ги вашите средни вредности по кластери и списоците на членови од една од вежбите погоре и побарајте од разговорен бот да ги именува кластерите. Користејќи ги средните вредности по групи, означете го секој назив како поткрепен или непоткрепен. Потоа прашајте го кои држави се погрешно сместени и проверете две негови тврдења со пребарување на податоците.<\/p>\n","answer":"<p>Резултатот зависи од вашите кластери. Секое име споредете го со средните вредности на групата. За „висок приход“ е потребна висока средна вредност на БДП, а за „дигитални лидери“ високо користење интернет. Другите тврдења означете ги како неподдржани. Тврдењето дека држава е „погрешно сместена“ треба да се провери со податоците и треба да запомните дека кластерот нема вистина според која сместувањето би можело да се оцени како погрешно: единственото прашање е дали нејзините вредности се блиску до центарот на групата.<\/p>\n"}],"title_mk":"Ненадгледувано учење","part_mk":"III. Статистичко учење и предвидување за јавните политики","check":{"status":"Reproduced","seconds":4.8,"book_lines":42,"matched":42,"message":""},"zip_kb":63},{"number":9,"title":"Linear Regression","part":"III. Statistical learning and policy prediction","folder":"ch09-regression","has_code":true,"code_lines":152,"datasets":["gravity_data.xlsx","regression_example_data.xlsx","story_bordeaux_wine.csv","us_okun.csv"],"packages":["boot","dplyr","ggplot2","knitr","moments","readxl","scales","tidyverse"],"figures":9,"tables":0,"stories":2,"closers":1,"prompts":3,"exercises":12,"questions":29,"solutions":[{"kind":"q","n":1,"ask":"<p>What is a dependent and what is an independent variable in regression analysis?<\/p>\n","answer":"<p>The dependent variable is the one we want to predict or explain. The independent variables are those we use as information for that prediction.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>What is the difference between regression and classification?<\/p>\n","answer":"<p>Regression predicts a quantitative variable, while classification predicts a category.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>What does the slope represent in simple linear regression?<\/p>\n","answer":"<p>The average change in the dependent variable for a one-unit increase in the independent variable.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>What does the intercept represent in a linear model?<\/p>\n","answer":"<p>The predicted value of the dependent variable when the independent variable is zero. It may have no real meaning if zero lies outside the data, as with the negative exports in this chapter's line.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>What are residuals?<\/p>\n","answer":"<p>The differences between the observed values and the values predicted by the model.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>What is the RSS and why is it minimised in linear regression?<\/p>\n","answer":"<p>The residual sum of squares is the sum of the squared residuals. Ordinary least squares chooses the coefficients that make it as small as possible, so that the line is as close as possible to the data.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>What is the MSE and how is it interpreted?<\/p>\n","answer":"<p>The mean squared error is the average squared residual. Lower values mean more accurate predictions, and it is expressed in squared units of the dependent variable.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>What is the coefficient of determination, $R^2$?<\/p>\n","answer":"<p>A measure of fit between 0 and 1, showing the share of the variation in the dependent variable explained by the model. It does not depend on units.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>In the simple regression in this chapter, how is the coefficient of <code>mean_years_schooling<\/code> interpreted?<\/p>\n","answer":"<p>Countries with one more year of mean schooling have internet penetration that is 6.379 percentage points higher on average.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Why does the coefficient of <code>mean_years_schooling<\/code> change when we move from simple to multiple regression?<\/p>\n","answer":"<p>With electricity access in the model, the coefficient measures the association of schooling with internet use holding electricity access constant. Schooling and electricity are related, so part of the simple coefficient was reflecting electricity.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>How is the coefficient of an independent variable interpreted in multiple regression?<\/p>\n","answer":"<p>It is the average change in the dependent variable for a one-unit increase in that independent variable, holding the other included variables constant.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Why is a model with a higher $R^2$ not necessarily better for prediction?<\/p>\n","answer":"<p>R² on the data used for estimation can only rise as variables are added, even useless ones. It measures fit to known data, not accuracy on new data.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>What is overfitting and why does it occur when a model has too many independent variables?<\/p>\n","answer":"<p>Overfitting occurs when a model fits noise in the estimation data and predicts new data poorly. With many variables, especially relative to the number of observations, some will be related to the outcome purely by chance.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Why is the MSE on the training set usually lower than the MSE on the test set?<\/p>\n","answer":"<p>The model's coefficients were chosen to fit the training data, including its noise, so it does better on these data than on data it has not seen.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Why might a model with fewer variables sometimes predict better than a more complex model?<\/p>\n","answer":"<p>A simpler model has lower variance and is less likely to fit noise. The reduction in variance can more than offset the extra bias.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>What does a p-value tell you, and what does it not tell you?<\/p>\n","answer":"<p>A p-value is the probability of a t value at least this large if the true coefficient were zero. It does not show that the association is large, important or causal, and it is not the probability that the coefficient is zero.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>What is regression to the mean? Give an example from economics.<\/p>\n","answer":"<p>Unusually high or low values tend to be followed by values closer to the average, because they are partly due to luck. A company with a record year usually does less well the next year, and a region that receives aid after its worst year usually improves anyway.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Why does a correlation between chocolate consumption and Nobel Prizes not show that chocolate raises intelligence?<\/p>\n","answer":"<p>Rich countries can afford both chocolate and research. Income is a likely common cause. The correlation is not evidence that eating chocolate raises anything.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>How would you interpret the Okun's law regression in this chapter?<\/p>\n","answer":"<p>Each extra percentage point of growth is associated with an unemployment rate about 0.44 points lower. Setting the change to zero shows that growth of about 3.1 percent was needed to hold unemployment constant, and the model fits well, with R² of 0.66. The association is observed, and 2020 lies far off the line.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Explain the bias-variance trade-off in your own words.<\/p>\n","answer":"<p>A simple model misses part of the truth (high bias) but changes little with new data. A complex model fits the sample closely but changes greatly with new data (high variance). Reducing one tends to raise the other, and a good model balances the two
