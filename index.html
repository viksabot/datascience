ие три држави. Погрижете се y-оската да почнува од 0, додајте наслов и означете ги оските. Потоа одговорете на следниве прашања. Колкава е разликата меѓу Германија и другите две држави? Дали Полска е поблиску до Германија или до Бугарија според доходот по жител? Зошто столбестиот графикон е подобар избор од кружниот за ваква споредба?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(ggplot2)\nd &lt;- WDI(country = c(&quot;DEU&quot;, &quot;POL&quot;, &quot;BGR&quot;),\n         indicator = c(gdp_pc = &quot;NY.GDP.PCAP.CD&quot;), start = 2022, end = 2022)\nggplot(d, aes(reorder(country, -gdp_pc), gdp_pc)) +\n  geom_col(fill = &quot;steelblue&quot;) +\n  scale_y_continuous(limits = c(0, NA), labels = scales::comma) +\n  labs(title = &quot;GDP per capita, 2022&quot;, x = NULL, y = &quot;Current US$&quot;)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. БДП по жител во 2022 беше <strong>US$50,507 во Германија, US$18,891 во Полска и US$14,000 во Бугарија<\/strong>. Приходот на Германија е 2.7 пати поголем од полскиот и 3.6 пати поголем од бугарскиот. <strong>Полска е многу поблиску до Бугарија<\/strong>: US$4,891 над Бугарија и US$31,616 под Германија.<\/p>\n<p>Столбестиот график е подобар бидејќи споредуваме должини од заедничка основа. Кружниот график би прикажал удели во збир што нема економско значење: збирот на приходите по жител на три држави.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Структурата на извозот.<\/strong> Преземете податоци од Светската банка за извозот на добра и услуги (тековни американски долари, <code>NE.EXP.GNFS.CD<\/code>) за Германија (DEU), Франција (FRA), Италија (ITA), Шпанија (ESP) и Холандија (NLD) за 2022. Нацртајте дрвовидна карта во која големината на секоја плочка е пропорционална на вредноста на извозот, со името на државата прикажано во плочката. Додајте соодветен наслов. Потоа одговорете на следниве прашања. Која држава има најголем удел во вкупниот извоз на овие пет држави? Дали една држава значително доминира? Дали дрвовидната карта ви овозможува појасно да ја видите структурата на извозот отколку столбест графикон? Зошто?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(ggplot2)\nlibrary(treemapify)\nd &lt;- WDI(country = c(&quot;DEU&quot;, &quot;FRA&quot;, &quot;ITA&quot;, &quot;ESP&quot;, &quot;NLD&quot;),\n         indicator = c(exports = &quot;NE.EXP.GNFS.CD&quot;), start = 2022, end = 2022)\nd$share &lt;- round(100 * d$exports / sum(d$exports), 1)\nggplot(d, aes(area = exports, label = paste0(country, &quot;\\n&quot;, share, &quot;%&quot;))) +\n  geom_treemap(fill = &quot;steelblue&quot;, color = &quot;white&quot;) +\n  geom_treemap_text(color = &quot;white&quot;, place = &quot;centre&quot;) +\n  labs(title = &quot;Exports of goods and services, 2022&quot;)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">Извоз (милијарди US$)<\/th>\n<th align=\"right\">Удел во петте (%)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Германија<\/td>\n<td align=\"right\">1,916.9<\/td>\n<td align=\"right\">36.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Франција<\/td>\n<td align=\"right\">1,023.3<\/td>\n<td align=\"right\">19.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Холандија<\/td>\n<td align=\"right\">1,009.3<\/td>\n<td align=\"right\">19.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Италија<\/td>\n<td align=\"right\">738.5<\/td>\n<td align=\"right\">14.0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Шпанија<\/td>\n<td align=\"right\">574.8<\/td>\n<td align=\"right\">10.9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Германија има најголем удел<\/strong>, а со 36.4 проценти е речиси двојно поголема од следната држава, но не сочинува мнозинство. Со само пет држави столбестиот график ги прави разликите полесни за споредба, бидејќи должините се читаат попрецизно од површините. Франција и Холандија, на пример, тешко се разликуваат на дрвовидна карта. Предноста на дрвовидната карта е прикажувањето на деловите од целината и таа станува повредна со зголемување на бројот на делови.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Обновлива енергија, ваш избор на графикон.<\/strong> Преземете податоци од Светската банка за потрошувачката на обновлива енергија (% од вкупната финална потрошувачка на енергија, <code>EG.FEC.RNEW.ZS<\/code>) за 2021 за Германија (DEU), Полска (POL), Северна Македонија (MKD), Србија (SRB), Албанија (ALB), САД (USA), Кина (CHN) и Индија (IND). Изберете и нацртајте го графиконот што, според вас, најдобро ја покажува разликата во уделот на обновливата енергија меѓу овие држави. Потоа напишете кратка анализа одговарајќи на следниве прашања. Кој вид графикон го избравте и зошто? Дали има јасни разлики меѓу развиените држави и државите во развој? Дали некоја држава значително отстапува од другите?<\/p>\n","answer":"<p>Подреден хоризонтален столбест график е најдобриот избор, бидејќи споредуваме една бројка меѓу осум држави.<\/p>\n<pre><code class=\"language-r\">library(WDI)\nlibrary(ggplot2)\nd &lt;- WDI(country = c(&quot;DEU&quot;, &quot;POL&quot;, &quot;MKD&quot;, &quot;SRB&quot;, &quot;ALB&quot;, &quot;USA&quot;, &quot;CHN&quot;, &quot;IND&quot;),\n         indicator = c(renewables = &quot;EG.FEC.RNEW.ZS&quot;), start = 2021, end = 2021)\nggplot(d, aes(renewables, reorder(country, renewables))) +\n  geom_col(fill = &quot;steelblue&quot;) +\n  labs(title = &quot;Renewable energy, 2021&quot;, x = &quot;% of final energy consumption&quot;, y = NULL)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">Обновлива енергија, % од финалната потрошувачка на енергија, 2021<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Албанија<\/td>\n<td align=\"right\">41.9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Индија<\/td>\n<td align=\"right\">34.9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Србија<\/td>\n<td align=\"right\">27.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Северна Македонија<\/td>\n<td align=\"right\">19.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Германија<\/td>\n<td align=\"right\">17.6<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Кина<\/td>\n<td align=\"right\">15.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Полска<\/td>\n<td align=\"right\">15.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Соединети Американски Држави<\/td>\n<td align=\"right\">10.9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Нема <strong>едноставна поделба меѓу развиени држави и држави во развој<\/strong>. Најбогатите држави овде се меѓу најниските, додека Индија и Албанија се највисоки. <strong>Албанија се издвојува<\/strong>, главно благодарение на хидроенергијата, а уделот на Индија вклучува традиционална биомаса. Високиот удел затоа може да одразува модерна енергија од ветер и сонце, хидроенергија или потпирање на традиционални горива, па високата вредност сама по себе не укажува на „зелена“ или богата економија.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: Филипсова крива за Европа.<\/strong> Користете ја табелата што ја подготвивте во Поглавје 3 (Вежба 3), со официјални податоци од Eurostat за сите европски држави во 2022, која ги содржи кодот ISO3 на државата, годината, стапката на невработеност и инфлацијата. Изберете и нацртајте го графиконот што најдобро ја покажува врската меѓу инфлацијата и невработеноста во Европа во 2022. Размислете кој вид графикон најдобро прикажува врска меѓу две квантитативни променливи. Додајте наслов, означете ги оските и, ако сметате дека е соодветно, додајте линија на тренд. Потоа одговорете на следниве прашања. Дали постои негативна врска меѓу инфлацијата и невработеноста, како што предвидува Филипсовата крива? Дали има држави што значително отстапуваат од општиот образец? (Разгледајте што му прави Турција на вашиот графикон.)<\/p>\n","answer":"<p><strong>Дијаграмот на расејување<\/strong> е вистинскиот график. Со <code>eurostat_2022_tidy.csv<\/code> (33 држави):<\/p>\n<pre><code class=\"language-r\">library(ggplot2)\ne &lt;- read.csv(&quot;data/eurostat_2022_tidy.csv&quot;)\nggplot(e, aes(unemployment_rate, inflation_rate, label = iso3c)) +\n  geom_point() + geom_text(vjust = -0.6, size = 2.5) +\n  geom_smooth(method = &quot;lm&quot;, se = FALSE) +\n  labs(title = &quot;Inflation and unemployment in Europe, 2022&quot;,\n       x = &quot;Unemployment rate (%)&quot;, y = &quot;Inflation (%)&quot;)\n<\/code><\/pre>\n<p>Нема <strong>негативна врска<\/strong>. Корелацијата е <strong>+0.27<\/strong> со сите држави. Турција, со инфлација од 72.3 проценти, ја развлекува вертикалната оска и го предизвикува тој резултат, а без неа корелацијата е само <strong>+0.06<\/strong> (32 држави). Други важни точки се Северна Македонија (14.4 проценти невработеност и 14.0 проценти инфлација) и Естонија, Литванија и Латвија, со инфлација од 17 до 19 проценти. Една година низ државите во секој случај не е тест на Филипсовата крива, бидејќи државите се разликуваат по институциите и очекуваната инфлација, а во 2022 доминираше шок на цените на енергијата.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6: Платите во Северна Македонија (MakStat).<\/strong> Користејќи ја уредната табела <code>wages<\/code> од Поглавје 3, нацртајте линиски графикон на нето-платата во три сектори по ваш избор од 2005 наваму. Означете ги линиите директно наместо да користите легенда. Потоа најдете индекс на цени во MakStat и повторно нацртајте го графиконот во реални износи. Како се менува приказната?<\/p>\n","answer":"<p>Со земјоделството, преработувачката индустрија и финансиите како примери, годишната просечна нето-плата се промени вака. Цените се од хармонизираниот индекс на Eurostat за Северна Македонија, кој порасна од 80.44 во 2005 на 149.14 во 2025 (<code>prc_hicp_aind<\/code>, <code>INX_A_AVG<\/code>, <code>CP00<\/code>). Индексот на трошоците на живот на МакСтат е алтернативен извор и може да даде малку поинакви резултати.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Сектор<\/th>\n<th align=\"right\">2005 (денари)<\/th>\n<th align=\"right\">2025 (денари)<\/th>\n<th align=\"right\">Номинален множител<\/th>\n<th align=\"right\">Реален множител<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Земјоделство<\/td>\n<td align=\"right\">9,760<\/td>\n<td align=\"right\">35,239<\/td>\n<td align=\"right\">3.61<\/td>\n<td align=\"right\">1.95<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Преработувачка индустрија<\/td>\n<td align=\"right\">10,223<\/td>\n<td align=\"right\">39,986<\/td>\n<td align=\"right\">3.91<\/td>\n<td align=\"right\">2.11<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Финансии<\/td>\n<td align=\"right\">26,098<\/td>\n<td align=\"right\">62,143<\/td>\n<td align=\"right\">2.38<\/td>\n<td align=\"right\">1.28<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\"># real wage = nominal wage / (price index / 100)\nwages$real &lt;- wages$net_wage / (wages$price_index / 100)\n<\/code><\/pre>\n<p>За директно означување на линиите, користете <code>annotate(&quot;text&quot;, ...)<\/code> или <code>geom_text()<\/code> на последната точка од секоја линија и поставете <code>guide = &quot;none&quot;<\/code> на скалата на бои.<\/p>\n<p>Приказната се менува на два начина. Реалните добивки се многу помали отколку што сугерираат номиналните бројки, бидејќи цените пораснаа за околу 85 проценти. Јазот меѓу секторите исто така се намали: финансиите растеа многу побавно во реални износи од преработувачката индустрија и земјоделството.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7: Поправете лош графикон.<\/strong> Земете ги податоците од графиконот во поглавјето. Одлучете која една порака сакате да ја пренесете и нацртајте го наједноставниот графикон што ја покажува. Објаснете во две реченици што отстранивте и зошто.<\/p>\n","answer":"<p>Има многу валидни одговори. Една јасна порака е дека <strong>кризата од 2009 ја погоди речиси секоја држава одеднаш, а Полска ја избегна<\/strong>. Растот во 2009 беше меѓу околу −3 и −6 проценти во другите девет држави, но +2.6 проценти во Полска.<\/p>\n<pre><code class=\"language-r\">library(dplyr)\nlibrary(ggplot2)\nd &lt;- read.csv(&quot;data/ten_countries_panel.csv&quot;, check.names = FALSE) %&gt;%\n  filter(year == 2009)\nggplot(d, aes(`GDP growth`, reorder(country, `GDP growth`),\n              fill = country == &quot;Poland&quot;)) +\n  geom_col(show.legend = FALSE) +\n  labs(title = &quot;Poland alone grew in 2009&quot;, x = &quot;GDP growth (%)&quot;, y = NULL)\n<\/code><\/pre>\n<p>Отстранив три показатели и деветнаесет години бидејќи не се однесуваа на пораката. Десетте линии што се преклопуваа ги заменив со подреден столбест график што го истакнува единствениот исклучок.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8 (AI): Строгиот критичар.<\/strong> Изберете го вашиот графикон од Вежба 4 и употребете го промптот „Побарајте строг критичар“. Кои предлози ги прифаќате, а кои ги отфрлате? Зошто? Вклучете ги двете верзии на графиконот.<\/p>\n","answer":"<p>Резултатот зависи од вашиот график. Типични валидни предлози се подредување на столбовите, додавање на единицата и годината и наведување на изворот. Отфрлете предлози што додаваат украси или тврдења за причини што вашите податоци не можат да ги поддржат. Вклучете ги двете верзии и дајте конкретна причина за секоја одлука.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Вежба 9 (AI): Фатете ја замката во графиконот на четботот.<\/strong> Побарајте од четбот да напише код за столбест графикон на населението на државите од Западен Балкан, без да наведете ништо друго. Извршете го, па применете ја листата за проверка во Оддел 4.6. Потоа побарајте да произведе графикон што ги прави разликите меѓу државите да изгледаат што е можно поголеми. Што сменил? Како би го забележале тоа во туѓ графикон?<\/p>\n","answer":"<p>Проверете го резултатот со листата за проверка од книгата: точни податоци, оска што почнува од нула, единици, наведен извор и бои што носат значење. Кога ќе се побара да ги преувеличи разликите, четботот обично ја <strong>скратува оската y<\/strong>, а понекогаш користи површина или тродимензионален ефект. Кај туѓ график, прво погледнете ја бројката од која почнува оската и споредете ги должините на столбовите со бројките што се навистина прикажани.<\/p>\n"}],"title_mk":"Визуализација на економски податоци","part_mk":"II. Опишување на економијата","check":{"status":"Reproduced","seconds":2.6,"book_lines":0,"matched":0,"message":""},"zip_kb":270},{"number":5,"title":"Descriptive Analysis","part":"II. Describing the economy","folder":"ch05-descriptive","has_code":true,"code_lines":179,"datasets":["gdp_growth_europe_2015.csv","income_europe_2023.csv","nasdaq_daily.csv","story_ireland_growth.csv","wb_cleaned_data.csv"],"packages":["dplyr","ggplot2","knitr","moments","openxlsx","scales"],"figures":9,"tables":1,"stories":3,"closers":1,"prompts":2,"exercises":8,"questions":24,"solutions":[{"kind":"q","n":1,"ask":"<p>What is descriptive analysis, and why is it an important step in analysing data?<\/p>\n","answer":"<p>Descriptive analysis summarises the variables in a dataset so that we understand what they contain. It is important because it reveals data problems, guides later methods and gives context to the results.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Name and explain the five reasons for carrying out descriptive analysis before further statistical work, with an example of each.<\/p>\n","answer":"<ul>\n<li><strong>It tests whether the data are clean:<\/strong> a maximum a thousand times too large suggests a mistake in units.<\/li>\n<li><strong>It guides the choice of methods:<\/strong> a strongly skewed variable may need a logarithmic transformation.<\/li>\n<li><strong>It gives results context:<\/strong> a two-point effect on export shares can only be judged by knowing typical export shares.<\/li>\n<li><strong>It sometimes answers the question outright:<\/strong> &quot;did median income rise?&quot; can be settled by the median.<\/li>\n<li><strong>It generates new questions:<\/strong> Ireland's growth rate raised the question of what GDP actually measures.<\/li>\n<\/ul>\n"},{"kind":"q","n":3,"ask":"<p>What is the difference between absolute and relative frequency? When is it better to use one or the other?<\/p>\n","answer":"<p><strong>Absolute frequency<\/strong> is the number of observations with a value, while <strong>relative frequency<\/strong> is that count as a share of all observations. Use absolute frequencies to check sample sizes and data quality, and relative frequencies to compare groups of different sizes.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>When would you report relative frequencies that include missing values, and when would you exclude them?<\/p>\n","answer":"<p>Include missing values when checking data quality, because the missing values are what you are examining. Exclude them when describing the distribution of observed values, by computing shares among the non-missing observations.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>What is the distribution of a variable?<\/p>\n","answer":"<p>It records which values a variable takes and how often it takes each of them, in absolute or relative terms.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Why is grouping useful for variables with many different values?<\/p>\n","answer":"<p>When nearly every value appears once, a list of frequencies tells us nothing. Grouping values into intervals reveals the shape of the distribution.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Explain Sturges' rule. When and why is it used? How many groups does it give for 200 observations?<\/p>\n","answer":"<p>Sturges' rule gives a starting number of groups: K = 1 + log2(N). It is used to choose groups for frequency tables and histograms. For 200 observations, K = 1 + log2(200) ≈ 8.64, so about <strong>9 groups<\/strong>. It tends to give too few groups for large or skewed datasets.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>What are extreme values (outliers)? Should they always be removed from an analysis? Explain.<\/p>\n","answer":"<p>Extreme values are observations far larger or smaller than the rest. They should not always be removed. Some are errors, some are real but irrelevant to the question, and some are the most important observations in the data.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Describe three types of extreme value. For each, explain what the analyst should do.<\/p>\n","answer":"<ol>\n<li><strong>Errors<\/strong>, such as 200 working hours a week: correct them or set them to missing.<\/li>\n<li><strong>Real but not relevant to the question<\/strong>, such as Ireland's 2015 growth when studying living standards: you may exclude them, and must say so.<\/li>\n<li><strong>Real and the whole point<\/strong>, such as the worst days on a stock market: keep them, and use methods that can cope with them.<\/li>\n<\/ol>\n"},{"kind":"q","n":10,"ask":"<p>Why did Ireland's 2015 growth rate not reflect a change in living standards, even though it was correctly calculated?<\/p>\n","answer":"<p>A large stock of intangible assets, mainly intellectual property, moved onto the books of companies in Ireland, and the income they earned counted as Irish output. The accounting rules were followed, but no more Irish people had jobs and little changed in daily economic life. GDP measures output recorded in a country, not the income of the people who live there.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>What are the three main categories of summary statistics?<\/p>\n","answer":"<p>Measures of central tendency, measures of dispersion and measures of shape.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>What is the difference between the mean and the median? In which case is the median the better measure?<\/p>\n","answer":"<p>The mean is the arithmetic average. The median is the middle value once observations are sorted. The median is better for skewed distributions, or those with extreme values, because a single huge value barely moves it.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>What does the standard deviation tell us?<\/p>\n","answer":"<p>It describes how far observations typically lie from the mean, in the original units.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>What is the difference between the variance and the standard deviation? Why is the standard deviation easier to interpret?<\/p>\n","answer":"<p>The variance is the average squared deviation from the mean, and the standard deviation is its square root. The standard deviation is easier to interpret because it is in the original units, whereas variance is in squared units such as &quot;squared millions of people&quot;.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>What is skewness? How do we interpret positive and negative skewness?<\/p>\n","answer":"<p>Skewness measures asymmetry. Positive skewness means a long right tail, as for income. Negative skewness means a long left tail. Zero means a symmetric distribution.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>What is kurtosis?<\/p>\n","answer":"<p>Kurtosis mostly measures the weight of the tails, or how often very extreme values occur. A normal distribution has a kurtosis of 3, and higher values indicate fatter tails.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>A variable has strong positive skewness. Would you expect the mean to be above or below the median? Explain why.<\/p>\n","answer":"<p>Above. The long right tail contains a few very large values, which pull up the mean, while the median depends only on the order of the values.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Imagine you are analysing the revenues of firms and notice a few extremely large values. What possible causes would you consider? What steps would you take before removing them?<\/p>\n","answer":"<p>Consider data errors (such as wrong units or digits), a different type of unit (such as a holding company or consolidated accounts), or genuinely large firms. Before removing anything, look up the observations, check the units and the source, decide which of the three situations applies, and report any exclusion. Firm size is typically skewed, so large firms are often real and important.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Two series have the same mean and standard deviation but different skewness. What does that tell you about the distributions?<\/p>\n","answer":"<p>The two have the same centre and the same average spread, but different asymmetry. One may have a longer right tail and the other a longer left tail or be symmetric. Summary numbers alone can hide this, so draw the histograms.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>If the range is very large but the standard deviation is relatively small, what can you conclude about the distribution?<\/p>\n","answer":"<p>Most observations are close together near the mean, and a few extreme values stretch the range. The range depends only on the two most extreme values, while the standard deviation reflects all observations.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>Can the median and the mode be equal? If so, in what type of distribution would you observe this?<\/p>\n","answer":"<p>Yes. In a symmetric distribution with a single peak, such as the normal distribution, the mean, median and mode coincide.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>What does a kurtosis of 12 tell you about a series of stock returns? What is the practical consequence for a risk manager?<\/p>\n","answer":"<p>Extreme days happen far more often than under a normal distribution, whose kurtosis is 3. A risk manager who uses a normal model will underestimate the probability and size of large losses, so must instead use methods that reflect fat tails, and hold reserves for rare but real events.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>Why does the <code>get_mode()<\/code> function return a meaningless result for population data?<\/p>\n","answer":"<p>Every country's population is unique, so all values tie with a frequency of one and the function returns the first of them, which is simply Iceland's population. For a continuous variable, report the modal group.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>Name four checks you should make before using summary statistics produced with the help of an AI chatbot.<\/p>\n","answer":"<p>Any four of these: count the observations; check one number by hand; look up the minimum and maximum; check the units; check definitions (for example, whether kurtosis subtracts 3, and whether the standard deviation divides by n or n−1); and question any explanation given for an outlier.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: Investigating an outlier.<\/strong> Using <code>gdp_growth_europe_2015.csv<\/code>, compute the summary statistics with and without Ireland. Which statistics change most? Then find out why Malta also lies outside the whiskers in the figure in the chapter. Is it Situation 1, 2 or 3 from Section 5.3? Write one paragraph defending your answer.<\/p>\n","answer":"<pre><code class=\"language-r\">library(moments)\ng &lt;- read.csv(&quot;data/gdp_growth_europe_2015.csv&quot;)\ndescribe &lt;- function(v) c(N = length(v), Mean = mean(v), Median = median(v),\n                          SD = sd(v), Min = min(v), Max = max(v),\n                          Skewness = skewness(v), Kurtosis = kurtosis(v))\nround(rbind(all = describe(g$gdp_growth),\n            without_IE = describe(g$gdp_growth[g$geo != &quot;IE&quot;])), 2)\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">N<\/th>\n<th align=\"right\">Mean<\/th>\n<th align=\"right\">Median<\/th>\n<th align=\"right\">SD<\/th>\n<th align=\"right\">Min<\/th>\n<th align=\"right\">Max<\/th>\n<th align=\"right\">Skewness<\/th>\n<th align=\"right\">Kurtosis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">All<\/td>\n<td align=\"right\">38<\/td>\n<td align=\"right\">3.23<\/td>\n<td align=\"right\">2.45<\/td>\n<td align=\"right\">4.50<\/td>\n<td align=\"right\">−9.8<\/td>\n<td align=\"right\">24.6<\/td>\n<td align=\"right\">2.32<\/td>\n<td align=\"right\">16.14<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Without Ireland<\/td>\n<td align=\"right\">37<\/td>\n<td align=\"right\">2.65<\/td>\n<td align=\"right\">2.40<\/td>\n<td align=\"right\">2.80<\/td>\n<td align=\"right\">−9.8<\/td>\n<td align=\"right\">9.6<\/td>\n<td align=\"right\">−1.96<\/td>\n<td align=\"right\">12.49<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The maximum, standard deviation, skewness and kurtosis change most, and skewness even changes sign. The median barely moves.<\/p>\n<p>Malta's position is <strong>real<\/strong>, not an error: Eurostat reports 9.6 percent. Check national accounts or European Commission reports for the source of that growth. Investment was unusually strong at the time, and you should confirm this and its components yourself. It is best seen as <strong>Situation 3<\/strong> if the question concerns output in Europe, because it reflects real activity. It moves towards Situation 2 only if you find that the growth was mainly a one-off accounting effect. Your paragraph should name the source that supports your classification.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Unemployment in Europe (Eurostat).<\/strong> Download annual unemployment rates for 2023 from Eurostat dataset <code>une_rt_a<\/code> (ages 15 to 74, both sexes, percent of the labour force). Remove aggregates such as <code>EU27_2020<\/code>. Carry out a complete descriptive analysis. Calculate the mean, median, minimum, maximum, range, standard deviation and skewness, and draw a histogram and a boxplot. Then answer these questions. Is the distribution symmetric or asymmetric? Does any country differ significantly from the rest? Is the mean or the median the more suitable measure here? Where do the Western Balkan countries fall in the distribution?<\/p>\n","answer":"<p>For 2023 there are 34 countries with data once <code>EU27_2020<\/code> and <code>EA21<\/code> are removed (results downloaded on 10 November 2026).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">N<\/th>\n<th align=\"right\">Mean<\/th>\n<th align=\"right\">Median<\/th>\n<th align=\"right\">Minimum<\/th>\n<th align=\"right\">Maximum<\/th>\n<th align=\"right\">Range<\/th>\n<th align=\"right\">SD<\/th>\n<th align=\"right\">Skewness<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">34<\/td>\n<td align=\"right\">6.24<\/td>\n<td align=\"right\">5.70<\/td>\n<td align=\"right\">2.6<\/td>\n<td align=\"right\">13.2<\/td>\n<td align=\"right\">10.6<\/td>\n<td align=\"right\">2.88<\/td>\n<td align=\"right\">1.04<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">library(ggplot2)\nurl &lt;- paste0(&quot;https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0/data/dataflow/ESTAT/&quot;,\n              &quot;une_rt_a/1.0?format=csvdata&amp;compress=false&quot;,\n              &quot;&amp;c[age]=Y15-74&amp;c[sex]=T&amp;c[unit]=PC_ACT&quot;)\nu &lt;- read.csv(url)\nu &lt;- u[u$TIME_PERIOD == 2023 &amp; !is.na(u$OBS_VALUE) &amp; !grepl(&quot;^EU|^EA&quot;, u$geo), ]\nggplot(u, aes(OBS_VALUE)) + geom_histogram(bins = 7)\nggplot(u, aes(OBS_VALUE)) + geom_boxplot()\n<\/code><\/pre>\n<p>The distribution is <strong>asymmetric<\/strong>, with positive skewness, so the median is the better measure of the typical country. The upper boxplot limit is 7.35 + 1.5 × 3.25 = 12.2, so <strong>Bosnia and Herzegovina (13.2) and North Macedonia (13.1)<\/strong> are flagged. Spain is just below the limit at 12.2. North Macedonia ranks second highest of the 34, Serbia is at 9.5, and data for Albania and Montenegro were not available for this indicator and year. Czechia (2.6) and Poland (2.8) are the lowest.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: Inflation around the world (IMF).<\/strong> The IMF's DataMapper indicator <code>PCPIPCH<\/code> gives annual inflation for almost every country. Compare 2019 and 2022. For which year is the mean further above the median? Which countries are flagged as extreme, and how does excluding them change your description of &quot;global inflation&quot;?<\/p>\n","answer":"<p>Data from the IMF's DataMapper API, for 196 countries in 2019 and 195 in 2022, downloaded on 10 November 2026. Regional aggregates are removed by keeping only the IMF's list of countries.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Year<\/th>\n<th align=\"right\">Mean<\/th>\n<th align=\"right\">Median<\/th>\n<th align=\"right\">Standard deviation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">2019<\/td>\n<td align=\"right\">106.79<\/td>\n<td align=\"right\">2.2<\/td>\n<td align=\"right\">1,421.61<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2022<\/td>\n<td align=\"right\">13.64<\/td>\n<td align=\"right\">8.1<\/td>\n<td align=\"right\">25.28<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The mean is far further above the median in <strong>2019<\/strong>, almost entirely because of <strong>Venezuela (about 19,906 percent)<\/strong>.<\/p>\n<p>The 1.5 × IQR rule flags 20 countries in 2019, including Venezuela, Zimbabwe (255), Argentina (54), Sudan (51) and South Sudan (49). In 2022 it flags 17, including Zimbabwe (193), Venezuela (186), Lebanon (171), Sudan (139), Argentina and Türkiye (both 72).<\/p>\n<p>Excluding the flagged countries gives a mean of <strong>2.15 and median of 1.9 in 2019<\/strong>, and a mean of <strong>8.13 and median of 7.6 in 2022<\/strong>. The conclusion is clear: global inflation was low in 2019 and much higher in 2022, and the median tells that story reliably with or without the exclusions. A description of &quot;global inflation&quot; should say which measure is being used, and that the extreme countries are real economic disasters rather than errors.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: The day oil cost less than nothing (FRED).<\/strong> Download daily West Texas Intermediate prices from FRED (series <code>DCOILWTICO<\/code>). The price on 20 April 2020 was $-36.98$ dollars per barrel. Is this an error? Find out what happened, then decide which of the three situations it belongs to. Compute kurtosis for daily price changes with and without that day.<\/p>\n","answer":"<p>It is <strong>not an error<\/strong>. In April 2020, pandemic lockdowns collapsed demand, and storage at the delivery point in Cushing, Oklahoma, was nearly full. Holders of the expiring May futures contract had to take delivery of physical oil, so they paid others to take it. This is <strong>Situation 3<\/strong>: real, and the essential feature for anyone concerned with risk.<\/p>\n<pre><code class=\"language-r\">library(moments)\no &lt;- read.csv(&quot;https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILWTICO&quot;)\nnames(o) &lt;- c(&quot;date&quot;, &quot;price&quot;)\no$price &lt;- suppressWarnings(as.numeric(o$price))\no &lt;- o[!is.na(o$price), ]\no$change &lt;- c(NA, diff(o$price))\nkurtosis(o$change, na.rm = TRUE)\n<\/code><\/pre>\n<p>Daily changes: −$55.29 on 20 April 2020 and +$45.89 on 21 April.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Sample<\/th>\n<th align=\"right\">Kurtosis of daily price changes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">All observations<\/td>\n<td align=\"right\">232.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Without the change on 20 April 2020<\/td>\n<td align=\"right\">108.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Without the changes on 20 and 21 April 2020<\/td>\n<td align=\"right\">19.8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Removing the negative price also affects the change that follows it, which is why the two-day row is informative. Even without those days, kurtosis remains far above the normal benchmark of 3.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: Urbanisation (World Bank).<\/strong> Download the urban population share (<code>SP.URB.TOTL.IN.ZS<\/code>) for 2022 for Japan, South Korea, Germany, France, Poland, India, Egypt and Indonesia, then repeat for all countries. In each case, use Sturges' rule to group the values and calculate the absolute and relative frequencies, then the mean, median and skewness. Is urbanisation concentrated in a particular interval? Is the distribution symmetric? Do any countries differ significantly from the group?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(moments)\nd &lt;- WDI(country = &quot;all&quot;, indicator = c(urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE)\nd &lt;- d[d$region != &quot;Aggregates&quot; &amp; !is.na(d$urban), ]\nx &lt;- d$urban\nk &lt;- nclass.Sturges(x)\nbins &lt;- cut(x, breaks = k, include.lowest = TRUE, right = FALSE)\ndata.frame(table(bins), share = round(prop.table(table(bins)), 3))\nc(mean = mean(x), median = median(x), skew = skewness(x))\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026.<\/p>\n<p>Urban share in 2022 for the eight countries: Japan 92.0, Germany 81.8, South Korea 81.2, France 78.8, Poland 59.8, Indonesia 57.5, Egypt 42.6 and India 34.8. Sturges' rule gives <strong>4 groups<\/strong>, with 2, 2, 0 and 4 countries. The mean is <strong>66.1<\/strong>, the median <strong>69.3<\/strong> and the skewness <strong>−0.31<\/strong>. With only eight observations, be cautious about any statement on shape.<\/p>\n<p>For all 214 countries with data, Sturges' rule gives <strong>9 groups<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Interval (%)<\/th>\n<th align=\"right\">Countries<\/th>\n<th align=\"right\">Share<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">14.6 to 24.2<\/td>\n<td align=\"right\">12<\/td>\n<td align=\"right\">5.6%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">24.2 to 33.6<\/td>\n<td align=\"right\">20<\/td>\n<td align=\"right\">9.3%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">33.6 to 43.1<\/td>\n<td align=\"right\">23<\/td>\n<td align=\"right\">10.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">43.1 to 52.6<\/td>\n<td align=\"right\">15<\/td>\n<td align=\"right\">7.0%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">52.6 to 62.1<\/td>\n<td align=\"right\">33<\/td>\n<td align=\"right\">15.4%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">62.1 to 71.6<\/td>\n<td align=\"right\">32<\/td>\n<td align=\"right\">15.0%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">71.6 to 81.0<\/td>\n<td align=\"right\">26<\/td>\n<td align=\"right\">12.1%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">81.0 to 90.5<\/td>\n<td align=\"right\">25<\/td>\n<td align=\"right\">11.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">90.5 to 100<\/td>\n<td align=\"right\">28<\/td>\n<td align=\"right\">13.1%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The mean is <strong>62.1<\/strong>, the median <strong>63.3<\/strong> and the skewness <strong>−0.18<\/strong>, so the distribution is <strong>close to symmetric, with a slight left tail<\/strong>. Urbanisation is not concentrated in any single interval, although it is most common between about 52 and 72 percent. The 1.5 × IQR rule flags no country, because the limits lie outside the possible range of 0 to 100. Eleven countries are at or very near 100 percent, while Liechtenstein and Papua New Guinea are the lowest, at 14.7 percent. Remember to remove regional aggregates, which is what <code>extra = TRUE<\/code> and the <code>region<\/code> filter achieve.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6: Education and defence (World Bank).<\/strong> Download government expenditure on education (% of GDP, <code>SE.XPD.TOTL.GD.ZS<\/code>) and military expenditure (% of GDP, <code>MS.MIL.XPND.GD.ZS<\/code>) for 2022 for Germany, France, Italy, Poland, Spain, the United States, Japan and South Korea. Analyse each variable separately, calculating the mean, median, minimum, maximum, standard deviation and skewness. Which distribution has greater variability? Is one more asymmetric? Do any countries stand out on one variable but not on the other?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(moments)\nd &lt;- WDI(country = c(&quot;DEU&quot;, &quot;FRA&quot;, &quot;ITA&quot;, &quot;POL&quot;, &quot;ESP&quot;, &quot;USA&quot;, &quot;JPN&quot;, &quot;KOR&quot;),\n         indicator = c(education = &quot;SE.XPD.TOTL.GD.ZS&quot;, defence = &quot;MS.MIL.XPND.GD.ZS&quot;),\n         start = 2022, end = 2022)\nstats &lt;- function(v) c(mean = mean(v, na.rm = TRUE), median = median(v, na.rm = TRUE),\n                       min = min(v, na.rm = TRUE), max = max(v, na.rm = TRUE),\n                       sd = sd(v, na.rm = TRUE), skew = skewness(v, na.rm = TRUE),\n                       cv = sd(v, na.rm = TRUE) / mean(v, na.rm = TRUE))\nround(rbind(education = stats(d$education), defence = stats(d$defence)), 2)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">N<\/th>\n<th align=\"right\">Mean<\/th>\n<th align=\"right\">Median<\/th>\n<th align=\"right\">Min<\/th>\n<th align=\"right\">Max<\/th>\n<th align=\"right\">SD<\/th>\n<th align=\"right\">Skewness<\/th>\n<th align=\"right\">CV<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Education (% of GDP)<\/td>\n<td align=\"right\">6<\/td>\n<td align=\"right\">4.82<\/td>\n<td align=\"right\">4.91<\/td>\n<td align=\"right\">4.07<\/td>\n<td align=\"right\">5.41<\/td>\n<td align=\"right\">0.58<\/td>\n<td align=\"right\">−0.21<\/td>\n<td align=\"right\">0.12<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Military (% of GDP)<\/td>\n<td align=\"right\">8<\/td>\n<td align=\"right\">1.92<\/td>\n<td align=\"right\">1.78<\/td>\n<td align=\"right\">0.97<\/td>\n<td align=\"right\">3.30<\/td>\n<td align=\"right\">0.76<\/td>\n<td align=\"right\">0.60<\/td>\n<td align=\"right\">0.39<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Japan and the United States have no education figure for 2022<\/strong>, so the two variables cover different countries, which you should say.<\/p>\n<p><strong>Military spending varies far more<\/strong> relative to its mean, with a coefficient of variation of 0.39 against 0.12, and it is the <strong>more asymmetric<\/strong>, with a positive skew. The United States (3.30), South Korea (2.58) and Poland (2.20) stand out on defence, and Japan is lowest (0.97). On education, South Korea (5.41) is highest and Italy lowest (4.07). South Korea is high on both. With so few countries, skewness is imprecise.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7: Connected societies (World Bank).<\/strong> Download individuals using the Internet (% of population, <code>IT.NET.USER.ZS<\/code>) and mobile cellular subscriptions (per 100 people, <code>IT.CEL.SETS.P2<\/code>) for 2022 for Sweden, Norway, the Netherlands, Italy, Poland, Türkiye, Brazil and India. Carry out a descriptive analysis of both distributions and compare their measures of central tendency and dispersion. Do the two variables have a similar shape? Do mobile subscriptions show greater dispersion than Internet use? Are there extreme values in either variable?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(moments)\nd &lt;- WDI(country = c(&quot;SWE&quot;, &quot;NOR&quot;, &quot;NLD&quot;, &quot;ITA&quot;, &quot;POL&quot;, &quot;TUR&quot;, &quot;BRA&quot;, &quot;IND&quot;),\n         indicator = c(internet = &quot;IT.NET.USER.ZS&quot;, mobile = &quot;IT.CEL.SETS.P2&quot;),\n         start = 2022, end = 2022)\nstats &lt;- function(v) c(mean = mean(v, na.rm = TRUE), median = median(v, na.rm = TRUE),\n                       sd = sd(v, na.rm = TRUE), skew = skewness(v, na.rm = TRUE))\nround(rbind(internet = stats(d$internet), mobile = stats(d$mobile)), 2)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">Internet users (%)<\/th>\n<th align=\"right\">Mobile subscriptions per 100<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Norway<\/td>\n<td align=\"right\">99.0<\/td>\n<td align=\"right\">111.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Sweden<\/td>\n<td align=\"right\">95.0<\/td>\n<td align=\"right\">140.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Netherlands<\/td>\n<td align=\"right\">92.5<\/td>\n<td align=\"right\">115.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Poland<\/td>\n<td align=\"right\">86.9<\/td>\n<td align=\"right\">137.0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Italy<\/td>\n<td align=\"right\">85.1<\/td>\n<td align=\"right\">131.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Türkiye<\/td>\n<td align=\"right\">83.4<\/td>\n<td align=\"right\">103.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Brazil<\/td>\n<td align=\"right\">80.5<\/td>\n<td align=\"right\">101.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">India<\/td>\n<td align=\"right\">55.9<\/td>\n<td align=\"right\">80.2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Mean<\/th>\n<th align=\"right\">Median<\/th>\n<th align=\"right\">SD<\/th>\n<th align=\"right\">Skewness<\/th>\n<th align=\"right\">CV<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Internet<\/td>\n<td align=\"right\">84.8<\/td>\n<td align=\"right\">86.0<\/td>\n<td align=\"right\">13.2<\/td>\n<td align=\"right\">−1.31<\/td>\n<td align=\"right\">0.16<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Mobile<\/td>\n<td align=\"right\">115.3<\/td>\n<td align=\"right\">113.7<\/td>\n<td align=\"right\">20.6<\/td>\n<td align=\"right\">−0.28<\/td>\n<td align=\"right\">0.18<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The shapes differ. Internet use is capped at 100 percent, so values pile up near the top and it has a <strong>clear left tail<\/strong>, while mobile subscriptions can exceed 100 because one person can hold several SIM cards. <strong>Mobile has the larger standard deviation<\/strong>, but the coefficients of variation are almost the same, so its dispersion is only slightly greater relative to its mean. <strong>India is the only flagged outlier for internet use<\/strong>, and no country is flagged for mobile subscriptions.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8 (AI): Audit a chatbot's analysis.<\/strong> Give an AI chatbot the file <code>income_europe_2023.csv<\/code> or a description of it, and use the first prompt in Section 5.7 to obtain code. Run the code. Then apply each point of the checklist and record what you found. Did the chatbot drop any observations? Did it explain kurtosis correctly? Next, ask it why Türkiye has the highest ratio of mean to median income, and try to verify its explanation from a source you can name.<\/p>\n","answer":"<p>Check that N is 34, compute one mean or median by hand, and look up the highest and lowest ratios. Make sure the chatbot has not dropped observations. A correct explanation of kurtosis focuses on tails rather than peakedness, and states whether 3 has been subtracted.<\/p>\n<p>Türkiye has the highest mean-to-median ratio, at 1.46. A chatbot's reason, such as high inequality, may be plausible, but you must verify it. A suitable check is the Gini coefficient or income-share data from Eurostat or the national statistical office, and you should name the source.<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што е дескриптивна анализа и зошто е важен чекор во анализирањето податоци?<\/p>\n","answer":"<p>Дескриптивната анализа ги резимира променливите во едно податочно множество за да разбереме што содржат. Важна е затоа што открива проблеми во податоците, ги насочува подоцнежните методи и им дава контекст на резултатите.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Наведете ги и објаснете ги петте причини за спроведување дескриптивна анализа пред понатамошна статистичка работа, со пример за секоја.<\/p>\n","answer":"<ul>\n<li><strong>Проверува дали податоците се чисти:<\/strong> максимум илјада пати преголем укажува на грешка во единиците.<\/li>\n<li><strong>Го насочува изборот на методи:<\/strong> на силно искосена променлива можеби ѝ треба логаритамска трансформација.<\/li>\n<li><strong>Им дава контекст на резултатите:<\/strong> ефект од два поени врз извозните удели може да се процени само ако се знаат типичните извозни удели.<\/li>\n<li><strong>Понекогаш директно одговара на прашањето:<\/strong> „дали порасна медијалниот приход?“ може да се реши со медијаната.<\/li>\n<li><strong>Создава нови прашања:<\/strong> стапката на раст на Ирска го отвори прашањето што всушност мери БДП.<\/li>\n<\/ul>\n"},{"kind":"q","n":3,"ask":"<p>Која е разликата меѓу апсолутна и релативна фреквенција? Кога е подобро да се користи едната или другата?<\/p>\n","answer":"<p><strong>Апсолутна честота<\/strong> е бројот на набљудувања со дадена вредност, а <strong>релативна честота<\/strong> е тој број како удел во сите набљудувања. Користете апсолутни честоти за да ги проверите големината на примерокот и квалитетот на податоците, а релативни честоти за да споредувате групи со различна големина.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Кога би прикажале релативни фреквенции што ги вклучуваат недостасувачките вредности, а кога би ги исклучиле?<\/p>\n","answer":"<p>Вклучете ги недостасувачките вредности кога го проверувате квалитетот на податоците, бидејќи токму тие се она што го испитувате. Исклучете ги кога ја опишувате распределбата на набљудуваните вредности, пресметувајќи удели меѓу набљудувањата што не недостасуваат.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Што е распределба на променлива?<\/p>\n","answer":"<p>Покажува кои вредности ги зема променливата и колку често ја зема секоја од нив, во апсолутни или релативни износи.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Зошто групирањето е корисно за променливи со многу различни вредности?<\/p>\n","answer":"<p>Кога речиси секоја вредност се појавува еднаш, листата на честоти не ни кажува ништо. Групирањето на вредностите во интервали ја открива формата на распределбата.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Објаснете го правилото на Старџес. Кога и зошто се користи? Колку групи дава за 200 набљудувања?<\/p>\n","answer":"<p>Правилото на Стерџис (Sturges) дава почетен број групи: K = 1 + log2(N). Се користи за избор на групи за табели на честоти и хистограми. За 200 набљудувања, K = 1 + log2(200) ≈ 8.64, значи околу <strong>9 групи<\/strong>. Обично дава премалку групи за големи или искосени податочни множества.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Што се екстремни вредности (аутлајери)? Дали секогаш треба да се отстрануваат од анализа? Објаснете.<\/p>\n","answer":"<p>Екстремните вредности се набљудувања многу поголеми или помали од останатите. Не треба секогаш да се отстрануваат. Некои се грешки, некои се вистински, но неважни за прашањето, а некои се најважните набљудувања во податоците.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Опишете три вида екстремни вредности. За секој објаснете што треба да направи аналитичарот.<\/p>\n","answer":"<ol>\n<li><strong>Грешки<\/strong>, како 200 работни часа неделно: поправете ги или означете ги како недостасувачки.<\/li>\n<li><strong>Вистински, но неважни за прашањето<\/strong>, како растот на Ирска во 2015 кога се проучува животниот стандард: може да ги исклучите, но мора да го кажете тоа.<\/li>\n<li><strong>Вистински и суштински за прашањето<\/strong>, како најлошите денови на берзата: задржете ги и користете методи што можат да се справат со нив.<\/li>\n<\/ol>\n"},{"kind":"q","n":10,"ask":"<p>Зошто стапката на раст на Ирска во 2015 не одразувала промена во животниот стандард, иако била правилно пресметана?<\/p>\n","answer":"<p>Голем фонд на нематеријални средства, главно интелектуална сопственост, се префрли во книгите на компании во Ирска, а приходот што го заработија се сметаше како ирско производство. Сметководствените правила беа почитувани, но немаше повеќе вработени Ирци и малку нешта се променија во секојдневниот економски живот. БДП го мери производството евидентирано во една држава, а не приходот на луѓето што живеат во неа.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Кои се трите главни категории збирни статистички показатели?<\/p>\n","answer":"<p>Мерки на централна тенденција, мерки на дисперзија и мерки на форма.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Која е разликата меѓу средната вредност и медијаната? Во кој случај медијаната е подобра мерка?<\/p>\n","answer":"<p>Средната вредност е аритметичкиот просек. Медијаната е средната вредност откако набљудувањата ќе се подредат. Медијаната е подобра за искосени распределби или за оние со екстремни вредности, бидејќи една огромна вредност речиси не ја поместува.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Што ни кажува стандардната девијација?<\/p>\n","answer":"<p>Опишува колку набљудувањата типично се оддалечени од средната вредност, во изворните единици.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Која е разликата меѓу варијансата и стандардната девијација? Зошто стандардната девијација полесно се толкува?<\/p>\n","answer":"<p>Варијансата е просечното квадратно отстапување од средната вредност, а стандардната девијација е нејзиниот квадратен корен. Стандардната девијација полесно се толкува бидејќи е во изворните единици, додека варијансата е во квадратни единици, како „квадратни милиони луѓе“.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Што е коефициент на асиметрија? Како ги толкуваме позитивната и негативната асиметрија?<\/p>\n","answer":"<p>Искосеноста ја мери асиметријата. Позитивна искосеност значи долга десна опашка, како кај приходот. Негативна искосеност значи долга лева опашка. Нула значи симетрична распределба.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Што е куртозис?<\/p>\n","answer":"<p>Заобленоста (kurtosis) главно ја мери тежината на опашките, односно колку често се јавуваат многу екстремни вредности. Нормалната распределба има заобленост 3, а повисоките вредности укажуваат на подебели опашки.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Променлива има силна позитивна асиметрија. Дали очекувате средната вредност да биде над или под медијаната? Објаснете зошто.<\/p>\n","answer":"<p>Над неа. Долгата десна опашка содржи неколку многу големи вредности, кои ја влечат средната вредност нагоре, додека медијаната зависи само од редоследот на вредностите.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Замислете дека ги анализирате приходите на фирми и забележувате неколку екстремно големи вредности. Кои можни причини би ги разгледале? Кои чекори би ги презеле пред да ги отстраните?<\/p>\n","answer":"<p>Земете ги предвид грешките во податоците (како погрешни единици или цифри), различен вид единица (како холдинг-компанија или консолидирани сметки) или навистина големи фирми. Пред да отстраните нешто, проверете ги набљудувањата, единиците и изворот, одлучете која од трите ситуации важи и пријавете го секое исклучување. Големината на фирмите обично е искосена, па големите фирми често се вистински и важни.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Две серии имаат иста средна вредност и стандардна девијација, но различна асиметрија. Што ви кажува тоа за распределбите?<\/p>\n","answer":"<p>Двете имаат ист центар и иста просечна распрснатост, но различна асиметрија. Едната може да има подолга десна опашка, а другата подолга лева опашка или да е симетрична. Самите збирни бројки може да го скријат тоа, затоа нацртајте ги хистограмите.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Ако распонот е многу голем, но стандардната девијација е релативно мала, што можете да заклучите за распределбата?<\/p>\n","answer":"<p>Повеќето набљудувања се блиску едно до друго, близу до средната вредност, а неколку екстремни вредности го растегнуваат опсегот. Опсегот зависи само од двете најекстремни вредности, додека стандардната девијација ги одразува сите набљудувања.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>Дали медијаната и модата можат да бидат еднакви? Ако можат, кај каков вид распределба би го забележале тоа?<\/p>\n","answer":"<p>Да. Кај симетрична распределба со еден врв, како нормалната распределба, средната вредност, медијаната и модата се совпаѓаат.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>Што ви кажува куртозис од 12 за серија приноси од акции? Која е практичната последица за менаџер за ризик?<\/p>\n","answer":"<p>Екстремните денови се случуваат многу почесто отколку според нормалната распределба, чија заобленост е 3. Менаџер за ризик што користи нормален модел ќе ги потцени веројатноста и големината на големите загуби, па мора да користи методи што ги одразуваат дебелите опашки и да чува резерви за ретки, но вистински настани.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>Зошто функцијата <code>get_mode()<\/code> враќа бесмислен резултат за податоците за населението?<\/p>\n","answer":"<p>Населението на секоја држава е единствено, па сите вредности се изедначени со честота еден и функцијата ја враќа првата од нив, што е едноставно населението на Исланд. За непрекината променлива, наведете ја модалната група.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>Наведете четири проверки што треба да ги направите пред да користите збирни статистички показатели произведени со помош на AI-четбот.<\/p>\n","answer":"<p>Кои било четири од овие: избројте ги набљудувањата; проверете една бројка рачно; проверете ги минимумот и максимумот; проверете ги единиците; проверете ги дефинициите (на пример, дали од заобленоста се одзема 3 и дали стандардната девијација дели со n или n−1); и преиспитајте го секое објаснување дадено за екстремна вредност.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Истражување аутлајер.<\/strong> Користејќи <code>gdp_growth_europe_2015.csv<\/code>, пресметајте ги збирните статистички показатели со и без Ирска. Кои показатели најмногу се менуваат? Потоа откријте зошто и Малта е надвор од мустаќите во графиконот во поглавјето. Дали е тоа Ситуација 1, 2 или 3 од Оддел 5.3? Напишете еден пасус во одбрана на вашиот одговор.<\/p>\n","answer":"<pre><code class=\"language-r\">library(moments)\ng &lt;- read.csv(&quot;data/gdp_growth_europe_2015.csv&quot;)\ndescribe &lt;- function(v) c(N = length(v), Mean = mean(v), Median = median(v),\n                          SD = sd(v), Min = min(v), Max = max(v),\n                          Skewness = skewness(v), Kurtosis = kurtosis(v))\nround(rbind(all = describe(g$gdp_growth),\n            without_IE = describe(g$gdp_growth[g$geo != &quot;IE&quot;])), 2)\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">N<\/th>\n<th align=\"right\">Средна вредност<\/th>\n<th align=\"right\">Медијана<\/th>\n<th align=\"right\">Стд. дев.<\/th>\n<th align=\"right\">Мин.<\/th>\n<th align=\"right\">Макс.<\/th>\n<th align=\"right\">Искосеност<\/th>\n<th align=\"right\">Заобленост<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Сите<\/td>\n<td align=\"right\">38<\/td>\n<td align=\"right\">3.23<\/td>\n<td align=\"right\">2.45<\/td>\n<td align=\"right\">4.50<\/td>\n<td align=\"right\">−9.8<\/td>\n<td align=\"right\">24.6<\/td>\n<td align=\"right\">2.32<\/td>\n<td align=\"right\">16.14<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Без Ирска<\/td>\n<td align=\"right\">37<\/td>\n<td align=\"right\">2.65<\/td>\n<td align=\"right\">2.40<\/td>\n<td align=\"right\">2.80<\/td>\n<td align=\"right\">−9.8<\/td>\n<td align=\"right\">9.6<\/td>\n<td align=\"right\">−1.96<\/td>\n<td align=\"right\">12.49<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Најмногу се менуваат максимумот, стандардната девијација, искосеноста и заобленоста, а искосеноста дури го менува и знакот. Медијаната речиси не се поместува.<\/p>\n<p>Позицијата на Малта е <strong>вистинска<\/strong>, а не грешка: Eurostat објавува 9.6 проценти. Проверете ги националните сметки или извештаите на Европската комисија за изворот на тој раст. Инвестициите тогаш беа невообичаено силни, а тоа и неговите компоненти треба сами да ги потврдите. Најдобро е да се смета за <strong>Ситуација 3<\/strong> ако прашањето се однесува на производството во Европа, бидејќи одразува вистинска активност. Кон Ситуација 2 се поместува само ако откриете дека растот бил главно еднократен сметководствен ефект. Вашиот пасус треба да го именува изворот што ја поддржува вашата класификација.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Невработеноста во Европа (Eurostat).<\/strong> Преземете ги годишните стапки на невработеност за 2023 од податочното множество на Eurostat <code>une_rt_a<\/code> (возраст од 15 до 74 години, двата пола, процент од работната сила). Отстранете ги агрегатите како <code>EU27_2020<\/code>. Спроведете целосна дескриптивна анализа. Пресметајте средна вредност, медијана, минимум, максимум, распон, стандардна девијација и коефициент на асиметрија и нацртајте хистограм и боксплот дијаграм. Потоа одговорете на прашањата. Дали распределбата е симетрична или асиметрична? Дали некоја држава значително се разликува од останатите? Дали средната вредност или медијаната е посоодветна мерка тука? Каде во распределбата се наоѓаат државите од Западен Балкан?<\/p>\n","answer":"<p>За 2023 има 34 држави со податоци откако ќе се отстранат <code>EU27_2020<\/code> и <code>EA21<\/code> (резултатите се преземени на 10 ноември 2026).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">N<\/th>\n<th align=\"right\">Средна вредност<\/th>\n<th align=\"right\">Медијана<\/th>\n<th align=\"right\">Минимум<\/th>\n<th align=\"right\">Максимум<\/th>\n<th align=\"right\">Опсег<\/th>\n<th align=\"right\">Стд. дев.<\/th>\n<th align=\"right\">Искосеност<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">34<\/td>\n<td align=\"right\">6.24<\/td>\n<td align=\"right\">5.70<\/td>\n<td align=\"right\">2.6<\/td>\n<td align=\"right\">13.2<\/td>\n<td align=\"right\">10.6<\/td>\n<td align=\"right\">2.88<\/td>\n<td align=\"right\">1.04<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">library(ggplot2)\nurl &lt;- paste0(&quot;https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0/data/dataflow/ESTAT/&quot;,\n              &quot;une_rt_a/1.0?format=csvdata&amp;compress=false&quot;,\n              &quot;&amp;c[age]=Y15-74&amp;c[sex]=T&amp;c[unit]=PC_ACT&quot;)\nu &lt;- read.csv(url)\nu &lt;- u[u$TIME_PERIOD == 2023 &amp; !is.na(u$OBS_VALUE) &amp; !grepl(&quot;^EU|^EA&quot;, u$geo), ]\nggplot(u, aes(OBS_VALUE)) + geom_histogram(bins = 7)\nggplot(u, aes(OBS_VALUE)) + geom_boxplot()\n<\/code><\/pre>\n<p>Распределбата е <strong>асиметрична<\/strong>, со позитивна искосеност, па медијаната е подобра мерка за типичната држава. Горната граница на кутиестиот дијаграм е 7.35 + 1.5 × 3.25 = 12.2, па се означени <strong>Босна и Херцеговина (13.2) и Северна Македонија (13.1)<\/strong>. Шпанија е веднаш под границата, со 12.2. Северна Македонија е втора по висина од 34-те држави, Србија е на 9.5, а за Албанија и Црна Гора немаше податоци за овој показател и година. Чешка (2.6) и Полска (2.8) се најниски.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Инфлацијата низ светот (ММФ).<\/strong> Показателот <code>PCPIPCH<\/code> од DataMapper на Меѓународниот монетарен фонд (International Monetary Fund, IMF) ја дава годишната инфлација за речиси секоја држава. Споредете ги 2019 и 2022. За која година средната вредност е подалеку над медијаната? Кои држави се означени како екстремни и како нивното исклучување го менува вашиот опис на „глобалната инфлација“?<\/p>\n","answer":"<p>Податоци од API-то DataMapper на ММФ, за 196 држави во 2019 и 195 во 2022, преземени на 10 ноември 2026. Регионалните агрегати се отстранети така што е задржана само листата на држави на ММФ.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Година<\/th>\n<th align=\"right\">Средна вредност<\/th>\n<th align=\"right\">Медијана<\/th>\n<th align=\"right\">Стандардна девијација<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">2019<\/td>\n<td align=\"right\">106.79<\/td>\n<td align=\"right\">2.2<\/td>\n<td align=\"right\">1,421.61<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2022<\/td>\n<td align=\"right\">13.64<\/td>\n<td align=\"right\">8.1<\/td>\n<td align=\"right\">25.28<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Средната вредност е многу повеќе над медијаната во <strong>2019<\/strong>, речиси целосно поради <strong>Венецуела (околу 19,906 проценти)<\/strong>.<\/p>\n<p>Правилото 1.5 × IQR означува 20 држави во 2019, меѓу кои Венецуела, Зимбабве (255), Аргентина (54), Судан (51) и Јужен Судан (49). Во 2022 означува 17, меѓу кои Зимбабве (193), Венецуела (186), Либан (171), Судан (139), Аргентина и Турција (двете 72).<\/p>\n<p>Исклучувањето на означените држави дава средна вредност од <strong>2.15 и медијана од 1.9 во 2019<\/strong> и средна вредност од <strong>8.13 и медијана од 7.6 во 2022<\/strong>. Заклучокот е јасен: глобалната инфлација беше ниска во 2019 и многу повисока во 2022, а медијаната сигурно ја кажува таа приказна со или без исклучувањата. Опис на „глобалната инфлација“ треба да каже која мерка се користи и дека екстремните држави се вистински економски катастрофи, а не грешки.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Денот кога нафтата чинеше помалку од ништо (FRED).<\/strong> Преземете ги дневните цени на West Texas Intermediate од FRED (серија <code>DCOILWTICO<\/code>). Цената на 20 април 2020 била $-36.98$ долари за барел. Дали ова е грешка? Откријте што се случило, па одлучете на која од трите ситуации припаѓа. Пресметајте куртозис за дневните промени на цените со и без тој ден.<\/p>\n","answer":"<p><strong>Не е грешка<\/strong>. Во април 2020, карантините за време на пандемијата ја урнаа побарувачката, а складиштата на местото на испорака во Кушинг, Оклахома, беа речиси полни. Сопствениците на фјучерс-договорот за мај што истекуваше мораа да преземат физичка нафта, па им платија на други да ја земат. Ова е <strong>Ситуација 3<\/strong>: вистинско и суштинско својство за секој што се занимава со ризик.<\/p>\n<pre><code class=\"language-r\">library(moments)\no &lt;- read.csv(&quot;https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILWTICO&quot;)\nnames(o) &lt;- c(&quot;date&quot;, &quot;price&quot;)\no$price &lt;- suppressWarnings(as.numeric(o$price))\no &lt;- o[!is.na(o$price), ]\no$change &lt;- c(NA, diff(o$price))\nkurtosis(o$change, na.rm = TRUE)\n<\/code><\/pre>\n<p>Дневни промени: −$55.29 на 20 април 2020 и +$45.89 на 21 април.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Примерок<\/th>\n<th align=\"right\">Заобленост на дневните промени на цената<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Сите набљудувања<\/td>\n<td align=\"right\">232.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Без промената на 20 април 2020<\/td>\n<td align=\"right\">108.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Без промените на 20 и 21 април 2020<\/td>\n<td align=\"right\">19.8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Отстранувањето на негативната цена влијае и врз промената што следи по неа, поради што редот со двата дена е информативен. Дури и без тие денови, заобленоста останува многу над нормалниот репер од 3.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: Урбанизација (Светска банка).<\/strong> Преземете го уделот на урбаното население (<code>SP.URB.TOTL.IN.ZS<\/code>) за 2022 за Јапонија, Јужна Кореја, Германија, Франција, Полска, Индија, Египет и Индонезија, па повторете за сите држави. Во секој случај, употребете го правилото на Старџес за да ги групирате вредностите и да ги пресметате апсолутните и релативните фреквенции, а потоа средната вредност, медијаната и коефициентот на асиметрија. Дали урбанизацијата е концентрирана во одреден интервал? Дали распределбата е симетрична? Дали некои држави значително се разликуваат од групата?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(moments)\nd &lt;- WDI(country = &quot;all&quot;, indicator = c(urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE)\nd &lt;- d[d$region != &quot;Aggregates&quot; &amp; !is.na(d$urban), ]\nx &lt;- d$urban\nk &lt;- nclass.Sturges(x)\nbins &lt;- cut(x, breaks = k, include.lowest = TRUE, right = FALSE)\ndata.frame(table(bins), share = round(prop.table(table(bins)), 3))\nc(mean = mean(x), median = median(x), skew = skewness(x))\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026.<\/p>\n<p>Удел на градското население во 2022 за осумте држави: Јапонија 92.0, Германија 81.8, Јужна Кореја 81.2, Франција 78.8, Полска 59.8, Индонезија 57.5, Египет 42.6 и Индија 34.8. Правилото на Стерџис дава <strong>4 групи<\/strong>, со 2, 2, 0 и 4 држави. Средната вредност е <strong>66.1<\/strong>, медијаната <strong>69.3<\/strong>, а искосеноста <strong>−0.31<\/strong>. Со само осум набљудувања, бидете претпазливи со секое тврдење за формата.<\/p>\n<p>За сите 214 држави со податоци, правилото на Стерџис дава <strong>9 групи<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Интервал (%)<\/th>\n<th align=\"right\">Држави<\/th>\n<th align=\"right\">Удел<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">14.6 до 24.2<\/td>\n<td align=\"right\">12<\/td>\n<td align=\"right\">5.6%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">24.2 до 33.6<\/td>\n<td align=\"right\">20<\/td>\n<td align=\"right\">9.3%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">33.6 до 43.1<\/td>\n<td align=\"right\">23<\/td>\n<td align=\"right\">10.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">43.1 до 52.6<\/td>\n<td align=\"right\">15<\/td>\n<td align=\"right\">7.0%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">52.6 до 62.1<\/td>\n<td align=\"right\">33<\/td>\n<td align=\"right\">15.4%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">62.1 до 71.6<\/td>\n<td align=\"right\">32<\/td>\n<td align=\"right\">15.0%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">71.6 до 81.0<\/td>\n<td align=\"right\">26<\/td>\n<td align=\"right\">12.1%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">81.0 до 90.5<\/td>\n<td align=\"right\">25<\/td>\n<td align=\"right\">11.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">90.5 до 100<\/td>\n<td align=\"right\">28<\/td>\n<td align=\"right\">13.1%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Средната вредност е <strong>62.1<\/strong>, медијаната <strong>63.3<\/strong>, а искосеноста <strong>−0.18<\/strong>, па распределбата е <strong>блиску до симетрична, со мала лева опашка<\/strong>. Урбанизацијата не е концентрирана во еден интервал, иако е најчеста меѓу околу 52 и 72 проценти. Правилото 1.5 × IQR не означува ниту една држава, бидејќи границите се надвор од можниот опсег од 0 до 100. Единаесет држави се на или многу блиску до 100 проценти, а Лихтенштајн и Папуа Нова Гвинеја се најниски, со 14.7 проценти. Запомнете да ги отстраните регионалните агрегати, што го постигнуваат <code>extra = TRUE<\/code> и филтерот <code>region<\/code>.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6: Образование и одбрана (Светска банка).<\/strong> Преземете ги државните расходи за образование (% од БДП, <code>SE.XPD.TOTL.GD.ZS<\/code>) и воените расходи (% од БДП, <code>MS.MIL.XPND.GD.ZS<\/code>) за 2022 за Германија, Франција, Италија, Полска, Шпанија, Соединетите Американски Држави, Јапонија и Јужна Кореја. Анализирајте ја секоја променлива одделно, пресметувајќи средна вредност, медијана, минимум, максимум, стандардна девијација и коефициент на асиметрија. Која распределба има поголема варијабилност? Дали едната е поасиметрична? Дали некои држави се издвојуваат кај едната променлива, но не и кај другата?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(moments)\nd &lt;- WDI(country = c(&quot;DEU&quot;, &quot;FRA&quot;, &quot;ITA&quot;, &quot;POL&quot;, &quot;ESP&quot;, &quot;USA&quot;, &quot;JPN&quot;, &quot;KOR&quot;),\n         indicator = c(education = &quot;SE.XPD.TOTL.GD.ZS&quot;, defence = &quot;MS.MIL.XPND.GD.ZS&quot;),\n         start = 2022, end = 2022)\nstats &lt;- function(v) c(mean = mean(v, na.rm = TRUE), median = median(v, na.rm = TRUE),\n                       min = min(v, na.rm = TRUE), max = max(v, na.rm = TRUE),\n                       sd = sd(v, na.rm = TRUE), skew = skewness(v, na.rm = TRUE),\n                       cv = sd(v, na.rm = TRUE) / mean(v, na.rm = TRUE))\nround(rbind(education = stats(d$education), defence = stats(d$defence)), 2)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">N<\/th>\n<th align=\"right\">Средна вредност<\/th>\n<th align=\"right\">Медијана<\/th>\n<th align=\"right\">Мин.<\/th>\n<th align=\"right\">Макс.<\/th>\n<th align=\"right\">Стд. дев.<\/th>\n<th align=\"right\">Искосеност<\/th>\n<th align=\"right\">CV<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Образование (% од БДП)<\/td>\n<td align=\"right\">6<\/td>\n<td align=\"right\">4.82<\/td>\n<td align=\"right\">4.91<\/td>\n<td align=\"right\">4.07<\/td>\n<td align=\"right\">5.41<\/td>\n<td align=\"right\">0.58<\/td>\n<td align=\"right\">−0.21<\/td>\n<td align=\"right\">0.12<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Војска (% од БДП)<\/td>\n<td align=\"right\">8<\/td>\n<td align=\"right\">1.92<\/td>\n<td align=\"right\">1.78<\/td>\n<td align=\"right\">0.97<\/td>\n<td align=\"right\">3.30<\/td>\n<td align=\"right\">0.76<\/td>\n<td align=\"right\">0.60<\/td>\n<td align=\"right\">0.39<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Јапонија и Соединетите Американски Држави немаат бројка за образование за 2022<\/strong>, па двете променливи опфаќаат различни држави, што треба да го кажете.<\/p>\n<p><strong>Воените трошоци варираат многу повеќе<\/strong> во однос на својата средна вредност, со коефициент на варијација 0.39 наспроти 0.12, и се <strong>поасиметрични<\/strong>, со позитивна искосеност. Соединетите Американски Држави (3.30), Јужна Кореја (2.58) и Полска (2.20) се издвојуваат кај одбраната, а Јапонија е најниска (0.97). Кај образованието, Јужна Кореја (5.41) е највисока, а Италија најниска (4.07). Јужна Кореја е висока и кај двете. Со толку малку држави, искосеноста е непрецизна.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7: Поврзани општества (Светска банка).<\/strong> Преземете ги податоците за поединци што користат интернет (% од населението, <code>IT.NET.USER.ZS<\/code>) и претплати за мобилна телефонија (на 100 лица, <code>IT.CEL.SETS.P2<\/code>) за 2022 за Шведска, Норвешка, Холандија, Италија, Полска, Турција, Бразил и Индија. Спроведете дескриптивна анализа на двете распределби и споредете ги нивните мерки на централна тенденција и дисперзија. Дали двете променливи имаат сличен облик? Дали мобилните претплати покажуваат поголема дисперзија од користењето интернет? Дали има екстремни вредности во некоја од променливите?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(moments)\nd &lt;- WDI(country = c(&quot;SWE&quot;, &quot;NOR&quot;, &quot;NLD&quot;, &quot;ITA&quot;, &quot;POL&quot;, &quot;TUR&quot;, &quot;BRA&quot;, &quot;IND&quot;),\n         indicator = c(internet = &quot;IT.NET.USER.ZS&quot;, mobile = &quot;IT.CEL.SETS.P2&quot;),\n         start = 2022, end = 2022)\nstats &lt;- function(v) c(mean = mean(v, na.rm = TRUE), median = median(v, na.rm = TRUE),\n                       sd = sd(v, na.rm = TRUE), skew = skewness(v, na.rm = TRUE))\nround(rbind(internet = stats(d$internet), mobile = stats(d$mobile)), 2)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">Корисници на интернет (%)<\/th>\n<th align=\"right\">Мобилни претплати на 100 жители<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Норвешка<\/td>\n<td align=\"right\">99.0<\/td>\n<td align=\"right\">111.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Шведска<\/td>\n<td align=\"right\">95.0<\/td>\n<td align=\"right\">140.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Холандија<\/td>\n<td align=\"right\">92.5<\/td>\n<td align=\"right\">115.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Полска<\/td>\n<td align=\"right\">86.9<\/td>\n<td align=\"right\">137.0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Италија<\/td>\n<td align=\"right\">85.1<\/td>\n<td align=\"right\">131.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Турција<\/td>\n<td align=\"right\">83.4<\/td>\n<td align=\"right\">103.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Бразил<\/td>\n<td align=\"right\">80.5<\/td>\n<td align=\"right\">101.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Индија<\/td>\n<td align=\"right\">55.9<\/td>\n<td align=\"right\">80.2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Средна вредност<\/th>\n<th align=\"right\">Медијана<\/th>\n<th align=\"right\">Стд. дев.<\/th>\n<th align=\"right\">Искосеност<\/th>\n<th align=\"right\">CV<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Интернет<\/td>\n<td align=\"right\">84.8<\/td>\n<td align=\"right\">86.0<\/td>\n<td align=\"right\">13.2<\/td>\n<td align=\"right\">−1.31<\/td>\n<td align=\"right\">0.16<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Мобилни<\/td>\n<td align=\"right\">115.3<\/td>\n<td align=\"right\">113.7<\/td>\n<td align=\"right\">20.6<\/td>\n<td align=\"right\">−0.28<\/td>\n<td align=\"right\">0.18<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Формите се разликуваат. Користењето интернет е ограничено на 100 проценти, па вредностите се собираат близу до врвот и има <strong>јасна лева опашка<\/strong>, додека мобилните претплати можат да надминат 100 бидејќи едно лице може да има неколку SIM-картички. <strong>Мобилните претплати имаат поголема стандардна девијација<\/strong>, но коефициентите на варијација се речиси исти, па нивната дисперзија е само малку поголема во однос на средната вредност. <strong>Индија е единствената означена екстремна вредност кај користењето интернет<\/strong>, а кај мобилните претплати не е означена ниту една држава.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8 (AI): Проверете анализа на четбот.<\/strong> Дајте му на AI-четбот фајлот <code>income_europe_2023.csv<\/code> или негов опис и користете го првиот промпт во Оддел 5.7 за да добиете код. Извршете го кодот. Потоа применете ја секоја точка од списокот за проверка и забележете што откривте. Дали четботот исфрлил некои набљудувања? Дали правилно го објаснил куртозисот? Потоа прашајте го зошто Турција има највисок однос на средната вредност и медијаната на доходот и обидете се да го потврдите објаснувањето од извор што можете да го наведете.<\/p>\n","answer":"<p>Проверете дали N е 34, пресметајте една средна вредност или медијана рачно и проверете ги највисоките и најниските соодноси. Уверете се дека четботот не изоставил набљудувања. Точното објаснување на заобленоста се фокусира на опашките, а не на шилестоста, и кажува дали е одземено 3.<\/p>\n<p>Турција има највисок сооднос на средната вредност и медијаната, 1.46. Причината што ја наведува четботот, како висока нееднаквост, може да изгледа веродостојно, но мора да ја проверите. Соодветна проверка се Џини-коефициентот или податоците за уделите во приходот од Eurostat или од националниот завод за статистика, а изворот треба да го именувате.<\/p>\n"}],"title_mk":"Дескриптивна анализа","part_mk":"II. Опишување на економијата","check":{"status":"Reproduced","seconds":1.8,"book_lines":28,"matched":28,"message":""},"zip_kb":92},{"number":6,"title":"Composite Indices","part":"II. Describing the economy","folder":"ch06-indices","has_code":true,"code_lines":221,"datasets":["eurostat_labour_2023.csv","undp_hdi_2023.csv","wdi_hdi_clean_2022.csv"],"packages":["dplyr","ggplot2","knitr","moments","openxlsx","scales"],"figures":7,"tables":1,"stories":3,"closers":2,"prompts":3,"exercises":12,"questions":24,"solutions":[{"kind":"q","n":1,"ask":"<p>What is a composite index, and why is it used in place of individual indicators?<\/p>\n","answer":"<p>A composite index combines several indicators into a single measure, within a stated theoretical and methodological framework. It is used because some phenomena have several dimensions, and a single number makes it easier to communicate, compare units and focus attention.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Give two examples of phenomena that cannot be adequately measured by one indicator, and explain why.<\/p>\n","answer":"<p><strong>Quality of life<\/strong> includes health, living standards, education, culture and recreation, so income per person alone misses much of it. <strong>Economic competitiveness<\/strong> depends on infrastructure, human capital, innovation and tax policy, which GDP per capita alone does not capture.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>What are the six basic elements of a composite index?<\/p>\n","answer":"<p>Concept, dimensions, underlying indicators, scale, aggregation and weights.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>What is the difference between the concept and the dimensions in the structure of an index?<\/p>\n","answer":"<p>The <strong>concept<\/strong> is the phenomenon being measured, such as human development. The <strong>dimensions<\/strong> are the main aspects through which it is measured, such as health, education and living standards.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Why is normalisation necessary before aggregation?<\/p>\n","answer":"<p>Indicators come in different units, such as years, dollars and percentages. Without a common scale, the indicator with the largest numbers would dominate purely because of its units.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Explain the difference between linear and geometric aggregation.<\/p>\n","answer":"<p><strong>Linear aggregation<\/strong> computes a weighted average, so that strengths can fully offset weaknesses. <strong>Geometric aggregation<\/strong> multiplies the indicators, each raised to its weight, so weak results cannot be fully offset.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>What does it mean to say that the geometric mean &quot;limits compensation&quot;?<\/p>\n","answer":"<p>A high score in one dimension cannot fully make up for a low score in another. Scores of 0.9, 0.9 and 0.1 have the same arithmetic average as 0.63, 0.63 and 0.64, namely 0.633. Their geometric means are 0.433 and 0.633.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>What are the advantages and disadvantages of equal weights?<\/p>\n","answer":"<p>Equal weights are simple and easy to explain. But they implicitly treat every indicator as equally important, and highly correlated indicators may count the same information twice.<\/p>\n"},{"kind":"q",
