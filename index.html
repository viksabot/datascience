<script id="manifest" type="application/json">{"built":"2026-11-14","r_version":"R version 4.5.0 (2025-04-11 ucrt)","chapters":[{"number":1,"title":"Why Data Science for Economists?","part":"I. Foundations","folder":"ch01-why","has_code":true,"code_lines":48,"datasets":["mk_exports_hs2.csv","uk_solar_imports_annual.csv"],"packages":["dplyr","ggplot2","knitr","moments","scales","treemapify"],"figures":3,"tables":0,"stories":1,"closers":1,"prompts":1,"exercises":5,"questions":9,"solutions":[{"kind":"q","n":1,"ask":"<p>What is data science for economists, and who uses it?<\/p>\n","answer":"<p>Data science for economists applies statistical and computational methods to economic questions, so that decisions rest on evidence. It is used by firms (for example, to plan production for an export market), by governments and policy advisers (for example, to decide whether to subsidise a factory), and by researchers and central banks.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Name the three basic functions of data science and give an example of each.<\/p>\n","answer":"<ul>\n<li><strong>Describing:<\/strong> a chart of a country's exports by product shows what its economy sells.<\/li>\n<li><strong>Informing decisions:<\/strong> the World Bank's study of North Macedonia's free zones tells a minister what the incentives cost and what they delivered.<\/li>\n<li><strong>Predicting:<\/strong> a firm forecasts next year's demand so that it can plan production.<\/li>\n<\/ul>\n<p>Any examples are fine if the first summarises what is, the second supports a choice, and the third estimates something not yet known.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>In the solar panel example, why could falling import values be misleading?<\/p>\n","answer":"<p>Value equals price times quantity, so value can fall because prices fall even when more panels are shipped. This is what the data show: in 2024 UK imports fell 24 percent by value but rose 23 percent by weight, and the value of a tonne fell from about US$6,000 in 2022 to about US$2,900 in 2024. A firm reading only the value would wrongly conclude that demand had collapsed.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Which methods from this book would you use to advise on a factory subsidy, and in what order?<\/p>\n","answer":"<p>First use <strong>descriptive analysis<\/strong> (Chapter 5) to measure the structure of the industries already in the zone, with a <strong>treemap<\/strong> (Chapter 4) to display it. This shows what gaps the factory could fill. Then use <strong>logistic regression<\/strong> (Chapter 10) to estimate the probability that the investment succeeds. Recommend the subsidy only if the investment fills a gap and the probability of success is high.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>How did John Graunt estimate London's population from the Bills of Mortality, and why did he estimate it in three different ways?<\/p>\n","answer":"<p>He had no list of residents, so he reasoned from the christenings. About 12,000 children were christened a year. If a woman aged 16 to 40 has a child about every two years, there were about 24,000 such women. Assuming twice as many families, that gives 48,000 families, and at about eight people per family, 384,000 people. Each step rested on an assumption, so he checked the result in two other ways, from the number of burials and from a map of houses, and both gave about 380,000. Agreement between independent methods made the estimate believable, and it showed that London had well under half a million people, not a million.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>What did Simon Kuznets's estimates show about the US economy between 1929 and 1932? Why did income paid out fall less than income produced?<\/p>\n","answer":"<p>National income produced fell from US$83.0 billion in 1929 to US$39.4 billion in 1932, by more than half, while prices fell by about 20 percent, so part of the fall was in prices. Income paid out fell by only about 40 percent because businesses kept paying wages and dividends that they were no longer earning: by 1932 they were running losses of US$9.5 billion a year.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>According to the World Bank study, was North Macedonia's free-zone policy a success? Explain why your answer depends on the goal.<\/p>\n","answer":"<p>It depends on the goal. If the goal is <strong>jobs<\/strong>, the policy looks expensive: about US$17,000 of tax given up per job-year, roughly three times an annual manufacturing wage. If the goal is <strong>exports and investment<\/strong>, it looks much better: zone firms produced 42 percent of exports in 2020 with about 3 percent of employment, and each dollar of incentives was associated with US$20 of investment and US$38 of exports. Statistics show what each choice costs, but they do not choose the goal.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>What three questions should you ask before using a statistic?<\/p>\n","answer":"<p>Who produced it? What exactly does it measure? What would make it change?<\/p>\n"},{"kind":"q","n":9,"ask":"<p>What are chatbots good at in data analysis, and what are they unreliable at? Describe the five steps of the working loop.<\/p>\n","answer":"<p>Chatbots are <strong>good at<\/strong> first drafts of code, explaining code or error messages, suggesting a suitable method and tidying rough notes into clear text. They are <strong>unreliable at<\/strong> recalling specific statistics, citing sources and judging whether a result makes economic sense.<\/p>\n<p>The working loop is: <strong>describe<\/strong> your data, units and aim; <strong>generate<\/strong> code or an explanation one step at a time; <strong>run<\/strong> it yourself on the real data; <strong>check<\/strong> the result against something you know independently; and <strong>explain<\/strong> what the code does and what the result means.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: Find a number at its source.<\/strong> Find North Macedonia's latest annual unemployment rate in the Eurostat database (dataset <code>une_rt_a<\/code>) and in the publications of the State Statistical Office. Do the two match? Write down the exact definition, year and population covered by each.<\/p>\n","answer":"<p>In Eurostat's <code>une_rt_a<\/code>, for ages 15 to 74, as a percentage of the labour force, North Macedonia's rate was <strong>13.1 percent in 2023, 12.3 percent in 2024 and 11.5 percent in 2025<\/strong> (downloaded 10 November 2026; figures can be revised).<\/p>\n<pre><code class=\"language-r\">url &lt;- paste0(&quot;https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0/data/dataflow/ESTAT/&quot;,\n              &quot;une_rt_a/1.0?format=csvdata&amp;compress=false&quot;,\n              &quot;&amp;c[geo]=MK&amp;c[age]=Y15-74&amp;c[sex]=T&amp;c[unit]=PC_ACT&quot;)\nu &lt;- read.csv(url)\ntail(u[, c(&quot;geo&quot;, &quot;age&quot;, &quot;unit&quot;, &quot;TIME_PERIOD&quot;, &quot;OBS_VALUE&quot;)], 4)\n<\/code><\/pre>\n<p>The State Statistical Office publishes the Labour Force Survey from which this figure comes, so the two should be very close. Any difference is usually due to the age group (for example, 15 and over against 15 to 74) or to rounding and revisions. Your answer should state the definition (unemployed as a share of the labour force), the year and the age group for each source.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Who produces the figure?<\/strong> Find a statistic in a news article from the past month. Identify who produced it and what exactly it measures, and suggest what could change its value without any change in the real economy.<\/p>\n","answer":"<p>There is no single answer. A good response names the original producer rather than the newspaper, and states exactly what is measured, including the units, period and population. Examples of changes unrelated to the real economy are a new survey method, a change in definition, a revised population estimate, a rebased price index, or a change in the sample.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: Your own export decision.<\/strong> Choose a product that North Macedonia exports and look it up in UN Comtrade or the Observatory of Economic Complexity (oec.world). Which are the three largest markets? If one of them introduced a tariff, what further data would you need before changing your production plan?<\/p>\n","answer":"<p>The answer depends on the product you choose. Report the three largest markets with the year and whether figures are values or quantities. Before changing production, you would want the size of the tariff and which products it covers; how much of the market your competitors supply and whether they face the same tariff; how sensitive buyers are to price; quantities as well as values; and how easily you could sell elsewhere.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: Write the memo.<\/strong> Using the four bullet points in the free-zone box, write a recommendation of about 150 words to a minister on whether to continue the incentives. State your goal explicitly, and name one further piece of evidence you would want.<\/p>\n","answer":"<p>There is more than one good memo. Here is an example.<\/p>\n<blockquote>\n<p>Minister, if the main goal is employment, I recommend reducing the incentives. Each job-year costs about US$17,000 in forgone tax, roughly three times an annual manufacturing wage, and zone firms provide only about 3 percent of employment. If the main goal is exports and investment, the policy has delivered more: zone firms produced 42 percent of exports in 2020, and each dollar of incentives was associated with US$20 of investment and US$38 of exports. However, tax costs have risen from 1.3 percent of tax revenue in 2011 to about 5 percent. I recommend keeping support only where firms create measurable links with domestic suppliers. Before deciding, I would want evidence on how much of this activity would have come without the incentives.<\/p>\n<\/blockquote>\n<p>The essential features are an explicitly stated goal, evidence on both sides and one specific further piece of evidence.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5 (AI): Test the chatbot.<\/strong> Ask an AI chatbot for North Macedonia's unemployment rate in 2023 and for its source. Then find the figure in Eurostat (Exercise 1). Did the chatbot's number match? Did the source it named exist? Now use the &quot;Interrogating a statistic&quot; prompt on the same figure, and write three sentences on what the chatbot did well and what it got wrong.<\/p>\n","answer":"<p>Use the Eurostat figure of <strong>13.1 percent for 2023<\/strong> as your benchmark. Results vary between chatbots, so what matters is your comparison. Good answers state whether the number matched, whether the named source exists and contains that figure, and whether the definition (age group, year) was given. A good critique might note that the chatbot explained the definition well, gave a number without a checkable link, or named a real institution but the wrong dataset.<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што е науката за податоци за економисти и кој ја користи?<\/p>\n","answer":"<p>Науката за податоци за економисти применува статистички и пресметковни методи врз економски прашања, за одлуките да се темелат на докази. Ја користат фирмите (на пример, за да планираат производство за извозен пазар), владите и советниците за политики (на пример, за да одлучат дали да субвенционираат фабрика), како и истражувачите и централните банки.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Наведете ги трите основни функции на науката за податоци и дајте пример за секоја.<\/p>\n","answer":"<ul>\n<li><strong>Опишување:<\/strong> график на извозот на една држава по производи покажува што продава нејзината економија.<\/li>\n<li><strong>Информирање на одлуките:<\/strong> студијата на Светската банка за слободните зони во Северна Македонија му кажува на министерот колку чинат поттикнувањата и што донеле.<\/li>\n<li><strong>Предвидување:<\/strong> фирма ја прогнозира побарувачката за следната година за да може да го планира производството.<\/li>\n<\/ul>\n<p>Секој пример е добар ако првиот го резимира она што постои, вториот поддржува избор, а третиот проценува нешто што сè уште не е познато.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Во примерот со соларните панели, зошто намалувањето на вредноста на увозот може да доведе во заблуда?<\/p>\n","answer":"<p>Вредноста е еднаква на цената помножена со количината, па вредноста може да падне поради пад на цените дури и кога се испорачуваат повеќе панели. Токму тоа го покажуваат податоците: во 2024 увозот во Обединетото Кралство падна за 24 проценти според вредноста, но порасна за 23 проценти според тежината, а вредноста на еден тон падна од околу US$6,000 во 2022 на околу US$2,900 во 2024. Фирма што ја чита само вредноста погрешно би заклучила дека побарувачката се урнала.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Кои методи од оваа книга би ги користеле за советување за субвенција за фабрика и по кој редослед?<\/p>\n","answer":"<p>Прво користете <strong>дескриптивна анализа<\/strong> (Поглавје 5) за да ја измерите структурата на индустриите што веќе се во зоната, со <strong>дрвовидна карта (treemap)<\/strong> (Поглавје 4) за да ја прикажете. Така се гледа кои празнини може да ги пополни фабриката. Потоа користете <strong>логистичка регресија<\/strong> (Поглавје 10) за да ја процените веројатноста инвестицијата да успее. Препорачајте ја субвенцијата само ако инвестицијата пополнува празнина и веројатноста за успех е висока.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Како Џон Граунт го процени населението на Лондон од Билтените за смртност и зошто го процени на три различни начини?<\/p>\n","answer":"<p>Немаше список на жители, па расудуваше од крштевањата. Годишно се крштеваа околу 12,000 деца. Ако жена на возраст од 16 до 40 години раѓа дете приближно на секои две години, имало околу 24,000 такви жени. Со претпоставка за двојно повеќе семејства, тоа дава 48,000 семејства, а со околу осум лица по семејство, 384,000 луѓе. Секој чекор се потпираше на претпоставка, па резултатот го провери на уште два начина, од бројот на погреби и од карта на куќите, и двата дадоа околу 380,000. Согласноста меѓу независните методи ја направи процената веродостојна и покажа дека Лондон имал многу помалку од половина милион жители, а не милион.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Што покажаа процените на Сајмон Кузнец за економијата на САД меѓу 1929 и 1932 година? Зошто исплатениот доход падна помалку од произведениот?<\/p>\n","answer":"<p>Произведениот национален доход падна од US$83.0 милијарди во 1929 на US$39.4 милијарди во 1932 година, за повеќе од половина, додека цените паднаа за околу 20 проценти, па дел од падот беше во цените. Исплатениот доход падна само за околу 40 проценти бидејќи претпријатијата продолжиле да исплаќаат плати и дивиденди што повеќе не ги заработувале: до 1932 година работеле со загуби од US$9.5 милијарди годишно.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Според студијата на Светската банка, дали политиката на слободни зони на Северна Македонија била успешна? Објаснете зошто вашиот одговор зависи од целта.<\/p>\n","answer":"<p>Зависи од целта. Ако целта се <strong>работните места<\/strong>, политиката изгледа скапа: околу US$17,000 неплатен данок по работно место-година, приближно три пати повеќе од годишна плата во преработувачката индустрија. Ако целта се <strong>извозот и инвестициите<\/strong>, изгледа многу подобро: фирмите во зоните произведоа 42 проценти од извозот во 2020 со околу 3 проценти од вработеноста, а секој долар поттикнувања беше поврзан со US$20 инвестиции и US$38 извоз. Статистиката покажува колку чини секој избор, но не ја избира целта.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Кои три прашања треба да ги поставите пред да употребите некој статистички показател?<\/p>\n","answer":"<p>Кој го произвел? Што точно мери? Што би предизвикало да се промени?<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Во што се добри четботовите при анализа на податоци, а во што се несигурни? Опишете ги петте чекори од работниот циклус.<\/p>\n","answer":"<p>Четботите се <strong>добри<\/strong> за први нацрти на код, објаснување на код или пораки за грешки, предлагање соодветен метод и средување груби белешки во јасен текст. Тие се <strong>несигурни<\/strong> при присетување конкретни статистички податоци, наведување извори и проценување дали резултатот има економска смисла.<\/p>\n<p>Работниот циклус е: <strong>опишете<\/strong> ги податоците, единиците и целта; <strong>генерирајте<\/strong> код или објаснување чекор по чекор; <strong>извршете<\/strong> го сами врз вистинските податоци; <strong>проверете<\/strong> го резултатот со нешто што го знаете независно; и <strong>објаснете<\/strong> што прави кодот и што значи резултатот.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Најдете бројка кај нејзиниот извор.<\/strong> Најдете ја најновата годишна стапка на невработеност во Северна Македонија во базата на податоци на Eurostat (податочно множество <code>une_rt_a<\/code>) и во публикациите на Државниот завод за статистика. Дали двете се совпаѓаат? Запишете ги точната дефиниција, годината и опфатената популација (population) за секоја од нив.<\/p>\n","answer":"<p>Во <code>une_rt_a<\/code> на Eurostat, за возраст од 15 до 74 години, како процент од работната сила, стапката на Северна Македонија беше <strong>13.1 проценти во 2023, 12.3 проценти во 2024 и 11.5 проценти во 2025<\/strong> (преземено на 10 ноември 2026; бројките може да се ревидираат).<\/p>\n<pre><code class=\"language-r\">url &lt;- paste0(&quot;https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0/data/dataflow/ESTAT/&quot;,\n              &quot;une_rt_a/1.0?format=csvdata&amp;compress=false&quot;,\n              &quot;&amp;c[geo]=MK&amp;c[age]=Y15-74&amp;c[sex]=T&amp;c[unit]=PC_ACT&quot;)\nu &lt;- read.csv(url)\ntail(u[, c(&quot;geo&quot;, &quot;age&quot;, &quot;unit&quot;, &quot;TIME_PERIOD&quot;, &quot;OBS_VALUE&quot;)], 4)\n<\/code><\/pre>\n<p>Државниот завод за статистика ја објавува Анкетата за работната сила од која потекнува оваа бројка, па двете треба да бидат многу блиски. Секоја разлика обично се должи на возрасната група (на пример, 15 и повеќе наспроти 15 до 74) или на заокружување и ревизии. Вашиот одговор треба да ги наведе дефиницијата (невработени како удел во работната сила), годината и возрасната група за секој извор.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Кој го произведува податокот?<\/strong> Најдете статистички показател во новинарска статија од изминатиот месец. Утврдете кој го произвел и што точно мери и предложете што би можело да ја промени неговата вредност без никаква промена во реалната економија.<\/p>\n","answer":"<p>Нема единствен одговор. Добриот одговор го именува изворниот производител, а не весникот, и наведува точно што се мери, вклучувајќи ги единиците, периодот и популацијата. Примери за промени неповрзани со реалната економија се нов метод на анкетирање, промена на дефиницијата, ревидирана проценка на населението, индекс на цени со нова базна година или промена на примерокот.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Ваша извозна одлука.<\/strong> Изберете производ што Северна Македонија го извезува и побарајте го во UN Comtrade или во Опсерваторијата за економска комплексност (Observatory of Economic Complexity; oec.world). Кои се трите најголеми пазари? Ако еден од нив воведе царина, кои дополнителни податоци би ви биле потребни пред да го промените производствениот план?<\/p>\n","answer":"<p>Одговорот зависи од производот што ќе го изберете. Наведете ги трите најголеми пазари со годината и дали бројките се вредности или количини. Пред да го промените производството, би сакале да знаете колкава е царината и кои производи ги опфаќа; колкав дел од пазарот го снабдуваат вашите конкуренти и дали се соочуваат со истата царина; колку купувачите се чувствителни на цената; количините, а не само вредностите; и колку лесно би можеле да продавате на друго место.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Напишете го меморандумот.<\/strong> Користејќи ги четирите точки во рамката за слободните зони, напишете препорака од околу 150 зборови до министер за тоа дали да продолжат поттикнувањата. Јасно наведете ја вашата цел и посочете еден дополнителен доказ што би сакале да го имате.<\/p>\n","answer":"<p>Има повеќе добри белешки. Еве еден пример.<\/p>\n<blockquote>\n<p>Господине министере, ако главната цел е вработеноста, препорачувам намалување на поттикнувањата. Секое работно место-година чини околу US$17,000 неплатен данок, приближно три пати повеќе од годишна плата во преработувачката индустрија, а фирмите во зоните обезбедуваат само околу 3 проценти од вработеноста. Ако главната цел се извозот и инвестициите, политиката дала повеќе: фирмите во зоните произведоа 42 проценти од извозот во 2020, а секој долар поттикнувања беше поврзан со US$20 инвестиции и US$38 извоз. Сепак, даночните трошоци пораснаа од 1.3 проценти од даночните приходи во 2011 на околу 5 проценти. Препорачувам поддршката да се задржи само таму каде што фирмите создаваат мерливи врски со домашни добавувачи. Пред да одлучам, би сакал докази за тоа колкав дел од оваа активност би настанал и без поттикнувањата.<\/p>\n<\/blockquote>\n<p>Суштинските елементи се јасно наведена цел, докази и за двете страни и еден конкретен дополнителен доказ.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5 (AI): Тестирајте го четботот.<\/strong> Прашајте четбот со вештачка интелигенција за стапката на невработеност во Северна Македонија во 2023 година и за нејзиниот извор. Потоа најдете ја бројката во Eurostat (Вежба 1). Дали бројката на четботот се совпадна? Дали изворот што го наведе постоеше? Сега употребете го барањето „Преиспитување статистички показател“ за истата бројка и напишете три реченици за тоа што четботот направил добро, а што погрешил.<\/p>\n","answer":"<p>Користете ја бројката на Eurostat од <strong>13.1 проценти за 2023<\/strong> како репер. Резултатите се разликуваат меѓу четботите, па важна е вашата споредба. Добрите одговори наведуваат дали бројката се совпаднала, дали именуваниот извор постои и ја содржи таа бројка и дали е дадена дефиницијата (возрасна група, година). Добра критика може да забележи дека четботот добро ја објаснил дефиницијата, дал бројка без врска што може да се провери или именувал вистинска институција, но погрешно податочно множество.<\/p>\n"}],"title_mk":"Зошто наука за податоци за економисти?","part_mk":"I. Основи","check":{"status":"Reproduced","seconds":0.9,"book_lines":0,"matched":0,"message":""},"zip_kb":7},{"number":2,"title":"Introduction to R","part":"I. Foundations","folder":"ch02-intro-r","has_code":true,"code_lines":36,"datasets":[],"packages":["dplyr","ggplot2","knitr","moments","scales"],"figures":9,"tables":0,"stories":2,"closers":1,"prompts":2,"exercises":9,"questions":17,"solutions":[{"kind":"q","n":1,"ask":"<p>What are the steps for installing R and RStudio? Why must R be installed before RStudio?<\/p>\n","answer":"<p>Download and install <strong>R<\/strong> first, from CRAN, choosing the version for your operating system. Then download and install <strong>RStudio<\/strong>. R is the language that performs the calculations, while RStudio is a working environment built on top of it, so RStudio cannot do anything without R already on the computer.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>How do you create a new R script in RStudio?<\/p>\n","answer":"<p>Choose File, then New File, then R Script. A new section opens for writing code. Save it with File, then Save As, which creates a file ending in <code>.R<\/code>.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>How would you define a variable in R and carry out arithmetic operations with it?<\/p>\n","answer":"<p>Use the assignment symbol <code>&lt;-<\/code>, then use the variable's name in calculations:<\/p>\n<pre><code class=\"language-r\">x &lt;- 4\ny &lt;- 5\nz &lt;- x + y\nz        # 9\n<\/code><\/pre>\n"},{"kind":"q","n":4,"ask":"<p>What is the purpose of functions in R?<\/p>\n","answer":"<p>A function takes one or more inputs, called arguments, and returns an output. Functions let us carry out a task repeatedly, with different inputs, without writing the calculation out each time. Examples are <code>mean()<\/code>, <code>sum()<\/code> and <code>sqrt()<\/code>.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Explain the process of installing and loading an R library.<\/p>\n","answer":"<p>Install the library once on each computer, with quotation marks: <code>install.packages(&quot;ggplot2&quot;)<\/code>. Load it in every session that uses it, without quotation marks: <code>library(ggplot2)<\/code>, usually at the top of the script.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>What is the main advantage of using a chatbot such as ChatGPT for programming in R?<\/p>\n","answer":"<p>It speeds up learning and working by turning a request in ordinary language into working code, and by explaining code and error messages. You must still run the code and check the result.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>What is prompting, and why is it important to make a clear and detailed request?<\/p>\n","answer":"<p>Prompting means writing clear and detailed requests to the chatbot. A precise prompt gives it the context it cannot otherwise see: its role, the task, your data, your constraints and the output you want. Vague requests produce generic answers, or answers based on wrong assumptions.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Rewrite the following request to a chatbot so that it is more effective: &quot;Help me analyse data in R.&quot;<\/p>\n","answer":"<p>Here is one good version.<\/p>\n<blockquote>\n<p>You are an expert in data analysis in R. I have a file called <code>wages.csv<\/code> with the columns <code>sector<\/code>, <code>month<\/code> and <code>net_wage<\/code>, where the wage is in denars. Please write R code using <code>dplyr<\/code> to calculate the mean and median wage for each sector, sorted from highest to lowest. Explain each line briefly.<\/p>\n<\/blockquote>\n<p>It states the role, file, columns, units, task, tools and desired output.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>What are the disadvantages of writing code only in the Console?<\/p>\n","answer":"<p>Code typed only into the Console is not saved, so it cannot be checked, shared or run again, and several lines cannot easily be run together.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>What is the working directory? Why can a script that begins with <code>setwd()<\/code> cause problems when it is shared?<\/p>\n","answer":"<p>The working directory is the folder in which R reads and saves files. A script that begins with <code>setwd()<\/code> and a personal folder path fails on anyone else's computer, because that folder does not exist there. An RStudio Project with relative paths avoids this.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>What does the argument <code>na.rm = TRUE<\/code> do? What happens without it if the data contain a missing value?<\/p>\n","answer":"<p><code>na.rm = TRUE<\/code> tells the function to ignore missing values. Without it, one <code>NA<\/code> makes the result missing: <code>mean(c(3, 5, NA))<\/code> returns <code>NA<\/code>, while <code>mean(c(3, 5, NA), na.rm = TRUE)<\/code> returns 4.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>What is the difference between a vector and a data frame?<\/p>\n","answer":"<p>A <strong>vector<\/strong> is a list of values of the same type. A <strong>data frame<\/strong> is a table with rows of observations and columns of variables, and each column can be of a different type.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>How did Thomas Herndon find the error in Reinhart and Rogoff's spreadsheet, and what does the case teach us about writing analysis as code?<\/p>\n","answer":"<p>He tried to reproduce the result for a term paper, could not, wrote to the authors and received the spreadsheet. He found that a formula meant to average across a column of countries stopped five rows short, leaving out Australia, Austria, Belgium, Canada and Denmark. He and his professors also questioned omitted years and the equal weighting of countries. A spreadsheet hides its formulas in cells, whereas code writes every step in plain text, where others can read and rerun it.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Name three ways in which code from a chatbot can be wrong even if it looks correct.<\/p>\n","answer":"<p>Any three of these: it may use a package or function that does not exist; it may use outdated code; it may misunderstand your data or units, because it cannot see your file; it may run without error but compute the wrong thing; or it may not have been run at all.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>What does a <code>.Rproj<\/code> file contain, and what happens when you double-click it?<\/p>\n","answer":"<p>It contains a few plain-text settings and no data or code. Double-clicking it opens RStudio with the working directory set to the folder that holds the file, wherever that folder is. The Files section shows that folder, and the Project's name appears at the top right.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>What is the difference between an absolute path and a relative path? Which one should a shared script use, and why?<\/p>\n","answer":"<p>An <strong>absolute path<\/strong> starts at the top of a disk and describes one computer, such as <code>C:/Users/Ana/Documents/data/gdp.csv<\/code>. A <strong>relative path<\/strong> starts from the working directory, such as <code>data/gdp.csv<\/code>. A shared script should use relative paths, because they work wherever the Project's folder is stored.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Why is it safer for R to start each session empty than to restore what was left in memory?<\/p>\n","answer":"<p>With an empty start, everything the script needs must be in the script. If R restored a variable you created by hand last week, the script might work only on your computer, and it would fail for everyone else. You would not know until someone tried it.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: Your installation.<\/strong> Install R and RStudio on your computer and take a screenshot of the RStudio interface with a script open.<\/p>\n","answer":"<p>There is nothing to calculate. A correct screenshot shows RStudio with a script open, so that the script section appears together with the Console, Environment and Files sections.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2 (AI): Your first prompt.<\/strong> Write a prompt asking a chatbot to calculate the sum of two variables, <code>x<\/code> and <code>y<\/code>, and test the code it generates in RStudio with different values of the variables.<\/p>\n","answer":"<p>A suitable prompt: &quot;You are an expert in R. Write R code that stores two numbers in variables called <code>x<\/code> and <code>y<\/code> and calculates their sum.&quot; The code should be similar to this:<\/p>\n<pre><code class=\"language-r\">x &lt;- 2\ny &lt;- 3\nx + y    # 5\n<\/code><\/pre>\n<p>Change the values and confirm the result by hand. For example, <code>x &lt;- 10<\/code> and <code>y &lt;- -4<\/code> should give 6.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: A script of your own.<\/strong> Create a script called <code>census.R<\/code> and an RStudio Project to hold it. Enter the census code from this chapter, add comments explaining each step, save it, close RStudio, reopen it and run the whole script. Then add a calculation. At the annual rate you found, what would the population be in 2031? Why might this be a poor forecast?<\/p>\n","answer":"<p>Using the annual rate of −0.506 percent, the projected population in 2031 is about <strong>1,745,867<\/strong>.<\/p>\n<pre><code class=\"language-r\">pop_2002 &lt;- 2022547\npop_2021 &lt;- 1836713\nannual_rate &lt;- ((pop_2021 / pop_2002)^(1 / 19) - 1) * 100   # -0.506\npop_2031 &lt;- pop_2021 * (1 + annual_rate / 100)^10\npop_2031   # 1745867\n<\/code><\/pre>\n<p>It may be a poor forecast because it assumes that the average rate of the past 19 years will continue unchanged. Emigration and fertility can change, and policies or economic conditions can alter them. The two censuses also treat people living abroad differently, so the change may partly reflect definitions.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: Functions on real numbers.<\/strong> Create a vector with North Macedonia's population in the censuses of 1981 (1,909,136), 1991 (2,033,964), 1994 (1,945,932), 2002 and 2021. Use <code>mean()<\/code>, <code>min()<\/code>, <code>max()<\/code> and <code>diff()<\/code> on it. What does <code>diff()<\/code> do? Look it up with <code>?diff<\/code>, and say which change between censuses was largest. Then find out why a further census was held only three years after the one in 1991, and explain why the change between those two counts should be read with care.<\/p>\n","answer":"<pre><code class=\"language-r\">census &lt;- c(1909136, 2033964, 1945932, 2022547, 1836713)\nmean(census)   # 1949658\nmin(census)    # 1836713\nmax(census)    # 2033964\ndiff(census)   # 124828  -88032  76615  -185834\n<\/code><\/pre>\n<p><code>diff()<\/code> returns the change from each value to the next. The largest change is the fall of <strong>185,834<\/strong> between 2002 and 2021, although that covers 19 years. The fall of 88,032 occurred in just three years.<\/p>\n<p>A further census was held in 1994 because the 1991 count was disputed, with many ethnic Albanians boycotting it, so part of that figure was estimated. The 1994 census was carried out with international observation. The counts also differed in how they treated people living abroad. So the change between 1991 and 1994 reflects differences in measurement as well as any real change in population.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: A data frame.<\/strong> Extend the <code>balkans<\/code> data frame with the mean income of each country: 6,934 for Albania, 9,868 for Montenegro, 8,158 for North Macedonia and 8,691 for Serbia. Add a new column with the ratio of mean to median income, using the <code>$<\/code> sign. Which country has the highest ratio? Compare your answer with the chart in Chapter 5.<\/p>\n","answer":"<pre><code class=\"language-r\">balkans &lt;- data.frame(\n  country = c(&quot;Albania&quot;, &quot;Montenegro&quot;, &quot;North Macedonia&quot;, &quot;Serbia&quot;),\n  median_income = c(6174, 9167, 7609, 7752)\n)\nbalkans$mean_income &lt;- c(6934, 9868, 8158, 8691)\nbalkans$ratio &lt;- balkans$mean_income / balkans$median_income\nbalkans\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">Ratio of mean to median<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Albania<\/td>\n<td align=\"right\">1.123<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Montenegro<\/td>\n<td align=\"right\">1.076<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">North Macedonia<\/td>\n<td align=\"right\">1.072<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Serbia<\/td>\n<td align=\"right\">1.121<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Albania<\/strong> has the highest ratio, closely followed by Serbia. A mean well above the median suggests that a few high incomes pull up the average.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6 (AI): Break it and fix it.<\/strong> Type <code>mean(c(3, 5, 7)<\/code>, leaving out the last bracket. Then try <code>Mean(c(3, 5, 7))<\/code> and <code>library(ggplott2)<\/code>. Read each message R gives you and write down what you think it means. Then use the &quot;Ask it to find the error&quot; prompt and compare its explanation with yours.<\/p>\n","answer":"<ul>\n<li><code>mean(c(3, 5, 7)<\/code> leaves R waiting for a closing bracket. In the Console you see a <code>+<\/code> prompt, and in a script R reports an unexpected end of input.<\/li>\n<li><code>Mean(c(3, 5, 7))<\/code> gives <code>could not find function &quot;Mean&quot;<\/code>, because R is case-sensitive and the function is called <code>mean<\/code>.<\/li>\n<li><code>library(ggplott2)<\/code> gives <code>there is no package called 'ggplott2'<\/code>, because the name is misspelt.<\/li>\n<\/ul>\n<p>Compare your own reading with the chatbot's. It should identify each cause and propose only the smallest fix.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7 (AI): Test what it knows.<\/strong> Ask a chatbot to write R code that downloads North Macedonia's GDP from Eurostat. Run it. Did the package and the dataset code it used exist? Did it work the first time? Keep a note of what you had to change. You will return to this in Chapter 3.<\/p>\n","answer":"<p>Results vary. Record whether the package exists (<code>eurostat<\/code> does), whether the dataset code is real, and whether the code ran the first time. Common faults are invented dataset codes, the wrong unit and outdated filter names. GDP in Eurostat is found in <code>nama_10_gdp<\/code>, which you can use to check its answer. You will return to this in Chapter 3.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8: A Project that moves.<\/strong> Create an RStudio Project called <code>moving-test<\/code>, with a folder inside it called <code>data<\/code>. Write a script that makes a small data frame, saves it with <code>write.csv(my_data, &quot;data/test.csv&quot;, row.names = FALSE)<\/code> and reads it back with <code>read.csv(&quot;data/test.csv&quot;)<\/code>. Close RStudio and move the whole folder somewhere else, such as onto your desktop. Reopen the Project by double-clicking its <code>.Rproj<\/code> file and run the script again. What does <code>getwd()<\/code> show now, and why does the script still work? Open the <code>.Rproj<\/code> file in Notepad and identify each setting.<\/p>\n","answer":"<p><code>getwd()<\/code> now shows the new location, for example your desktop followed by <code>moving-test<\/code>. The script still works because <code>&quot;data/test.csv&quot;<\/code> is relative to the working directory, and the Project sets that directory automatically when you open it.<\/p>\n<p>In the <code>.Rproj<\/code> file: <code>Version<\/code> is the file format; <code>RestoreWorkspace<\/code>, <code>SaveWorkspace<\/code> and <code>AlwaysSaveHistory<\/code> control whether RStudio restores or keeps what was left in memory or typed; and <code>Encoding: UTF-8<\/code> fixes how letters are stored. A Project you create yourself may list a few additional options.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Exercise 9 (AI): Remove the absolute path.<\/strong> Ask a chatbot to write R code that reads a CSV file from your computer. Did its answer include <code>setwd()<\/code> or an invented folder such as <code>C:/path/to/<\/code>? Ask it to rewrite the code for an RStudio Project, using only a relative path. Run the new version from inside the Project from Exercise 8, and check that it reads the right file by comparing the number of rows.<\/p>\n","answer":"<p>Many chatbots will include <code>setwd()<\/code> or a made-up folder such as <code>C:/path/to/<\/code> unless told otherwise. The rewritten code should be close to this:<\/p>\n<pre><code class=\"language-r\">my_data &lt;- read.csv(&quot;data/test.csv&quot;)\nnrow(my_data)\n<\/code><\/pre>\n<p>Confirm that <code>nrow()<\/code> equals the number of rows you created in Exercise 8. If the chatbot still includes <code>setwd()<\/code>, tell it that the code will run inside an RStudio Project and ask again.<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Кои се чекорите за инсталирање R и RStudio? Зошто R мора да се инсталира пред RStudio?<\/p>\n","answer":"<p>Прво преземете го и инсталирајте го <strong>R<\/strong> од CRAN, избирајќи ја верзијата за вашиот оперативен систем. Потоа преземете го и инсталирајте го <strong>RStudio<\/strong>. R е јазикот што ги извршува пресметките, а RStudio е работна околина изградена врз него, па RStudio не може да направи ништо ако R веќе не е на компјутерот.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Како создавате нова R скрипта во RStudio?<\/p>\n","answer":"<p>Изберете File, потоа New File, потоа R Script. Се отвора нов дел за пишување код. Зачувајте го со File, потоа Save As, со што се создава датотека што завршува на <code>.R<\/code>.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Како би дефинирале променлива во R и би извршувале аритметички операции со неа?<\/p>\n","answer":"<p>Користете го знакот за доделување <code>&lt;-<\/code>, а потоа користете го името на променливата во пресметките:<\/p>\n<pre><code class=\"language-r\">x &lt;- 4\ny &lt;- 5\nz &lt;- x + y\nz        # 9\n<\/code><\/pre>\n"},{"kind":"q","n":4,"ask":"<p>Која е целта на функциите во R?<\/p>\n","answer":"<p>Функцијата зема еден или повеќе влезови, наречени аргументи, и враќа излез. Функциите ни овозможуваат повеќепати да извршиме задача, со различни влезови, без секој пат да ја испишуваме пресметката. Примери се <code>mean()<\/code>, <code>sum()<\/code> и <code>sqrt()<\/code>.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Објаснете го процесот на инсталирање и вчитување R библиотека.<\/p>\n","answer":"<p>Инсталирајте ја библиотеката еднаш на секој компјутер, со наводници: <code>install.packages(&quot;ggplot2&quot;)<\/code>. Вчитајте ја во секоја сесија во која ја користите, без наводници: <code>library(ggplot2)<\/code>, обично на врвот на скриптата.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Која е главната предност на користењето четбот како ChatGPT за програмирање во R?<\/p>\n","answer":"<p>Го забрзува учењето и работата така што барање на обичен јазик го претвора во код што работи и така што објаснува код и пораки за грешки. Сепак, вие мора да го извршите кодот и да го проверите резултатот.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Што е задавање барања и зошто е важно да се постави јасно и детално барање?<\/p>\n","answer":"<p>Пишувањето барања (prompting) значи пишување јасни и детални барања до четботот. Прецизното барање му го дава контекстот што инаку не може да го види: неговата улога, задачата, вашите податоци, вашите ограничувања и излезот што го сакате. Нејасните барања даваат општи одговори или одговори засновани на погрешни претпоставки.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Препишете го следново барање до четбот за да биде поефективно: „Помогни ми да анализирам податоци во R.“<\/p>\n","answer":"<p>Еве една добра верзија.<\/p>\n<blockquote>\n<p>Ти си експерт за анализа на податоци во R. Имам датотека наречена <code>wages.csv<\/code> со колоните <code>sector<\/code>, <code>month<\/code> и <code>net_wage<\/code>, каде што платата е во денари. Те молам напиши R-код со <code>dplyr<\/code> за да се пресметаат просечната и медијалната плата за секој сектор, подредени од највисоката кон најниската. Објасни го накратко секој ред.<\/p>\n<\/blockquote>\n<p>Ги наведува улогата, датотеката, колоните, единиците, задачата, алатките и посакуваниот излез.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Кои се недостатоците на пишувањето код само во конзолата?<\/p>\n","answer":"<p>Кодот внесен само во конзолата не се зачувува, па не може да се провери, сподели или повторно изврши, а неколку редови не може лесно да се извршат заедно.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Што е работен директориум? Зошто скрипта што почнува со <code>setwd()<\/code> може да предизвика проблеми кога се споделува?<\/p>\n","answer":"<p>Работната папка е папката во која R чита и зачувува датотеки. Скрипта што почнува со <code>setwd()<\/code> и патека до лична папка не работи на туѓ компјутер, бидејќи таа папка таму не постои. Проект во RStudio со релативни патеки го избегнува ова.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Што прави аргументот <code>na.rm = TRUE<\/code>? Што се случува без него ако податоците содржат недостасувачка вредност?<\/p>\n","answer":"<p><code>na.rm = TRUE<\/code> ѝ кажува на функцијата да ги игнорира недостасувачките вредности. Без него, еден <code>NA<\/code> го прави резултатот недостасувачки: <code>mean(c(3, 5, NA))<\/code> враќа <code>NA<\/code>, додека <code>mean(c(3, 5, NA), na.rm = TRUE)<\/code> враќа 4.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Која е разликата меѓу вектор и податочна рамка?<\/p>\n","answer":"<p><strong>Вектор<\/strong> е листа од вредности од ист тип. <strong>Податочна рамка (data frame)<\/strong> е табела со редови набљудувања и колони променливи, а секоја колона може да биде од различен тип.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Како Томас Херндон ја открил грешката во електронската табела на Рајнхарт и Рогоф и што нè учи тој случај за запишувањето анализа како код?<\/p>\n","answer":"<p>Се обиде да го репродуцира резултатот за семинарска работа, не успеа, им пиша на авторите и ја доби табелата. Откри дека формула наменета за просек низ колона со држави завршувала пет реда порано, изоставувајќи ги Австралија, Австрија, Белгија, Канада и Данска. Тој и неговите професори ги доведоа во прашање и изоставените години и еднаквото пондерирање на државите. Табеларната пресметка ги крие формулите во ќелиите, додека кодот го запишува секој чекор како обичен текст, каде што другите можат да го прочитаат и повторно да го извршат.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Наведете три начини на кои код од четбот може да биде погрешен дури и кога изгледа точен.<\/p>\n","answer":"<p>Кои било три од овие: може да користи пакет или функција што не постои; може да користи застарен код; може погрешно да ги разбере вашите податоци или единици, бидејќи не може да ја види вашата датотека; може да се изврши без грешка, но да пресмета погрешно нешто; или воопшто да не бил извршен.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Што содржи датотеката <code>.Rproj<\/code> и што се случува кога двапати ќе кликнете на неа?<\/p>\n","answer":"<p>Содржи неколку поставки како обичен текст, без податоци и без код. Со двоен клик се отвора RStudio со работна папка поставена на папката во која се наоѓа датотеката, каде и да е таа. Делот Files ја прикажува таа папка, а името на проектот се појавува горе десно.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Која е разликата меѓу апсолутна и релативна патека? Која треба да ја користи скрипта што се споделува и зошто?<\/p>\n","answer":"<p><strong>Апсолутна патека<\/strong> почнува од врвот на дискот и опишува еден компјутер, на пример <code>C:/Users/Ana/Documents/data/gdp.csv<\/code>. <strong>Релативна патека<\/strong> почнува од работната папка, на пример <code>data/gdp.csv<\/code>. Споделена скрипта треба да користи релативни патеки, бидејќи тие работат каде и да е зачувана папката на проектот.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Зошто е побезбедно R да ја започне секоја сесија празна отколку да го обнови она што останало во меморијата?<\/p>\n","answer":"<p>Со празен почеток, сè што ѝ е потребно на скриптата мора да биде во скриптата. Ако R врати променлива што сте ја создале рачно минатата недела, скриптата можеби би работела само на вашиот компјутер, а за сите други не би работела. Не би знаеле сè додека некој не ја проба.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Вашата инсталација.<\/strong> Инсталирајте R и RStudio на вашиот компјутер и направете снимка од екранот на интерфејсот на RStudio со отворена скрипта.<\/p>\n","answer":"<p>Нема што да се пресмета. Точна слика од екранот го прикажува RStudio со отворена скрипта, така што делот за скрипта се гледа заедно со деловите Console, Environment и Files.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2 (AI): Вашето прво барање.<\/strong> Напишете барање со кое барате од четбот да го пресмета збирот на две променливи, <code>x<\/code> и <code>y<\/code>, и тестирајте го кодот што го генерира во RStudio со различни вредности на променливите.<\/p>\n","answer":"<p>Соодветно барање: „Ти си експерт за R. Напиши R-код што зачувува два броја во променливи наречени <code>x<\/code> и <code>y<\/code> и го пресметува нивниот збир.“ Кодот треба да биде сличен на овој:<\/p>\n<pre><code class=\"language-r\">x &lt;- 2\ny &lt;- 3\nx + y    # 5\n<\/code><\/pre>\n<p>Променете ги вредностите и потврдете го резултатот рачно. На пример, <code>x &lt;- 10<\/code> и <code>y &lt;- -4<\/code> треба да дадат 6.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Ваша сопствена скрипта.<\/strong> Создајте скрипта наречена <code>census.R<\/code> и проект во RStudio во кој ќе ја сместите. Внесете го кодот за пописот од ова поглавје, додајте коментари што го објаснуваат секој чекор, зачувајте го, затворете го RStudio, отворете го повторно и извршете ја целата скрипта. Потоа додајте пресметка. При годишната стапка што ја најдовте, колкаво би било населението во 2031 година? Зошто ова би можело да биде лоша прогноза?<\/p>\n","answer":"<p>Со годишна стапка од −0.506 проценти, проектираното население во 2031 е околу <strong>1,745,867<\/strong>.<\/p>\n<pre><code class=\"language-r\">pop_2002 &lt;- 2022547\npop_2021 &lt;- 1836713\nannual_rate &lt;- ((pop_2021 / pop_2002)^(1 / 19) - 1) * 100   # -0.506\npop_2031 &lt;- pop_2021 * (1 + annual_rate / 100)^10\npop_2031   # 1745867\n<\/code><\/pre>\n<p>Може да биде лоша прогноза бидејќи претпоставува дека просечната стапка од изминатите 19 години ќе продолжи непроменета. Емиграцијата и плодноста може да се променат, а политиките или економските услови може да влијаат врз нив. Двата пописа различно ги третираат и луѓето што живеат во странство, па промената делумно може да ги одразува дефинициите.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Функции врз вистински бројки.<\/strong> Создајте вектор со населението на Северна Македонија во пописите од 1981 (1,909,136), 1991 (2,033,964), 1994 (1,945,932), 2002 и 2021 година. Применете ги <code>mean()<\/code>, <code>min()<\/code>, <code>max()<\/code> и <code>diff()<\/code> врз него. Што прави <code>diff()<\/code>? Побарајте го со <code>?diff<\/code> и кажете која промена меѓу пописите била најголема. Потоа дознајте зошто бил одржан уште еден попис само три години по оној од 1991 година и објаснете зошто промената меѓу тие две пребројувања треба внимателно да се толкува.<\/p>\n","answer":"<pre><code class=\"language-r\">census &lt;- c(1909136, 2033964, 1945932, 2022547, 1836713)\nmean(census)   # 1949658\nmin(census)    # 1836713\nmax(census)    # 2033964\ndiff(census)   # 124828  -88032  76615  -185834\n<\/code><\/pre>\n<p><code>diff()<\/code> ја враќа промената од секоја вредност до следната. Најголемата промена е падот од <strong>185,834<\/strong> меѓу 2002 и 2021, иако таа опфаќа 19 години. Падот од 88,032 се случил за само три години.<\/p>\n<p>Дополнителен попис се одржа во 1994 бидејќи пребројувањето од 1991 беше оспорено, а многу етнички Албанци го бојкотираа, па дел од таа бројка беше проценет. Пописот од 1994 беше спроведен под меѓународно набљудување. Пописите се разликуваа и по тоа како ги третираа луѓето што живеат во странство. Затоа промената меѓу 1991 и 1994 ги одразува и разликите во мерењето, а не само евентуалната вистинска промена на населението.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: Податочна рамка.<\/strong> Проширете ја податочната рамка <code>balkans<\/code> со средната вредност на доходот на секоја држава: 6,934 за Албанија, 9,868 за Црна Гора, 8,158 за Северна Македонија и 8,691 за Србија. Додајте нова колона со односот меѓу средната вредност и медијаната на доходот, користејќи го знакот <code>$<\/code>. Која држава има највисок однос? Споредете го вашиот одговор со графиконот во Поглавје 5.<\/p>\n","answer":"<pre><code class=\"language-r\">balkans &lt;- data.frame(\n  country = c(&quot;Albania&quot;, &quot;Montenegro&quot;, &quot;North Macedonia&quot;, &quot;Serbia&quot;),\n  median_income = c(6174, 9167, 7609, 7752)\n)\nbalkans$mean_income &lt;- c(6934, 9868, 8158, 8691)\nbalkans$ratio &lt;- balkans$mean_income / balkans$median_income\nbalkans\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">Сооднос на средната вредност и медијаната<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Албанија<\/td>\n<td align=\"right\">1.123<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Црна Гора<\/td>\n<td align=\"right\">1.076<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Северна Македонија<\/td>\n<td align=\"right\">1.072<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Србија<\/td>\n<td align=\"right\">1.121<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Албанија<\/strong> има највисок сооднос, а веднаш по неа е Србија. Средна вредност значително над медијаната укажува дека неколку високи приходи го влечат просекот нагоре.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6 (AI): Расипете го и поправете го.<\/strong> Впишете <code>mean(c(3, 5, 7)<\/code>, изоставајќи ја последната заграда. Потоа испробајте ги <code>Mean(c(3, 5, 7))<\/code> и <code>library(ggplott2)<\/code>. Прочитајте ја секоја порака што ви ја дава R и запишете што мислите дека значи. Потоа употребете го барањето „Побарајте да ја најде грешката“ и споредете го неговото објаснување со вашето.<\/p>\n","answer":"<ul>\n<li><code>mean(c(3, 5, 7)<\/code> го остава R да чека затворачка заграда. Во конзолата гледате знак <code>+<\/code>, а во скрипта R пријавува неочекуван крај на влезот.<\/li>\n<li><code>Mean(c(3, 5, 7))<\/code> дава <code>could not find function &quot;Mean&quot;<\/code>, бидејќи R ги разликува големите и малите букви, а функцијата се вика <code>mean<\/code>.<\/li>\n<li><code>library(ggplott2)<\/code> дава <code>there is no package called 'ggplott2'<\/code>, бидејќи името е погрешно напишано.<\/li>\n<\/ul>\n<p>Споредете го вашето читање со она на четботот. Тој треба да ја препознае секоја причина и да ја предложи само најмалата поправка.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7 (AI): Тестирајте што знае.<\/strong> Побарајте од четбот да напише R код што го презема БДП на Северна Македонија од Eurostat. Извршете го. Дали постоеја пакетот и шифрата на податочното множество што ги употреби? Дали работеше од првиот обид? Забележете што моравте да промените. На ова ќе се навратите во Поглавје 3.<\/p>\n","answer":"<p>Резултатите се разликуваат. Запишете дали пакетот постои (<code>eurostat<\/code> постои), дали шифрата на податочното множество е вистинска и дали кодот се извршил од прв пат. Чести грешки се измислени шифри на податочни множества, погрешна единица и застарени имиња на филтри. БДП во Eurostat се наоѓа во <code>nama_10_gdp<\/code>, што може да го искористите за да го проверите неговиот одговор. На ова ќе се вратите во Поглавје 3.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8: Проект што се преместува.<\/strong> Создајте проект во RStudio наречен <code>moving-test<\/code>, со папка во него наречена <code>data<\/code>. Напишете скрипта што создава мала податочна рамка, ја зачувува со <code>write.csv(my_data, &quot;data/test.csv&quot;, row.names = FALSE)<\/code> и повторно ја чита со <code>read.csv(&quot;data/test.csv&quot;)<\/code>. Затворете го RStudio и преместете ја целата папка на друго место, на пример на работната површина. Повторно отворете го проектот со двојно кликнување на неговата датотека <code>.Rproj<\/code> и повторно извршете ја скриптата. Што покажува <code>getwd()<\/code> сега и зошто скриптата сè уште работи? Отворете ја датотеката <code>.Rproj<\/code> во Notepad и препознајте ја секоја поставка.<\/p>\n","answer":"<p><code>getwd()<\/code> сега ја прикажува новата локација, на пример вашата работна површина, а потоа <code>moving-test<\/code>. Скриптата и понатаму работи бидејќи <code>&quot;data/test.csv&quot;<\/code> е релативна во однос на работната папка, а проектот автоматски ја поставува таа папка кога ќе го отворите.<\/p>\n<p>Во датотеката <code>.Rproj<\/code>: <code>Version<\/code> е форматот на датотеката; <code>RestoreWorkspace<\/code>, <code>SaveWorkspace<\/code> и <code>AlwaysSaveHistory<\/code> одредуваат дали RStudio го враќа или чува она што останало во меморијата или што било внесено; а <code>Encoding: UTF-8<\/code> одредува како се зачувуваат буквите. Проект што сами ќе го создадете може да наведува уште неколку опции.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Вежба 9 (AI): Отстранете ја апсолутната патека.<\/strong> Побарајте од четбот да напише R-код што чита CSV-датотека од вашиот компјутер. Дали неговиот одговор вклучуваше <code>setwd()<\/code> или измислена папка како <code>C:/path/to/<\/code>? Побарајте да го препише кодот за проект во RStudio, користејќи само релативна патека. Извршете ја новата верзија во проектот од Вежба 8 и проверете дали ја чита вистинската датотека со споредување на бројот на редови.<\/p>\n","answer":"<p>Многу четботи ќе вклучат <code>setwd()<\/code> или измислена папка како <code>C:/path/to/<\/code>, освен ако не им кажете поинаку. Преработениот код треба да биде близу до овој:<\/p>\n<pre><code class=\"language-r\">my_data &lt;- read.csv(&quot;data/test.csv&quot;)\nnrow(my_data)\n<\/code><\/pre>\n<p>Потврдете дека <code>nrow()<\/code> е еднакво на бројот на редови што ги создадовте во Вежба 8. Ако четботот и понатаму вклучува <code>setwd()<\/code>, кажете му дека кодот ќе се извршува во проект во RStudio и побарајте повторно.<\/p>\n"}],"title_mk":"Вовед во R","part_mk":"I. Основи","check":{"status":"Reproduced","seconds":0.7,"book_lines":26,"matched":26,"message":""},"zip_kb":4},{"number":3,"title":"Data and Working with Data","part":"I. Foundations","folder":"ch03-data","has_code":true,"code_lines":127,"datasets":["eurostat_2022_tidy.csv","fred_unrate.csv","GDP.xls","mk_net_wages_wide.csv","POP.xls","wb_gdp_2022.json","wb_pop_2022.json","wdi_2022.csv"],"packages":["dplyr","ggplot2","httr","jsonlite","knitr","moments","readxl","scales","tidyr"],"figures":4,"tables":3,"stories":2,"closers":1,"prompts":6,"exercises":12,"questions":24,"solutions":[{"kind":"q","n":1,"ask":"<p>What are data, and why are they important for analysis?<\/p>\n","answer":"<p>Data are factual information used as a basis for reasoning, discussion or calculation. They matter because conclusions about trends and decisions rest on them, and those conclusions can only be as good as the information in the original data.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>What are the main differences between quantitative and qualitative variables?<\/p>\n","answer":"<p><strong>Quantitative<\/strong> variables are numeric by nature and can take many values, such as prices, income or age. <strong>Qualitative<\/strong> variables represent categories, such as product types or countries, even if they are stored as numbers.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Explain the difference between cross-sectional data, time series and panel data. Give an example of each.<\/p>\n","answer":"<p><strong>Cross-sectional<\/strong> data cover different units at about the same moment, such as wages by sector in September 2024. <strong>Time series<\/strong> data follow a single unit over time, such as a shop's monthly sales. <strong>Panel<\/strong> data follow several units over several periods, such as annual GDP for many countries.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>What is an API, and how does it differ from downloading data through a direct link?<\/p>\n","answer":"<p>An API allows a program to request data automatically and specify parameters such as years, countries and indicators, always from the latest data. A direct link gives you a file to download by hand, which must be repeated when the data are updated.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Why is the use of software packages such as <code>WDI<\/code> useful for manipulating data?<\/p>\n","answer":"<p>Packages provide ready-made functions for obtaining particular databases and selecting indicators and years, with very little setup. The price is that they cover only the supported databases and depend on their authors keeping them up to date.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>What is the difference between nominal, ordinal, interval and ratio variables?<\/p>\n","answer":"<ul>\n<li><strong>Nominal:<\/strong> qualitative with no order (cities).<\/li>\n<li><strong>Ordinal:<\/strong> qualitative with an order (poor, good, excellent).<\/li>\n<li><strong>Interval:<\/strong> quantitative, with consistent differences between values (temperature in °C).<\/li>\n<li><strong>Ratio:<\/strong> interval with a meaningful zero, so that ratios make sense (distance).<\/li>\n<\/ul>\n"},{"kind":"q","n":7,"ask":"<p>What is the difference between a stock and a flow? Give an economic example of each, and explain how each is aggregated over time.<\/p>\n","answer":"<p>A <strong>flow<\/strong> is measured over a period, such as monthly sales or GDP, and is usually summed over time. A <strong>stock<\/strong> is measured at one moment, such as inventories at the end of a month or public debt at the end of a year, and is usually averaged over time.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>State the three principles of tidy data.<\/p>\n","answer":"<p>Each observation forms one row. Each variable forms one column. Each type of observation forms a separate data table.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>What should you do with values that fall outside a variable's permitted range?<\/p>\n","answer":"<p>Replace them with missing values, unless it is obvious what the intended value was, as with an obvious typing error. Document what you did.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Why should raw data never be changed directly?<\/p>\n","answer":"<p>So that you can always go back to the original, and anyone can see exactly what was done. Every change should be made in a script that reads the raw file and writes a new, clean one.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Why does the <code>filter()<\/code> step need a check such as <code>setdiff()<\/code>?<\/p>\n","answer":"<p><code>%in%<\/code> raises no error when a code matches nothing, so a mistyped code simply removes a country without warning. <code>setdiff()<\/code> lists the codes in your list that are not in the data, which exposes the problem.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>What is the difference between <code>left_join()<\/code> and <code>inner_join()<\/code>?<\/p>\n","answer":"<p><code>left_join()<\/code> keeps all rows of the left table and adds matching information from the right table, leaving missing values where there is no match. <code>inner_join()<\/code> keeps only the rows present in both tables.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Why might the Argentine inflation figures of 2007 to 2015 have affected other statistics as well?<\/p>\n","answer":"<p>Many statistics are calculated from inflation. If inflation is understated, real wages, real growth and poverty counts are all misreported, because each depends on adjusting a money amount for prices.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>What was the dispute that stopped North Macedonia's 2011 census, and why does a definition matter so much in a census?<\/p>\n","answer":"<p>The dispute was about who should be counted, centred on people living abroad: whether copies of identity documents handed in by relatives were enough to count someone who had been away for over a year as a resident. Definitions matter because they decide who is in the population, and that number feeds into almost every statistic expressed per person and affects how groups are represented.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Why should you check dataset codes supplied by a chatbot?<\/p>\n","answer":"<p>Chatbots can invent dataset codes or give old ones. A code can also exist but point to the wrong variable, unit or geography. Checking at the source is the only way to know.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>What is a reproducibility package, and what are three reasons for building one?<\/p>\n","answer":"<p>It is a single folder containing the data, code and instructions needed for another person to regenerate every result. It catches mistakes; it helps you when you must explain a number months later; it makes results credible; and it is increasingly required by journals and institutions.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>If you find an error in a raw data file, what should you do?<\/p>\n","answer":"<p>Do not change the raw file. Make the correction in code, creating a new file in <code>data/clean<\/code>, and record what you changed and why.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>What should a README contain?<\/p>\n","answer":"<p>What the package reproduces and who wrote it; where each dataset came from, when it was obtained and on what terms it may be shared; the software and packages needed and roughly how long the code takes; the exact steps for running the code; and which script produces which table and figure.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>How would you share your work if some of the data were confidential?<\/p>\n","answer":"<p>Do not put confidential data in a public package or paste them into a public chatbot. Share the code and a list of variables, explain how someone with permission can obtain the same data, and state in the README what is missing and why.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Why must a package be extracted from its zip file and opened through its <code>.Rproj<\/code> file before it is run?<\/p>\n","answer":"<p>Inside a zip file, R cannot properly reach the other files, so the package fails. Opening through the <code>.Rproj<\/code> file sets the working directory to the package's folder, so that the relative paths such as <code>data/GDP.xls<\/code> work.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>In the worked example, why did the mistyped code <code>&quot;MVA&quot;<\/code> produce no error? Which output revealed the problem?<\/p>\n","answer":"<p><code>%in%<\/code> simply finds no match for <code>&quot;MVA&quot;<\/code>, so Moldova is dropped silently, which R does not treat as an error. The row count revealed the problem: <code>nrow(df_gdp_eu)<\/code> printed 40 instead of 41, and the saved CSV file also had 40 rows.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>Your rerun of a package gives a number slightly different from the published one. What would you check, and in what order?<\/p>\n","answer":"<p>First check that you did not edit any code or data, by running a fresh download of the package. Then compare <code>session_info.txt<\/code> with the README to see if the versions of R or the packages differ. Next check whether the code uses random numbers with a seed, and whether the data were revised (if you downloaded a new copy). Only then conclude that the published result may be at fault, and report exactly what differs.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>Why did revisions to Greece's deficit figures for 2009 have such serious consequences?<\/p>\n","answer":"<p>The deficit estimate for 2009 rose from 3.7 percent of GDP to 15.4 percent. Investors who had lent on the basis of the old figures no longer knew what to believe, and worried lenders demand higher interest rates. Greek borrowing costs soared, by spring 2010 the country could not borrow at an affordable price and needed a rescue, and doubts spread to other euro countries.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>What changed in Greece and in the EU after the revisions, and why does the independence of a national statistical office matter?<\/p>\n","answer":"<p>Greece made its statistical office independent and relaunched it as ELSTAT, and the EU gave Eurostat the right to inspect the accounts of government bodies where figures raised serious doubts. In November 2010 Eurostat found the revised figures reliable. Independence matters because governments often have an interest in how the numbers look. If the people who produce statistics can be pressured or punished for an unwelcome result, nobody can trust the numbers, and every decision built on them is weakened. The prosecution of Andreas Georgiou shows why statistical societies around the world defended this principle.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: Classify the data.<\/strong> The table below shows monthly data for two shops. Each row is one shop in one month.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">store_id<\/th>\n<th align=\"left\">month<\/th>\n<th align=\"right\">sales_eur<\/th>\n<th align=\"right\">customers<\/th>\n<th align=\"right\">inventory_end_units<\/th>\n<th align=\"right\">is_promo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">ABV<\/td>\n<td align=\"left\">2024-01<\/td>\n<td align=\"right\">12500<\/td>\n<td align=\"right\">410<\/td>\n<td align=\"right\">320<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">ABV<\/td>\n<td align=\"left\">2024-02<\/td>\n<td align=\"right\">11800<\/td>\n<td align=\"right\">390<\/td>\n<td align=\"right\">295<\/td>\n<td align=\"right\">1<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">ABV<\/td>\n<td align=\"left\">2024-03<\/td>\n<td align=\"right\">13250<\/td>\n<td align=\"right\">430<\/td>\n<td align=\"right\">280<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">VGD<\/td>\n<td align=\"left\">2024-01<\/td>\n<td align=\"right\">8400<\/td>\n<td align=\"right\">260<\/td>\n<td align=\"right\">210<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">VGD<\/td>\n<td align=\"left\">2024-02<\/td>\n<td align=\"right\">9100<\/td>\n<td align=\"right\">275<\/td>\n<td align=\"right\">190<\/td>\n<td align=\"right\">1<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">VGD<\/td>\n<td align=\"left\">2024-03<\/td>\n<td align=\"right\">8700<\/td>\n<td align=\"right\">268<\/td>\n<td align=\"right\">205<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The variables are: <code>store_id<\/code> (the name of the shop), <code>month<\/code> (the month of observation), <code>sales_eur<\/code> (total sales in the month, in euros), <code>customers<\/code> (the number of customers in the month), <code>inventory_end_units<\/code> (stock at the end of the month, as the number of unsold items) and <code>is_promo<\/code> (whether there was a promotion in the month: 0 = no, 1 = yes).<\/p>\n<p>a. Determine which columns are ID variables. Is a combination of several variables needed to identify a row uniquely?\nb. For each variable, classify whether it is quantitative or qualitative, and state its measurement scale (nominal, ordinal, interval or ratio).\nc. Determine which variables are flows and which are stocks. Explain why in one sentence.\nd. Are these data cross-sectional, a time series or a panel? Explain in one sentence.<\/p>\n","answer":"<p><strong>a.<\/strong> <code>store_id<\/code> and <code>month<\/code> are ID variables. A combination is needed, because neither alone is unique: each shop appears three times and each month twice. Together they identify all six rows.<\/p>\n<p><strong>b.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Variable<\/th>\n<th align=\"left\">Type<\/th>\n<th align=\"left\">Scale<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\"><code>store_id<\/code><\/td>\n<td align=\"left\">Qualitative<\/td>\n<td align=\"left\">Nominal<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>month<\/code><\/td>\n<td align=\"left\">Quantitative (a date)<\/td>\n<td align=\"left\">Interval<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>sales_eur<\/code><\/td>\n<td align=\"left\">Quantitative<\/td>\n<td align=\"left\">Ratio<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>customers<\/code><\/td>\n<td align=\"left\">Quantitative<\/td>\n<td align=\"left\">Ratio<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>inventory_end_units<\/code><\/td>\n<td align=\"left\">Quantitative<\/td>\n<td align=\"left\">Ratio<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>is_promo<\/code><\/td>\n<td align=\"left\">Qualitative (binary)<\/td>\n<td align=\"left\">Nominal<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>c.<\/strong> <code>sales_eur<\/code> and <code>customers<\/code> are flows, because they accumulate over the month. <code>inventory_end_units<\/code> is a stock, because it is measured at one moment. The others are neither.<\/p>\n<p><strong>d.<\/strong> Panel data, because several shops are observed over several months.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: A tidy table from WDI.<\/strong> The aim is to download data from WDI (World Bank) and prepare a tidy table for analysis. Use the following countries (ISO3 codes): MKD (North Macedonia), SRB (Serbia), ALB (Albania), DEU (Germany) and ITA (Italy). Use these indicators:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">WDI code<\/th>\n<th align=\"left\">Description<\/th>\n<th align=\"left\">Units<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">NY.GDP.PCAP.CD<\/td>\n<td align=\"left\">GDP per capita (nominal, current prices)<\/td>\n<td align=\"left\">US dollars per person<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">FP.CPI.TOTL.ZG<\/td>\n<td align=\"left\">Inflation, CPI (annual rate)<\/td>\n<td align=\"left\">percent<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">SL.UEM.TOTL.ZS<\/td>\n<td align=\"left\">Unemployment, total (modelled ILO estimate)<\/td>\n<td align=\"left\">percent<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Download data for the period 2010 to 2024 (inclusive) for all the countries and all three indicators. Prepare a tidy table in which each row is a combination of country and year, with the columns <code>country_code<\/code>, <code>country_name<\/code>, <code>year<\/code>, <code>gdp_pc_usd<\/code>, <code>inflation_pct<\/code> and <code>unemployment_pct<\/code>. In one or two sentences, explain why it is important to check whether there are missing values and whether the units are comparable across countries.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\n\nraw &lt;- WDI(\n  country = c(&quot;MK&quot;, &quot;RS&quot;, &quot;AL&quot;, &quot;DE&quot;, &quot;IT&quot;),\n  indicator = c(gdp_pc_usd = &quot;NY.GDP.PCAP.CD&quot;,\n                inflation_pct = &quot;FP.CPI.TOTL.ZG&quot;,\n                unemployment_pct = &quot;SL.UEM.TOTL.ZS&quot;),\n  start = 2010, end = 2024\n)\n\ntidy &lt;- raw %&gt;%\n  transmute(country_code = iso3c, country_name = country, year,\n            gdp_pc_usd, inflation_pct, unemployment_pct) %&gt;%\n  arrange(country_code, year)\n\nnrow(tidy)          # should be 5 countries x 15 years = 75\ncolSums(is.na(tidy))\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. The table has <strong>75 rows<\/strong> (5 countries for 15 years), with <strong>no missing values<\/strong> for these countries and years. In 2024, for example:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">GDP per person (US$)<\/th>\n<th align=\"right\">Inflation (%)<\/th>\n<th align=\"right\">Unemployment (%)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Albania<\/td>\n<td align=\"right\">11,374<\/td>\n<td align=\"right\">2.2<\/td>\n<td align=\"right\">10.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Germany<\/td>\n<td align=\"right\">56,104<\/td>\n<td align=\"right\">2.3<\/td>\n<td align=\"right\">3.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Italy<\/td>\n<td align=\"right\">40,430<\/td>\n<td align=\"right\">1.0<\/td>\n<td align=\"right\">6.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">North Macedonia<\/td>\n<td align=\"right\">9,292<\/td>\n<td align=\"right\">3.5<\/td>\n<td align=\"right\">12.3<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Serbia<\/td>\n<td align=\"right\">13,678<\/td>\n<td align=\"right\">4.7<\/td>\n<td align=\"right\">7.2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Missing values matter because a mean or chart can silently drop some country-years, so that comparisons are not like for like. Units matter because dollars, percentages and index numbers cannot be compared directly, and a figure in current dollars is not the same as one in constant prices.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: A table from Eurostat.<\/strong> Using official Eurostat data, prepare a table for all European countries in 2022 containing the following columns: the country's ISO3 code, the year, the unemployment rate and inflation. The table should be tidy, contain one row for each country and be ready for further analysis in R. Which countries are missing, and why?<\/p>\n","answer":"<p>Use the code in the worked Eurostat example in the chapter: table <code>tps00203<\/code> for unemployment and <code>prc_hicp_aind<\/code> with the unit <code>RCH_A_AVG<\/code> and the item <code>CP00<\/code> for inflation. Remember to change Eurostat's <code>EL<\/code> and <code>UK<\/code> codes to <code>GR<\/code> and <code>GB<\/code> before converting to ISO3.<\/p>\n<p>The result, <code>eurostat_2022_tidy.csv<\/code> in the companion, has <strong>33 rows<\/strong>. The eight countries from the book's list of 41 that are missing are Albania, Bosnia and Herzegovina, Belarus, the United Kingdom, Moldova, Montenegro, Russia and Ukraine. <code>inner_join()<\/code> keeps a country only if it has data in both tables, and Eurostat's coverage is mainly EU members and some partner countries, so these countries lack at least one of the two indicators. The United Kingdom left the EU in 2020.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: Compare two sources.<\/strong> Download the unemployment rate for North Macedonia and five other countries for 2023 from both Eurostat (<code>une_rt_a<\/code>) and the World Bank (<code>SL.UEM.TOTL.ZS<\/code>). Merge them into one table and add a column with the difference. Where is the gap largest? Read the definition of each indicator and explain the differences.<\/p>\n","answer":"<p>World Bank data, downloaded on 10 November 2026. The Eurostat figures are for ages 15 to 74.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">Eurostat (%)<\/th>\n<th align=\"right\">World Bank (%)<\/th>\n<th align=\"right\">Difference<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Serbia<\/td>\n<td align=\"right\">9.5<\/td>\n<td align=\"right\">8.27<\/td>\n<td align=\"right\"><strong>1.23<\/strong><\/td>\n<\/tr>\n<tr>\n<td align=\"left\">North Macedonia<\/td>\n<td align=\"right\">13.1<\/td>\n<td align=\"right\">13.17<\/td>\n<td align=\"right\">−0.07<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Italy<\/td>\n<td align=\"right\">7.7<\/td>\n<td align=\"right\">7.63<\/td>\n<td align=\"right\">0.07<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Germany<\/td>\n<td align=\"right\">3.1<\/td>\n<td align=\"right\">3.07<\/td>\n<td align=\"right\">0.03<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Spain<\/td>\n<td align=\"right\">12.2<\/td>\n<td align=\"right\">12.18<\/td>\n<td align=\"right\">0.02<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Türkiye<\/td>\n<td align=\"right\">9.4<\/td>\n<td align=\"right\">9.39<\/td>\n<td align=\"right\">0.01<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">library(WDI)\nwb &lt;- WDI(country = c(&quot;MK&quot;, &quot;RS&quot;, &quot;TR&quot;, &quot;DE&quot;, &quot;IT&quot;, &quot;ES&quot;),\n          indicator = c(worldbank = &quot;SL.UEM.TOTL.ZS&quot;),\n          start = 2023, end = 2023)\n# Merge with the Eurostat figures by iso2c, then:\n# merged$difference &lt;- merged$eurostat - merged$worldbank\n<\/code><\/pre>\n<p><strong>The gap is largest for Serbia<\/strong>, and tiny for the other five. The definitions explain why differences can arise. Eurostat's figure comes from Labour Force Surveys for ages 15 to 74, while the World Bank's <code>SL.UEM.TOTL.ZS<\/code> is a <strong>modelled ILO estimate<\/strong> for ages 15 and over, so it is adjusted for comparability and can include modelling.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: MakStat.<\/strong> Use the MakStat website to find the table of average gross wages by sector (table 125, in the same folder as the net wage table used in this chapter). Download it through the API or as a file, convert it to tidy form with <code>pivot_longer()<\/code>, merge it with the net wage data and calculate the ratio of net to gross wages for the total economy. How has it changed over time?<\/p>\n","answer":"<p>The table is <code>125_PazTrud_Mk_bruto_ml.px<\/code>, in the same folder as the net wage table.<\/p>\n<pre><code class=\"language-r\">library(htt
