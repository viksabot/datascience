bove it.<\/p>\n<pre><code class=\"language-r\">set.seed(123)\ni &lt;- sample(nrow(x), floor(0.7 * nrow(x)))\nm &lt;- glm(high ~ unemployment_rate + gdp_pc, data = x[i, ], family = binomial)\npred &lt;- predict(m, x[-i, ], type = &quot;response&quot;) &gt; 0.5\ntable(Predicted = pred, Actual = x$high[-i])\n<\/code><\/pre>\n<p>On the nine test countries, accuracy is <strong>6 of 9, or 66.7 percent<\/strong> (one true positive, one false positive, two false negatives and five true negatives). Five-fold cross-validation with <code>set.seed(123)<\/code> gives <strong>74.1 percent<\/strong>.<\/p>\n<p>The test accuracy comes from a single split, while cross-validation averages over several. <strong>Neither should be trusted very much<\/strong> with 27 observations. Over 200 seeds, cross-validated accuracy ranges from 63 to 85 percent, and across 200 random 70/30 splits, test accuracy ranges from 33 to 100 percent. Neither coefficient is statistically significant.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: Car exporters.<\/strong> Using <code>trade_cars_2022.xlsx<\/code>, compare the following models by cross-validated accuracy: GDP alone; GDP, FDI and capital; and all three with the logarithm of population. Which countries with <code>is_exporter = 0<\/code> have the highest predicted probabilities? Is any of them a plausible new car exporter? What other information would you want?<\/p>\n","answer":"<p>Using <code>trade_cars_2022.xlsx<\/code>, 150 countries and a 50 percent base rate. The table shows mean cross-validated accuracy over 200 seeds.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Model<\/th>\n<th align=\"right\">Mean accuracy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">GDP alone<\/td>\n<td align=\"right\">83.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">GDP, FDI and capital<\/td>\n<td align=\"right\">83.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">GDP, FDI, capital and log population<\/td>\n<td align=\"right\">85.6%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Non-exporters with the highest probability in the third model are:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">Probability<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Bermuda<\/td>\n<td align=\"right\">0.9997<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Uruguay<\/td>\n<td align=\"right\">0.717<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Belarus<\/td>\n<td align=\"right\">0.619<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Dominican Republic<\/td>\n<td align=\"right\">0.612<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Costa Rica<\/td>\n<td align=\"right\">0.493<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Iran<\/td>\n<td align=\"right\">0.465<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Egypt<\/td>\n<td align=\"right\">0.463<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Bermuda's probability only reflects its very high GDP per person, so it is not plausible, as its population is around 65,000. Iran and Egypt have large populations and some car assembly, so they are more plausible. But remember that &quot;exporter&quot; here means car exports per person above the median. You would also want information on existing industry, trade agreements, wages, product-level exports and whether any firm wants to invest.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6: Recessions with more data (FRED).<\/strong> Add a second predictor to the recession model, such as the change in the unemployment rate (<code>UNRATE<\/code>) or the Chicago Fed index (<code>CFNAI<\/code>). Do precision and recall improve? To avoid leakage, make sure that each predictor is known 12 months before the outcome. Try a training period up to 2000 and a test period after that.<\/p>\n","answer":"<p>Sample: months from March 1967 to September 2025, with a training period to December 2000 (406 months, 65 positive) and test period afterwards (297 months, 20 positive). Predictors are known at the forecast date: the spread, the 12-month change in unemployment and the three-month Chicago Fed index.<\/p>\n<p>Test results:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Threshold<\/th>\n<th align=\"left\">Model<\/th>\n<th align=\"right\">Accuracy<\/th>\n<th align=\"right\">Precision<\/th>\n<th align=\"right\">Recall<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">0.15<\/td>\n<td align=\"left\">Spread<\/td>\n<td align=\"right\">0.687<\/td>\n<td align=\"right\">0.124<\/td>\n<td align=\"right\">0.60<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.15<\/td>\n<td align=\"left\">Spread and unemployment change<\/td>\n<td align=\"right\">0.690<\/td>\n<td align=\"right\">0.125<\/td>\n<td align=\"right\">0.60<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.15<\/td>\n<td align=\"left\">Spread and CFNAI<\/td>\n<td align=\"right\">0.710<\/td>\n<td align=\"right\">0.133<\/td>\n<td align=\"right\">0.60<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.30<\/td>\n<td align=\"left\">Spread<\/td>\n<td align=\"right\">0.778<\/td>\n<td align=\"right\">0.129<\/td>\n<td align=\"right\">0.40<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.30<\/td>\n<td align=\"left\">Spread and CFNAI<\/td>\n<td align=\"right\">0.781<\/td>\n<td align=\"right\">0.091<\/td>\n<td align=\"right\">0.25<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.50<\/td>\n<td align=\"left\">Spread<\/td>\n<td align=\"right\">0.855<\/td>\n<td align=\"right\">0.074<\/td>\n<td align=\"right\">0.10<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>There is <strong>no clear improvement<\/strong>. At a threshold of 0.15, the Chicago Fed index slightly reduces false alarms with the same recall, but at 0.30 recall falls. With 20 positive months from about two recessions in the test period, the differences are very imprecise. Note that the month-by-month observations are strongly dependent.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7 (AI): Fix the accuracy.<\/strong> Ask a chatbot for 5-fold cross-validation of the model in Section 10.2-r. Check whether it reports <code>1 - delta<\/code> as accuracy. Compare its figure with the correct one and write two sentences explaining the difference.<\/p>\n","answer":"<p>Chatbots often report <code>100 * (1 - cv.err$delta[1])<\/code> or <code>delta[2]<\/code> as accuracy. This uses the default cost, which is the mean squared difference between the outcome and the probability. Using the book's misclassification cost function gives about 86 percent. An explanation in two sentences might be: &quot;The chatbot's figure is one minus an average squared error, so a correct prediction with less than complete certainty is still penalised. It is not the share of countries classified correctly, which requires a cost function that counts misclassifications.&quot;<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8 (AI): Audit for leakage.<\/strong> Give a chatbot the variable names and definitions in <code>trade_cars_2022.xlsx<\/code> without mentioning this chapter. Ask it to build the best possible model of <code>is_exporter<\/code>. Does it use <code>exports_pc<\/code> or <code>car_exports<\/code>? Does it notice the problem? What did you have to tell it?<\/p>\n","answer":"<p>A chatbot told to build the &quot;best possible model&quot; will typically include <code>exports_pc<\/code> or <code>car_exports<\/code> and report an excellent result. Unless it examines how the target was constructed, it will miss the fact that <code>is_exporter<\/code> equals <code>exports_pc &gt; median(exports_pc)<\/code>. Note what you had to tell it. The necessary instruction is to exclude any variable from which the target can be computed or that would not be known at the moment of prediction.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Exercise 9: Set a threshold.<\/strong> Using the recession model, assume that a false alarm costs 1 and a missed recession costs $c$. For $c = 2, 5$ and 10, calculate the total cost at thresholds from 0.05 to 0.9 and find the lowest. How does the best threshold depend on $c$? Who would decide the value of $c$ in practice?<\/p>\n","answer":"<p>Using the full-sample recession model (871 months), thresholds from 0.05 to 0.90 in steps of 0.01.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">c (cost of a missed recession month)<\/th>\n<th align=\"right\">Best threshold<\/th>\n<th align=\"right\">Total cost<\/th>\n<th align=\"right\">False alarms<\/th>\n<th align=\"right\">Missed months<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">2<\/td>\n<td align=\"right\">0.27<\/td>\n<td align=\"right\">187<\/td>\n<td align=\"right\">51<\/td>\n<td align=\"right\">68<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">5<\/td>\n<td align=\"right\">0.14<\/td>\n<td align=\"right\">304<\/td>\n<td align=\"right\">199<\/td>\n<td align=\"right\">21<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">10<\/td>\n<td align=\"right\">0.10<\/td>\n<td align=\"right\">403<\/td>\n<td align=\"right\">263<\/td>\n<td align=\"right\">14<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">m &lt;- glm(rec_12 ~ spread, yc, family = binomial)\np &lt;- predict(m, type = &quot;response&quot;)\ntotal_cost &lt;- function(t, c) sum(p &gt; t &amp; yc$rec_12 == 0) + c * sum(p &lt;= t &amp; yc$rec_12 == 1)\nthresholds &lt;- seq(0.05, 0.9, 0.01)\nthresholds[which.min(sapply(thresholds, total_cost, c = 5))]\n<\/code><\/pre>\n<p><strong>The higher the cost of a missed recession, the lower the best threshold.<\/strong> The value of c is not a statistical quantity. In practice it would be decided by the policymakers accountable for the consequences, such as a central bank's governing board.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Exercise 10 (AI): Write the memo.<\/strong> Give a chatbot the two numbers in the joint replacement example (10,512 futile operations avoided and 38,533 operations postponed) and ask for a recommendation to a health minister. Does it treat the choice as a matter of statistics? Rewrite the memo so that it separates what the model shows from what the minister must decide.<\/p>\n","answer":"<p>The result depends on the chatbot's reply. Many will recommend a policy as if the calculation settled the matter. A better memo separates the following.<\/p>\n<blockquote>\n<p><strong>What the model shows.<\/strong> Redirecting the operations for the 10 percent of highest-risk patients would avoid about 10,512 futile operations a year and redirect about $158 million. It would also postpone 38,533 operations for high-risk patients who would have survived and benefited.<\/p>\n<p><strong>What the minister must decide.<\/strong> Whether avoiding 10,512 futile operations justifies delaying 38,533 useful ones, how to weigh pain and risk against costs, and who has the right to be consulted in such decisions. Patients and physicians should be part of any such decision.<\/p>\n<\/blockquote>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што е класификација во статистичкото учење?<\/p>\n","answer":"<p>Група методи што ја предвидуваат категоријата или класата на која ѝ припаѓа едно набљудување, користејќи повеќе независни променливи.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Која е разликата меѓу проблем на регресиона анализа и проблем на класификација?<\/p>\n","answer":"<p>Регресиониот проблем има квантитативен одговор, а проблемот со класификација има квалитативен (категорија).<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Што е бинарна зависна променлива и како се создава?<\/p>\n","answer":"<p>Променлива што ги зема само вредностите 0 и 1, означувајќи отсуство или присуство на класа. Се конструира со правило, на пример <code>ifelse(internet_penetration &gt; 75, 1, 0)<\/code>.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Зошто линеарната регресија не е соодветна за непосредно предвидување бинарна зависна променлива?<\/p>\n","answer":"<p>Линеарната регресија дава непрекинати предвидувања што може да бидат под 0 или над 1, па не можат да се читаат како вистински веројатности.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Која е улогата на логистичката функција во логистичката регресија?<\/p>\n","answer":"<p>Секој број од линеарниот дел на моделот го претвора во вредност меѓу 0 и 1, која може да се чита како веројатност.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Како се толкува знакот на коефициент во логистичката регресија?<\/p>\n","answer":"<p>Позитивен коефициент значи позитивна поврзаност со веројатноста за класата кодирана со 1, а негативен коефициент значи негативна поврзаност. Насоката зависи од тоа како е кодирана променливата.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Што претставуваат предвидените веројатности во логистичката регресија?<\/p>\n","answer":"<p>Проценетата веројатност дека секое набљудување припаѓа на позитивната класа.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Како можат предвидените веројатности да се претворат во предвидени класи?<\/p>\n","answer":"<p>Изберете праг, на пример 0.5. Доделете ја позитивната класа ако предвидената веројатност е над прагот, а инаку негативната класа.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Што е матрица на конфузија и кои можни исходи ги содржи?<\/p>\n","answer":"<p>Табела 2×2 што ги споредува вистинските и предвидените класи. Содржи вистински позитивни, лажно позитивни, лажно негативни и вистински негативни.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Што е точност на моделот и зошто 5-кратната вкрстена валидација е корисна при изборот на модел за класификација?<\/p>\n","answer":"<p>Точноста е уделот на точни класификации. Петкратната вкрстена валидација го тестира секој модел врз податоци што не ги видел, па споредбата е за предвидување нови случаи, а не за приспособеност кон познати податоци.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Што е основна зачестеност и зошто точноста мора да се спореди со неа?<\/p>\n","answer":"<p>Точноста што би ја постигнале без модел, ако секогаш ја избирате најчестата класа. Точноста има значење само во однос на ова.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Која е разликата меѓу прецизност и одзив? Дајте пример во кој секоја од нив е поважна.<\/p>\n","answer":"<p><strong>Прецизност<\/strong> е уделот на предвидените позитивни што се навистина позитивни, а <strong>одѕив (recall)<\/strong> е уделот на вистинските позитивни што моделот ги наоѓа. Прецизноста е поважна кога постапувањето по лажна тревога е скапо, како при обвинување некого за измама. Одѕивот е поважен кога пропуштањето случај е скапо, како при скрининг за сериозна болест.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Зошто модел што предвидува рецесии може да има пониска точност при понизок праг, а сепак да биде покорисен?<\/p>\n","answer":"<p>Рецесиите се ретки, па понизок праг предизвикува повеќе лажни тревоги и ја намалува вкупната точност. Но фаќа многу повеќе од вистинските месеци на рецесија, а раното предупредување може да ги вреди лажните тревоги.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Што пресметува <code>cv.glm()<\/code> по основните поставки за бинарен модел?<\/p>\n","answer":"<p>Просечната квадратна разлика меѓу вистинската вредност (0 или 1) и предвидената веројатност. Не е стапка на погрешна класификација, па 1 − delta не е точност.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Што е протекување на податоци? Како настана во примерот со извозот на автомобили?<\/p>\n","answer":"<p>Истекување на податоци (data leakage) настанува кога предиктор го содржи одговорот или информација што не е достапна во моментот на предвидувањето. Во примерот со автомобили, <code>is_exporter<\/code> беше дефинирана како <code>exports_pc<\/code> над нејзината медијана, па користењето <code>exports_pc<\/code> како предиктор му го даде одговорот на моделот.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Зошто примерокот на Алтман од 33 пропаднати и 33 опстанати фирми се разликуваше од реалниот свет? Зошто е тоа важно?<\/p>\n","answer":"<p>Половина од фирмите на Алтман (Altman) беа банкротирани, додека во која било година пропаѓа само мал удел од фирмите. Метод што работи кога групите се подеднакво чести има многу потешка задача кога едната група е ретка, па точноста во примерокот го преценува резултатот во реалниот свет.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Наведете четири проверки што треба да ги направите кај класификатор изграден со помош на разговорен бот со AI.<\/p>\n","answer":"<p>Кои било четири од овие: споредете со основната стапка; проверете која класа е кодирана со 1; проверете <code>type = &quot;response&quot;<\/code>; проверете што мери вкрстената валидација; читајте ги коефициентите како промени во логаритамот на шансите; бидете сомничави кон речиси совршен резултат; и погледнете ги погрешно класификуваните случаи.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Зошто прагот во проблем на јавните политики заснован врз предвидување е одлука на јавната политика, а не статистичка одлука?<\/p>\n","answer":"<p>Прагот одлучува колку лажни тревоги се прифаќаат во замена за колку пропуштени случаи. Статистиката го дава компромисот, но како да се вреднува секој вид грешка е одлука за трошоците и за луѓето.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Во примерот со замената на зглобови, кои се лажно позитивните случаи и што губат тие?<\/p>\n","answer":"<p>Тоа се 38,533 пациенти со висок ризик што <em>не<\/em> би умреле во рок од една година. Нивната операција би била одложена, па подолго би живееле со болка.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Зошто прогнозата за рецесија не е чист проблем со чадор?<\/p>\n","answer":"<p>Реакцијата на централната банка на прогнозата може да промени дали ќе се случи рецесијата. Прогнозата може да влијае врз исходот што го предвидува, а моделот учи и од минатото во кое политиката реагирала на свој начин.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Висока употреба на интернет (Светска банка).<\/strong> Со пакетот <code>WDI<\/code> во R, преземете податоци за сите држави за 2022 за <code>IT.NET.USER.ZS<\/code> (поединци што користат интернет, % од населението), <code>SE.SEC.ENRR<\/code> (бруто-стапка на запишување во средно образование, %) и <code>EG.ELC.ACCS.ZS<\/code> (пристап до електрична енергија, % од населението). По чистењето на податоците, создадете бинарна зависна променлива <code>high_internet<\/code>, со вредност 1 ако <code>IT.NET.USER.ZS<\/code> &gt; 75, а 0 во спротивно. Потоа проценете логистичка регресија со <code>high_internet<\/code> како зависна променлива и <code>SE.SEC.ENRR<\/code> и <code>EG.ELC.ACCS.ZS<\/code> како независни променливи. Прикажете ги резултатите од <code>summary()<\/code>, пресметајте ги предвидените веројатности, претворете ги во класи со праг од 0.5, составете матрица на конфузија и пресметајте ја точноста на моделот.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(internet = &quot;IT.NET.USER.ZS&quot;, enrol = &quot;SE.SEC.ENRR&quot;, electricity = &quot;EG.ELC.ACCS.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(internet), !is.na(enrol), !is.na(electricity)) %&gt;%\n  mutate(high_internet = ifelse(internet &gt; 75, 1, 0))\n\nm &lt;- glm(high_internet ~ enrol + electricity, data = d, family = binomial(logit))\nsummary(m)\nprob &lt;- predict(m, type = &quot;response&quot;)\npred &lt;- ifelse(prob &gt; 0.5, 1, 0)\ntable(Predicted = pred, Actual = d$high_internet)\nmean(pred == d$high_internet)\nmean(d$high_internet)    # compare accuracy with the base rate\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>127 држави<\/strong> со целосни податоци, од кои 70.1 проценти имаат високо користење интернет.<\/p>\n<p>Двата коефициенти се позитивни и значајни: 0.047 за запишаноста и 0.207 за пристапот до електрична енергија.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Вистински високо<\/th>\n<th align=\"right\">Вистински не високо<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Предвидено високо<\/td>\n<td align=\"right\">85<\/td>\n<td align=\"right\">19<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Предвидено не високо<\/td>\n<td align=\"right\">4<\/td>\n<td align=\"right\">19<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Точноста е 81.9 проценти, наспроти основна стапка од 70.1 проценти<\/strong> ако секогаш се предвидува високо. Ова е измерено врз податоците употребени за приспособување на моделот. Моделот ги наоѓа повеќето држави со високо користење, со одѕив од 96 проценти, но точно препознава само половина од другите.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Три модели на очекуваниот животен век (Светска банка).<\/strong> Преземете податоци за сите држави за 2022 за <code>SP.DYN.LE00.IN<\/code> (очекуван животен век, life expectancy), <code>NY.GDP.PCAP.CD<\/code> (БДП по жител, тековни US$), <code>SH.XPD.CHEX.GD.ZS<\/code> (тековни здравствени расходи, % од БДП) и <code>SP.URB.TOTL.IN.ZS<\/code> (урбано население, % од вкупното). По чистењето на податоците, создадете бинарна зависна променлива <code>high_lifeexp<\/code>, со вредност 1 ако очекуваниот животен век е поголем од медијаната на <code>SP.DYN.LE00.IN<\/code>, а 0 во спротивно. Потоа проценете три логистички модели. Во првиот, користете само <code>NY.GDP.PCAP.CD<\/code> како независна променлива. Во вториот, користете <code>NY.GDP.PCAP.CD<\/code> и <code>SH.XPD.CHEX.GD.ZS<\/code>. Во третиот, користете <code>NY.GDP.PCAP.CD<\/code>, <code>SH.XPD.CHEX.GD.ZS<\/code> и <code>SP.URB.TOTL.IN.ZS<\/code>. За секој модел пресметајте ги предвидените класи со праг од 0.5, направете матрица на конфузија и пресметајте ја точноста. На крајот споредете ги трите модели и објаснете дали додавањето нови променливи води кон подобра класификација.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(life = &quot;SP.DYN.LE00.IN&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;,\n                       health = &quot;SH.XPD.CHEX.GD.ZS&quot;, urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(life), !is.na(gdp), !is.na(health), !is.na(urban)) %&gt;%\n  mutate(high_lifeexp = ifelse(life &gt; median(life), 1, 0))\n\nmodels &lt;- list(glm(high_lifeexp ~ gdp, d, family = binomial),\n               glm(high_lifeexp ~ gdp + health, d, family = binomial),\n               glm(high_lifeexp ~ gdp + health + urban, d, family = binomial))\nsapply(models, function(m) mean((predict(m, type = &quot;response&quot;) &gt; 0.5) == d$high_lifeexp))\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>186 држави<\/strong> со целосни податоци, рамномерно поделени, па основната стапка е 50 проценти.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Модел<\/th>\n<th align=\"right\">Точни<\/th>\n<th align=\"right\">Точност<\/th>\n<th align=\"right\">Вкрстено валидирана точност (100 почетни вредности)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">БДП<\/td>\n<td align=\"right\">153<\/td>\n<td align=\"right\">82.3%<\/td>\n<td align=\"right\">80.8%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">БДП и здравствени трошоци<\/td>\n<td align=\"right\">153<\/td>\n<td align=\"right\">82.3%<\/td>\n<td align=\"right\">80.2%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">БДП, здравствени трошоци и градско население<\/td>\n<td align=\"right\">154<\/td>\n<td align=\"right\">82.8%<\/td>\n<td align=\"right\">81.5%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Додавањето променливи речиси не ја подобрува класификацијата.<\/strong> Здравствените трошоци даваат идентични резултати во примерокот и малку ја намалуваат вкрстено валидираната точност. Градското население додава околу еден процентен поен, што е мала разлика во однос на шумот од случајните поделби.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Висока невработеност (Светска банка).<\/strong> Преземете податоци за сите држави за 2022 за <code>SL.UEM.TOTL.ZS<\/code> (стапка на невработеност, %), <code>NY.GDP.PCAP.CD<\/code> (БДП по жител) и <code>SP.URB.TOTL.IN.ZS<\/code> (урбано население, % од вкупното). По чистењето на податоците, создадете бинарна зависна променлива <code>high_unemployment<\/code>, со вредност 1 ако стапката на невработеност е поголема од 10 проценти, а 0 во спротивно. Потоа поделете ја збирката на множество за обучување (training set, 70 проценти) и тест-множество (test set, 30 проценти) со <code>set.seed(123)<\/code>. Проценете два логистички модели врз множеството за обучување: првиот само со <code>NY.GDP.PCAP.CD<\/code> како независна променлива, а вториот со <code>NY.GDP.PCAP.CD<\/code> и <code>SP.URB.TOTL.IN.ZS<\/code>. За двата модела пресметајте ги предвидените класи за тест-множеството со праг од 0.5, направете матрица на конфузија и пресметајте ја точноста врз тест-множеството. Потоа спроведете 5-кратна вкрстена валидација за двата модела, користејќи функција на трошок за погрешна класификација, и споредете ги резултатите. Објаснете кој модел би го избрале ако целта е подобро предвидување нови податоци. Каква е точноста во споредба со основната зачестеност?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nlibrary(boot)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(unemp = &quot;SL.UEM.TOTL.ZS&quot;, gdp = &quot;NY.GDP.PCAP.CD&quot;, urban = &quot;SP.URB.TOTL.IN.ZS&quot;),\n         start = 2022, end = 2022, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(unemp), !is.na(gdp), !is.na(urban)) %&gt;%\n  mutate(high_unemployment = ifelse(unemp &gt; 10, 1, 0))\ncost &lt;- function(r, pi = 0) mean(abs(r - pi) &gt; 0.5)\n\nset.seed(123)\ni &lt;- sample(nrow(d), floor(0.7 * nrow(d)))\na &lt;- glm(high_unemployment ~ gdp, d[i, ], family = binomial)\nb &lt;- glm(high_unemployment ~ gdp + urban, d[i, ], family = binomial)\nmean((predict(a, d[-i, ], type = &quot;response&quot;) &gt; 0.5) == d$high_unemployment[-i])\nmean((predict(b, d[-i, ], type = &quot;response&quot;) &gt; 0.5) == d$high_unemployment[-i])\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>179 држави<\/strong> со целосни податоци. Висока невработеност има кај 41 од нив, па основната стапка за „не висока“ е <strong>77.1 проценти<\/strong>. Кај 54-те држави за тестирање изнесува 81.5 проценти.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Модел<\/th>\n<th align=\"right\">Тест-точност<\/th>\n<th align=\"right\">Точност со 5-кратна CV (100 почетни вредности)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Само БДП<\/td>\n<td align=\"right\">81.5%<\/td>\n<td align=\"right\">77.1%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">БДП и градско население<\/td>\n<td align=\"right\">83.3%<\/td>\n<td align=\"right\">78.3%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Првиот модел <strong>едноставно предвидува „не висока“ за секоја држава<\/strong>, па воопшто нема вредност, а неговата точност е точно еднаква на основната стапка. Вториот модел означува неколку држави и е малку подобар, препознавајќи 2 од 10-те држави со висока невработеност во тест-множеството. Ако целта е предвидување нови податоци, тој е подобриот избор. Но ниту еден модел не е корисен за наоѓање држави со висока невработеност, а подобрувањето во однос на основната стапка е мало.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Висока инфлација во ЕУ (Eurostat).<\/strong> Со пакетот <code>eurostat<\/code> во R, преземете податоци за државите од Европската Унија за 2022 за стапката на невработеност, годишната инфлација и БДП по жител. По чистењето и спојувањето на податоците, создадете бинарна зависна променлива <code>high_inflation<\/code>, со вредност 1 ако годишната инфлација е поголема од медијаната за државите од ЕУ, а 0 во спротивно. Потоа поделете ја збирката на множество за обучување (70 проценти) и тест-множество (30 проценти) со <code>set.seed(123)<\/code>, проценете логистичка регресија врз множеството за обучување со <code>high_inflation<\/code> како зависна променлива и стапката на невработеност и БДП по жител како независни променливи, пресметајте ги предвидените класи за тест-множеството со праг од 0.5, направете матрица на конфузија и пресметајте ја точноста врз тест-множеството, а потоа спроведете 5-кратна вкрстена валидација. На крајот споредете ја точноста од тест-множеството со точноста од вкрстената валидација и накратко објаснете што ни кажуваат овие две мерки за квалитетот на моделот. Со само 27 набљудувања, колку ѝ верувате на која било од двете бројки?<\/p>\n","answer":"<p>Податоци: <code>eurostat_2022_tidy.csv<\/code> за невработеност и инфлација и <code>nama_10_pc<\/code> на Eurostat за БДП по жител во тековни евра, преземени на 10 ноември 2026. Има 27 држави, медијалната стапка на инфлација е 9.3 проценти, а 12 држави се над неа.<\/p>\n<pre><code class=\"language-r\">set.seed(123)\ni &lt;- sample(nrow(x), floor(0.7 * nrow(x)))\nm &lt;- glm(high ~ unemployment_rate + gdp_pc, data = x[i, ], family = binomial)\npred &lt;- predict(m, x[-i, ], type = &quot;response&quot;) &gt; 0.5\ntable(Predicted = pred, Actual = x$high[-i])\n<\/code><\/pre>\n<p>На деветте држави за тестирање, точноста е <strong>6 од 9, односно 66.7 проценти<\/strong> (еден вистински позитивен, еден лажно позитивен, два лажно негативни и пет вистински негативни). Петкратната вкрстена валидација со <code>set.seed(123)<\/code> дава <strong>74.1 проценти<\/strong>.<\/p>\n<p>Тест-точноста доаѓа од една поделба, додека вкрстената валидација прави просек од неколку. <strong>Ниту на едната не треба многу да ѝ се верува<\/strong> со 27 набљудувања. Низ 200 почетни вредности, вкрстено валидираната точност се движи од 63 до 85 проценти, а низ 200 случајни поделби 70/30, тест-точноста се движи од 33 до 100 проценти. Ниту еден коефициент не е статистички значаен.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: Извозници на автомобили.<\/strong> Со <code>trade_cars_2022.xlsx<\/code>, споредете ги следниве модели според точноста од вкрстена валидација: само БДП; БДП, FDI и капитал; и сите три со логаритамот од населението. Кои држави со <code>is_exporter = 0<\/code> имаат највисоки предвидени веројатности? Дали некоја од нив е веродостоен кандидат за нов извозник на автомобили? Кои други информации би ги сакале?<\/p>\n","answer":"<p>Со <code>trade_cars_2022.xlsx<\/code>, 150 држави и основна стапка од 50 проценти. Табелата ја прикажува средната вкрстено валидирана точност низ 200 почетни вредности.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Модел<\/th>\n<th align=\"right\">Средна точност<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Само БДП<\/td>\n<td align=\"right\">83.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">БДП, СДИ и капитал<\/td>\n<td align=\"right\">83.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">БДП, СДИ, капитал и логаритам од население<\/td>\n<td align=\"right\">85.6%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Неизвозниците со највисока веројатност во третиот модел се:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">Веројатност<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Бермуди<\/td>\n<td align=\"right\">0.9997<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Уругвај<\/td>\n<td align=\"right\">0.717<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Белорусија<\/td>\n<td align=\"right\">0.619<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Доминиканска Република<\/td>\n<td align=\"right\">0.612<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Костарика<\/td>\n<td align=\"right\">0.493<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Иран<\/td>\n<td align=\"right\">0.465<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Египет<\/td>\n<td align=\"right\">0.463<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Веројатноста на Бермуди го одразува само многу високиот БДП по жител, па не е веродостојна, бидејќи населението е околу 65,000. Иран и Египет имаат големо население и извесно склопување автомобили, па се поверодостојни. Но запомнете дека „извозник“ овде значи извоз на автомобили по жител над медијаната. Би сакале и информации за постоечката индустрија, трговските договори, платите, извозот на ниво на производ и дали некоја фирма сака да инвестира.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6: Рецесии со повеќе податоци (FRED).<\/strong> Додајте втор предиктор во моделот за рецесија, како промената во стапката на невработеност (<code>UNRATE<\/code>) или индексот на Банката на федерални резерви на Чикаго (<code>CFNAI<\/code>). Дали се подобруваат прецизноста и одзивот? За да избегнете протекување на податоци, осигурете се дека секој предиктор е познат 12 месеци пред исходот. Обидете се со период за обучување до 2000 и тест-период по таа година.<\/p>\n","answer":"<p>Примерок: месеци од март 1967 до септември 2025, со период за обучување до декември 2000 (406 месеци, 65 позитивни) и период за тестирање потоа (297 месеци, 20 позитивни). Предикторите се познати на датумот на прогнозата: распонот, 12-месечната промена на невработеноста и тримесечниот индекс на Федералните резерви од Чикаго.<\/p>\n<p>Резултати од тестирањето:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Праг<\/th>\n<th align=\"left\">Модел<\/th>\n<th align=\"right\">Точност<\/th>\n<th align=\"right\">Прецизност<\/th>\n<th align=\"right\">Одѕив<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">0.15<\/td>\n<td align=\"left\">Распон<\/td>\n<td align=\"right\">0.687<\/td>\n<td align=\"right\">0.124<\/td>\n<td align=\"right\">0.60<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.15<\/td>\n<td align=\"left\">Распон и промена на невработеноста<\/td>\n<td align=\"right\">0.690<\/td>\n<td align=\"right\">0.125<\/td>\n<td align=\"right\">0.60<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.15<\/td>\n<td align=\"left\">Распон и CFNAI<\/td>\n<td align=\"right\">0.710<\/td>\n<td align=\"right\">0.133<\/td>\n<td align=\"right\">0.60<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.30<\/td>\n<td align=\"left\">Распон<\/td>\n<td align=\"right\">0.778<\/td>\n<td align=\"right\">0.129<\/td>\n<td align=\"right\">0.40<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.30<\/td>\n<td align=\"left\">Распон и CFNAI<\/td>\n<td align=\"right\">0.781<\/td>\n<td align=\"right\">0.091<\/td>\n<td align=\"right\">0.25<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">0.50<\/td>\n<td align=\"left\">Распон<\/td>\n<td align=\"right\">0.855<\/td>\n<td align=\"right\">0.074<\/td>\n<td align=\"right\">0.10<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Нема <strong>јасно подобрување<\/strong>. При праг од 0.15, индексот на Федералните резерви од Чикаго малку ги намалува лажните тревоги со ист одѕив, но при 0.30 одѕивот паѓа. Со 20 позитивни месеци од околу две рецесии во тест-периодот, разликите се многу непрецизни. Забележете дека месечните набљудувања се силно зависни.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7 (AI): Поправете ја точноста.<\/strong> Побарајте од разговорен бот 5-кратна вкрстена валидација на моделот во Оддел 10.2-r. Проверете дали пријавува <code>1 - delta<\/code> како точност. Споредете ја неговата бројка со точната и напишете две реченици што ја објаснуваат разликата.<\/p>\n","answer":"<p>Четботите често го наведуваат <code>100 * (1 - cv.err$delta[1])<\/code> или <code>delta[2]<\/code> како точност. Тоа го користи стандардниот трошок, кој е средната квадратна разлика меѓу исходот и веројатноста. Користењето на функцијата за трошок од книгата за погрешна класификација дава околу 86 проценти. Објаснување во две реченици може да биде: „Бројката на четботот е еден минус просечна квадратна грешка, па точно предвидување со помалку од целосна сигурност сепак се казнува. Тоа не е уделот на држави точно класификувани, за што е потребна функција за трошок што ги брои погрешните класификации.“<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8 (AI): Проверка за протекување на податоци.<\/strong> Дајте му ги на разговорен бот имињата и дефинициите на променливите во <code>trade_cars_2022.xlsx<\/code> без да го споменете ова поглавје. Побарајте да го изгради најдобриот можен модел за <code>is_exporter<\/code>. Дали ги користи <code>exports_pc<\/code> или <code>car_exports<\/code>? Дали го забележува проблемот? Што моравте да му кажете?<\/p>\n","answer":"<p>Четбот на кој му е кажано да изгради „најдобар можен модел“ обично ќе вклучи <code>exports_pc<\/code> или <code>car_exports<\/code> и ќе пријави одличен резултат. Ако не испита како е конструирана целта, ќе го пропушти фактот дека <code>is_exporter<\/code> е еднакво на <code>exports_pc &gt; median(exports_pc)<\/code>. Забележете што моравте да му кажете. Потребното упатство е да се исклучи секоја променлива од која може да се пресмета целта или што не би била позната во моментот на предвидувањето.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Вежба 9: Поставете праг.<\/strong> Со моделот за рецесија, претпоставете дека лажна тревога чини 1, а пропуштена рецесија чини $c$. За $c = 2, 5$ и 10, пресметајте го вкупниот трошок при прагови од 0.05 до 0.9 и најдете го најнискиот. Како зависи најдобриот праг од $c$? Кој би ја одредил вредноста на $c$ во практиката?<\/p>\n","answer":"<p>Со моделот за рецесии на целиот примерок (871 месец), прагови од 0.05 до 0.90 со чекор 0.01.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">c (трошок за пропуштен месец на рецесија)<\/th>\n<th align=\"right\">Најдобар праг<\/th>\n<th align=\"right\">Вкупен трошок<\/th>\n<th align=\"right\">Лажни тревоги<\/th>\n<th align=\"right\">Пропуштени месеци<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">2<\/td>\n<td align=\"right\">0.27<\/td>\n<td align=\"right\">187<\/td>\n<td align=\"right\">51<\/td>\n<td align=\"right\">68<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">5<\/td>\n<td align=\"right\">0.14<\/td>\n<td align=\"right\">304<\/td>\n<td align=\"right\">199<\/td>\n<td align=\"right\">21<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">10<\/td>\n<td align=\"right\">0.10<\/td>\n<td align=\"right\">403<\/td>\n<td align=\"right\">263<\/td>\n<td align=\"right\">14<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">m &lt;- glm(rec_12 ~ spread, yc, family = binomial)\np &lt;- predict(m, type = &quot;response&quot;)\ntotal_cost &lt;- function(t, c) sum(p &gt; t &amp; yc$rec_12 == 0) + c * sum(p &lt;= t &amp; yc$rec_12 == 1)\nthresholds &lt;- seq(0.05, 0.9, 0.01)\nthresholds[which.min(sapply(thresholds, total_cost, c = 5))]\n<\/code><\/pre>\n<p><strong>Колку е поголем трошокот за пропуштена рецесија, толку е понизок најдобриот праг.<\/strong> Вредноста на c не е статистичка величина. Во практиката ја одредуваат носителите на политики што се одговорни за последиците, како управниот одбор на централна банка.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Вежба 10 (AI): Напишете го меморандумот.<\/strong> Дајте му ги на разговорен бот двете бројки од примерот со замената на зглобови (10,512 избегнати бесцелни операции и 38,533 одложени операции) и побарајте препорака до министер за здравство. Дали го третира изборот како статистичко прашање? Преработете го меморандумот така што ќе го раздвои она што го покажува моделот од она што мора да го одлучи министерот.<\/p>\n","answer":"<p>Резултатот зависи од одговорот на четботот. Многу од нив ќе препорачаат политика како пресметката да го решава прашањето. Подобра белешка го одделува следново.<\/p>\n<blockquote>\n<p><strong>Што покажува моделот.<\/strong> Пренасочувањето на операциите за 10-те проценти пациенти со највисок ризик би избегнало околу 10,512 бесполезни операции годишно и би пренасочило околу $158 милиони. Исто така, би одложило 38,533 операции за пациенти со висок ризик што би преживеале и би имале корист.<\/p>\n<p><strong>Што мора да одлучи министерот.<\/strong> Дали избегнувањето на 10,512 бесполезни операции го оправдува одложувањето на 38,533 корисни, како да се одмерат болката и ризикот наспроти трошоците и кој има право да биде консултиран при такви одлуки. Пациентите и лекарите треба да бидат дел од секоја таква одлука.<\/p>\n<\/blockquote>\n"}],"title_mk":"Класификација","part_mk":"III. Статистичко учење и предвидување за јавните политики","check":{"status":"Reproduced","seconds":1.1,"book_lines":73,"matched":73,"message":""},"zip_kb":68},{"number":11,"title":"Applications: Economic Structure and Trade","part":"IV. Applications","folder":"ch11-applications","has_code":true,"code_lines":179,"datasets":["data-for-real-regression.xlsx","econgeo_results.rds","eurostat_employment_nuts2.csv","export_example.xlsx","specialization_example.xlsx","trade_matrix_data_2021.xlsx"],"packages":["dplyr","ggplot2","ggrepel","knitr","moments","readxl","scales","tidyverse"],"figures":6,"tables":0,"stories":2,"closers":1,"prompts":3,"exercises":10,"questions":20,"solutions":[{"kind":"q","n":1,"ask":"<p>What is an activity matrix? What do its rows and columns represent?<\/p>\n","answer":"<p>A table recording economic activity by location and sector. The rows are the locations (regions or countries) and the columns are the activities (industries or products). Each entry is the size of that activity in that location.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Why is a high share of an industry in a region's GDP not enough to indicate specialisation?<\/p>\n","answer":"<p>A region may have a large share simply because the industry is large everywhere. Specialisation means that the share is larger than would be expected given the industry's size in the economy as a whole.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Define revealed comparative advantage, and interpret an RCA of 0.72 and of 1.44.<\/p>\n","answer":"<p>RCA is the share of an industry in a region's activity divided by that industry's share in the whole economy. An RCA of 0.72 means the industry is less important in the region than in the economy overall, so there is no comparative advantage. An RCA of 1.44 means its share is 1.44 times the national share, which shows specialisation.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>How is the specialisation matrix constructed from the RCA?<\/p>\n","answer":"<p>Each cell is set to 1 if RCA is greater than 1, and to 0 otherwise.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>What are diversification and ubiquity?<\/p>\n","answer":"<p><strong>Diversification<\/strong> is the number of industries in which a region is specialised. <strong>Ubiquity<\/strong> is the number of regions specialised in an industry.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Why might a less ubiquitous industry bring greater rewards?<\/p>\n","answer":"<p>A rare industry often requires specific capabilities and has higher barriers to entry. It may offer more added value and less competition, so that regions able to develop it can gain more.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>How can two regions have the same diversification and different complexity?<\/p>\n","answer":"<p>Diversification only counts specialisations, while complexity also considers which industries they are. A region specialised in rare industries is more complex than one with the same number of common ones, as with the North and the Mid North in the fictional example.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>What is the difference between <code>morc()<\/code> and <code>mort()<\/code>?<\/p>\n","answer":"<p><code>morc()<\/code> gives the complexity of the rows, which are the regions or countries. <code>mort()<\/code> gives the complexity of the columns, which are the industries or products.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>How is the HHI calculated? What is the relationship between the HHI and diversification?<\/p>\n","answer":"<p>HHI is the sum of the squared shares of each industry in a region's activity. Higher values mean greater concentration, so it is usually negatively related to diversification.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>How does an HHI used by a competition authority differ from the HHI in this chapter?<\/p>\n","answer":"<p>A competition authority adds the squared percentage shares of <strong>firms<\/strong> in a market, so it runs to 10,000 and is related to market power. Here we add the squared shares of <strong>sectors<\/strong> in a region as proportions, so it runs from 0 to 1 and measures dependence on few activities.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Why might the HHI have a positive coefficient in a regression explaining revenue per employee?<\/p>\n","answer":"<p>A concentrated municipality may be dominated by a few large, productive firms, which raise revenue per employee. This can be a result of a single plant buying expensive inputs, so higher revenue does not necessarily reflect more value created.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Why do we take the logarithm of revenue per employee in the regression of this chapter?<\/p>\n","answer":"<p>Revenue per employee is typically skewed to the right. Using its logarithm reduces skewness and stabilises the variance.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>How can one test the claim that a municipality above its predicted revenue per employee will fall back?<\/p>\n","answer":"<p>Calculate each municipality's gap between actual and predicted revenue in the first year. Then regress growth between the two years on that gap. A significantly negative coefficient would support falling back. In the chapter's data, the coefficient is small and not significant at the 5 percent level.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>What does the Product Complexity Index measure?<\/p>\n","answer":"<p>How complex a product is, based on the diversification of the countries that export it and how few countries can do so. Products exported by few countries have a higher PCI.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>What is relatedness density, and how is proximity between products calculated?<\/p>\n","answer":"<p>Relatedness density measures how close a product is to a country's existing exports. It is the weighted share of the product's &quot;proximate&quot; products in which the country has a comparative advantage. Proximity between two products is the number of countries with a comparative advantage in both, divided by the larger of the two products' ubiquities.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Why should relatedness not be used on its own to choose new export products?<\/p>\n","answer":"<p>Relatedness ignores complexity, so it may recommend products that are close but less sophisticated than what a country already exports.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Describe the four quadrants of the diversification diagram.<\/p>\n","answer":"<ul>\n<li><strong>Upper right:<\/strong> high relatedness and complexity above the country's level, the best targets.<\/li>\n<li><strong>Upper left:<\/strong> complex but distant, so high risk and high reward.<\/li>\n<li><strong>Lower right:<\/strong> close but less complex, so easy but with little added value.<\/li>\n<li><strong>Lower left:<\/strong> distant and not complex, a poor choice.<\/li>\n<\/ul>\n"},{"kind":"q","n":18,"ask":"<p>Why might a foreign-owned factory raise a country's measured complexity without raising its capabilities?<\/p>\n","answer":"<p>Export data show where goods were finished, not where the knowledge lies. A foreign-owned plant may process imported components with know-how held abroad, so measured complexity rises without the local economy gaining capabilities.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>How can a gravity model be combined with the diversification diagram? What are the limitations of doing so?<\/p>\n","answer":"<p>Use relatedness and complexity to choose the product, then a gravity model to choose the market. The limitations are that gravity with only GDP and distance has very wide prediction intervals, and that data are usually for total trade and not trade in each product.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Name four checks you should make on complexity measures produced with the help of an AI chatbot.<\/p>\n","answer":"<p>Any four of these: test on a small table; check rows and columns (<code>morc()<\/code> against <code>mort()<\/code>); check the scale of ECI, PCI and HHI; check the year and product classification; compare with published figures; look for a single dominant firm; and separate the data from the interpretation.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: By hand.<\/strong> Using the 3 × 3 matrix in the second prompt of Section 5.7-apps, calculate RCA, the specialisation matrix, diversification, ubiquity and the HHI on paper. Check your results in R.<\/p>\n","answer":"<pre><code class=\"language-r\">X &lt;- matrix(c(10, 0, 10,\n               5, 5,  0,\n               0, 5,  5), 3, byrow = TRUE,\n            dimnames = list(c(&quot;North&quot;, &quot;Centre&quot;, &quot;South&quot;), c(&quot;A&quot;, &quot;B&quot;, &quot;C&quot;)))\nW &lt;- X / rowSums(X)\nWp &lt;- colSums(X) / sum(X)\nRCA &lt;- t(t(W) / Wp)\nM &lt;- (RCA &gt; 1) * 1\nrowSums(M); colSums(M); rowSums(W^2)\n<\/code><\/pre>\n<p>Total activity is 40. Column totals are 15, 10 and 15, so the economy-wide shares are 0.375, 0.25 and 0.375.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">A<\/th>\n<th align=\"right\">B<\/th>\n<th align=\"right\">C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">North<\/td>\n<td align=\"right\">0.5 / 0.375 = 1.33<\/td>\n<td align=\"right\">0<\/td>\n<td align=\"right\">0.5 / 0.375 = 1.33<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Centre<\/td>\n<td align=\"right\">1.33<\/td>\n<td align=\"right\">0.5 / 0.25 = 2<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">South<\/td>\n<td align=\"right\">0<\/td>\n<td align=\"right\">2<\/td>\n<td align=\"right\">1.33<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The <strong>specialisation matrix<\/strong> has a 1 wherever RCA is above 1, so every non-zero cell above becomes 1. <strong>Diversification<\/strong> is 2 for each region. <strong>Ubiquity<\/strong> is 2 for each industry. The <strong>HHI<\/strong> is 0.5² + 0.5² = 0.5 for each region.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Europe's specialised regions (Eurostat).<\/strong> Using <code>eurostat_employment_nuts2.csv<\/code>, find the five regions with the highest RCA in industry (<code>B.E<\/code>). Draw a histogram of the HHI across regions. Then construct a binary matrix and calculate diversification. Do the most diversified regions have the lowest HHI?<\/p>\n","answer":"<p>Using <code>eurostat_employment_nuts2.csv<\/code> (249 regions).<\/p>\n<pre><code class=\"language-r\">emp &lt;- read.csv(&quot;data/eurostat_employment_nuts2.csv&quot;)\nsectors &lt;- c(&quot;A&quot;, &quot;B.E&quot;, &quot;F&quot;, &quot;G.I&quot;, &quot;J&quot;, &quot;K&quot;, &quot;L&quot;, &quot;M_N&quot;, &quot;O.Q&quot;, &quot;R.U&quot;)\nX &lt;- as.matrix(emp[, sectors]); rownames(X) &lt;- emp$name\nshare &lt;- X / rowSums(X); all_share &lt;- colSums(X) / sum(X)\nrca &lt;- t(t(share) / all_share); hhi &lt;- rowSums(share^2)\nsort(rca[, &quot;B.E&quot;], decreasing = TRUE)[1:5]\nhist(hhi)\ndiv &lt;- rowSums(rca &gt; 1)\ncor(div, hhi)\n<\/code><\/pre>\n<p>The highest RCA in industry (<code>B.E<\/code>) is in <strong>Severovýchod (2.33), Vest (2.29), Střední Morava (2.22), Közép-Dunántúl (2.15) and Nyugat-Dunántúl (2.06)<\/strong>: manufacturing regions in Czechia, Romania and Hungary. The HHI ranges from 0.156 to 0.342, with a median of 0.188.<\/p>\n<p>The relationship is negative but not perfect, with a correlation of −0.47. Average HHI falls from 0.279 for regions specialised in one sector to about 0.18 for those specialised in five to seven. <strong>The most diversified regions do not have the lowest HHI.<\/strong> Hovedstaden, Helsinki-Uusimaa and Pomorskie, with seven specialisations, have HHI between 0.17 and 0.19, while the lowest-HHI regions (Yugozapaden, Warszawski stołeczny, Praha and Luxembourg) have four to six. The two measures differ because diversification counts sectors above a threshold, while HHI uses shares of all sectors.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: A region's change over time (Eurostat).<\/strong> Download <code>nama_10r_3empers<\/code> for 2012 and 2022 and compute each region's HHI in both years. Which regions became more concentrated? Do the Western Balkan regions in the data show any pattern?<\/p>\n","answer":"<p>Using <code>nama_10r_3empers<\/code> for 2012 and 2022, downloaded on 10 November 2026, for regions with all ten sectors in both years (253 regions).<\/p>\n<pre><code class=\"language-r\"># After filtering to the ten sectors and NUTS 2 regions:\nhhi &lt;- g %&gt;% group_by(geo, TIME_PERIOD) %&gt;%\n  summarise(hhi = sum((value / sum(value))^2), .groups = &quot;drop&quot;)\n<\/code><\/pre>\n<p>Exactly as many regions became more concentrated as less (126 and 126). The largest increases are in the Greek islands of <strong>Notio Aigaio (+0.077), Ionia Nisia (+0.068), Kriti (+0.038) and Voreio Aigaio (+0.023)<\/strong>, consistent with growing dependence on tourism. Also remove <code>ZZ<\/code> codes such as <code>NLZZ<\/code> (extra-regional territory), which are not regions in the usual sense.<\/p>\n<p>The Western Balkan regions in the data all became <strong>less concentrated<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Region<\/th>\n<th align=\"right\">2012<\/th>\n<th align=\"right\">2022<\/th>\n<th align=\"right\">Change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">North Macedonia<\/td>\n<td align=\"right\">0.177<\/td>\n<td align=\"right\">0.164<\/td>\n<td align=\"right\">−0.013<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Belgrade<\/td>\n<td align=\"right\">0.161<\/td>\n<td align=\"right\">0.158<\/td>\n<td align=\"right\">−0.002<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Vojvodina<\/td>\n<td align=\"right\">0.203<\/td>\n<td align=\"right\">0.177<\/td>\n<td align=\"right\">−0.027<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Šumadija and Western Serbia<\/td>\n<td align=\"right\">0.331<\/td>\n<td align=\"right\">0.257<\/td>\n<td align=\"right\">−0.074<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Southern and Eastern Serbia<\/td>\n<td align=\"right\">0.326<\/td>\n<td align=\"right\">0.234<\/td>\n<td align=\"right\">−0.092<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The biggest falls occurred in the two Serbian regions with large agricultural employment, along with Romania's RO41, which is consistent with people moving out of agriculture.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: The planning regions (MakStat).<\/strong> Download employment or value added by sector for North Macedonia's eight planning regions from the State Statistical Office. Construct the activity matrix, RCA and HHI. Which region is most specialised, and in what?<\/p>\n","answer":"<p>Results depend on what MakStat provides at the time. Construct a matrix with the eight planning regions as rows and sectors as columns. Compute RCA and the HHI with the formulas in E1 and E2. Name the region with the highest HHI and its highest RCA, and check whether the value could reflect a single large employer or a very small sector. With only eight regions, one large plant can dominate the results.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: Above and below the line.<\/strong> For the municipal data, identify the six municipalities closest to their prediction. Re-estimate the model without Ilinden. How do the coefficients change? Does Ilinden meet the definition of an extreme value from Chapter 5, and which of the three situations does it fit?<\/p>\n","answer":"<pre><code class=\"language-r\">d &lt;- as.data.frame(readxl::read_excel(&quot;data/data-for-real-regression.xlsx&quot;))\nd$z1 &lt;- as.vector(scale(d$eci_start)); d$z2 &lt;- as.vector(scale(d$eci_end))\nd$ly &lt;- log(d$income_start)\nm &lt;- lm(ly ~ z1 + hhi_start, d)\nd$pred &lt;- exp(predict(m, data.frame(z1 = d$z2, hhi_start = d$hhi_end)))\nd$ratio &lt;- d$income_end / d$pred\nd[order(abs(log(d$ratio))), c(&quot;municipality&quot;, &quot;income_end&quot;, &quot;pred&quot;, &quot;ratio&quot;)][1:6, ]\nm2 &lt;- lm(ly ~ z1 + hhi_start, d[d$municipality != &quot;ИЛИНДЕН&quot;, ])\n<\/code><\/pre>\n<p>The six municipalities closest to their prediction are <strong>Resen (0.996), Bitola (0.991), Dolneni (1.015), Kisela Voda (1.019), Mogila (1.027) and Kičevo (0.968)<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Coefficient<\/th>\n<th align=\"right\">All 80<\/th>\n<th align=\"right\">Without Ilinden<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">ECI (standardised)<\/td>\n<td align=\"right\">0.312<\/td>\n<td align=\"right\">0.257<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">HHI<\/td>\n<td align=\"right\">1.482<\/td>\n<td align=\"right\">1.274<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">R²<\/td>\n<td align=\"right\">0.394<\/td>\n<td align=\"right\">0.309<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>One municipality noticeably raises both coefficients and R². Ilinden's 2019 revenue per employee is 17,975,410 denars, far beyond the upper boxplot limit of 4,693,462 and almost twice the next highest municipality, and it remains an outlier on a log scale. It is an <strong>extreme value<\/strong>. It fits <strong>Situation 2<\/strong> for a question about typical municipal productivity, because revenue reflects a single large plant buying expensive inputs. It is Situation 3 if you are asking about concentration and export risk. Report results with and without it.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6: Another country's diagram.<\/strong> Using <code>trade_matrix_data_2021.xlsx<\/code> and the <code>EconGeo<\/code> package, draw the diversification diagram for Serbia or Albania. Which products appear in the upper-right quadrant that do not appear for North Macedonia?<\/p>\n","answer":"<p>For Serbia and Albania, the code in the chapter is used with the country code changed. North Macedonia's own suggestion list has 195 products.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Serbia<\/th>\n<th align=\"right\">Albania<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">ECI<\/td>\n<td align=\"right\">68.5<\/td>\n<td align=\"right\">51.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Products in the upper-right quadrant<\/td>\n<td align=\"right\">127<\/td>\n<td align=\"right\">305<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Of which not on North Macedonia's list<\/td>\n<td align=\"right\">69<\/td>\n<td align=\"right\">165<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Correlation of relatedness and complexity<\/td>\n<td align=\"right\">−0.46<\/td>\n<td align=\"right\">−0.69<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Examples of products with the highest relatedness that appear for the country but not for North Macedonia:<\/p>\n<ul>\n<li><strong>Serbia:<\/strong> electrical control boards, rye, fruit-pressing machinery, metal insulating fittings, vinegar, opto-electric instrument parts and motor vehicle parts.<\/li>\n<li><strong>Albania:<\/strong> tissue, paper notebooks, sugar confectionery, twine articles, jams, frozen vegetables and flavoured water.<\/li>\n<\/ul>\n<p>Because the horizontal line is the country's own ECI, Albania's lower ECI gives it a much longer list. The Albanian list is less complex, so a longer list is not an advantage.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7: Complexity and income.<\/strong> Merge the ECI from the trade data with GDP per person from the World Bank for 2021. Plot one against the other and estimate a regression of log income on ECI. Which countries lie far above and far below the line? How does North Macedonia compare?<\/p>\n","answer":"<p>World Bank data, downloaded on 10 November 2026.<\/p>\n<pre><code class=\"language-r\">fit &lt;- lm(log(GDP_2021) ~ eci, z)\nsummary(fit)\n<\/code><\/pre>\n<p>The regression covers 143 countries. The slope on the ECI is <strong>0.049<\/strong> and R² is <strong>0.591<\/strong>. A 10-point higher ECI is associated with about 49 log points higher GDP per person, or roughly 63 percent.<\/p>\n<ul>\n<li><strong>Far above the line:<\/strong> Qatar, Australia, Iceland, Norway and Equatorial Guinea. Most of these are natural resource exporters, with incomes high for their complexity.<\/li>\n<li><strong>Far below the line:<\/strong> Madagascar, India, the Philippines, Pakistan and the Kyrgyz Republic.<\/li>\n<li><strong>North Macedonia<\/strong> has an ECI of 61.8 and GDP per person of about US$7,621 in 2021, compared with a fitted value of about US$12,203, a residual of −0.47. It ranks 96th of 143 by residual, so it is below the line. Remember that the catalyst plant's exports may raise measured complexity.<\/li>\n<\/ul>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8: Project: product and market together.<\/strong> Pick three products from North Macedonia's suggestion list. Using UN Comtrade or BACI, obtain bilateral data for those products. Estimate a gravity model for each product with CEPII variables, and write a two-page note recommending a market for one of them. Include prediction intervals, and state what your data cannot show.<\/p>\n","answer":"<p><em>This is a project that depends on the products you choose, and it was not run for these solutions.<\/em><\/p>\n<p>Use BACI for bilateral product-level data, which is the source used for Chapter 1, and CEPII's Gravity variables. A strong note selects three products from the suggestion list and estimates a separate model for each. It reports prediction intervals, compares potential with actual trade, recommends one market with explicit reasons, and acknowledges what the data cannot show: product quality, trade barriers specific to the product, firm capabilities and whether promotion would actually work.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Exercise 9 (AI): Compare a chatbot with a hand calculation.<\/strong> Use the second prompt in Section 5.7-apps. Does the chatbot's hand calculation agree with yours and with R? Record each discrepancy.<\/p>\n","answer":"<p>The correct answers are those in Exercise 1. A chatbot's hand calculation may contain arithmetic errors or confuse shares by row and by column. Note each discrepancy, and check it against R.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Exercise 10 (AI): Fact-check an industrial strategy.<\/strong> Ask a chatbot to write a paragraph on what North Macedonia's export structure says about its economic capabilities. Mark each sentence as supported by this chapter's data, supported by a source you found, or unsupported. Rewrite it, using only the supported sentences.<\/p>\n","answer":"<p>Results will vary. Sentences that can be supported from the chapter include the top export shares (22 percent catalysts, 10.5 percent centrifuges and 7.6 percent insulated wire) and the ECI of 61.8, ranking 53rd of 144. A claim about &quot;deep local capabilities&quot; is unsupported, since export statistics show what left the country. Rewrite the paragraph so that it describes what is exported, notes the concentration and states that the role of foreign-owned plants in building local capabilities needs other evidence.<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што е матрица на активности? Што претставуваат нејзините редови и колони?<\/p>\n","answer":"<p>Табела што ја евидентира економската активност по локација и сектор. Редовите се локациите (региони или држави), а колоните се активностите (индустрии или производи). Секоја ставка е големината на таа активност на таа локација.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Зошто висок удел на една индустрија во БДП на регионот не е доволен за да укаже на специјализација?<\/p>\n","answer":"<p>Еден регион може да има голем удел едноставно затоа што индустријата е голема насекаде. Специјализација значи дека уделот е поголем од очекуваниот со оглед на големината на индустријата во економијата како целина.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Дефинирајте откриена компаративна предност и протолкувајте RCA од 0.72 и од 1.44.<\/p>\n","answer":"<p>RCA е уделот на индустријата во активноста на регионот поделен со уделот на таа индустрија во целата економија. RCA од 0.72 значи дека индустријата е помалку важна во регионот отколку во економијата вкупно, па нема компаративна предност. RCA од 1.44 значи дека нејзиниот удел е 1.44 пати поголем од националниот, што покажува специјализација.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Како се конструира матрицата на специјализација од RCA?<\/p>\n","answer":"<p>Секоја ќелија се поставува на 1 ако RCA е поголем од 1, а инаку на 0.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Што се диверзификација и распространетост?<\/p>\n","answer":"<p><strong>Диверзификација<\/strong> е бројот на индустрии во кои е специјализиран регионот. <strong>Распространетост (ubiquity)<\/strong> е бројот на региони специјализирани во една индустрија.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Зошто помалку распространета индустрија би можела да донесе поголеми придобивки?<\/p>\n","answer":"<p>Ретка индустрија често бара специфични способности и има повисоки бариери за влез. Може да нуди поголема додадена вредност и помала конкуренција, па регионите способни да ја развијат може да добијат повеќе.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Како два региона можат да имаат иста диверзификација, а различна сложеност?<\/p>\n","answer":"<p>Диверзификацијата само ги брои специјализациите, додека сложеноста го зема предвид и кои индустрии се тие. Регион специјализиран во ретки индустрии е посложен од регион со ист број вообичаени индустрии, како Северот и Средниот Север во измислениот пример.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Која е разликата меѓу <code>morc()<\/code> и <code>mort()<\/code>?<\/p>\n","answer":"<p><code>morc()<\/code> ја дава сложеноста на редовите, а тоа се регионите или државите. <code>mort()<\/code> ја дава сложеноста на колоните, а тоа се индустриите или производите.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Како се пресметува HHI? Каква е врската меѓу HHI и диверзификацијата?<\/p>\n","answer":"<p>HHI е збирот на квадратите на уделите на секоја индустрија во активноста на регионот. Повисоките вредности значат поголема концентрација, па обично е негативно поврзан со диверзификацијата.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Како HHI што го користи орган за заштита на конкуренцијата се разликува од HHI во ова поглавје?<\/p>\n","answer":"<p>Органот за заштита на конкуренцијата ги собира квадратите на процентните удели на <strong>фирмите<\/strong> на еден пазар, па збирот оди до 10,000 и е поврзан со пазарната моќ. Овде ги собираме квадратите на уделите на <strong>секторите<\/strong> во регионот како пропорции, па вредноста е од 0 до 1 и мери зависност од малку активности.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Зошто HHI би можел да има позитивен коефициент во регресија што ги објаснува приходите по вработен?<\/p>\n","answer":"<p>Концентрирана општина може да биде доминирана од неколку големи, продуктивни фирми, кои ги зголемуваат приходите по вработен. Тоа може да биде резултат на една фабрика што купува скапи влезни материјали, па повисоките приходи не значат нужно поголема создадена вредност.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Зошто земаме логаритам од приходите по вработен во регресијата од ова поглавје?<\/p>\n","answer":"<p>Приходите по вработен обично се искосени надесно. Користењето на нивниот логаритам ја намалува искосеноста и ја стабилизира варијансата.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Како може да се провери тврдењето дека општина над предвидените приходи по вработен ќе се врати надолу?<\/p>\n","answer":"<p>Пресметајте го јазот на секоја општина меѓу вистинските и предвидените приходи во првата година. Потоа направете регресија на растот меѓу двете години врз тој јаз. Значајно негативен коефициент би го поддржал враќањето кон предвиденото. Во податоците од поглавјето, коефициентот е мал и не е значаен на ниво од 5 проценти.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Што мери индексот на сложеност на производите?<\/p>\n","answer":"<p>Колку е сложен еден производ, врз основа на диверзификацијата на државите што го извезуваат и на тоа колку малку држави можат да го извезуваат. Производите што ги извезуваат малку држави имаат повисок PCI.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Што е густина на сродност и како се пресметува блискоста меѓу производите?<\/p>\n","answer":"<p>Густината на сродност мери колку еден производ е близок до постојниот извоз на државата. Тоа е пондерираниот удел на „блиските“ производи на производот во кои државата има компаративна предност. Блискоста меѓу два производа е бројот на држави со компаративна предност во двата, поделен со поголемата од двете распространетости на производите.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Зошто сродноста не треба да се користи самостојно за избор на нови извозни производи?<\/p>\n","answer":"<p>Сродноста ја игнорира сложеноста, па може да препорача производи што се блиски, но помалку софистицирани од она што државата веќе го извезува.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Опишете ги четирите квадранти на дијаграмот на диверзификација.<\/p>\n","answer":"<ul>\n<li><strong>Горе десно:<\/strong> висока сродност и сложеност над нивото на државата, најдобрите цели.<\/li>\n<li><strong>Горе лево:<\/strong> сложени, но далечни, па висок ризик и висока награда.<\/li>\n<li><strong>Долу десно:<\/strong> блиски, но помалку сложени, па лесни, но со мала додадена вредност.<\/li>\n<li><strong>Долу лево:<\/strong> далечни и несложени, лош избор.<\/li>\n<\/ul>\n"},{"kind":"q","n":18,"ask":"<p>Зошто фабрика во странска сопственост би можела да ја зголеми измерената сложеност на државата без да ги зголеми нејзините способности?<\/p>\n","answer":"<p>Извозните податоци покажуваат каде се завршени стоките, а не каде е знаењето. Фабрика во странска сопственост може да обработува увезени компоненти со знаење што се наоѓа во странство, па измерената сложеност расте без домашната економија да стекнува способности.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Како гравитациски модел може да се комбинира со дијаграмот на диверзификација? Кои се ограничувањата?<\/p>\n","answer":"<p>Користете сродност и сложеност за да го изберете производот, а потоа гравитациски модел за да го изберете пазарот. Ограничувањата се што гравитацијата само со БДП и растојание има многу широки интервали на предвидување и што податоците обично се за вкупната трговија, а не за трговијата со секој производ.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Наведете четири проверки што треба да ги направите на мерките на сложеност создадени со помош на AI-четбот.<\/p>\n","answer":"<p>Кои било четири од овие: тестирајте на мала табела; проверете ги редовите и колоните (<code>morc()<\/code> наспроти <code>mort()<\/code>); проверете ја скалата на ECI, PCI и HHI; проверете ги годината и класификацијата на производите; споредете со објавени бројки; барајте една доминантна фирма; и одделете ги податоците од толкувањето.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Рачно.<\/strong> Користејќи ја матрицата 3 × 3 од второто поттикнување во Оддел 5.7-apps, пресметајте ги на хартија RCA, матрицата на специјализација, диверзификацијата, распространетоста и HHI. Проверете ги резултатите во R.<\/p>\n","answer":"<pre><code class=\"language-r\">X &lt;- matrix(c(10, 0, 10,\n               5, 5,  0,\n               0, 5,  5), 3, byrow = TRUE,\n            dimnames = list(c(&quot;North&quot;, &quot;Centre&quot;, &quot;South&quot;), c(&quot;A&quot;, &quot;B&quot;, &quot;C&quot;)))\nW &lt;- X / rowSums(X)\nWp &lt;- colSums(X) / sum(X)\nRCA &lt;- t(t(W) / Wp)\nM &lt;- (RCA &gt; 1) * 1\nrowSums(M); colSums(M); rowSums(W^2)\n<\/code><\/pre>\n<p>Вкупната активност е 40. Збировите по колони се 15, 10 и 15, па уделите во целата економија се 0.375, 0.25 и 0.375.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">A<\/th>\n<th align=\"right\">B<\/th>\n<th align=\"right\">C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Север<\/td>\n<td align=\"right\">0.5 / 0.375 = 1.33<\/td>\n<td align=\"right\">0<\/td>\n<td align=\"right\">0.5 / 0.375 = 1.33<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Центар<\/td>\n<td align=\"right\">1.33<\/td>\n<td align=\"right\">0.5 / 0.25 = 2<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Југ<\/td>\n<td align=\"right\">0<\/td>\n<td align=\"right\">2<\/td>\n<td align=\"right\">1.33<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Матрицата на специјализација<\/strong> има 1 секаде каде што RCA е над 1, па секоја ненулта ќелија погоре станува 1. <strong>Диверзификацијата<\/strong> е 2 за секој регион. <strong>Распространетоста<\/strong> е 2 за секоја индустрија. <strong>HHI<\/strong> е 0.5² + 0.5² = 0.5 за секој регион.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Специјализираните европски региони (Евростат).<\/strong> Со <code>eurostat_employment_nuts2.csv<\/code>, најдете ги петте региони со највисока RCA во индустријата (<code>B.E<\/code>). Нацртајте хистограм (histogram) на HHI низ регионите. Потоа конструирајте бинарна матрица и пресметајте ја диверзификацијата. Дали најдиверзифицираните региони имаат најнизок HHI?<\/p>\n","answer":"<p>Со <code>eurostat_employment_nuts2.csv<\/code> (249 региони).<\/p>\n<pre><code class=\"language-r\">emp &lt;- read.csv(&quot;data/eurostat_employment_nuts2.csv&quot;)\nsectors &lt;- c(&quot;A&quot;, &quot;B.E&quot;, &quot;F&quot;, &quot;G.I&quot;, &quot;J&quot;, &quot;K&quot;, &quot;L&quot;, &quot;M_N&quot;, &quot;O.Q&quot;, &quot;R.U&quot;)\nX &lt;- as.matrix(emp[, sectors]); rownames(X) &lt;- emp$name\nshare &lt;- X / rowSums(X); all_share &lt;- colSums(X) / sum(X)\nrca &lt;- t(t(share) / all_share); hhi &lt;- rowSums(share^2)\nsort(rca[, &quot;B.E&quot;], decreasing = TRUE)[1:5]\nhist(hhi)\ndiv &lt;- rowSums(rca &gt; 1)\ncor(div, hhi)\n<\/code><\/pre>\n<p>Највисокиот RCA во индустријата (<code>B.E<\/code>) е во <strong>Severovýchod (2.33), Vest (2.29), Střední Morava (2.22), Közép-Dunántúl (2.15) и Nyugat-Dunántúl (2.06)<\/strong>: производствени региони во Чешка, Романија и Унгарија. HHI се движи од 0.156 до 0.342, со медијана 0.188.<\/p>\n<p>Врската е негативна, но не и совршена, со корелација −0.47. Просечниот HHI паѓа од 0.279 за региони специјализирани во еден сектор на околу 0.18 за оние специјализирани во пет до седум. <strong>Најдиверзифицираните региони немаат најнизок HHI.<\/strong> Hovedstaden, Helsinki-Uusimaa и Pomorskie, со седум специјализации, имаат HHI меѓу 0.17 и 0.19, додека регионите со најнизок HHI (Yugozapaden, Warszawski stołeczny, Praha и Luxembourg) имаат четири до шест. Двете мерки се разликуваат бидејќи диверзификацијата ги брои секторите над еден праг, додека HHI ги користи уделите на сите сектори.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Промената на еден регион со текот на времето (Евростат).<\/strong> Преземете <code>nama_10r_3empers<\/code> за 2012 и 2022 и пресметајте го HHI на секој регион во двете години. Кои региони станале поконцентрирани? Дали западнобалканските региони во податоците покажуваат некаков образец?<\/p>\n","answer":"<p>Со <code>nama_10r_3empers<\/code> за 2012 и 2022, преземено на 10 ноември 2026, за региони со сите десет сектори во двете години (253 региони).<\/p>\n<pre><code class=\"language-r\"># After filtering to the ten sectors and NUTS 2 regions:\nhhi &lt;- g %&gt;% group_by(geo, TIME_PERIOD) %&gt;%\n  summarise(hhi = sum((value / sum(value))^2), .groups = &quot;drop&quot;)\n<\/code><\/pre>\n<p>Точно толку региони станаа поконцентрирани колку и помалку концентрирани (126 и 126). Најголемите зголемувања се на грчките острови <strong>Notio Aigaio (+0.077), Ionia Nisia (+0.068), Kriti (+0.038) и Voreio Aigaio (+0.023)<\/strong>, што е во согласност со растечката зависност од туризмот. Отстранете ги и шифрите <code>ZZ<\/code>, како <code>NLZZ<\/code> (екстрарегионална територија), кои не се региони во вообичаена смисла.<\/p>\n<p>Сите западнобалкански региони во податоците станаа <strong>помалку концентрирани<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Регион<\/th>\n<th align=\"right\">2012<\/th>\n<th align=\"right\">2022<\/th>\n<th align=\"right\">Промена<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Северна Македонија<\/td>\n<td align=\"right\">0.177<\/td>\n<td align=\"right\">0.164<\/td>\n<td align=\"right\">−0.013<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Белград<\/td>\n<td align=\"right\">0.161<\/td>\n<td align=\"right\">0.158<\/td>\n<td align=\"right\">−0.002<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Војводина<\/td>\n<td align=\"right\">0.203<\/td>\n<td align=\"right\">0.177<\/td>\n<td align=\"right\">−0.027<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Шумадија и Западна Србија<\/td>\n<td align=\"right\">0.331<\/td>\n<td align=\"right\">0.257<\/td>\n<td align=\"right\">−0.074<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Јужна и Источна Србија<\/td>\n<td align=\"right\">0.326<\/td>\n<td align=\"right\">0.234<\/td>\n<td align=\"right\">−0.092<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Најголемите падови се случија во двата српски региона со голема вработеност во земјоделството, заедно со романскиот RO41, што е во согласност со преминот на луѓето надвор од земјоделството.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Планските региони (МакСтат).<\/strong> Преземете вработеност или додадена вредност по сектори за осумте плански региони на Северна Македонија од Државниот завод за статистика. Конструирајте ги матрицата на активности, RCA и HHI. Кој регион е најспецијализиран и во што?<\/p>\n","answer":"<p>Резултатите зависат од она што МакСтат го обезбедува во тој момент. Конструирајте матрица со осумте плански региони како редови и секторите како колони. Пресметајте RCA и HHI со формулите од E1 и E2. Именувајте го регионот со највисок HHI и неговиот највисок RCA и проверете дали вредноста може да одразува еден голем работодавач или многу мал сектор. Со само осум региони, една голема фабрика може да доминира во резултатите.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: Над и под линијата.<\/strong> За општинските податоци, утврдете ги шесте општини најблиски до своето предвидување. Повторно оценете го моделот без Илинден. Како се менуваат коефициентите? Дали Илинден ја исполнува дефиницијата за екстремна вредност (outlier) од Поглавје 5 и во која од трите ситуации се вклопува?<\/p>\n","answer":"<pre><code class=\"language-r\">d &lt;- as.data.frame(readxl::read_excel(&quot;data/data-for-real-regression.xlsx&quot;))\nd$z1 &lt;- as.vector(scale(d$eci_start)); d$z2 &lt;- as.vector(scale(d$eci_end))\nd$ly &lt;- log(d$income_start)\nm &lt;- lm(ly ~ z1 + hhi_start, d)\nd$pred &lt;- exp(predict(m, data.frame(z1 = d$z2, hhi_start = d$hhi_end)))\nd$ratio &lt;- d$income_end / d$pred\nd[order(abs(log(d$ratio))), c(&quot;municipality&quot;, &quot;income_end&quot;, &quot;pred&quot;, &quot;ratio&quot;)][1:6, ]\nm2 &lt;- lm(ly ~ z1 + hhi_start, d[d$municipality != &quot;ИЛИНДЕН&quot;, ])\n<\/code><\/pre>\n<p>Шесте општини најблиску до нивното предвидување се <strong>Ресен (0.996), Битола (0.991), Долнени (1.015), Кисела Вода (1.019), Могила (1.027) и Кичево (0.968)<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Коефициент<\/th>\n<th align=\"right\">Сите 80<\/th>\n<th align=\"right\">Без Илинден<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">ECI (стандардизиран)<\/td>\n<td align=\"right\">0.312<\/td>\n<td align=\"right\">0.257<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">HHI<\/td>\n<td align=\"right\">1.482<\/td>\n<td align=\"right\">1.274<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">R²<\/td>\n<td align=\"right\">0.394<\/td>\n<td align=\"right\">0.309<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Една општина забележливо ги зголемува и двата коефициенти и R². Приходите по вработен на Илинден во 2019 се 17,975,410 денари, многу над горната граница на кутиестиот дијаграм од 4,693,462 и речиси двојно поголеми од следната највисока општина, а остануваат екстремна вредност и на логаритамска скала. Тоа е <strong>екстремна вредност<\/strong>. Одговара на <strong>Ситуација 2<\/strong> за прашање за типичната општинска продуктивност, бидејќи приходите одразуваат една голема фабрика што купува скапи влезни материјали. Ситуација 3 е ако прашувате за концентрација и извозен ризик. Прикажете ги резултатите со и без неа.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><st
