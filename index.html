"n":9,"ask":"<p>Why is transparency crucial when constructing a composite index?<\/p>\n","answer":"<p>Every step involves a choice that someone could reasonably have made differently. Transparency lets users judge those choices and reproduce the result, which is what allowed the official HDI to be reproduced in this chapter.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Explain the difference between input, process and output indicators.<\/p>\n","answer":"<p>An <strong>input<\/strong> is a resource used, such as hospital beds. A <strong>process<\/strong> indicator describes how a service is delivered, such as the share of patients treated within a time limit. An <strong>output<\/strong> is the result achieved, such as life expectancy. An index should not mix them without a clear reason.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>If two indicators have a correlation above 0.9, should both be included in the composite index? Explain.<\/p>\n","answer":"<p>Not automatically. A correlation above 0.9 suggests the two carry similar information, so including both gives that information extra weight. Keep both only if there is a theoretical reason why they measure different things, and say so.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Imagine that one indicator has a much greater range than the others. What would happen if it were aggregated without normalisation?<\/p>\n","answer":"<p>The indicator with the greatest range would dominate the index, and the other indicators would barely affect the result.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>If you use min-max normalisation and there is an extreme value, how will that affect the index?<\/p>\n","answer":"<p>The extreme value widens the range, so most observations are squeezed into a narrow band near one end. Luxembourg's income does this: North Macedonia scores only 0.057 on GDP per person.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>In what case would you choose geometric over linear aggregation?<\/p>\n","answer":"<p>When you want to encourage progress in all dimensions, and do not believe a strength in one dimension can make up for a weakness in another.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>If a country scores very highly in two dimensions but extremely low in the third, how will its score differ under linear and geometric aggregation?<\/p>\n","answer":"<p>Its linear score can still be fairly high, because the two high scores offset the low one. Its geometric score will be much lower, as the low dimension pulls down the product. If the low score is exactly zero, the geometric score is zero.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Is the choice of weights purely a statistical decision or a value judgement? Explain.<\/p>\n","answer":"<p>It is a value judgement. Statistical methods can describe how indicators vary together, but this is not the same as importance. Deciding how much health should count compared with income is a question of values.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>How does multivariate analysis help in the selection of indicators?<\/p>\n","answer":"<p>It shows which indicators overlap or form groups. This helps avoid including near duplicates and informs choices about weights and aggregation. Scatter plots also reveal outliers and non-linear relationships that a correlation can miss.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Why must an indicator such as the unemployment rate be treated differently from the employment rate when building an index?<\/p>\n","answer":"<p>A higher employment rate is better, while a higher unemployment rate is worse. The unemployment rate must be reversed, or the index will reward high unemployment.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Why can a geometric mean of min-max normalised indicators produce a value of exactly zero? How does the official HDI avoid this?<\/p>\n","answer":"<p>Min-max normalisation always gives 0 to the country with the lowest value of each indicator, and anything multiplied by zero is zero. The official HDI uses fixed goalposts instead of each year's minimum and maximum, so a country's score does not fall to zero simply for being last.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Why does the HDI take the logarithm of income?<\/p>\n","answer":"<p>Because an extra thousand dollars means far more to a poor country than to a rich one. The logarithm reflects these diminishing returns.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>What did <em>Doing Business<\/em> say it did not measure? Why does that matter when comparing its ranking with governance indicators?<\/p>\n","answer":"<p>Its authors said it did not cover security, market size, macroeconomic stability or the prevalence of bribery and corruption. It measured rules as written for a standard company in the largest business city. Governance indicators measure perceptions of how the law works, so a high rank in the first is not evidence about the second.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>What does it mean to say that an index contains an &quot;implicit price&quot; of a year of life?<\/p>\n","answer":"<p>Any index that combines dimensions implies how much of one is &quot;worth the same&quot; as another. If income and longevity can both raise a score, the formula implies how much extra income equals one more year of life, even though nobody chose that number explicitly.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>What is sensitivity analysis, and what would you conclude if a country's rank moved 30 places under other reasonable weights?<\/p>\n","answer":"<p>Sensitivity analysis recalculates the result after changing a choice that could reasonably have been made differently. If a country's rank moves 30 places, its position depends heavily on the weights, and its published rank should not be taken at face value.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>Name four checks you should make before using a composite index built with the help of an AI chatbot.<\/p>\n","answer":"<p>Any four of these: check every indicator's direction; count the countries before and after cleaning; check that min-max results lie between 0 and 1; look for zeros under geometric aggregation; recalculate one country by hand; verify cited weights and methods; and treat explanations as hypotheses.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: An index for 20 countries (World Bank).<\/strong> Download data for 2022 on Life expectancy at birth (<code>SP.DYN.LE00.IN<\/code>), GDP per capita (<code>NY.GDP.PCAP.CD<\/code>) and School enrolment, secondary (% gross, <code>SE.SEC.ENRR<\/code>) for these 20 countries: Germany (DEU), France (FRA), Italy (ITA), Spain (ESP), the Netherlands (NLD), Belgium (BEL), Austria (AUT), Sweden (SWE), Poland (POL), Czechia (CZE), Hungary (HUN), Romania (ROU), Bulgaria (BGR), Greece (GRC), Portugal (PRT), the United States (USA), Canada (CAN), Japan (JPN), South Korea (KOR) and Australia (AUS). (a) Normalise the indicators with min-max normalisation. (b) Construct a composite index with equal weights using linear aggregation. (c) Rank the countries. Then answer: Are the richest countries always ranked highest? Do some countries do well in one dimension but badly in another? Does any country differ significantly from the group?<\/p>\n","answer":"<p>The file <code>wdi_hdi_clean_2022.csv<\/code> contains all 20 countries.<\/p>\n<pre><code class=\"language-r\">library(dplyr)\ncodes &lt;- c(&quot;DEU&quot;,&quot;FRA&quot;,&quot;ITA&quot;,&quot;ESP&quot;,&quot;NLD&quot;,&quot;BEL&quot;,&quot;AUT&quot;,&quot;SWE&quot;,&quot;POL&quot;,&quot;CZE&quot;,\n           &quot;HUN&quot;,&quot;ROU&quot;,&quot;BGR&quot;,&quot;GRC&quot;,&quot;PRT&quot;,&quot;USA&quot;,&quot;CAN&quot;,&quot;JPN&quot;,&quot;KOR&quot;,&quot;AUS&quot;)\nminmax &lt;- function(x) (x - min(x)) / (max(x) - min(x))\n\nr &lt;- read.csv(&quot;data/wdi_hdi_clean_2022.csv&quot;) %&gt;%\n  filter(iso3c %in% codes) %&gt;%\n  mutate(L = minmax(LifeExp), G = minmax(GDPperCap), S = minmax(SecEnroll),\n         linear = (L + G + S) / 3,\n         rank_linear = rank(-linear),\n         rank_gdp = rank(-GDPperCap)) %&gt;%\n  arrange(rank_linear)\n<\/code><\/pre>\n<p><strong>Top five:<\/strong> Australia (0.852), Sweden (0.828), the Netherlands (0.798), Belgium (0.781) and Spain (0.593). <strong>Bottom three:<\/strong> Hungary (0.191), Bulgaria (0.076) and Romania (0.041).<\/p>\n<p>The richest countries are not always ranked highest. The <strong>United States has the highest GDP per person but ranks only 10th<\/strong>, because its life expectancy score is 0.33 and its enrolment score is 0.24. <strong>Spain is 13th on income but 5th overall.<\/strong><\/p>\n<p>Countries with uneven profiles include Japan (life expectancy 1.00 but enrolment 0.31) and Belgium (enrolment 1.00, with gross enrolment of 143 percent). Gross enrolment can exceed 100 percent because it includes students outside the official age group, so a high value is not necessarily better. There is a sharp drop between the top four and the rest.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Geometric aggregation.<\/strong> Using the same normalised indicators, (a) construct an index with geometric aggregation and (b) compare the ranks obtained with linear and geometric aggregation. Which countries change position the most? Does any country score exactly zero, and why?<\/p>\n","answer":"<pre><code class=\"language-r\">r &lt;- r %&gt;%\n  mutate(geometric = (L * G * S)^(1/3),\n         rank_geometric = rank(-geometric, ties.method = &quot;min&quot;),\n         change = rank_linear - rank_geometric) %&gt;%\n  arrange(desc(abs(change)))\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">Linear rank<\/th>\n<th align=\"right\">Geometric rank<\/th>\n<th align=\"right\">Change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Germany<\/td>\n<td align=\"right\">12<\/td>\n<td align=\"right\">9<\/td>\n<td align=\"right\">+3<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Japan<\/td>\n<td align=\"right\">7<\/td>\n<td align=\"right\">10<\/td>\n<td align=\"right\">−3<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Italy<\/td>\n<td align=\"right\">13<\/td>\n<td align=\"right\">11<\/td>\n<td align=\"right\">+2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Portugal<\/td>\n<td align=\"right\">11<\/td>\n<td align=\"right\">13<\/td>\n<td align=\"right\">−2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">United States<\/td>\n<td align=\"right\">10<\/td>\n<td align=\"right\">12<\/td>\n<td align=\"right\">−2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Japan and the United States have very uneven profiles, so they lose. Germany's three scores are more balanced, so it gains.<\/p>\n<p><strong>Bulgaria and Romania score exactly zero.<\/strong> Bulgaria has the lowest life expectancy and GDP per person among the 20, and Romania has the lowest enrolment. Min-max normalisation gives them 0 on those indicators, and multiplying by zero gives zero. They therefore tie at the bottom, which is an artefact of combining these two methods.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: Different weights.<\/strong> Use the same indicators, but assign weights of 0.5 to GDP per capita, 0.3 to life expectancy and 0.2 to school enrolment. (a) Calculate a new index with these weights. (b) Compare it with the equal-weights index. Which countries benefit most from the greater weight on income? How does the choice of weights affect the final ranking?<\/p>\n","answer":"<pre><code class=\"language-r\">r &lt;- r %&gt;%\n  mutate(weighted = 0.5 * G + 0.3 * L + 0.2 * S,\n         rank_weighted = rank(-weighted))\n<\/code><\/pre>\n<p><strong>The United States gains the most, moving from 10th to 5th, followed by Germany, from 12th to 8th.<\/strong> Spain loses the most, falling from 5th to 11th, and Portugal falls from 11th to 14th. The top four and bottom four hardly change. Weights therefore matter most in the middle of the ranking, where countries have similar totals but different profiles, and a higher weight on income reflects a value judgement.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: Correlations.<\/strong> Calculate the correlations among the three indicators. (a) Draw scatter plots for each pair of indicators. (b) Calculate the Pearson correlation. Is there a strong association between any of the indicators?<\/p>\n","answer":"<pre><code class=\"language-r\">vars &lt;- r[, c(&quot;LifeExp&quot;, &quot;GDPperCap&quot;, &quot;SecEnroll&quot;)]\npairs(vars)\nround(cor(vars), 3)\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Life expectancy<\/th>\n<th align=\"right\">GDP per person<\/th>\n<th align=\"right\">Enrolment<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Life expectancy<\/td>\n<td align=\"right\">1<\/td>\n<td align=\"right\">0.435<\/td>\n<td align=\"right\">0.511<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">GDP per person<\/td>\n<td align=\"right\">0.435<\/td>\n<td align=\"right\">1<\/td>\n<td align=\"right\">0.420<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Enrolment<\/td>\n<td align=\"right\">0.511<\/td>\n<td align=\"right\">0.420<\/td>\n<td align=\"right\">1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>All are moderately positive and well below 0.8, so <strong>no pair is strongly associated<\/strong> among these 20 countries. This does not contradict the higher correlations over 136 countries, because this group is much richer and less varied.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: z-scores.<\/strong> For the same indicators, (a) calculate z-score standardisation, (b) construct a composite index with linear aggregation, and (c) compare the results with the index obtained using min-max normalisation. Do the ranks differ significantly? Which method is more sensitive to extreme values?<\/p>\n","answer":"<pre><code class=\"language-r\">z &lt;- function(x) (x - mean(x)) / sd(x)\nr &lt;- r %&gt;%\n  mutate(z_index = (z(LifeExp) + z(GDPperCap) + z(SecEnroll)) / 3,\n         rank_z = rank(-z_index))\ncor(r$rank_linear, r$rank_z, method = &quot;spearman&quot;)\n<\/code><\/pre>\n<p>The ranks are almost identical. The rank correlation is <strong>0.998<\/strong>, and only France and the United States differ, exchanging 9th and 10th place. Here, both methods give similar results because the sample has no large outliers. In general, <strong>min-max is more sensitive<\/strong> because its range depends entirely on the two most extreme values. The z-score is also affected, through the mean and standard deviation, but less.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6: An economic openness index (World Bank).<\/strong> Using the <code>WDI<\/code> package, download these indicators for all countries for 2023: exports as a percentage of GDP (<code>NE.EXP.GNFS.ZS<\/code>), imports as a percentage of GDP (<code>NE.IMP.GNFS.ZS<\/code>) and net foreign direct investment inflows as a percentage of GDP (<code>BX.KLT.DINV.WD.GD.ZS<\/code>). (1) Normalise the indicators with min-max and with rank normalisation (the rank divided by the largest rank). (2) Create two composite indices with linear aggregation and equal weights. (3) Show the values in a table and draw bar charts. (4) Compare the two indices with a scatter plot and explain the differences in up to 150 words. Which countries owe their high score to a single unusual value?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nlibrary(ggplot2)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(exports = &quot;NE.EXP.GNFS.ZS&quot;, imports = &quot;NE.IMP.GNFS.ZS&quot;,\n                       fdi = &quot;BX.KLT.DINV.WD.GD.ZS&quot;),\n         start = 2023, end = 2023, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(exports), !is.na(imports), !is.na(fdi))\n\nminmax &lt;- function(x) (x - min(x)) / (max(x) - min(x))\nrankn  &lt;- function(x) rank(x) / max(rank(x))\n\nd &lt;- d %&gt;%\n  mutate(open_minmax = (minmax(exports) + minmax(imports) + minmax(fdi)) / 3,\n         open_rank = (rankn(exports) + rankn(imports) + rankn(fdi)) / 3)\n\nggplot(d, aes(open_rank, open_minmax, label = iso3c)) +\n  geom_point() + geom_text(vjust = -0.5, size = 2)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. There are <strong>168 countries<\/strong> with all three indicators for 2023.<\/p>\n<p>North Macedonia ranks 20th under min-max and about 14th under ranks. The top places under min-max are Hong Kong (0.77), Luxembourg (0.77), Singapore (0.70), Malta (0.70) and San Marino (0.68). The two indices have a Pearson correlation of 0.79 and a rank correlation of 0.94.<\/p>\n<p>The two approaches differ because min-max is shaped by extremes: exports reach 217 percent of GDP, and FDI runs from −63 percent (Cyprus) to +109 percent (Malta). Rank normalisation removes those distances. <strong>Malta owes much of its score to a single unusual value<\/strong>, net FDI of 109 percent of GDP. In the other direction, Luxembourg falls from 2nd to 45th, Ireland from 7th to 50th and Belgium from 14th to 55th once ranks are used, because their negative FDI counts for little under min-max but puts them low on the ranks. FDI flows through financial centres can be very large and can be negative, so they say little about real investment.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7: An energy efficiency index (World Bank).<\/strong> Download CO~2~ emissions per person (<code>EN.GHG.CO2.PC.CE.AR5<\/code>), energy use per person (<code>EG.USE.PCAP.KG.OE<\/code>) and the share of renewables in total energy (<code>EG.FEC.RNEW.ZS<\/code>) for all countries for the latest year with good coverage. Decide first which way each indicator should point. Then repeat steps 1 to 4 of Exercise 6. What happens to the ranking if you forget to reverse the first two indicators?<\/p>\n","answer":"<p>Decide direction first. <strong>Higher CO₂ per person and higher energy use per person are worse, so reverse them.<\/strong> A higher share of renewables is better.<\/p>\n<pre><code class=\"language-r\">d &lt;- d %&gt;%\n  mutate(eff_minmax = ((1 - minmax(co2)) + (1 - minmax(energy)) + minmax(renewables)) / 3,\n         careless = (minmax(co2) + minmax(energy) + minmax(renewables)) / 3)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. Decide direction first. <strong>Higher CO₂ per person and higher energy use per person are worse, so reverse them.<\/strong> A higher share of renewables is better. The latest year with good coverage of all three is <strong>2021, with 145 countries<\/strong>, since renewables data thin out from 2022.<\/p>\n<p>The <strong>highest scores are the Democratic Republic of Congo, Ethiopia, Uganda, Madagascar and Zimbabwe<\/strong>, and the lowest are Qatar, Bahrain, Trinidad and Tobago and Brunei. North Macedonia ranks 76th under min-max and 75th under ranks. The two indices have a rank correlation of 0.97.<\/p>\n<p>If you forget to reverse the first two indicators, the rank correlation with the correct index falls to just 0.24. <strong>Qatar, the worst country, moves to first<\/strong>, followed by Iceland, Bahrain, Norway and Gabon. The code runs without a warning, as with the careless labour market index in this chapter.<\/p>\n<p>Notice who tops the correct ranking. Very poor countries use little energy and rely on traditional biomass, so a high score here reflects poverty rather than efficiency. That is a problem with the design of this index: the concept should be defined more carefully, for instance as energy use per unit of GDP.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8: Reproduce the HDI over time (UNDP).<\/strong> UNDP's full time series is at <code>hdr.undp.org<\/code> (file <code>HDR25_Composite_indices_complete_time_series.csv<\/code>). Reproduce the HDI for 2010 and 2023 for the Western Balkan countries using the goalposts in this chapter. Which dimension contributed most to each country's progress?<\/p>\n","answer":"<p>Data from UNDP's complete time series. Our calculations match all ten published values to three decimals.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">HDI 2010<\/th>\n<th align=\"right\">HDI 2023<\/th>\n<th align=\"right\">Health change<\/th>\n<th align=\"right\">Education change<\/th>\n<th align=\"right\">Income change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Albania<\/td>\n<td align=\"right\">0.769<\/td>\n<td align=\"right\">0.810<\/td>\n<td align=\"right\">0.020<\/td>\n<td align=\"right\">0.057<\/td>\n<td align=\"right\"><strong>0.080<\/strong><\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Bosnia and Herzegovina<\/td>\n<td align=\"right\">0.725<\/td>\n<td align=\"right\">0.804<\/td>\n<td align=\"right\">0.018<\/td>\n<td align=\"right\"><strong>0.203<\/strong><\/td>\n<td align=\"right\">0.091<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Montenegro<\/td>\n<td align=\"right\">0.815<\/td>\n<td align=\"right\">0.862<\/td>\n<td align=\"right\">0.024<\/td>\n<td align=\"right\"><strong>0.079<\/strong><\/td>\n<td align=\"right\">0.065<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">North Macedonia<\/td>\n<td align=\"right\">0.765<\/td>\n<td align=\"right\">0.815<\/td>\n<td align=\"right\">0.042<\/td>\n<td align=\"right\"><strong>0.093<\/strong><\/td>\n<td align=\"right\">0.053<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Serbia<\/td>\n<td align=\"right\">0.775<\/td>\n<td align=\"right\">0.833<\/td>\n<td align=\"right\">0.043<\/td>\n<td align=\"right\"><strong>0.105<\/strong><\/td>\n<td align=\"right\">0.068<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Each change is the difference in the natural logarithm of the dimension's score. Because the HDI is a geometric mean, these contributions add up: the change in the log of the HDI is one third of their sum. <strong>Education contributed most in four of the five countries, and income contributed most in Albania.<\/strong><\/p>\n<pre><code class=\"language-r\">score &lt;- function(le, eys, mys, gni) {\n  h &lt;- pmin((le - 20) / 65, 1)\n  e &lt;- (pmin(eys / 18, 1) + pmin(mys / 15, 1)) / 2\n  i &lt;- pmin((log(gni) - log(100)) / (log(75000) - log(100)), 1)\n  data.frame(h, e, i, hdi = (h * e * i)^(1/3))\n}\n<\/code><\/pre>\n"},{"kind":"e","n":9,"ask":"<p><strong>Exercise 9: Weights you choose (OECD).<\/strong> Visit the OECD Better Life Index website and download the data. Choose your own weights for the 11 topics and explain each choice in one sentence. Compute the index and then ask a classmate for their weights. How far apart are your rankings? Which country is most sensitive to the difference?<\/p>\n","answer":"<p>The result depends on your own weights, so there is no single answer. A good answer normalises the indicators, gives each weight a reason in a single sentence, and compares the two rankings with a rank correlation and the largest change in rank. Countries with uneven strengths across topics are the most sensitive. Weights are value judgements, so disagreement with your classmate is an expected result rather than an error.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Exercise 10: A regional index (Eurostat).<\/strong> Choose three indicators for NUTS 2 regions from Eurostat's regional statistics, for example GDP per head (<code>nama_10r_2gdp<\/code>), employment and tertiary education. Build a regional development index, including the regions of North Macedonia or a neighbouring country where they are available. Report which regions appear to be the most sensitive to the choice of normalisation.<\/p>\n","answer":"<p>Using <code>eurostat_regions_2022.csv<\/code>, with 269 NUTS 2 regions, and GDP per head, employment and tertiary education.<\/p>\n<pre><code class=\"language-r\">library(dplyr)\ng &lt;- read.csv(&quot;data/eurostat_regions_2022.csv&quot;)\nminmax &lt;- function(x) (x - min(x)) / (max(x) - min(x))\npct &lt;- function(x) rank(x) / length(x)\nr &lt;- g %&gt;%\n  mutate(index_mm = (minmax(gdp_pps) + minmax(employment) + minmax(tertiary)) / 3,\n         index_rank = (pct(gdp_pps) + pct(employment) + pct(tertiary)) / 3,\n         rank_mm = rank(-index_mm), rank_rank = rank(-index_rank),\n         move = rank_mm - rank_rank)\n<\/code><\/pre>\n<p>The two rankings are similar overall, with a rank correlation of <strong>0.989<\/strong> and a median move of <strong>8 places<\/strong>. Particularly sensitive regions are:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Region<\/th>\n<th align=\"right\">Min-max rank<\/th>\n<th align=\"right\">Rank-based rank<\/th>\n<th align=\"right\">Move<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Brussels<\/td>\n<td align=\"right\">20<\/td>\n<td align=\"right\">60.5<\/td>\n<td align=\"right\">−40.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">País Vasco<\/td>\n<td align=\"right\">28<\/td>\n<td align=\"right\">68.5<\/td>\n<td align=\"right\">−40.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Ankara<\/td>\n<td align=\"right\">204<\/td>\n<td align=\"right\">166<\/td>\n<td align=\"right\">+38<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">İstanbul<\/td>\n<td align=\"right\">206<\/td>\n<td align=\"right\">170<\/td>\n<td align=\"right\">+36<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Luxembourg<\/td>\n<td align=\"right\">3<\/td>\n<td align=\"right\">29<\/td>\n<td align=\"right\">−26<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Luxembourg and the Irish regions rank top under min-max because very high GDP per head stretches that indicator. <strong>North Macedonia (MK00) is 233rd under min-max and 238th under ranks.<\/strong> Serbia's Belgrade region is 99th and 126th. Note that high GDP per head in Ireland and Luxembourg may reflect multinational profits and cross-border commuters, as we saw in Chapter 5.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Exercise 11 (AI): Audit a chatbot's index.<\/strong> Give a chatbot the file <code>eurostat_labour_2023.csv<\/code>, a description of the variables and the first prompt in Section 5.7-index, without mentioning direction. Run the code. Did it reverse the unemployment and NEET rates? Then use the second prompt and compare the two rankings. Write a short note saying what you had to correct.<\/p>\n","answer":"<p>Without being told, a chatbot is likely to normalise all the indicators in the same direction, as in the careless index in this chapter, which ranked North Macedonia first. The correct index, with unemployment and NEET rates reversed, ranks North Macedonia 33rd of 34, with Iceland, the Netherlands and Czechia at the top. Report whether the first response reversed the two variables, and what changed with the second prompt.<\/p>\n"},{"kind":"e","n":12,"ask":"<p><strong>Exercise 12 (AI): Argue with the index.<\/strong> Ask a chatbot why a country of your choice ranks where it does in the HDI. Using <code>undp_hdi_2023.csv<\/code>, calculate the three dimension scores for that country and for one neighbour. Mark each statement the chatbot made as confirmed, contradicted or impossible to check with these data.<\/p>\n","answer":"<p>Example: North Macedonia and Albania, from <code>undp_hdi_2023.csv<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Health<\/th>\n<th align=\"right\">Education<\/th>\n<th align=\"right\">Income<\/th>\n<th align=\"right\">HDI<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">North Macedonia<\/td>\n<td align=\"right\">0.883<\/td>\n<td align=\"right\">0.752<\/td>\n<td align=\"right\">0.816<\/td>\n<td align=\"right\">0.815<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Albania<\/td>\n<td align=\"right\">0.917<\/td>\n<td align=\"right\">0.742<\/td>\n<td align=\"right\">0.781<\/td>\n<td align=\"right\">0.810<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The chapter's hand calculation gives 0.751 for education because it uses rounded inputs. North Macedonia has an advantage in income and a small one in education, while Albania has a clear advantage in health. A statement such as &quot;North Macedonia has higher income&quot; is confirmed. &quot;Better governance explains the rank&quot; cannot be checked with these data, because governance is not in the file. A statement that contradicts the table, such as &quot;Albania's higher income&quot;, should be marked as contradicted.<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што е композитен индекс и зошто се користи наместо поединечни показатели?<\/p>\n","answer":"<p>Композитниот индекс комбинира неколку показатели во една мерка, во рамките на наведена теоретска и методолошка рамка. Се користи затоа што некои појави имаат неколку димензии, а една бројка ги олеснува комуникацијата, споредбата на единиците и насочувањето на вниманието.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Дајте два примера на појави што не можат соодветно да се измерат со еден показател и објаснете зошто.<\/p>\n","answer":"<p><strong>Квалитетот на животот<\/strong> ги вклучува здравјето, животниот стандард, образованието, културата и рекреацијата, па самиот приход по жител пропушта голем дел од него. <strong>Економската конкурентност<\/strong> зависи од инфраструктурата, човечкиот капитал, иновациите и даночната политика, што самиот БДП по жител не ги опфаќа.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Кои се шесте основни елементи на композитен индекс?<\/p>\n","answer":"<p>Концепт, димензии, основни показатели, скала, агрегација и пондери.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Која е разликата меѓу концептот и димензиите во структурата на индекс?<\/p>\n","answer":"<p><strong>Концептот<\/strong> е појавата што се мери, како човечкиот развој. <strong>Димензиите<\/strong> се главните аспекти преку кои се мери, како здравјето, образованието и животниот стандард.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Зошто е потребна нормализација пред агрегација?<\/p>\n","answer":"<p>Показателите доаѓаат во различни единици, како години, долари и проценти. Без заедничка скала, показателот со најголемите бројки би доминирал само поради своите единици.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Објаснете ја разликата меѓу линеарна и геометриска агрегација.<\/p>\n","answer":"<p><strong>Линеарната агрегација<\/strong> пресметува пондериран просек, така што силните страни можат целосно да ги надоместат слабостите. <strong>Геометриската агрегација<\/strong> ги множи показателите, секој степенуван со својот пондер, па слабите резултати не можат целосно да се надоместат.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Што значи да се каже дека геометриската средина „ја ограничува компензацијата“?<\/p>\n","answer":"<p>Висок резултат во една димензија не може целосно да надомести низок резултат во друга. Резултатите 0.9, 0.9 и 0.1 имаат ист аритметички просек како и 0.63, 0.63 и 0.64, имено 0.633. Нивните геометриски средини се 0.433 и 0.633.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Кои се предностите и недостатоците на еднаквите пондери?<\/p>\n","answer":"<p>Еднаквите пондери се едноставни и лесни за објаснување. Но тие имплицитно го третираат секој показател како подеднакво важен, а високо корелирани показатели може двапати да ја бројат истата информација.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Зошто транспарентноста е клучна при конструирање композитен индекс?<\/p>\n","answer":"<p>Секој чекор вклучува избор што некој разумно можел да го направи поинаку. Транспарентноста им овозможува на корисниците да ги проценат тие избори и да го репродуцираат резултатот, што овозможи официјалниот HDI да се репродуцира во ова поглавје.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Објаснете ја разликата меѓу влезни, процесни и излезни показатели.<\/p>\n","answer":"<p><strong>Влез<\/strong> е употребен ресурс, како болнички кревети. Показател на <strong>процес<\/strong> опишува како се дава услугата, како уделот на пациенти лекувани во временски рок. <strong>Излез<\/strong> е постигнатиот резултат, како очекуваниот животен век. Индексот не треба да ги меша без јасна причина.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Ако два показатела имаат корелација над 0.9, дали двата треба да се вклучат во композитниот индекс? Објаснете.<\/p>\n","answer":"<p>Не автоматски. Корелација над 0.9 укажува дека двата показатели носат слична информација, па вклучувањето на двата ѝ дава на таа информација дополнителна тежина. Задржете ги двата само ако има теоретска причина зошто мерат различни нешта и кажете го тоа.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Замислете дека еден показател има многу поголем распон (range) од останатите. Што би се случило ако се агрегира без нормализација?<\/p>\n","answer":"<p>Показателот со најголем опсег би доминирал во индексот, а другите показатели речиси не би влијаеле врз резултатот.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Ако користите мин-макс нормализација и има екстремна вредност, како ќе влијае тоа врз индексот?<\/p>\n","answer":"<p>Екстремната вредност го проширува опсегот, па повеќето набљудувања се збиени во тесен појас близу до едниот крај. Тоа го прави приходот на Луксембург: Северна Македонија добива само 0.057 за БДП по жител.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Во кој случај би избрале геометриска наместо линеарна агрегација?<\/p>\n","answer":"<p>Кога сакате да поттикнете напредок во сите димензии и не верувате дека силна страна во една димензија може да надомести слабост во друга.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Ако држава има многу високи оценки во две димензии, но екстремно ниска во третата, како ќе се разликува нејзината оценка при линеарна и геометриска агрегација?<\/p>\n","answer":"<p>Нејзиниот линеарен резултат сепак може да биде прилично висок, бидејќи двата високи резултати го надоместуваат ниското. Нејзиниот геометриски резултат ќе биде многу понизок, бидејќи ниската димензија го намалува производот. Ако нискиот резултат е точно нула, геометрискиот резултат е нула.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Дали изборот на пондери е чисто статистичка одлука или вредносна проценка? Објаснете.<\/p>\n","answer":"<p>Тоа е вредносен суд. Статистичките методи можат да опишат како показателите варираат заедно, но тоа не е исто со важност. Одлуката колку треба да вреди здравјето во споредба со приходот е прашање на вредности.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Како мултиваријантната анализа помага при изборот на показатели?<\/p>\n","answer":"<p>Покажува кои показатели се преклопуваат или формираат групи. Тоа помага да се избегне вклучување речиси дупликати и ги информира изборите за пондери и агрегација. Дијаграмите на расејување откриваат и екстремни вредности и нелинеарни врски што корелацијата може да ги пропушти.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Зошто показател како стапката на невработеност мора да се третира различно од стапката на вработеност при градењето индекс?<\/p>\n","answer":"<p>Повисока стапка на вработеност е подобро, додека повисока стапка на невработеност е полошо. Стапката на невработеност мора да се преврти, инаку индексот ќе ја наградува високата невработеност.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Зошто геометриска средина на мин-макс нормализирани показатели може да даде вредност точно нула? Како официјалниот HDI го избегнува ова?<\/p>\n","answer":"<p>Минимум-максимум нормализацијата секогаш ѝ дава 0 на државата со најниска вредност на секој показател, а сè што е помножено со нула е нула. Официјалниот HDI користи фиксни граници наместо минимумот и максимумот за секоја година, па резултатот на државата не паѓа на нула само затоа што е последна.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Зошто HDI го зема логаритамот на доходот?<\/p>\n","answer":"<p>Затоа што дополнителни илјада долари значат многу повеќе за сиромашна држава отколку за богата. Логаритамот ги одразува овие опаѓачки приноси.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>Што велеше <em>Doing Business<\/em> дека не мери? Зошто е тоа важно кога неговото рангирање се споредува со показатели за управување?<\/p>\n","answer":"<p>Неговите автори рекоа дека не ги опфаќа безбедноста, големината на пазарот, макроекономската стабилност или распространетоста на поткупот и корупцијата. Ги мереше правилата како што се напишани за стандардна компанија во најголемиот деловен град. Показателите за управување ги мерат перцепциите за тоа како функционира законот, па високата позиција на првиот не е доказ за вториот.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>Што значи да се каже дека индекс содржи „имплицитна цена“ на една година живот?<\/p>\n","answer":"<p>Секој индекс што комбинира димензии имплицира колку од едната „вреди исто“ колку другата. Ако и приходот и долговечноста можат да го зголемат резултатот, формулата имплицира колку дополнителен приход е еднаков на уште една година живот, иако никој експлицитно не ја избрал таа бројка.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>Што е анализа на чувствителност и што би заклучиле ако рангот на држава се помести за 30 места при други разумни пондери?<\/p>\n","answer":"<p>Анализата на чувствителност го пресметува резултатот одново откако ќе се промени избор што разумно можел да биде поинаков. Ако позицијата на државата се помести за 30 места, нејзината позиција силно зависи од пондерите и објавената позиција не треба да се прифати без резерва.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>Наведете четири проверки што треба да ги направите пред да користите композитен индекс изграден со помош на AI-четбот.<\/p>\n","answer":"<p>Кои било четири од овие: проверете ја насоката на секој показател; избројте ги државите пред и по чистењето; проверете дали резултатите од минимум-максимум се меѓу 0 и 1; барајте нули при геометриска агрегација; пресметајте една држава рачно; проверете ги наведените пондери и методи; и третирајте ги објаснувањата како хипотези.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Индекс за 20 држави (Светска банка).<\/strong> Преземете податоци за 2022 за очекуван животен век при раѓање (<code>SP.DYN.LE00.IN<\/code>), БДП по жител (<code>NY.GDP.PCAP.CD<\/code>) и запишаност во средно образование (% бруто, <code>SE.SEC.ENRR<\/code>) за овие 20 држави: Германија (DEU), Франција (FRA), Италија (ITA), Шпанија (ESP), Холандија (NLD), Белгија (BEL), Австрија (AUT), Шведска (SWE), Полска (POL), Чешка (CZE), Унгарија (HUN), Романија (ROU), Бугарија (BGR), Грција (GRC), Португалија (PRT), Соединетите Американски Држави (USA), Канада (CAN), Јапонија (JPN), Јужна Кореја (KOR) и Австралија (AUS). (a) Нормализирајте ги показателите со мин-макс нормализација. (b) Конструирајте композитен индекс со еднакви пондери користејќи линеарна агрегација. (c) Рангирајте ги државите. Потоа одговорете: Дали најбогатите држави секогаш се рангирани највисоко? Дали некои држави имаат добри резултати во една димензија, но лоши во друга? Дали некоја држава значително се разликува од групата?<\/p>\n","answer":"<p>Датотеката <code>wdi_hdi_clean_2022.csv<\/code> ги содржи сите 20 држави.<\/p>\n<pre><code class=\"language-r\">library(dplyr)\ncodes &lt;- c(&quot;DEU&quot;,&quot;FRA&quot;,&quot;ITA&quot;,&quot;ESP&quot;,&quot;NLD&quot;,&quot;BEL&quot;,&quot;AUT&quot;,&quot;SWE&quot;,&quot;POL&quot;,&quot;CZE&quot;,\n           &quot;HUN&quot;,&quot;ROU&quot;,&quot;BGR&quot;,&quot;GRC&quot;,&quot;PRT&quot;,&quot;USA&quot;,&quot;CAN&quot;,&quot;JPN&quot;,&quot;KOR&quot;,&quot;AUS&quot;)\nminmax &lt;- function(x) (x - min(x)) / (max(x) - min(x))\n\nr &lt;- read.csv(&quot;data/wdi_hdi_clean_2022.csv&quot;) %&gt;%\n  filter(iso3c %in% codes) %&gt;%\n  mutate(L = minmax(LifeExp), G = minmax(GDPperCap), S = minmax(SecEnroll),\n         linear = (L + G + S) / 3,\n         rank_linear = rank(-linear),\n         rank_gdp = rank(-GDPperCap)) %&gt;%\n  arrange(rank_linear)\n<\/code><\/pre>\n<p><strong>Првите пет:<\/strong> Австралија (0.852), Шведска (0.828), Холандија (0.798), Белгија (0.781) и Шпанија (0.593). <strong>Последните три:<\/strong> Унгарија (0.191), Бугарија (0.076) и Романија (0.041).<\/p>\n<p>Најбогатите држави не се секогаш рангирани највисоко. <strong>Соединетите Американски Држави имаат највисок БДП по жител, но се рангирани само на 10-то место<\/strong>, бидејќи нивниот резултат за очекуван животен век е 0.33, а за запишани во училиште 0.24. <strong>Шпанија е 13-та по приход, но 5-та вкупно.<\/strong><\/p>\n<p>Држави со нерамномерни профили се Јапонија (очекуван животен век 1.00, но запишани 0.31) и Белгија (запишани 1.00, со бруто-запишаност од 143 проценти). Бруто-запишаноста може да надмине 100 проценти бидејќи вклучува ученици надвор од официјалната возрасна група, па високата вредност не е нужно подобра. Постои остар пад меѓу првите четири и останатите.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Геометриска агрегација.<\/strong> Користејќи ги истите нормализирани показатели, (a) конструирајте индекс со геометриска агрегација и (b) споредете ги ранговите добиени со линеарна и геометриска агрегација. Кои држави најмногу ја менуваат позицијата? Дали некоја држава добива точно нула и зошто?<\/p>\n","answer":"<pre><code class=\"language-r\">r &lt;- r %&gt;%\n  mutate(geometric = (L * G * S)^(1/3),\n         rank_geometric = rank(-geometric, ties.method = &quot;min&quot;),\n         change = rank_linear - rank_geometric) %&gt;%\n  arrange(desc(abs(change)))\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">Линеарна позиција<\/th>\n<th align=\"right\">Геометриска позиција<\/th>\n<th align=\"right\">Промена<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Германија<\/td>\n<td align=\"right\">12<\/td>\n<td align=\"right\">9<\/td>\n<td align=\"right\">+3<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Јапонија<\/td>\n<td align=\"right\">7<\/td>\n<td align=\"right\">10<\/td>\n<td align=\"right\">−3<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Италија<\/td>\n<td align=\"right\">13<\/td>\n<td align=\"right\">11<\/td>\n<td align=\"right\">+2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Португалија<\/td>\n<td align=\"right\">11<\/td>\n<td align=\"right\">13<\/td>\n<td align=\"right\">−2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Соединети Американски Држави<\/td>\n<td align=\"right\">10<\/td>\n<td align=\"right\">12<\/td>\n<td align=\"right\">−2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Јапонија и Соединетите Американски Држави имаат многу нерамномерни профили, па губат. Трите резултати на Германија се порамномерни, па таа добива.<\/p>\n<p><strong>Бугарија и Романија имаат резултат точно нула.<\/strong> Бугарија има најнизок очекуван животен век и БДП по жител меѓу 20-те држави, а Романија најниска запишаност. Минимум-максимум нормализацијата им дава 0 за тие показатели, а множењето со нула дава нула. Затоа тие се изедначени на дното, што е артефакт на комбинирањето на овие два методи.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Различни пондери.<\/strong> Користете ги истите показатели, но доделете пондери од 0.5 на БДП по жител, 0.3 на очекуваниот животен век и 0.2 на запишаноста во образование. (a) Пресметајте нов индекс со овие пондери. (b) Споредете го со индексот со еднакви пондери. Кои држави добиваат најмногу од поголемиот пондер на доходот? Како изборот на пондери влијае врз конечното рангирање?<\/p>\n","answer":"<pre><code class=\"language-r\">r &lt;- r %&gt;%\n  mutate(weighted = 0.5 * G + 0.3 * L + 0.2 * S,\n         rank_weighted = rank(-weighted))\n<\/code><\/pre>\n<p><strong>Соединетите Американски Држави добиваат најмногу, поместувајќи се од 10-то на 5-то место, а по нив Германија, од 12-то на 8-мо.<\/strong> Шпанија губи најмногу, паѓајќи од 5-то на 11-то место, а Португалија паѓа од 11-то на 14-то. Првите четири и последните четири речиси не се менуваат. Пондерите затоа се најважни во средината на рангирањето, каде што државите имаат слични вкупни резултати, но различни профили, а поголем пондер на приходот одразува вредносен суд.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Корелации.<\/strong> Пресметајте ги корелациите меѓу трите показатели. (a) Нацртајте дијаграми на растурање за секој пар показатели. (b) Пресметајте ја Пирсоновата корелација. Дали постои силна поврзаност меѓу некои од показателите?<\/p>\n","answer":"<pre><code class=\"language-r\">vars &lt;- r[, c(&quot;LifeExp&quot;, &quot;GDPperCap&quot;, &quot;SecEnroll&quot;)]\npairs(vars)\nround(cor(vars), 3)\n<\/code><\/pre>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Очекуван животен век<\/th>\n<th align=\"right\">БДП по жител<\/th>\n<th align=\"right\">Запишаност<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Очекуван животен век<\/td>\n<td align=\"right\">1<\/td>\n<td align=\"right\">0.435<\/td>\n<td align=\"right\">0.511<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">БДП по жител<\/td>\n<td align=\"right\">0.435<\/td>\n<td align=\"right\">1<\/td>\n<td align=\"right\">0.420<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Запишаност<\/td>\n<td align=\"right\">0.511<\/td>\n<td align=\"right\">0.420<\/td>\n<td align=\"right\">1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Сите се умерено позитивни и многу под 0.8, па <strong>ниту еден пар не е силно поврзан<\/strong> меѓу овие 20 држави. Ова не им противречи на повисоките корелации за 136 држави, бидејќи оваа група е многу побогата и помалку разновидна.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: z-вредности.<\/strong> За истите показатели, (a) пресметајте стандардизација со z-вредности, (b) конструирајте композитен индекс со линеарна агрегација и (c) споредете ги резултатите со индексот добиен со мин-макс нормализација. Дали ранговите значително се разликуваат? Кој метод е почувствителен на екстремни вредности?<\/p>\n","answer":"<pre><code class=\"language-r\">z &lt;- function(x) (x - mean(x)) / sd(x)\nr &lt;- r %&gt;%\n  mutate(z_index = (z(LifeExp) + z(GDPperCap) + z(SecEnroll)) / 3,\n         rank_z = rank(-z_index))\ncor(r$rank_linear, r$rank_z, method = &quot;spearman&quot;)\n<\/code><\/pre>\n<p>Позициите се речиси идентични. Ранговата корелација е <strong>0.998<\/strong>, а се разликуваат само Франција и Соединетите Американски Држави, кои ги разменуваат 9-то и 10-то место. Овде двата методи даваат слични резултати бидејќи примерокот нема големи екстремни вредности. Општо, <strong>минимум-максимум е почувствителен<\/strong> бидејќи неговиот опсег целосно зависи од двете најекстремни вредности. Врз z-вредноста исто така влијаат, преку средната вредност и стандардната девијација, но помалку.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6: Индекс на економска отвореност (Светска банка).<\/strong> Користејќи го пакетот <code>WDI<\/code>, преземете ги овие показатели за сите држави за 2023: извоз како процент од БДП (<code>NE.EXP.GNFS.ZS<\/code>), увоз како процент од БДП (<code>NE.IMP.GNFS.ZS<\/code>) и нето-приливи на странски директни инвестиции како процент од БДП (<code>BX.KLT.DINV.WD.GD.ZS<\/code>). (1) Нормализирајте ги показателите со мин-макс и со нормализација според рангови (рангот поделен со најголемиот ранг). (2) Создајте два композитни индекса со линеарна агрегација и еднакви пондери. (3) Прикажете ги вредностите во табела и нацртајте столбести графикони. (4) Споредете ги двата индекса со дијаграм на растурање и објаснете ги разликите во најмногу 150 зборови. Кои држави ја должат високата оценка на една необична вредност?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\nlibrary(ggplot2)\nd &lt;- WDI(country = &quot;all&quot;,\n         indicator = c(exports = &quot;NE.EXP.GNFS.ZS&quot;, imports = &quot;NE.IMP.GNFS.ZS&quot;,\n                       fdi = &quot;BX.KLT.DINV.WD.GD.ZS&quot;),\n         start = 2023, end = 2023, extra = TRUE) %&gt;%\n  filter(region != &quot;Aggregates&quot;, !is.na(exports), !is.na(imports), !is.na(fdi))\n\nminmax &lt;- function(x) (x - min(x)) / (max(x) - min(x))\nrankn  &lt;- function(x) rank(x) / max(rank(x))\n\nd &lt;- d %&gt;%\n  mutate(open_minmax = (minmax(exports) + minmax(imports) + minmax(fdi)) / 3,\n         open_rank = (rankn(exports) + rankn(imports) + rankn(fdi)) / 3)\n\nggplot(d, aes(open_rank, open_minmax, label = iso3c)) +\n  geom_point() + geom_text(vjust = -0.5, size = 2)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Има <strong>168 држави<\/strong> со сите три показатели за 2023.<\/p>\n<p>Северна Македонија е 20-та со минимум-максимум и околу 14-та со рангови. Првите места со минимум-максимум се Хонгконг (0.77), Луксембург (0.77), Сингапур (0.70), Малта (0.70) и Сан Марино (0.68). Двата индекса имаат Пирсонова корелација 0.79 и рангова корелација 0.94.<\/p>\n<p>Двата пристапа се разликуваат бидејќи минимум-максимум е обликуван од екстремите: извозот достигнува 217 проценти од БДП, а СДИ се движат од −63 проценти (Кипар) до +109 проценти (Малта). Ранговата нормализација ги отстранува тие растојанија. <strong>Малта голем дел од својот резултат го должи на една необична вредност<\/strong>, нето-СДИ од 109 проценти од БДП. Во другата насока, Луксембург паѓа од 2-ро на 45-то место, Ирска од 7-мо на 50-то, а Белгија од 14-то на 55-то кога се користат рангови, бидејќи нивните негативни СДИ малку значат со минимум-максимум, но ги ставаат ниско според ранговите. Теците на СДИ низ финансиските центри можат да бидат многу големи и негативни, па малку кажуваат за вистинските инвестиции.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7: Индекс на енергетска ефикасност (Светска банка).<\/strong> Преземете ги емисиите на CO~2~ по жител (<code>EN.GHG.CO2.PC.CE.AR5<\/code>), користењето енергија по жител (<code>EG.USE.PCAP.KG.OE<\/code>) и уделот на обновливите извори во вкупната енергија (<code>EG.FEC.RNEW.ZS<\/code>) за сите држави за најновата година со добра покриеност. Најпрвин одлучете во која насока треба да биде насочен секој показател. Потоа повторете ги чекорите од 1 до 4 од Вежба 6. Што се случува со рангирањето ако заборавите да ја превртите насоката на првите два показатела?<\/p>\n","answer":"<p>Прво одлучете ја насоката. <strong>Повисок CO₂ по жител и повисока употреба на енергија по жител се полоши, па превртете ги.<\/strong> Поголем удел на обновливи извори е подобар.<\/p>\n<pre><code class=\"language-r\">d &lt;- d %&gt;%\n  mutate(eff_minmax = ((1 - minmax(co2)) + (1 - minmax(energy)) + minmax(renewables)) / 3,\n         careless = (minmax(co2) + minmax(energy) + minmax(renewables)) / 3)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Последната година со добра покриеност на сите три е <strong>2021, со 145 држави<\/strong>, бидејќи податоците за обновливите извори се проредуваат од 2022.<\/p>\n<p><strong>Највисоки резултати имаат Демократска Република Конго, Етиопија, Уганда, Мадагаскар и Зимбабве<\/strong>, а најниски Катар, Бахреин, Тринидад и Тобаго и Брунеј. Северна Македонија е 76-та со минимум-максимум и 75-та со рангови. Двата индекса имаат рангова корелација 0.97.<\/p>\n<p>Ако заборавите да ги превртите првите два показатели, ранговата корелација со точниот индекс паѓа на само 0.24. <strong>Катар, најлошата држава, се поместува на првото место<\/strong>, а по него Исланд, Бахреин, Норвешка и Габон. Кодот се извршува без предупредување, како и кај невнимателниот индекс за пазарот на труд во ова поглавје.<\/p>\n<p>Забележете кој е на врвот на точното рангирање. Многу сиромашните држави користат малку енергија и се потпираат на традиционална биомаса, па високиот резултат овде одразува сиромаштија, а не ефикасност. Тоа е проблем со дизајнот на овој индекс: концептот треба да се дефинира повнимателно, на пример како употреба на енергија по единица БДП.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8: Репродуцирајте го HDI низ времето (UNDP).<\/strong> Целосната временска серија на UNDP е на <code>hdr.undp.org<\/code> (фајл <code>HDR25_Composite_indices_complete_time_series.csv<\/code>). Репродуцирајте го HDI за 2010 и 2023 за државите од Западен Балкан користејќи ги референтните граници од ова поглавје. Која димензија најмногу придонела за напредокот на секоја држава?<\/p>\n","answer":"<p>Податоци од целосните временски серии на UNDP. Нашите пресметки се совпаѓаат со сите десет објавени вредности на три децимали.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">HDI 2010<\/th>\n<th align=\"right\">HDI 2023<\/th>\n<th align=\"right\">Промена на здравјето<\/th>\n<th align=\"right\">Промена на образованието<\/th>\n<th align=\"right\">Промена на приходот<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Албанија<\/td>\n<td align=\"right\">0.769<\/td>\n<td align=\"right\">0.810<\/td>\n<td align=\"right\">0.020<\/td>\n<td align=\"right\">0.057<\/td>\n<td align=\"right\"><strong>0.080<\/strong><\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Босна и Херцеговина<\/td>\n<td align=\"right\">0.725<\/td>\n<td align=\"right\">0.804<\/td>\n<td align=\"right\">0.018<\/td>\n<td align=\"right\"><strong>0.203<\/strong><\/td>\n<td align=\"right\">0.091<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Црна Гора<\/td>\n<td align=\"right\">0.815<\/td>\n<td align=\"right\">0.862<\/td>\n<td align=\"right\">0.024<\/td>\n<td align=\"right\"><strong>0.079<\/strong><\/td>\n<td align=\"right\">0.065<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Северна Македонија<\/td>\n<td align=\"right\">0.765<\/td>\n<td align=\"right\">0.815<\/td>\n<td align=\"right\">0.042<\/td>\n<td align=\"right\"><strong>0.093<\/strong><\/td>\n<td align=\"right\">0.053<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Србија<\/td>\n<td align=\"right\">0.775<\/td>\n<td align=\"right\">0.833<\/td>\n<td align=\"right\">0.043<\/td>\n<td align=\"right\"><strong>0.105<\/strong><\/td>\n<td align=\"right\">0.068<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Секоја промена е разликата во природниот логаритам на резултатот за димензијата. Бидејќи HDI е геометриска средина, овие придонеси се собираат: промената во логаритамот на HDI е една третина од нивниот збир. <strong>Образованието придонело најмногу во четири од петте држави, а приходот придонел најмногу во Албанија.<\/strong><\/p>\n<pre><code class=\"language-r\">score &lt;- function(le, eys, mys, gni) {\n  h &lt;- pmin((le - 20) / 65, 1)\n  e &lt;- (pmin(eys / 18, 1) + pmin(mys / 15, 1)) / 2\n  i &lt;- pmin((log(gni) - log(100)) / (log(75000) - log(100)), 1)\n  data.frame(h, e, i, hdi = (h * e * i)^(1/3))\n}\n<\/code><\/pre>\n"},{"kind":"e","n":9,"ask":"<p><strong>Вежба 9: Пондери по ваш избор (OECD).<\/strong> Посетете ја веб-страницата на Индексот за подобар живот на OECD и преземете ги податоците. Изберете свои пондери за 11-те теми и објаснете го секој избор во една реченица. Пресметајте го индексот, а потоа побарајте пондери од колега од студиите. Колку се разликуваат вашите рангирања? Која држава е најчувствителна на разликата?<\/p>\n","answer":"<p>Резултатот зависи од вашите пондери, па нема единствен одговор. Добриот одговор ги нормализира показателите, му дава на секој пондер причина во една реченица и ги споредува двете рангирања со рангова корелација и со најголемата промена на позицијата. Државите со нерамномерни силни страни низ темите се најчувствителни. Пондерите се вредносни судови, па несогласувањето со вашиот колега е очекуван резултат, а не грешка.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Вежба 10: Регионален индекс (Eurostat).<\/strong> Изберете три показатели за региони NUTS 2 од регионалната статистика на Eurostat, на пример БДП по жител (<code>nama_10r_2gdp<\/code>), вработеност и високо образование. Изградете индекс на регионален развој, вклучувајќи ги регионите на Северна Македонија или на соседна држава каде што се достапни. Наведете кои региони изгледаат најчувствителни на изборот на нормализација.<\/p>\n","answer":"<p>Со <code>eurostat_regions_2022.csv<\/code>, со 269 региони NUTS 2, и БДП по жител, вработеност и терцијарно образование.<\/p>\n<pre><code class=\"language-r\">library(dplyr)\ng &lt;- read.csv(&quot;data/eurostat_regions_2022.csv&quot;)\nminmax &lt;- function(x) (x - min(x)) / (max(x) - min(x))\npct &lt;- function(x) rank(x) / length(x)\nr &lt;- g %&gt;%\n  mutate(index_mm = (minmax(gdp_pps) + minmax(employment) + minmax(tertiary)) / 3,\n         index_rank = (pct(gdp_pps) + pct(employment) + pct(tertiary)) / 3,\n         rank_mm = rank(-index_mm), rank_rank = rank(-index_rank),\n         move = rank_mm - rank_rank)\n<\/code><\/pre>\n<p>Двете рангирања се генерално слични, со рангова корелација <strong>0.989<\/strong> и медијално поместување од <strong>8 места<\/strong>. Особено чувствителни региони се:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Регион<\/th>\n<th align=\"right\">Позиција со минимум-максимум<\/th>\n<th align=\"right\">Позиција со рангови<\/th>\n<th align=\"right\">Поместување<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Брисел<\/td>\n<td align=\"right\">20<\/td>\n<td align=\"right\">60.5<\/td>\n<td align=\"right\">−40.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">País Vasco<\/td>\n<td align=\"right\">28<\/td>\n<td align=\"right\">68.5<\/td>\n<td align=\"right\">−40.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Анкара<\/td>\n<td align=\"right\">204<\/td>\n<td align=\"right\">166<\/td>\n<td align=\"right\">+38<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Истанбул<\/td>\n<td align=\"right\">206<\/td>\n<td align=\"right\">170<\/td>\n<td align=\"right\">+36<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Луксембург<\/td>\n<td align=\"right\">3<\/td>\n<td align=\"right\">29<\/td>\n<td align=\"right\">−26<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Луксембург и ирските региони се на врвот со минимум-максимум бидејќи многу високиот БДП по жител го растегнува тој показател. <strong>Северна Македонија (MK00) е 233-та со минимум-максимум и 238-та со рангови.<\/strong> Белградскиот регион на Србија е 99-ти и 126-ти. Забележете дека високиот БДП по жител во Ирска и Луксембург може да ги одразува профитите на мултинационалните компании и прекуграничните работници, како што видовме во Поглавје 5.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Вежба 11 (AI): Проверете индекс на четбот.<\/strong> Дајте му на четбот фајлот <code>eurostat_labour_2023.csv<\/code>, опис на променливите и првиот промпт во Оддел 5.7-index, без да ја спомнете насоката. Извршете го кодот. Дали ја превртил насоката на стапките на невработеност и NEET? Потоа употребете го вториот промпт и споредете ги двете рангирања. Напишете кратка белешка за тоа што моравте да исправите.<\/p>\n","answer":"<p>Ако не му се каже, четботот веројатно ќе ги нормализира сите показатели во иста насока, како кај невнимателниот индекс во ова поглавје, кој ја рангираше Северна Македонија на прво место. Точниот индекс, со превртени стапки на невработеност и NEET, ја рангира Северна Македонија на 33-то место од 34, со Исланд, Холандија и Чешка на врвот. Наведете дали првиот одговор ги превртел двете променливи и што се променило со второто барање.<\/p>\n"},{"kind":"e","n":12,"ask":"<p><strong>Вежба 12 (AI): Расправајте се со индексот.<\/strong> Прашајте четбот зошто држава по ваш избор го има своето место во HDI. Користејќи <code>undp_hdi_2023.csv<\/code>, пресметајте ги оценките за трите димензии за таа држава и за еден сосед. Означете го секое тврдење на четботот како потврдено, противречно на податоците или невозможно за проверка со овие податоци.<\/p>\n","answer":"<p>Пример: Северна Македонија и Албанија, од <code>undp_hdi_2023.csv<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Здравје<\/th>\n<th align=\"right\">Образование<\/th>\n<th align=\"right\">Приход<\/th>\n<th align=\"right\">HDI<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Северна Македонија<\/td>\n<td align=\"right\">0.883<\/td>\n<td align=\"right\">0.752<\/td>\n<td align=\"right\">0.816<\/td>\n<td align=\"right\">0.815<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Албанија<\/td>\n<td align=\"right\">0.917<\/td>\n<td align=\"right\">0.742<\/td>\n<td align=\"right\">0.781<\/td>\n<td align=\"right\">0.810<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Рачната пресметка во поглавјето дава 0.751 за образованието бидејќи користи заокружени влезни вредности. Северна Македонија има предност кај приходот и мала предност кај образованието, додека Албанија има јасна предност кај здравјето. Тврдење како „Северна Македонија има повисок приход“ е потврдено. „Подоброто управување ја објаснува позицијата“ не може да се провери со овие податоци, бидејќи управувањето не е во датотеката. Тврдење што ѝ противречи на табелата, како „повисокиот приход на Албанија“, треба да се означи како побиено.<\/p>\n"}],"title_mk":"Композитни индекси","part_mk":"II. Опишување на економијата","check":{"status":"Reproduced","seconds":1.5,"book_lines":26,"matched":26,"message":""},"zip_kb":24},{"number":7,"title":"Statistical Learning and Policy Prediction","part":"III. Statistical learning and policy prediction","folder":"ch07-learning","has_code":false,"code_lines":0,"datasets":[],"packages":["dplyr","ggplot2","knitr","moments","scales"],"figures":1,"tables":0,"stories":2,"closers":1,"prompts":3,"exercises":6,"questions":12,"solutions":[{"kind":"q","n":1,"ask":"<p>What is statistical learning? How does it differ from descriptive analysis?<\/p>\n","answer":"<p>Statistical learning is the part of statistics concerned with prediction, also known as machine learning. It estimates values about the past, present and future, even when some information is missing, whereas descriptive analysis is mostly concerned with understanding the structure of the data at hand.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>What is the difference between forecasting, nowcasting and backcasting? Give an example of each.<\/p>\n","answer":"<ul>\n<li><strong>Forecasting<\/strong> estimates something yet to occur, such as next year's growth rate.<\/li>\n<li><strong>Nowcasting<\/strong> estimates the current state when data arrive with a delay, such as this quarter's GDP from electricity use and trade flows.<\/li>\n<li><strong>Backcasting<\/strong> asks which conditions would lead to a known state, such as the path to a future target for sustainable development.<\/li>\n<\/ul>\n"},{"kind":"q","n":3,"ask":"<p>What are independent and dependent variables? What are their other names?<\/p>\n","answer":"<p>Independent variables are the information we have, and the dependent variable is the value we want to estimate. Independent variables are also called <strong>inputs<\/strong>, and the dependent variable the <strong>output<\/strong>.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>What is the difference between supervised and unsupervised learning?<\/p>\n","answer":"<p>In <strong>supervised learning<\/strong>, we know the correct answer for each observation in the data, and the model learns to predict it. In <strong>unsupervised learning<\/strong>, there is no dependent variable, and the model looks for structure or groups in the data.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Explain the difference between regression and classification.<\/p>\n","answer":"<p>Regression predicts a number, such as income or a price. Classification predicts a category, such as whether a firm succeeds or fails.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>What is the difference between a rain dance problem and an umbrella problem?<\/p>\n","answer":"<p>A <strong>rain dance<\/strong> problem depends on whether an action changes the outcome, so it requires a causal answer. An <strong>umbrella<\/strong> problem depends on what will happen anyway, so it requires a prediction.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>In the decomposition of a policy's effect on the payoff, which term requires a prediction and which a causal effect?<\/p>\n","answer":"<p>The first term, ∂π/∂X₀ (Y), needs a <strong>prediction<\/strong> of Y. The second term, (∂π/∂Y)(∂Y/∂X₀), contains the policy's effect on the outcome, so it needs a <strong>causal effect<\/strong>.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Why does an umbrella problem not need an unbiased estimate of each coefficient?<\/p>\n","answer":"<p>The decision depends on the predicted outcome, not on what any variable would do if it were changed. A good umbrella model needs a small prediction error on new cases, and it can do this without an unbiased coefficient on any variable.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Why is hip and knee replacement partly a prediction problem and partly a causal one?<\/p>\n","answer":"<p>Whether replacing a joint reduces pain is a causal question for clinical research. Whether a particular patient will live long enough to benefit is a prediction that must be made before each operation.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>What are the five questions to ask about a decision that depends on a prediction?<\/p>\n","answer":"<ol>\n<li>What is the decision?<\/li>\n<li>What exactly must be predicted?<\/li>\n<li>Does the decision change the outcome?<\/li>\n<li>What does each kind of mistake cost?<\/li>\n<li>What is known at the moment of the decision?<\/li>\n<\/ol>\n"},{"kind":"q","n":11,"ask":"<p>What is the problem of selective labels?<\/p>\n","answer":"<p>We often observe the outcome only for those who were selected. Surgery data contain only people who had surgery, and an inspection model learns only from firms that were inspected. The model therefore knows little about those who were not selected.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Name three checks you should make on a problem specification written by a chatbot.<\/p>\n","answer":"<p>Any three of these: has it answered the question you asked; would each input be known when the decision is made; does causal language appear in a description of a prediction; are data limited to those selected by earlier decisions; is there a simple benchmark; are the named institutions, datasets and laws real; and is personal data protected.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: Rain dance or umbrella?<\/strong> Classify each of these as mainly prediction, mainly causal or both, and answer the five questions in Section 7.2 for two of them: (a) whether to raise the minimum wage; (b) which restaurants to inspect first; (c) whether to build a new free zone; (d) which borrowers a development bank should refuse; (e) how much tax revenue to put in next year's budget.<\/p>\n","answer":"<table>\n<thead>\n<tr>\n<th align=\"left\">Decision<\/th>\n<th align=\"left\">Type<\/th>\n<th align=\"left\">Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">(a) Raising the minimum wage<\/td>\n<td align=\"left\">Mainly causal<\/td>\n<td align=\"left\">The issue is the effect of the policy on employment and wages.<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(b) Restaurants to inspect first<\/td>\n<td align=\"left\">Mainly prediction<\/td>\n<td align=\"left\">Inspectors need to know where violations are most likely.<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(c) Building a new free zone<\/td>\n<td align=\"left\">Mainly causal, with some prediction<\/td>\n<td align=\"left\">The effect of the zone matters, but so does predicted demand from investors.<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(d) Borrowers to refuse<\/td>\n<td align=\"left\">Mainly prediction<\/td>\n<td align=\"left\">The bank needs the probability of default, though the loan itself can affect that.<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(e) Tax revenue for the budget<\/td>\n<td align=\"left\">Mainly prediction<\/td>\n<td align=\"left\">The budget needs a forecast of revenue.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Five questions for <strong>(b)<\/strong>: The decision is the order of inspections, made by the food safety agency. The outcome is a serious violation at the next inspection. Inspection may change later behaviour, but the immediate target is finding existing violations, so it is close to an umbrella. A false alarm wastes an inspection, and a missed case may leave a health hazard in place. Only past inspections, complaints and licence information can be used, and only if available before the inspection.<\/p>\n<p>Five questions for <strong>(e)<\/strong>: The finance ministry decides the budget, and its alternatives are spending levels. The outcome is total tax revenue next year. The budget has some effect on the economy, and so on revenue, which is a causal element. Overestimating leads to unplanned borrowing or cuts, and underestimating leads to unnecessary spending cuts. Only data available when the budget is prepared can be used.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Forecast, nowcast or backcast?<\/strong> For North Macedonia's GDP, unemployment and exports, give one example of each kind of estimate. Which data would be available at the moment of the estimate? Which of the examples would be of most use to the finance ministry, and why?<\/p>\n","answer":"<p>Examples are:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Series<\/th>\n<th align=\"left\">Forecast<\/th>\n<th align=\"left\">Nowcast<\/th>\n<th align=\"left\">Backcast<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">GDP<\/td>\n<td align=\"left\">Growth next year, from current indicators and foreign demand<\/td>\n<td align=\"left\">This quarter's GDP, from industrial production, trade and tax receipts<\/td>\n<td align=\"left\">The path of investment required to reach a target GDP in 2035<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Unemployment<\/td>\n<td align=\"left\">The rate in two years, from demographics and growth<\/td>\n<td align=\"left\">This quarter's rate, from employment service registrations<\/td>\n<td align=\"left\">The training needed to reach a target rate<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Exports<\/td>\n<td align=\"left\">Exports next year, from partners' GDP forecasts<\/td>\n<td align=\"left\">This month's exports, from customs data and partner imports<\/td>\n<td align=\"left\">The sectoral changes needed to reach an export target<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The GDP nowcast and revenue-relevant forecast would be most useful to the finance ministry, because they feed directly into budget and revenue planning, and official GDP data arrive with a delay.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: Supervised or unsupervised?<\/strong> For each task, say which kind of learning applies, and whether it is regression or classification where relevant: (a) grouping municipalities with similar economies; (b) predicting next year's exports; (c) predicting whether a firm will default; (d) combining ten indicators into a single index. Explain what is the output in each supervised case.<\/p>\n","answer":"<ul>\n<li>(a) <strong>Unsupervised<\/strong> learning: clustering, with no output.<\/li>\n<li>(b) <strong>Supervised, regression:<\/strong> the output is next year's value of exports.<\/li>\n<li>(c) <strong>Supervised, classification:<\/strong> the output is default or no default.<\/li>\n<li>(d) <strong>Unsupervised<\/strong> learning: for example, principal component analysis, with no output.<\/li>\n<\/ul>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: The cost of mistakes.<\/strong> A tax authority can audit 500 of 20,000 firms. Write down what a false alarm and a missed case cost, and for whom. Why is &quot;accuracy&quot; a poor way of measuring success in this setting? What would you measure instead?<\/p>\n","answer":"<p>A <strong>false alarm<\/strong> (auditing a compliant firm) wastes the authority's limited time and imposes costs on the firm. A <strong>missed case<\/strong> (not auditing a firm that evades) loses tax revenue, is unfair to compliant firms and may encourage more evasion.<\/p>\n<p>&quot;Accuracy&quot; is a poor measure because only a few firms evade and only 500 of 20,000 can be audited. If 5 percent of firms evade, a rule that says &quot;no firm evades&quot; is 95 percent accurate and useless.<\/p>\n<p>Better measures are the <strong>share of the 500 audits that find evasion<\/strong> (precision among audited firms), the <strong>additional tax recovered per audit<\/strong>, and the share of all evasion captured. Compare them with random audits and with the authority's current selection rules. Remember that outcomes can be observed only for audited firms, the problem of selective labels.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5 (AI): Frame a Macedonian decision.<\/strong> Choose a real decision by a public institution in North Macedonia and use the first prompt in Section 5.7-learning. Mark every statement that you could verify from a public source. Which data would the institution need, and does it hold them?<\/p>\n","answer":"<p>The answer depends on your decision. A good response separates verified statements from the chatbot's assumptions and links to a public source for each verified one. It also lists the required data and who holds them (for example, the Employment Service Agency for registered unemployment). It should note the legal basis and protection of personal data. Do not paste individual records into a chatbot.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6 (AI): Catch the causal story.<\/strong> Find a news article that reports a predictive model or a statistical finding, and use the third prompt in Section 5.7-learning. Do you agree with the chatbot about where the text moves from prediction to cause? Rewrite one sentence so that it claims only what the evidence supports.<\/p>\n","answer":"<p>The answer depends on the article. Look for phrases such as &quot;drives&quot;, &quot;leads to&quot;, &quot;because&quot; or &quot;reduces&quot; attached to a correlation or a predictive score. For example, you could replace &quot;Students who use the app perform better because of the app&quot; with &quot;Students who use the app had higher scores on average, but the study does not show that the app caused the difference.&quot;<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што е статистичко учење? По што се разликува од дескриптивната анализа?<\/p>\n","answer":"<p>Статистичкото учење е делот од статистиката што се занимава со предвидување, познат и како машинско учење. Проценува вредности за минатото, сегашноста и иднината, дури и кога некои информации недостасуваат, додека дескриптивната анализа главно се занимава со разбирање на структурата на податоците што ги имаме.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Која е разликата меѓу прогнозирање, проценување на сегашната состојба и ретроспективно предвидување? Дајте пример за секое.<\/p>\n","answer":"<ul>\n<li><strong>Прогнозирањето (forecasting)<\/strong> проценува нешто што допрва ќе се случи, како стапката на раст следната година.<\/li>\n<li><strong>Тековното проценување (nowcasting)<\/strong> ја проценува сегашната состојба кога податоците пристигнуваат со задоцнување, како БДП за овој квартал од потрошувачката на електрична енергија и трговските текови.<\/li>\n<li><strong>Обратното прогнозирање (backcasting)<\/strong> прашува кои услови би довеле до позната состојба, како патот до идна цел за одржлив развој.<\/li>\n<\/ul>\n"},{"kind":"q","n":3,"ask":"<p>Што се независни и зависни променливи? Кои се нивните други називи?<\/p>\n","answer":"<p>Независните променливи се информациите што ги имаме, а зависната променлива е вредноста што сакаме да ја процениме. Независните променливи се нарекуваат и <strong>влезови<\/strong>, а зависната променлива <strong>излез<\/strong>.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Која е разликата меѓу надгледувано и ненадгледувано учење?<\/p>\n","answer":"<p>Кај <strong>надгледуваното учење<\/strong> го знаеме точниот одговор за секое набљудување во податоците, а моделот учи да го предвидува. Кај <strong>ненадгледуваното учење<\/strong> нема зависна променлива, а моделот бара структура или групи во податоците.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Објаснете ја разликата меѓу регресиона анализа и класификација.<\/p>\n","answer":"<p>Регресијата предвидува број, како приход или цена. Класификацијата предвидува категорија, како тоа дали фирма успева или пропаѓа.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Која е разликата меѓу проблем од типот танц за дожд и проблем од типот чадор?<\/p>\n","answer":"<p>Проблемот со <strong>танцот за дожд<\/strong> зависи од тоа дали дејството го менува исходот, па бара причинско-последичен одговор. Проблемот со <strong>чадорот<\/strong> зависи од тоа што и онака ќе се случи, па бара предвидување.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>При разложувањето на ефектот на политиката врз добивката, кој член бара предвидување, а кој каузален ефект?<\/p>\n","answer":"<p>На првиот член, ∂π/∂X₀ (Y), му треба <strong>предвидување<\/strong> на Y. Вториот член, (∂π/∂Y)(∂Y/∂X₀), го содржи ефектот на политиката врз исходот, па му треба <strong>причински ефект<\/strong>.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Зошто проблем од типот чадор не бара непристрасна процена на секој коефициент?<\/p>\n","answer":"<p>Одлуката зависи од предвидениот исход, а не од тоа што би направила која било променлива ако се промени. На добар модел за проблем со чадор му треба мала грешка на предвидување кај нови случаи, а тоа може да го постигне без непристрасен коефициент за која било променлива.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Зошто замената на колк и колено е делумно проблем на предвидување, а делумно каузален проблем?<\/p>\n","answer":"<p>Дали замената на зглоб ја намалува болката е причинско-последично прашање за клиничките истражувања. Дали одреден пациент ќе живее доволно долго за да има корист е предвидување што мора да се направи пред секоја операција.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Кои се петте прашања што треба да се постават за одлука што зависи од предвидување?<\/p>\n","answer":"<ol>\n<li>Која е одлуката?<\/li>\n<li>Што точно мора да се предвиди?<\/li>\n<li>Дали одлуката го менува исходот?<\/li>\n<li>Колку чини секој вид грешка?<\/li>\n<li>Што се знае во моментот на одлуката?<\/li>\n<\/ol>\n"},{"kind":"q","n":11,"ask":"<p>Што е проблемот на селективни ознаки?<\/p>\n","answer":"<p>Исходот често го набљудуваме само за оние што биле избрани. Податоците за операции ги содржат само луѓето што биле оперирани, а модел за инспекции учи само од фирмите што биле проверени. Затоа моделот знае малку за оние што не биле избрани.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Наведете три проверки што треба да ги направите на спецификација на проблем напишана од разговорен бот.<\/p>\n","answer":"<p>Кои било три од овие: дали одговорил на прашањето што сте го поставиле; дали секој влез би бил познат кога се носи одлуката; дали се појавува причинско-последичен јазик во опис на предвидување; дали податоците се ограничени на оние избрани со претходни одлуки; дали постои едноставен репер; дали именуваните институции, податочни множества и закони се вистински; и дали се заштитени личните податоци.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Танц за дожд или чадор?<\/strong> Класифицирајте го секој од следниве случаи како главно предвидување, главно каузален или двете, а за два од нив одговорете на петте прашања во Оддел 7.2: (а) дали да се зголеми минималната плата; (б) кои ресторани прво да се проверат; (в) дали да се изгради нова слободна зона; (г) кои заемопримачи треба да ги одбие една развојна банка; (д) колкав даночен приход да се предвиди во буџетот за следната година.<\/p>\n","answer":"<table>\n<thead>\n<tr>\n<th align=\"left\">Одлука<\/th>\n<th align=\"left\">Вид<\/th>\n<th align=\"left\">Зошто<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">(а) Зголемување на минималната плата<\/td>\n<td align=\"left\">Главно причинско-последично<\/td>\n<td align=\"left\">Прашањето е ефектот на политиката врз вработеноста и платите.<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(б) Кои ресторани први да се проверат<\/td>\n<td align=\"left\">Главно предвидување<\/td>\n<td align=\"left\">Инспекторите треба да знаат каде прекршоците се најверојатни.<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(в) Изградба на нова слободна зона<\/td>\n<td align=\"left\">Главно причинско-последично, со малку предвидување<\/td>\n<td align=\"left\">Важен е ефектот на зоната, но и предвидената побарувачка од инвеститорите.<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(г) На кои должници да им се одбие кредит<\/td>\n<td align=\"left\">Главно предвидување<\/td>\n<td align=\"left\">На банката ѝ е потребна веројатноста за неплаќање, иако самиот кредит може да влијае врз неа.<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">(д) Даночни приходи за буџетот<\/td>\n<td align=\"left\">Главно предвидување<\/td>\n<td align=\"left\">На буџетот му е потреб
