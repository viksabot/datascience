rong>Вежба 6: Дијаграм на друга држава.<\/strong> Со <code>trade_matrix_data_2021.xlsx<\/code> и пакетот <code>EconGeo<\/code>, нацртајте го дијаграмот на диверзификација за Србија или Албанија. Кои производи се појавуваат во горниот десен квадрант, а не се појавуваат за Северна Македонија?<\/p>\n","answer":"<p>За Србија и Албанија се користи кодот од поглавјето со променета шифра на државата. Сопствената листа на предлози на Северна Македонија има 195 производи.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\"><\/th>\n<th align=\"right\">Србија<\/th>\n<th align=\"right\">Албанија<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">ECI<\/td>\n<td align=\"right\">68.5<\/td>\n<td align=\"right\">51.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Производи во горниот десен квадрант<\/td>\n<td align=\"right\">127<\/td>\n<td align=\"right\">305<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Од нив не се на листата на Северна Македонија<\/td>\n<td align=\"right\">69<\/td>\n<td align=\"right\">165<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Корелација на сродноста и сложеноста<\/td>\n<td align=\"right\">−0.46<\/td>\n<td align=\"right\">−0.69<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Примери на производи со највисока сродност што се појавуваат за државата, но не и за Северна Македонија:<\/p>\n<ul>\n<li><strong>Србија:<\/strong> електрични контролни табли, 'рж, машини за цедење овошје, метални изолациски прибори, оцет, делови за оптоелектрични инструменти и делови за моторни возила.<\/li>\n<li><strong>Албанија:<\/strong> марамчиња, хартиени тетратки, шеќерни слатки, производи од канап, џемови, замрзнат зеленчук и ароматизирана вода.<\/li>\n<\/ul>\n<p>Бидејќи хоризонталната линија е сопствениот ECI на државата, понискиот ECI на Албанија ѝ дава многу подолга листа. Албанската листа е помалку сложена, па подолгата листа не е предност.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7: Сложеност и доход.<\/strong> Спојте го ECI од трговските податоци со БДП по жител од Светската банка за 2021. Прикажете ги на графикон еден наспроти друг и оценете регресија на логаритамскиот доход врз ECI. Кои држави се далеку над и далеку под линијата? Како се споредува Северна Македонија?<\/p>\n","answer":"<p>Податоци од Светската банка, преземени на 10 ноември 2026.<\/p>\n<pre><code class=\"language-r\">fit &lt;- lm(log(GDP_2021) ~ eci, z)\nsummary(fit)\n<\/code><\/pre>\n<p>Регресијата опфаќа 143 држави. Наклонот на ECI е <strong>0.049<\/strong>, а R² е <strong>0.591<\/strong>. ECI повисок за 10 поени е поврзан со околу 49 логаритамски поени повисок БДП по жител, односно приближно 63 проценти.<\/p>\n<ul>\n<li><strong>Многу над правата:<\/strong> Катар, Австралија, Исланд, Норвешка и Екваторијална Гвинеја. Повеќето од нив се извозници на природни ресурси, со приходи високи за нивната сложеност.<\/li>\n<li><strong>Многу под правата:<\/strong> Мадагаскар, Индија, Филипини, Пакистан и Киргистан.<\/li>\n<li><strong>Северна Македонија<\/strong> има ECI од 61.8 и БДП по жител од околу US$7,621 во 2021, во споредба со приспособена вредност од околу US$12,203, резидуал од −0.47. На 96-то место е од 143 според резидуалот, па е под правата. Запомнете дека извозот на фабриката за катализатори може да ја зголеми измерената сложеност.<\/li>\n<\/ul>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8: Проект: производ и пазар заедно.<\/strong> Изберете три производи од листата на предлози за Северна Македонија. Со UN Comtrade или BACI, набавете билатерални податоци за нив. Оценете гравитациски модел за секој производ со променливи од CEPII и напишете белешка од две страници со препорака за пазар за еден од нив. Вклучете интервали на предвидување и наведете што вашите податоци не можат да покажат.<\/p>\n","answer":"<p><em>Ова е проект што зависи од производите што ќе ги изберете и не е извршен за овие решенија.<\/em><\/p>\n<p>Користете BACI за билатерални податоци на ниво на производ, што е изворот употребен за Поглавје 1, и променливите Gravity на CEPII. Силна белешка избира три производи од листата на предлози и проценува посебен модел за секој. Наведува интервали на предвидување, го споредува потенцијалот со вистинската трговија, препорачува еден пазар со експлицитни причини и признава што податоците не можат да покажат: квалитет на производот, трговски бариери специфични за производот, способности на фирмите и дали промоцијата навистина би функционирала.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Вежба 9 (AI): Споредете четбот со рачна пресметка.<\/strong> Користете го второто поттикнување во Оддел 5.7-apps. Дали рачната пресметка на четботот се согласува со вашата и со R? Забележете го секое несовпаѓање.<\/p>\n","answer":"<p>Точните одговори се оние од Вежба 1. Рачната пресметка на четботот може да содржи аритметички грешки или да ги меша уделите по редови и по колони. Запишете ја секоја разлика и проверете ја со R.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Вежба 10 (AI): Проверете ги фактите во индустриска стратегија.<\/strong> Побарајте од четбот да напише пасус за тоа што извозната структура на Северна Македонија кажува за нејзините економски способности. Означете ја секоја реченица како поткрепена со податоците од поглавјето, поткрепена со извор што сте го нашле или непоткрепена. Препишете го пасусот користејќи ги само поткрепените реченици.<\/p>\n","answer":"<p>Резултатите ќе се разликуваат. Реченици што може да се поддржат од поглавјето ги вклучуваат најголемите извозни удели (22 проценти катализатори, 10.5 проценти центрифуги и 7.6 проценти изолирана жица) и ECI од 61.8, на 53-то место од 144. Тврдење за „длабоки локални способности“ не е поддржано, бидејќи извозните статистики покажуваат што ја напуштило државата. Препишете го пасусот така што ќе опише што се извезува, ќе ја забележи концентрацијата и ќе наведе дека за улогата на фабриките во странска сопственост во градењето локални способности се потребни други докази.<\/p>\n"}],"title_mk":"Примени: економска структура и трговија","part_mk":"IV. Примени","check":{"status":"Reproduced","seconds":2,"book_lines":165,"matched":165,"message":""},"zip_kb":1331},{"number":12,"title":"Applications: Finance","part":"IV. Applications","folder":"ch12-finance","has_code":true,"code_lines":222,"datasets":["french_industries_monthly.csv","hmda_boston.csv","oecd_share_prices.csv","story_account_ownership.csv","story_asian_exchange_rates.csv","wb_financial_development.csv"],"packages":["dplyr","ggplot2","ggrepel","knitr","moments","scales"],"figures":9,"tables":0,"stories":5,"closers":3,"prompts":3,"exercises":11,"questions":19,"solutions":[{"kind":"q","n":1,"ask":"<p>What does the Sharpe ratio measure? Why can it not be used on its own to choose an investment?<\/p>\n","answer":"<p>The Sharpe ratio measures the mean return above the risk-free rate per unit of standard deviation. It cannot be used alone because it ignores how an asset moves with others you hold, the shape of its returns (such as fat tails) and the imprecision of a historical mean.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>What did Markowitz add to the advice to buy the asset with the best expected return?<\/p>\n","answer":"<p>He added risk. Investors care about both expected return and risk, and the risk of a portfolio depends on how its assets move together.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>In the formula for the variance of two assets, what happens if the correlation is 1? What if it is below 1?<\/p>\n","answer":"<p>If the correlation is 1, the portfolio's standard deviation equals the weighted average of the two standard deviations. If it is below 1, the portfolio's standard deviation is lower than that average.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Why can the risk of a portfolio be below the risk of each asset in it?<\/p>\n","answer":"<p>Because when assets do not move perfectly together, gains in some partly offset losses in others. Banks and gold each have a higher risk than a mix of 72 percent banks and 28 percent gold.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>What is systematic risk? Why can diversification not remove it?<\/p>\n","answer":"<p>Systematic risk is the part of risk that all assets share, the risk of the economy itself. Diversification cannot remove it, because spreading money across more assets does not avoid what affects all of them.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>How does standardising returns before <code>kmeans()<\/code> change what &quot;close&quot; means?<\/p>\n","answer":"<p>Standardising makes each industry's returns have the same mean and variance. &quot;Close&quot; then means having highly correlated returns, regardless of the level of risk.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Why were the clusters formed on 2006 to 2015 and tested on 2016 to 2025?<\/p>\n","answer":"<p>To avoid judging the portfolio on the same data used to choose it. Testing on later, unseen data shows whether the clusters are useful and not merely fitted to the past.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>How is beta estimated? What does a beta of 0.5 mean?<\/p>\n","answer":"<p>Beta is the slope of a regression of an asset's excess return on the market's excess return. A beta of 0.5 means the asset tends to rise or fall by 0.5 percent for each 1 percent move in the market.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>What does the CAPM predict about the relationship between beta and mean return? What did we find?<\/p>\n","answer":"<p>The CAPM predicts a line through zero, with a slope equal to the market's mean excess return. We found an intercept of 0.58 and a slope of 0.24, compared with the predicted slope of 0.85, and beta explained only 8 percent of the differences in mean return.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>What is a coexceedance? Why does it use each market's own percentile?<\/p>\n","answer":"<p>A coexceedance is a period in which several markets have an extreme return at the same time. Each market's own percentile is used because a fall of 8 percent means something quite different in Slovenia and in Türkiye.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>How do we calculate the probability of joint falls if markets are independent?<\/p>\n","answer":"<p>Each market is extreme with probability 0.05, so the number of markets extreme in a month follows a binomial distribution. The probability of at least two among six is 1 − dbinom(0, 6, 0.05) − dbinom(1, 6, 0.05), or 3.3 percent.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Why is 93.8 percent accuracy not impressive for the coexceedance model?<\/p>\n","answer":"<p>Because always predicting &quot;no joint fall&quot; is correct 92.5 percent of the time. The model catches only 9 of 24 joint falls, and it uses information from the same month, so it does not forecast.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Why did the bankers argue that the early mortgage data proved nothing? How did the Boston Fed respond?<\/p>\n","answer":"<p>The data lacked applicants' debts, credit records and property values, the variables lenders said mattered. The Boston Fed asked banks which characteristics they used, and collected those details for applicants in 1990.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Why can a logistic coefficient not be read directly as a change in probability?<\/p>\n","answer":"<p>The effect of a coefficient on probability depends on where the observation starts on the logistic curve. A coefficient is a change in log-odds, so the probability changes by different amounts for different applicants.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>What is a proxy variable? Why does removing race from a model not make it fair?<\/p>\n","answer":"<p>A proxy is a variable that carries information about another variable. Income, debt, credit history and location are shaped by the history of race, so a model can reproduce racial patterns without seeing race. It also learns from past decisions that may themselves have been discriminatory.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>What is the difference between the <code>false_flag<\/code> and <code>missed<\/code> rates?<\/p>\n","answer":"<p><code>false_flag<\/code> is the share of applicants actually approved whom the model flags. <code>missed<\/code> is the share of applicants actually denied whom the model does not flag.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Why might a country have high credit to GDP and low financial access?<\/p>\n","answer":"<p>Credit to GDP mostly reflects how much banks lend to existing customers. Access depends on whether ordinary people use banks at all, which is influenced by income, trust, how wages and pensions are paid and the size of the informal economy.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Name three choices made in building the financial development index that could change the ranking.<\/p>\n","answer":"<p>Any three of these: which indicators are included; using logarithms; equal weights; min-max scaling; using the latest available value from different years; and how missing data are handled.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Name four checks you should make on a portfolio analysis produced with the help of a chatbot.<\/p>\n","answer":"<p>Any four of these: check the units; check simple versus logarithmic returns; check the risk-free rate; look for leakage from the test period; count your attempts; compare with the base rate; report results by group; never paste private data; and do not take investment advice from it.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: By hand.<\/strong> Two assets have standard deviations of 8 and 12 percent and a correlation of $-0.3$. Calculate the risk of portfolios with 25, 50 and 75 percent in the first asset. Check the results in R.<\/p>\n","answer":"<p>Using σ_p² = w²(8²) + (1−w)²(12²) + 2w(1−w)(8)(12)(−0.3).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">Share in first asset<\/th>\n<th align=\"left\">Calculation of variance<\/th>\n<th align=\"right\">Standard deviation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">25%<\/td>\n<td align=\"left\">4 + 81 − 10.8 = 74.2<\/td>\n<td align=\"right\"><strong>8.61%<\/strong><\/td>\n<\/tr>\n<tr>\n<td align=\"right\">50%<\/td>\n<td align=\"left\">16 + 36 − 14.4 = 37.6<\/td>\n<td align=\"right\"><strong>6.13%<\/strong><\/td>\n<\/tr>\n<tr>\n<td align=\"right\">75%<\/td>\n<td align=\"left\">36 + 9 − 10.8 = 34.2<\/td>\n<td align=\"right\"><strong>5.85%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">pf &lt;- function(w, s1 = 8, s2 = 12, rho = -0.3) {\n  sqrt(w^2 * s1^2 + (1 - w)^2 * s2^2 + 2 * w * (1 - w) * s1 * s2 * rho)\n}\nsapply(c(0.25, 0.5, 0.75), pf)    # 8.614 6.132 5.848\n<\/code><\/pre>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Risk and return in another period.<\/strong> Repeat the figure in the chapter for 2006 to 2015 and for 2016 to 2025 separately. Which industries change position most? Is the correlation between mean and standard deviation stable?<\/p>\n","answer":"<pre><code class=\"language-r\">fin &lt;- read.csv(&quot;data/french_industries_monthly.csv&quot;, check.names = FALSE)\nr &lt;- as.matrix(fin[, -(1:3)])\nearly &lt;- fin$month &lt;= 201512\n<\/code><\/pre>\n<p><strong>The correlation between mean and standard deviation is not stable: −0.46 in 2006 to 2015 and +0.59 in 2016 to 2025.<\/strong> Standard deviations are much more stable between periods (correlation 0.85) than means (−0.44, so the best and worst industries largely swapped).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Industry<\/th>\n<th align=\"right\">Mean rank, 2006–15<\/th>\n<th align=\"right\">Mean rank, 2016–25<\/th>\n<th align=\"right\">Change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Textiles<\/td>\n<td align=\"right\">2<\/td>\n<td align=\"right\">48<\/td>\n<td align=\"right\">−46<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Coal<\/td>\n<td align=\"right\">48<\/td>\n<td align=\"right\">3<\/td>\n<td align=\"right\">+45<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Gold<\/td>\n<td align=\"right\">47<\/td>\n<td align=\"right\">4<\/td>\n<td align=\"right\">+43<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Construction<\/td>\n<td align=\"right\">46<\/td>\n<td align=\"right\">7<\/td>\n<td align=\"right\">+39<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Steel<\/td>\n<td align=\"right\">45<\/td>\n<td align=\"right\">6<\/td>\n<td align=\"right\">+39<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Beer<\/td>\n<td align=\"right\">8<\/td>\n<td align=\"right\">44<\/td>\n<td align=\"right\">−36<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Risk can be estimated far more reliably than return. A ten-year mean return is a poor guide to the next ten years.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: The cost of a bad pair.<\/strong> Find the pair of industries with the highest correlation. Calculate the lowest possible risk for a portfolio of that pair, and compare it with banks and gold.<\/p>\n","answer":"<p>The most correlated pair is <strong>construction and building materials (0.88)<\/strong>. Their standard deviations are 7.57 and 7.42 percent. The lowest possible portfolio risk is <strong>7.26 percent<\/strong>, with 42 percent in construction. Compare this with banks and gold, whose lowest risk is <strong>5.70 percent<\/strong> despite individual risks of 6.73 and 10.64. Diversifying between two highly correlated assets removes very little risk.<\/p>\n<pre><code class=\"language-r\">C &lt;- cor(r); C[upper.tri(C, TRUE)] &lt;- NA\nwhich(C == max(C, na.rm = TRUE), arr.ind = TRUE)\n<\/code><\/pre>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: How many clusters?<\/strong> Repeat the out-of-sample comparison with three, four and eight clusters. Does the benefit of choosing one asset from each cluster depend on the number of clusters? Is that a reason to choose the number that works best?<\/p>\n","answer":"<p>Clusters are formed on 2006 to 2015, and the standard deviation of each portfolio is measured on 2016 to 2025. Each portfolio has the same number of industries as clusters, and each average is over 2,000 draws.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">Clusters<\/th>\n<th align=\"right\">One from each<\/th>\n<th align=\"right\">Random<\/th>\n<th align=\"right\">Difference<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">3<\/td>\n<td align=\"right\">5.26%<\/td>\n<td align=\"right\">5.54%<\/td>\n<td align=\"right\">0.28<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">4<\/td>\n<td align=\"right\">5.14%<\/td>\n<td align=\"right\">5.38%<\/td>\n<td align=\"right\">0.25<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">6<\/td>\n<td align=\"right\">4.91%<\/td>\n<td align=\"right\">5.20%<\/td>\n<td align=\"right\">0.29<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">8<\/td>\n<td align=\"right\">4.84%<\/td>\n<td align=\"right\">5.11%<\/td>\n<td align=\"right\">0.27<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The benefit is about 0.25 to 0.29 points <strong>regardless of the number of clusters<\/strong>, while portfolios of more industries are less risky for simple reasons. Choosing the number that happens to work best on the test data would turn the test set into part of the choice, which is exactly the leakage the test was designed to avoid. Exact values depend on the seed used for clustering and sampling, which is why these figures differ slightly from the chapter's.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: Beta in two halves.<\/strong> Estimate each industry's beta on 2006 to 2015 and on 2016 to 2025. Draw a scatter plot of one against the other. Which industries changed most? What does this tell you about using a past beta?<\/p>\n","answer":"<pre><code class=\"language-r\">excess &lt;- r - fin$riskfree\nmk &lt;- fin$market_excess\nearly &lt;- fin$month &lt;= 201512\nb &lt;- function(k) apply(excess[k, ], 2, function(y) coef(lm(y ~ mk[k]))[2])\nb1 &lt;- b(early); b2 &lt;- b(!early)\nplot(b1, b2); abline(0, 1)\ncor(b1, b2)\n<\/code><\/pre>\n<p>The correlation between the two periods' betas is <strong>0.85<\/strong>, and the mean absolute change is 0.17. The largest changes are <strong>Coal (1.54 to 1.01), Insurance (1.22 to 0.70), Shipbuilding (1.62 to 1.13), Textiles (1.79 to 1.35), Entertainment (1.72 to 1.31) and Mining (1.62 to 1.22)<\/strong>. All of these fell.<\/p>\n<p>A past beta is a useful guide to an industry's relative market sensitivity, but it is not a constant. Individual values can move substantially, and it is uncertain.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6: A different threshold (coexceedances).<\/strong> Repeat the analysis with the worst 10 percent of months. How does the ratio of actual to independent joint falls change? Then add the return of a second large market, and report whether it improves on the base rate.<\/p>\n","answer":"<table>\n<thead>\n<tr>\n<th align=\"left\">Definition of extreme<\/th>\n<th align=\"right\">Actual, at least two markets<\/th>\n<th align=\"right\">If independent<\/th>\n<th align=\"right\">Ratio<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Worst 5% of months<\/td>\n<td align=\"right\">7.5% (24 months)<\/td>\n<td align=\"right\">3.3%<\/td>\n<td align=\"right\">2.29<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Worst 10% of months<\/td>\n<td align=\"right\">14.4% (46 months)<\/td>\n<td align=\"right\">11.4%<\/td>\n<td align=\"right\">1.26<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The excess of actual over independent falls sharply with the less strict definition. Clustering of joint falls is concentrated at the far extreme of the distribution.<\/p>\n<p>Base rate at the 10 percent level: 85.6 percent of months have no joint fall. The model with Germany and the VIX has an accuracy of <strong>89.1 percent and catches 18 of 46<\/strong>. The file has no other large market, and adding a market from the group, such as Poland, gives 90.9 percent and catches 25. That improvement is misleading, because Poland is one of the six markets counted in the outcome. To test it fairly, use a market from outside the group, such as France or the United Kingdom, downloaded from FRED.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7: Fairness at different thresholds.<\/strong> Calculate the <code>false_flag<\/code> and <code>missed<\/code> rates for both groups at thresholds of 0.1, 0.2, 0.3 and 0.5. Draw them. Can you find a threshold at which the two groups have the same <code>false_flag<\/code> rate? What happens to the other measures?<\/p>\n","answer":"<p>Results on the test set (loans in the training set are the same as in the chapter).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">Threshold<\/th>\n<th align=\"right\">False flag, others<\/th>\n<th align=\"right\">False flag, Black<\/th>\n<th align=\"right\">Missed, others<\/th>\n<th align=\"right\">Missed, Black<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">0.1<\/td>\n<td align=\"right\">19.1%<\/td>\n<td align=\"right\">39.4%<\/td>\n<td align=\"right\">44.4%<\/td>\n<td align=\"right\">24.1%<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">0.2<\/td>\n<td align=\"right\">8.3%<\/td>\n<td align=\"right\">27.3%<\/td>\n<td align=\"right\">61.1%<\/td>\n<td align=\"right\">41.4%<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">0.3<\/td>\n<td align=\"right\">3.9%<\/td>\n<td align=\"right\">15.2%<\/td>\n<td align=\"right\">66.7%<\/td>\n<td align=\"right\">51.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">0.5<\/td>\n<td align=\"right\">1.6%<\/td>\n<td align=\"right\">7.6%<\/td>\n<td align=\"right\">79.6%<\/td>\n<td align=\"right\">69.0%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>No single threshold equates the false-flag rates<\/strong>: the Black applicants' rate is higher throughout. The smallest difference, about one percentage point, occurs near a threshold of 0.62, at which few applicants are flagged at all.<\/p>\n<p>With group-specific thresholds, the false-flag rates can be matched approximately. For example, using 0.2 for others (8.3 percent) and 0.455 for Black applicants (7.6 percent). But the missed rate for Black applicants rises to 65.5 percent, compared with 61.1 percent for others, and the threshold would have to be based on race. You cannot satisfy every definition of fairness at once when groups differ, and choosing among them is a decision about values. The numbers are imprecise, with only 95 Black applicants in the test set.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8: Weights and indicators (World Bank).<\/strong> Add non-performing loans to the financial development index, with the direction reversed. How many countries are lost? Then use the weights from the first principal component, as in Chapter 8. How does the position of North Macedonia change?<\/p>\n","answer":"<p>Adding non-performing loans, with direction reversed, leaves <strong>107 countries<\/strong>, so 18 are lost.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Index<\/th>\n<th align=\"right\">North Macedonia's rank<\/th>\n<th align=\"right\">Countries<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Original three indicators<\/td>\n<td align=\"right\">42<\/td>\n<td align=\"right\">125<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Three indicators, same 107 countries<\/td>\n<td align=\"right\">40<\/td>\n<td align=\"right\">107<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Four indicators with equal weights<\/td>\n<td align=\"right\">38<\/td>\n<td align=\"right\">107<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Four indicators with PCA weights<\/td>\n<td align=\"right\">38<\/td>\n<td align=\"right\">107<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Three indicators with PCA weights<\/td>\n<td align=\"right\">42<\/td>\n<td align=\"right\">125<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">b$npl_good &lt;- 100 - minmax(b$npl)\nb$index4 &lt;- (b$depth + b$access + b$reach + b$npl_good) / 4\n<\/code><\/pre>\n<p>North Macedonia's position hardly changes. PCA weights on four indicators are 0.269, 0.250, 0.258 and 0.223, and on three indicators they are almost equal (0.335, 0.330 and 0.335), so PCA adds little here. Its non-performing loans of 2.7 percent are low, which helps slightly. Check the comparison with care, because dropping 18 countries changes the scale and the rank.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Exercise 9 (AI): A chatbot on your calculation.<\/strong> Use the second prompt in Section 5.7-finance with your own numbers. Did its hand calculation, its formula and its matrix code agree? Record any discrepancy.<\/p>\n","answer":"<p>Use your own numbers, and compare the hand calculation, the formula and the matrix code. With 6 and 10 percent, a correlation of 0.2 and 70 percent in the first asset, the correct answer is 5.63 percent. Record any discrepancy. A common error is using the correlation directly in place of the covariance, or a hand calculation that drops the factor of 2.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Exercise 10 (AI): Audit the advice.<\/strong> Ask a chatbot: &quot;I am a student in Skopje with 1,000 euros. How should I invest?&quot; Mark each sentence as a verifiable fact, a general opinion or something that it could not know about you. What important information did it fail to ask for?<\/p>\n","answer":"<p>Results depend on the reply. &quot;Interest rates change&quot; or &quot;stocks can fall&quot; are general or verifiable statements. The chatbot cannot know your income, debts, time horizon, risk tolerance, need for emergency savings, or tax position. A responsible reply asks about those, and you should note what it failed to ask. It should not state specific assets to buy as if suitable for you. This exercise is about auditing advice and it is not financial advice.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Exercise 11 (AI): Attack a backtest.<\/strong> Use the third prompt on your work in Exercise 4. Which of the chatbot's criticisms are correct? Which are generic? Rewrite your conclusion so that it survives the correct ones.<\/p>\n","answer":"<p>Correct criticisms of your work in Exercise 4 are likely to include trying several numbers of clusters, small differences relative to chance, ignoring trading costs and a single test period. A rewritten conclusion might read: &quot;Over 2016 to 2025, portfolios drawn from different clusters had standard deviations about 0.25 to 0.3 points below those of random portfolios of the same size. We tried four numbers of clusters and report them all, and we have not tested whether the difference would survive in other periods or after costs.&quot;<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што мери Шарповиот коефициент? Зошто не може да се користи самостојно за избор на инвестиција?<\/p>\n","answer":"<p>Шарповиот сооднос го мери средниот принос над безризичната стапка по единица стандардна девијација. Не може да се користи сам бидејќи игнорира како средството се движи заедно со другите што ги имате, формата на неговите приноси (како дебелите опашки) и непрецизноста на историската средна вредност.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Што додал Марковиц кон советот да се купи средството со најдобар очекуван принос?<\/p>\n","answer":"<p>Го додаде ризикот. Инвеститорите се грижат и за очекуваниот принос и за ризикот, а ризикот на портфолиото зависи од тоа како неговите средства се движат заедно.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Во формулата за варијанса на две средства, што се случува ако корелацијата е 1? А ако е под 1?<\/p>\n","answer":"<p>Ако корелацијата е 1, стандардната девијација на портфолиото е еднаква на пондерираниот просек на двете стандардни девијации. Ако е под 1, стандардната девијација на портфолиото е пониска од тој просек.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Зошто ризикот на портфолиото може да биде под ризикот на секое средство во него?<\/p>\n","answer":"<p>Затоа што кога средствата не се движат совршено заедно, добивките кај некои делумно ги надоместуваат загубите кај други. Банките и златото поединечно имаат поголем ризик од мешавина од 72 проценти банки и 28 проценти злато.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Што е систематски ризик? Зошто диверзификацијата не може да го отстрани?<\/p>\n","answer":"<p>Систематскиот ризик е делот од ризикот што го делат сите средства, ризикот на самата економија. Диверзификацијата не може да го отстрани, бидејќи распоредувањето на парите во повеќе средства не го избегнува она што влијае врз сите нив.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Како стандардизирањето на приносите пред <code>kmeans()<\/code> го менува значењето на „блиско“?<\/p>\n","answer":"<p>Стандардизирањето прави приносите на секоја индустрија да имаат иста средна вредност и варијанса. „Блиски“ тогаш значи да имаат високо корелирани приноси, без оглед на нивото на ризик.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Зошто кластерите биле формирани врз 2006 до 2015, а тестирани врз 2016 до 2025?<\/p>\n","answer":"<p>За да се избегне оценување на портфолиото врз истите податоци употребени за неговиот избор. Тестирањето врз подоцнежни, невидени податоци покажува дали кластерите се корисни, а не само приспособени на минатото.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Како се оценува бета? Што значи бета од 0.5?<\/p>\n","answer":"<p>Бета е наклонот на регресијата на вишокот на принос на средството врз вишокот на принос на пазарот. Бета од 0.5 значи дека средството обично расте или паѓа за 0.5 проценти при секое движење на пазарот од 1 процент.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Што предвидува CAPM за врската меѓу бета и средниот принос? Што утврдивме ние?<\/p>\n","answer":"<p>CAPM предвидува права низ нулата, со наклон еднаков на средниот вишок на принос на пазарот. Најдовме пресек од 0.58 и наклон од 0.24, во споредба со предвидениот наклон од 0.85, а бета објасни само 8 проценти од разликите во средниот принос.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Што е заедничко надминување на праг? Зошто се користи сопствениот перцентил на секој пазар?<\/p>\n","answer":"<p>Истовремено надминување (coexceedance) е период во кој неколку пазари имаат екстремен принос во исто време. Се користи сопствениот перцентил на секој пазар бидејќи пад од 8 проценти значи сосема различно нешто во Словенија и во Турција.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Како ја пресметуваме веројатноста за заеднички падови ако пазарите се независни?<\/p>\n","answer":"<p>Секој пазар е екстремен со веројатност 0.05, па бројот на пазари што се екстремни во еден месец следи биномна распределба. Веројатноста за најмалку два од шест е 1 − dbinom(0, 6, 0.05) − dbinom(1, 6, 0.05), односно 3.3 проценти.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Зошто точност од 93.8 проценти не е импресивна за моделот на заеднички надминувања на праг?<\/p>\n","answer":"<p>Затоа што постојаното предвидување „нема заеднички пад“ е точно во 92.5 проценти од случаите. Моделот фаќа само 9 од 24 заеднички падови и користи информации од истиот месец, па не прогнозира.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Зошто банкарите тврделе дека раните хипотекарни податоци не докажуваат ништо? Како одговорила Бостонската банка на федералните резерви?<\/p>\n","answer":"<p>Во податоците недостасуваа долговите на барателите, кредитните досиеја и вредностите на имотите, променливите за кои заемодавачите велеа дека се важни. Федералните резерви од Бостон ги прашаа банките кои карактеристики ги користат и ги собраа тие детали за барателите во 1990.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Зошто логистички коефициент не може директно да се чита како промена во веројатноста?<\/p>\n","answer":"<p>Ефектот на коефициентот врз веројатноста зависи од тоа каде на логистичката крива почнува набљудувањето. Коефициентот е промена во логаритамот на шансите, па веројатноста се менува за различни износи кај различни баратели.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Што е променлива-посреден показател (proxy variable)? Зошто отстранувањето на расата од моделот не го прави праведен?<\/p>\n","answer":"<p>Посредна променлива (proxy) е променлива што носи информација за друга променлива. Приходот, долгот, кредитната историја и локацијата се обликувани од историјата на расата, па моделот може да репродуцира расни шеми без да ја види расата. Исто така учи од минати одлуки што самите можеби биле дискриминаторски.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Која е разликата меѓу стапките <code>false_flag<\/code> и <code>missed<\/code>?<\/p>\n","answer":"<p><code>false_flag<\/code> е уделот на навистина одобрените баратели што моделот ги означува. <code>missed<\/code> е уделот на навистина одбиените баратели што моделот не ги означува.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Зошто држава би можела да има висок сооднос кредити/БДП и низок финансиски пристап?<\/p>\n","answer":"<p>Кредитите во однос на БДП главно одразуваат колку банките им позајмуваат на постојните клиенти. Пристапот зависи од тоа дали обичните луѓе воопшто користат банки, на што влијаат приходот, довербата, начинот на исплата на платите и пензиите и големината на неформалната економија.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Наведете три избори направени при конструирање на индексот на финансиски развој што би можеле да го сменат рангирањето.<\/p>\n","answer":"<p>Кои било три од овие: кои показатели се вклучени; користење логаритми; еднакви пондери; минимум-максимум скалирање; користење на последната достапна вредност од различни години; и како се постапува со недостасувачките податоци.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Наведете четири проверки што треба да ги направите на анализа на портфолио создадена со помош на разговорен бот.<\/p>\n","answer":"<p>Кои било четири од овие: проверете ги единиците; проверете дали се работи за едноставни или логаритамски приноси; проверете ја безризичната стапка; барајте истекување од тест-периодот; избројте ги вашите обиди; споредете со основната стапка; прикажете ги резултатите по групи; никогаш не вметнувајте приватни податоци; и не земајте инвестициски совети од него.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Рачно.<\/strong> Две средства имаат стандардни девијации од 8 и 12 проценти и корелација од $-0.3$. Пресметајте го ризикот на портфолија со 25, 50 и 75 проценти во првото средство. Проверете ги резултатите во R.<\/p>\n","answer":"<p>Со σ_p² = w²(8²) + (1−w)²(12²) + 2w(1−w)(8)(12)(−0.3).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">Удел во првото средство<\/th>\n<th align=\"left\">Пресметка на варијансата<\/th>\n<th align=\"right\">Стандардна девијација<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">25%<\/td>\n<td align=\"left\">4 + 81 − 10.8 = 74.2<\/td>\n<td align=\"right\"><strong>8.61%<\/strong><\/td>\n<\/tr>\n<tr>\n<td align=\"right\">50%<\/td>\n<td align=\"left\">16 + 36 − 14.4 = 37.6<\/td>\n<td align=\"right\"><strong>6.13%<\/strong><\/td>\n<\/tr>\n<tr>\n<td align=\"right\">75%<\/td>\n<td align=\"left\">36 + 9 − 10.8 = 34.2<\/td>\n<td align=\"right\"><strong>5.85%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">pf &lt;- function(w, s1 = 8, s2 = 12, rho = -0.3) {\n  sqrt(w^2 * s1^2 + (1 - w)^2 * s2^2 + 2 * w * (1 - w) * s1 * s2 * rho)\n}\nsapply(c(0.25, 0.5, 0.75), pf)    # 8.614 6.132 5.848\n<\/code><\/pre>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Ризик и принос во друг период.<\/strong> Повторете ја графиконот во поглавјето одделно за 2006 до 2015 и за 2016 до 2025. Кои индустрии најмногу ја менуваат позицијата? Дали корелацијата меѓу средната вредност и стандардната девијација е стабилна?<\/p>\n","answer":"<pre><code class=\"language-r\">fin &lt;- read.csv(&quot;data/french_industries_monthly.csv&quot;, check.names = FALSE)\nr &lt;- as.matrix(fin[, -(1:3)])\nearly &lt;- fin$month &lt;= 201512\n<\/code><\/pre>\n<p><strong>Корелацијата меѓу средната вредност и стандардната девијација не е стабилна: −0.46 во 2006 до 2015 и +0.59 во 2016 до 2025.<\/strong> Стандардните девијации се многу постабилни меѓу периодите (корелација 0.85) отколку средните вредности (−0.44, па најдобрите и најлошите индустрии главно си ги сменија местата).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Индустрија<\/th>\n<th align=\"right\">Позиција по средна вредност, 2006–15<\/th>\n<th align=\"right\">Позиција по средна вредност, 2016–25<\/th>\n<th align=\"right\">Промена<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Текстил<\/td>\n<td align=\"right\">2<\/td>\n<td align=\"right\">48<\/td>\n<td align=\"right\">−46<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Јаглен<\/td>\n<td align=\"right\">48<\/td>\n<td align=\"right\">3<\/td>\n<td align=\"right\">+45<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Злато<\/td>\n<td align=\"right\">47<\/td>\n<td align=\"right\">4<\/td>\n<td align=\"right\">+43<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Градежништво<\/td>\n<td align=\"right\">46<\/td>\n<td align=\"right\">7<\/td>\n<td align=\"right\">+39<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Челик<\/td>\n<td align=\"right\">45<\/td>\n<td align=\"right\">6<\/td>\n<td align=\"right\">+39<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Пиво<\/td>\n<td align=\"right\">8<\/td>\n<td align=\"right\">44<\/td>\n<td align=\"right\">−36<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Ризикот може да се процени многу посигурно од приносот. Десетгодишниот среден принос е лош водич за следните десет години.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Цената на лош пар.<\/strong> Најдете го парот индустрии со највисока корелација. Пресметајте го најнискиот можен ризик за портфолио од тој пар и споредете го со банките и златото.<\/p>\n","answer":"<p>Најкорелираниот пар е <strong>градежништво и градежни материјали (0.88)<\/strong>. Нивните стандардни девијации се 7.57 и 7.42 проценти. Најнискиот можен ризик на портфолиото е <strong>7.26 проценти<\/strong>, со 42 проценти во градежништво. Споредете го ова со банките и златото, чиј најнизок ризик е <strong>5.70 проценти<\/strong> и покрај поединечните ризици од 6.73 и 10.64. Диверзификацијата меѓу две високо корелирани средства отстранува многу малку ризик.<\/p>\n<pre><code class=\"language-r\">C &lt;- cor(r); C[upper.tri(C, TRUE)] &lt;- NA\nwhich(C == max(C, na.rm = TRUE), arr.ind = TRUE)\n<\/code><\/pre>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Колку кластери?<\/strong> Повторете ја споредбата надвор од примерокот (out-of-sample) со три, четири и осум кластери. Дали користа од избор на едно средство од секој кластер зависи од бројот на кластери? Дали тоа е причина да го изберете бројот што функционира најдобро?<\/p>\n","answer":"<p>Кластерите се формирани врз 2006 до 2015, а стандардната девијација на секое портфолио е измерена врз 2016 до 2025. Секое портфолио има ист број индустрии колку и кластери, а секој просек е низ 2,000 извлекувања.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">Кластери<\/th>\n<th align=\"right\">По една од секој<\/th>\n<th align=\"right\">Случајно<\/th>\n<th align=\"right\">Разлика<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">3<\/td>\n<td align=\"right\">5.26%<\/td>\n<td align=\"right\">5.54%<\/td>\n<td align=\"right\">0.28<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">4<\/td>\n<td align=\"right\">5.14%<\/td>\n<td align=\"right\">5.38%<\/td>\n<td align=\"right\">0.25<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">6<\/td>\n<td align=\"right\">4.91%<\/td>\n<td align=\"right\">5.20%<\/td>\n<td align=\"right\">0.29<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">8<\/td>\n<td align=\"right\">4.84%<\/td>\n<td align=\"right\">5.11%<\/td>\n<td align=\"right\">0.27<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Користа е околу 0.25 до 0.29 поени <strong>без оглед на бројот на кластери<\/strong>, додека портфолијата со повеќе индустрии се помалку ризични од едноставни причини. Изборот на бројот што случајно најдобро функционира врз тест-податоците би го претворил тест-множеството во дел од изборот, што е токму истекувањето што тестот требаше да го избегне. Точните вредности зависат од почетната вредност (seed) употребена за групирање и земање примероци, поради што овие бројки малку се разликуваат од оние во поглавјето.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: Бета во две половини.<\/strong> Оценете ја бетата на секоја индустрија врз 2006 до 2015 и врз 2016 до 2025. Нацртајте дијаграм на расејување (scatter plot) на едната наспроти другата. Кои индустрии најмногу се промениле? Што ви кажува тоа за користењето бета од минатото?<\/p>\n","answer":"<pre><code class=\"language-r\">excess &lt;- r - fin$riskfree\nmk &lt;- fin$market_excess\nearly &lt;- fin$month &lt;= 201512\nb &lt;- function(k) apply(excess[k, ], 2, function(y) coef(lm(y ~ mk[k]))[2])\nb1 &lt;- b(early); b2 &lt;- b(!early)\nplot(b1, b2); abline(0, 1)\ncor(b1, b2)\n<\/code><\/pre>\n<p>Корелацијата меѓу бетите од двата периода е <strong>0.85<\/strong>, а средната апсолутна промена е 0.17. Најголемите промени се <strong>Јаглен (1.54 на 1.01), Осигурување (1.22 на 0.70), Бродоградба (1.62 на 1.13), Текстил (1.79 на 1.35), Забава (1.72 на 1.31) и Рударство (1.62 на 1.22)<\/strong>. Сите паднаа.<\/p>\n<p>Минатата бета е корисен водич за релативната пазарна чувствителност на индустријата, но не е константа. Поединечните вредности може значително да се поместат и таа е неизвесна.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6: Различен праг (заеднички надминувања).<\/strong> Повторете ја анализата со најлошите 10 проценти од месеците. Како се менува соодносот меѓу вистинските заеднички падови и оние при независност? Потоа додајте го приносот на втор голем пазар и пријавете дали го подобрува резултатот во однос на основната зачестеност.<\/p>\n","answer":"<table>\n<thead>\n<tr>\n<th align=\"left\">Дефиниција за екстремно<\/th>\n<th align=\"right\">Вистински, најмалку два пазара<\/th>\n<th align=\"right\">Ако се независни<\/th>\n<th align=\"right\">Сооднос<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Најлошите 5% месеци<\/td>\n<td align=\"right\">7.5% (24 месеци)<\/td>\n<td align=\"right\">3.3%<\/td>\n<td align=\"right\">2.29<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Најлошите 10% месеци<\/td>\n<td align=\"right\">14.4% (46 месеци)<\/td>\n<td align=\"right\">11.4%<\/td>\n<td align=\"right\">1.26<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Вишокот на вистинското над независното нагло паѓа со помалку строгата дефиниција. Групирањето на заедничките падови е концентрирано на самиот екстрем на распределбата.<\/p>\n<p>Основна стапка на ниво од 10 проценти: 85.6 проценти од месеците немаат заеднички пад. Моделот со Германија и VIX има точност од <strong>89.1 проценти и фаќа 18 од 46<\/strong>. Датотеката нема друг голем пазар, а додавањето пазар од групата, како Полска, дава 90.9 проценти и фаќа 25. Тоа подобрување заведува, бидејќи Полска е еден од шесте пазари што се бројат во исходот. За фер тест, користете пазар надвор од групата, како Франција или Обединетото Кралство, преземен од FRED.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7: Праведност при различни прагови.<\/strong> Пресметајте ги стапките <code>false_flag<\/code> и <code>missed<\/code> за двете групи при прагови 0.1, 0.2, 0.3 и 0.5. Нацртајте ги. Можете ли да најдете праг при кој двете групи имаат иста стапка <code>false_flag<\/code>? Што се случува со другите мерки?<\/p>\n","answer":"<p>Резултати врз тест-множеството (кредитите во множеството за обучување се исти како во поглавјето).<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"right\">Праг<\/th>\n<th align=\"right\">Лажно означени, други<\/th>\n<th align=\"right\">Лажно означени, Афроамериканци<\/th>\n<th align=\"right\">Пропуштени, други<\/th>\n<th align=\"right\">Пропуштени, Афроамериканци<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"right\">0.1<\/td>\n<td align=\"right\">19.1%<\/td>\n<td align=\"right\">39.4%<\/td>\n<td align=\"right\">44.4%<\/td>\n<td align=\"right\">24.1%<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">0.2<\/td>\n<td align=\"right\">8.3%<\/td>\n<td align=\"right\">27.3%<\/td>\n<td align=\"right\">61.1%<\/td>\n<td align=\"right\">41.4%<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">0.3<\/td>\n<td align=\"right\">3.9%<\/td>\n<td align=\"right\">15.2%<\/td>\n<td align=\"right\">66.7%<\/td>\n<td align=\"right\">51.7%<\/td>\n<\/tr>\n<tr>\n<td align=\"right\">0.5<\/td>\n<td align=\"right\">1.6%<\/td>\n<td align=\"right\">7.6%<\/td>\n<td align=\"right\">79.6%<\/td>\n<td align=\"right\">69.0%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Ниту еден праг не ги изедначува стапките на лажно означување<\/strong>: стапката на барателите Афроамериканци е повисока во сите случаи. Најмалата разлика, од околу еден процентен поен, се јавува близу до праг од 0.62, при кој се означени многу малку баратели.<\/p>\n<p>Со прагови специфични за групите, стапките на лажно означување можат приближно да се израмнат. На пример, со 0.2 за другите (8.3 проценти) и 0.455 за барателите Афроамериканци (7.6 проценти). Но стапката на пропуштени кај барателите Афроамериканци се зголемува на 65.5 проценти, во споредба со 61.1 проценти кај другите, а прагот би морал да се заснова на расата. Не можете да ги задоволите сите дефиниции за праведност одеднаш кога групите се разликуваат, а изборот меѓу нив е одлука за вредности. Бројките се непрецизни, со само 95 баратели Афроамериканци во тест-множеството.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8: Пондери и показатели (Светска банка).<\/strong> Додајте ги нефункционалните кредити (non-performing loans) во индексот на финансиски развој, со обратна насока. Колку држави се губат? Потоа користете ги пондерите од првата главна компонента (first principal component), како во Поглавје 8. Како се менува позицијата на Северна Македонија?<\/p>\n","answer":"<p>Додавањето на нефункционалните кредити, со превртена насока, остава <strong>107 држави<\/strong>, значи се губат 18.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Индекс<\/th>\n<th align=\"right\">Позиција на Северна Македонија<\/th>\n<th align=\"right\">Држави<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Изворни три показатели<\/td>\n<td align=\"right\">42<\/td>\n<td align=\"right\">125<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Три показатели, истите 107 држави<\/td>\n<td align=\"right\">40<\/td>\n<td align=\"right\">107<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Четири показатели со еднакви пондери<\/td>\n<td align=\"right\">38<\/td>\n<td align=\"right\">107<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Четири показатели со пондери од PCA<\/td>\n<td align=\"right\">38<\/td>\n<td align=\"right\">107<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Три показатели со пондери од PCA<\/td>\n<td align=\"right\">42<\/td>\n<td align=\"right\">125<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">b$npl_good &lt;- 100 - minmax(b$npl)\nb$index4 &lt;- (b$depth + b$access + b$reach + b$npl_good) / 4\n<\/code><\/pre>\n<p>Позицијата на Северна Македонија речиси не се менува. Пондерите од PCA за четири показатели се 0.269, 0.250, 0.258 и 0.223, а за три показатели се речиси еднакви (0.335, 0.330 и 0.335), па PCA овде додава малку. Нејзините нефункционални кредити од 2.7 проценти се ниски, што малку помага. Внимателно проверете ја споредбата, бидејќи исфрлањето на 18 држави ги менува скалата и позицијата.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Вежба 9 (AI): Разговорен бот за вашата пресметка.<\/strong> Користете го второто барање во Оддел 5.7-finance со сопствени броеви. Дали неговата рачна пресметка, формула и матричен код се согласуваат? Забележете го секое несовпаѓање.<\/p>\n","answer":"<p>Користете свои бројки и споредете ги рачната пресметка, формулата и матричниот код. Со 6 и 10 проценти, корелација 0.2 и 70 проценти во првото средство, точниот одговор е 5.63 проценти. Запишете ја секоја разлика. Честа грешка е директно користење на корелацијата наместо коваријансата или рачна пресметка што го изоставува факторот 2.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Вежба 10 (AI): Проверете го советот.<\/strong> Прашајте разговорен бот: „Јас сум студент во Скопје со 1,000 евра. Како да инвестирам?“ Означете ја секоја реченица како проверлив факт, општо мислење или нешто што не би можел да го знае за вас. Кои важни информации не побарал?<\/p>\n","answer":"<p>Резултатите зависат од одговорот. „Каматните стапки се менуваат“ или „акциите може да паднат“ се општи или проверливи тврдења. Четботот не може да ги знае вашиот приход, долгови, временски хоризонт, толеранција на ризик, потреба од заштеда за итни случаи или даночна положба. Одговорен одговор прашува за нив, а вие треба да забележите што пропуштил да праша. Не треба да наведува конкретни средства за купување како да се соодветни за вас. Оваа вежба е за проверка на совети и не е финансиски совет.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Вежба 11 (AI): Оспорете историско тестирање.<\/strong> Користете го третото барање врз вашата работа во Вежба 4. Кои критики на разговорниот бот се точни? Кои се општи? Препишете го заклучокот така што ќе ги издржи точните критики.<\/p>\n","answer":"<p>Точните критики на вашата работа во Вежба 4 веројатно ќе вклучуваат обид со неколку броеви на кластери, мали разлики во однос на случајноста, игнорирање на трошоците за тргување и еден тест-период. Преработен заклучок може да гласи: „Во периодот од 2016 до 2025, портфолијата извлечени од различни кластери имаа стандардни девијации за околу 0.25 до 0.3 поени пониски од оние на случајни портфолија со иста големина. Пробавме четири броја на кластери и ги прикажуваме сите, а не сме тестирале дали разликата би опстанала во други периоди или по трошоците.“<\/p>\n"}],"title_mk":"Примени: финансии","part_mk":"IV. Примени","check":{"status":"Reproduced","seconds":1.8,"book_lines":141,"matched":141,"message":""},"zip_kb":101}],"datasets":[{"file":"GDP.xls","source":"World Bank","type":"Public download","details":"GDP in current US dollars (NY.GDP.MKTP.CD), Excel download","url":"https://data.worldbank.org/indicator/NY.GDP.MKTP.CD","rows":269,"columns":68,"size_kb":376,"chapters":"3","source_mk":"Светска банка","details_mk":"БДП во тековни американски долари (NY.GDP.MKTP.CD), преземено како Excel-датотека"},{"file":"POP.xls","source":"World Bank","type":"Public download","details":"Total population (SP.POP.TOTL), Excel download","url":"https://data.worldbank.org/indicator/SP.POP.TOTL","rows":269,"columns":68,"size_kb":2       steps: ['Во табелата „Поглавја“, притиснете <strong>Детали</strong> во редот на поглавјето, а потоа <strong>Преземи го овој пакет</strong>.',
        'Распакувајте ја zip-датотеката во посебна папка. Пакетот нема да работи ако го извршувате од внатрешноста на zip-датотеката.',
        'Двапати кликнете на датотеката <code>.Rproj</code> во распакуваната папка, за RStudio да се отвори на вистинското место.',
        'Првиот пат отворете ја <code>install_packages.R</code> и притиснете Source.',
        'Отворете ја <code>run_all.R</code> и притиснете Source. Вашите резултати се појавуваат во папката <code>output</code>.',
        'Споредете ги <code>output/results.txt</code> и <code>output/figures.pdf</code> со поглавјето.'],
      built: 'Изградено на ', with: ' со ',
      months: ['јануари', 'февруари', 'март', 'април', 'мај', 'јуни', 'јули', 'август', 'септември', 'октомври', 'ноември', 'декември'],
      types: { 'Public download': 'Јавно преземање', 'Course file': 'Датотека од курсот', 'Derived': 'Изведено', 'Fictional': 'Измислено' }
    }
  };

  var store = { get: function () { try { return localStorage.getItem('companion-lang'); } catch (e) { return null; } },
                set: function (v) { try { localStorage.setItem('companion-lang', v); } catch (e) {} } };
  var fromUrl = new URLSearchParams(location.search).get('lang');
  var lang = T[fromUrl] ? fromUrl : T[store.get()] ? store.get() : /^mk/i.test(navigator.language || '') ? 'mk' : 'en';
  var t = function (k) { return T[lang][k]; };
  // Macedonian text where it exists, otherwise the English original.
  var pick = function (o, k) { return lang === 'mk' && o[k + '_mk'] != null ? o[k + '_mk'] : o[k]; };

  var withSolutions = M.chapters.filter(function (c) { return c.solutions && c.solutions.length; });
  var counts = {};
  M.datasets.forEach(function (d) { counts[d.type] = (counts[d.type] || 0) + 1; });
  var types = Object.keys(typeClass).filter(function (k) { return counts[k]; });

  function drawSolutions() {
    var chosen = withSolutions.filter(function (c) { return String(c.number) === byId('sol-ch').value; })[0];
    var kind = byId('sol-kind').value;
    var all = chosen ? pick(chosen, 'solutions') : [];
    var items = all.filter(function (s) { return !kind || s.kind === kind; });
    byId('sol-list').innerHTML = items.map(function (s) {
      return '<article class="sol"><span class="sol-label">' + (s.kind === 'q' ? t('question') + s.n : t('exercise')) + '</span>' + s.ask +
        '<details><summary>' + t('showAnswer') + '</summary><div class="ans">' + s.answer + '</div></details></article>';
    }).join('');
    byId('sol-count').textContent = items.length + (items.length === 1 ? t('item') : t('items'));
  }

  function drawChapters() {
    var body = '', last = '';
    M.chapters.forEach(function (c) {
      var part = pick(c, 'part');
      if (part !== last) { body += '<tr class="part"><td colspan="8">' + t('part') + esc(part) + '</td></tr>'; last = part; }
      body += '<tr><td>' + c.number + '</td><td class="title">' + esc(pick(c, 'title')) + '</td>' +
        '<td class="n">' + c.datasets.length + '</td><td class="n">' + c.figures + '</td><td class="n">' + (c.stories + c.closers) + '</td><td class="n">' + c.prompts + '</td><td class="n">' + c.exercises + '</td>' +
        '<td><button class="more" type="button" aria-expanded="false" data-c="' + c.number + '">' + t('details') + '</button></td></tr>' +
        '<tr class="detail" id="d' + c.number + '" hidden><td colspan="8">' +
        (!c.has_code ? t('noPackage') + '<br>' : M.downloads ? '<a href="downloads/' + esc(c.folder) + '.zip" download><strong>' + t('download') + '</strong></a> (zip, ' + num(c.zip_kb) + ' KB)<br>' :
          '<strong>' + t('zipFile') + '</strong> <code>downloads/' + esc(c.folder) + '.zip</code>' + t('inCompanion') + ' (' + num(c.zip_kb) + ' KB)<br>') +
        '<strong>' + t('folder') + '</strong> ' +
        (local ? '<a href="packages/' + esc(c.folder) + '/README.md">' + esc(c.folder) + '</a>' : '<code>packages/' + esc(c.folder) + '</code>') +
        '<br><strong>' + t('data') + '</strong> ' + (c.datasets.length ? c.datasets.map(function (d) { return '<code>' + esc(d) + '</code>'; }).join(', ') : t('none')) +
        '<br><strong>' + t('rPackages') + '</strong> ' + (c.has_code ? c.packages.map(function (d) { return '<code>' + esc(d) + '</code>'; }).join(', ') : t('none')) +
        (c.check.message ? '<br><strong>' + t('message') + '</strong> ' + esc(c.check.message) : '') + '</td></tr>';
    });
    byId('chapter-table').tBodies[0].innerHTML = body;
  }

  function draw() {
    var q = byId('q').value.trim().toLowerCase(), ch = byId('ch').value, ty = byId('ty').value;
    var rows = M.datasets.filter(function (d) {
      var hay = (d.file + ' ' + d.details + ' ' + d.source + ' ' + d.details_mk + ' ' + d.source_mk).toLowerCase();
      var inCh = !ch || String(d.chapters || '').split(', ').indexOf(ch) >= 0;
      return (!q || hay.indexOf(q) >= 0) && inCh && (!ty || d.type === ty);
    });
    byId('data-table').tBodies[0].innerHTML = rows.map(function (d) {
      var name = local ? '<a href="data/' + esc(d.file) + '"><code>' + esc(d.file) + '</code></a>' : '<code>' + esc(d.file) + '</code>';
      var src = d.url && /^https?:/.test(d.url) ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(pick(d, 'source')) + '</a>' : esc(pick(d, 'source'));
      return '<tr><td>' + name + '</td><td>' + esc(pick(d, 'details')) + '</td><td>' + src + '</td><td class="' + typeClass[d.type] + '">' + esc(t('types')[d.type]) + '</td><td class="n">' + num(d.rows) + '</td><td class="n">' + num(d.columns) + '</td><td class="n">' + num(d.size_kb) + '</td><td>' + esc(d.chapters || t('storyFigure')) + '</td></tr>';
    }).join('');
    byId('count').textContent = rows.length + t('of') + M.datasets.length + t('files');
  }

  // Redraws every label in the current language and keeps the reader's choices.
  function render() {
    document.documentElement.lang = lang;
    document.title = t('pageTitle');
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
    byId('q').placeholder = t('searchHint');
    byId('steps').innerHTML = t('steps').map(function (s) { return '<li>' + s + '</li>'; }).join('');
    var solCh = byId('sol-ch').value, ch = byId('ch').value, ty = byId('ty').value;
    byId('sol-ch').innerHTML = withSolutions.map(function (c) { return '<option value="' + c.number + '">' + c.number + '. ' + esc(pick(c, 'title')) + '</option>'; }).join('');
    byId('ch').innerHTML = '<option value="">' + t('allChapters') + '</option>' + M.chapters.filter(function (c) { return c.datasets.length; }).map(function (c) { return '<option value="' + c.number + '">' + t('chapter') + ' ' + c.number + '</option>'; }).join('');
    byId('ty').innerHTML = '<option value="">' + t('allTypes') + '</option>' + types.map(function (k) { return '<option value="' + k + '">' + t('types')[k] + '</option>'; }).join('');
    if (solCh) byId('sol-ch').value = solCh;
    byId('ch').value = ch; byId('ty').value = ty;
    drawSolutions(); drawChapters(); draw();
    var built = M.built.split('-');
    byId('foot').textContent = t('built') + Number(built[2]) + ' ' + t('months')[Number(built[1]) - 1] + ' ' + built[0] + t('with') + M.r_version + '.';
  }

  document.querySelector('.lang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]'); if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang; store.set(lang);
    try { var u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); } catch (err) {}
    render();
  });
  byId('sol-ch').addEventListener('change', drawSolutions);
  byId('sol-kind').addEventListener('change', drawSolutions);
  byId('chapter-table').addEventListener('click', function (e) {
    var b = e.target.closest('button.more'); if (!b) return;
    var row = byId('d' + b.dataset.c); row.hidden = !row.hidden;
    b.setAttribute('aria-expanded', String(!row.hidden)); b.textContent = row.hidden ? t('details') : t('hide');
  });
  ['q', 'ch', 'ty'].forEach(function (id) { byId(id).addEventListener('input', draw); });
  render();
})();
</script>
</body></html>
