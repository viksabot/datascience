r)\nlibrary(dplyr)\nlibrary(tidyr)\n\nfolder &lt;- &quot;https://makstat.stat.gov.mk/PXWeb/api/v1/en/MakStat/PazarNaTrud/Plati/MesecnaBrutoNeto/&quot;\nquery &lt;- '{&quot;query&quot;: [], &quot;response&quot;: {&quot;format&quot;: &quot;csv&quot;}}'\nres &lt;- POST(paste0(folder, &quot;125_PazTrud_Mk_bruto_ml.px&quot;), body = query, content_type_json())\ngross &lt;- read.csv(text = content(res, as = &quot;text&quot;, encoding = &quot;latin1&quot;), check.names = FALSE)\nnet &lt;- read.csv(&quot;data/mk_net_wages_wide.csv&quot;, check.names = FALSE)\n\ntotal &lt;- function(d, name) {\n  x &lt;- d[grepl(&quot;Total&quot;, d[[1]]), ] %&gt;%\n    pivot_longer(-1, names_to = &quot;month&quot;, values_to = name)\n  x[[1]] &lt;- NULL\n  x\n}\n\nwages &lt;- inner_join(total(net, &quot;net&quot;), total(gross, &quot;gross&quot;), by = &quot;month&quot;) %&gt;%\n  mutate(ratio = net / gross)\n<\/code><\/pre>\n<p>The ratio of net to gross wages for the total economy rose from <strong>0.591 in January 2005 to about 0.68 from 2010 to 2018<\/strong>, and has since eased to <strong>0.665 in August 2026<\/strong>. The largest rise took place around 2008 and 2009. Since the ratio shows how much of the gross wage reaches the employee, this pattern points towards changes in taxes and contributions, which you could check in the relevant legislation. The gross table has 260 months and our net table 257, so <code>inner_join()<\/code> keeps 257 of them.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6: A stock and a flow.<\/strong> From Eurostat's <code>gov_10dd_edpt1<\/code> dataset, download a country's annual government balance and government debt, both as a percentage of GDP. Which is a stock and which is a flow? Why might the change in the debt ratio from one year to the next differ from the deficit?<\/p>\n","answer":"<p>The balance is a <strong>flow<\/strong> (over the year), and the debt is a <strong>stock<\/strong> (at the end of the year). Example for Greece, as a percentage of GDP (<code>B9<\/code> is the balance and <code>GD<\/code> is the debt):<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Year<\/th>\n<th align=\"right\">Balance<\/th>\n<th align=\"right\">Debt<\/th>\n<th align=\"right\">Change in debt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">2022<\/td>\n<td align=\"right\">−2.7<\/td>\n<td align=\"right\">177.8<\/td>\n<td align=\"right\">−19.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2023<\/td>\n<td align=\"right\">−1.5<\/td>\n<td align=\"right\">164.0<\/td>\n<td align=\"right\">−13.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2024<\/td>\n<td align=\"right\">1.4<\/td>\n<td align=\"right\">153.5<\/td>\n<td align=\"right\">−10.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2025<\/td>\n<td align=\"right\">2.0<\/td>\n<td align=\"right\">145.4<\/td>\n<td align=\"right\">−8.1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">url &lt;- paste0(&quot;https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0/data/dataflow/ESTAT/&quot;,\n              &quot;gov_10dd_edpt1/1.0?format=csvdata&amp;compress=false&quot;,\n              &quot;&amp;c[geo]=EL&amp;c[unit]=PC_GDP&amp;c[sector]=S13&amp;c[na_item]=B9,GD&quot;)\ng &lt;- read.csv(url)\n<\/code><\/pre>\n<p>The ratio can change by much more than the deficit because the denominator, GDP, also changes: strong nominal growth shrinks the ratio even without a surplus. In addition, some transactions change debt without entering the deficit, such as buying financial assets or changes in the value of debt. In 2023, for example, Greece's debt ratio fell by 13.8 points despite a deficit of 1.5 percent.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7: Your first reproducibility package.<\/strong> Turn your work on Exercise 2 into a package. Create the folder structure in Section 3.5, save the downloaded data in <code>data/raw<\/code>, write one script that downloads the data, one that makes the tidy table in <code>data/clean<\/code>, and one that saves a summary table to <code>output/tables<\/code>. Add a <code>run_all.R<\/code>, save the output of <code>sessionInfo()<\/code> and write a one-page README. Delete <code>data/clean<\/code> and <code>output<\/code>, and check that <code>run_all.R<\/code> recreates them. Then swap packages with a classmate and try to run each other's work without any help. Write down what failed.<\/p>\n","answer":"<p>A correct submission has the folder structure from Section 3.5. The scripts must run in order from <code>run_all.R<\/code>, raw data must stay unedited, and the tidy table must appear in <code>data/clean<\/code> after being deleted and rebuilt. The README should cover sources, download dates, software and steps. Your partner's list of failures is the most valuable part, and the usual causes are absolute paths, undeclared packages and manual steps.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8 (AI): Return to the Chapter 2 test.<\/strong> In Chapter 2 you asked a chatbot for code to download North Macedonia's GDP from Eurostat. Now use the API or package prompt from this chapter to ask again, including the correct dataset code. Compare the two answers. Then check the code against the checklist in Section 3.6, and report every correction you had to make.<\/p>\n","answer":"<p>The answer depends on what the chatbot produces. Check the correct code and geography (Eurostat uses <code>MK<\/code>), unit, time period and row count, using the checklist in Section 3.6. Report each correction, and say whether adding the dataset code made the answer better than your Chapter 2 attempt.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Exercise 9 (AI): Spot the wrong unit.<\/strong> Ask a chatbot to write code that produces each country's 2022 inflation rate from Eurostat's table <code>prc_hicp_aind<\/code>. Which unit did it choose? If it chose <code>INX_A_AVG<\/code>, how would you have detected the error without knowing the unit codes?<\/p>\n","answer":"<p>The right unit is <code>RCH_A_AVG<\/code>, the annual average rate of change. <code>INX_A_AVG<\/code> is an index level. For 2022, Germany's values are <strong>8.7 percent<\/strong> under <code>RCH_A_AVG<\/code> and <strong>118.7<\/strong> under <code>INX_A_AVG<\/code>.<\/p>\n<p>You could detect the error without knowing the codes: inflation of about 118 percent in Germany is implausible, and all values would be clustered somewhat above 100, as an index is. Compare one number with a value you know, and always print the distinct values of <code>unit<\/code>.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Exercise 10 (AI): Audit a package.<\/strong> Use the prompt &quot;Draft a README, then audit the package&quot; on the package from Exercise 7. Did the chatbot invent anything, or mark it <code>[MISSING]<\/code> as you asked? Which of its warnings about your code were correct? Follow its README in a fresh R session and record every step that did not work.<\/p>\n","answer":"<p>The answer depends on your package. A good report states whether the chatbot wrote <code>[MISSING]<\/code> or invented details such as URLs, versions and dates; which warnings about absolute paths, manual steps, seeds and unloaded packages were valid; and each step that failed when you followed the README in a fresh R session.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Exercise 11: Be the referee.<\/strong> Follow all nine steps of the worked example in Section 3.5. Submit the value of <code>nrow(my_table)<\/code> from Step 7, the population of a country of your choice as shown in <code>output/wb_cleaned_data.csv<\/code>, the row of the Data catalogue that documents <code>POP.xls<\/code>, and one line in your <code>session_info.txt<\/code> that differs from the versions given in the README. Then remove one more country from <code>europe_iso3<\/code>, run the package again and report how many rows you get. Restore the code when you have finished.<\/p>\n","answer":"<p>Your <code>nrow(my_table)<\/code> should be <strong>41<\/strong>. For example, North Macedonia's population in the file is 1,831,712. The catalogue row should show <code>POP.xls<\/code> as a World Bank public download of total population (<code>SP.POP.TOTL<\/code>).<\/p>\n<p>The line that differs in <code>session_info.txt<\/code> depends on your computer, and is often the R version or the operating system. Removing one further country from <code>europe_iso3<\/code> gives <strong>40<\/strong> rows, and removing two countries gives 39. Always restore the code afterwards.<\/p>\n"},{"kind":"e","n":12,"ask":"<p><strong>Exercise 12 (AI): Explain a package you did not write.<\/strong> Paste <code>run_all.R<\/code> from the Chapter 3 package into a chatbot and ask: &quot;Explain what each line does to a student who has used R for two weeks, and tell me what would go wrong if I ran this script without opening the <code>.Rproj<\/code> file first.&quot; Then test its answer. Open <code>run_all.R<\/code> without the Project, in a new RStudio session, run it and compare the real message with the chatbot's prediction. Which of its explanations can you confirm by running the code, and which can you not?<\/p>\n","answer":"<p>The chatbot should explain that the script checks the code file exists, creates <code>output<\/code>, loads the setup, sends charts to <code>figures.pdf<\/code>, sends printed results to <code>results.txt<\/code>, runs the chapter's code and records the software used.<\/p>\n<p>Without the Project, R's working directory is usually elsewhere. The real result is the script's own message: <code>Open the .Rproj file in this folder first.<\/code> You can confirm what happens by running the code, and you can read what each line does by testing them one at a time. Explanations of the authors' reasons or of behaviour on other computers cannot be confirmed by a single run.<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Што се податоци и зошто се важни за анализата?<\/p>\n","answer":"<p>Податоците се фактички информации што се користат како основа за расудување, дискусија или пресметка. Важни се затоа што заклучоците за трендовите и одлуките се темелат на нив, а тие заклучоци можат да бидат само толку добри колку што се добри информациите во изворните податоци.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Кои се главните разлики меѓу квантитативните и квалитативните променливи?<\/p>\n","answer":"<p><strong>Квантитативните<\/strong> променливи се бројчани по природа и можат да имаат многу вредности, како цени, приход или возраст. <strong>Квалитативните<\/strong> променливи претставуваат категории, како видови производи или држави, дури и ако се зачувани како броеви.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Објаснете ја разликата меѓу пресечни податоци, временски серии и панел-податоци. Наведете пример за секој вид.<\/p>\n","answer":"<p><strong>Податоците во пресек<\/strong> опфаќаат различни единици во приближно ист момент, како платите по сектори во септември 2024. <strong>Временските серии<\/strong> следат една единица низ времето, како месечната продажба на една продавница. <strong>Панел-податоците<\/strong> следат неколку единици низ неколку периоди, како годишниот БДП за многу држави.<\/p>\n"},{"kind":"q","n":4,"ask":"<p>Што е API и по што се разликува од преземањето податоци преку директна врска?<\/p>\n","answer":"<p>API овозможува програма автоматски да бара податоци и да задава параметри како години, држави и показатели, секогаш од најновите податоци. Директната врска ви дава датотека за рачно преземање, што мора да се повтори кога податоците ќе се ажурираат.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Зошто употребата на софтверски пакети како <code>WDI<\/code> е корисна за манипулирање со податоци?<\/p>\n","answer":"<p>Пакетите нудат готови функции за пристап до одредени бази на податоци и за избор на показатели и години, со многу мало подесување. Цената е што ги опфаќаат само поддржаните бази и зависат од тоа дали нивните автори ги одржуваат ажурирани.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Која е разликата меѓу номинални, ординални, интервални и соодносни променливи?<\/p>\n","answer":"<ul>\n<li><strong>Номинална:<\/strong> квалитативна, без редослед (градови).<\/li>\n<li><strong>Ординална:<\/strong> квалитативна, со редослед (слабо, добро, одлично).<\/li>\n<li><strong>Интервална:<\/strong> квантитативна, со постојани разлики меѓу вредностите (температура во °C).<\/li>\n<li><strong>Рациона:<\/strong> интервална со значајна нула, така што соодносите имаат смисла (растојание).<\/li>\n<\/ul>\n"},{"kind":"q","n":7,"ask":"<p>Која е разликата меѓу состојба и тек? Наведете економски пример за секое и објаснете како секое се агрегира низ времето.<\/p>\n","answer":"<p><strong>Тек (flow)<\/strong> се мери за период, како месечната продажба или БДП, и обично се собира низ времето. <strong>Состојба (stock)<\/strong> се мери во еден момент, како залихите на крајот од месецот или јавниот долг на крајот од годината, и обично се усреднува низ времето.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Наведете ги трите принципи на уредни податоци.<\/p>\n","answer":"<p>Секое набљудување формира еден ред. Секоја променлива формира една колона. Секој вид набљудување формира посебна табела со податоци.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Што треба да направите со вредности што се надвор од дозволениот опсег на променливата?<\/p>\n","answer":"<p>Заменете ги со недостасувачки вредности, освен ако не е очигледно која била намерата, како кај очигледна грешка при внесување. Документирајте што сте направиле.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Зошто необработените податоци никогаш не треба директно да се менуваат?<\/p>\n","answer":"<p>За секогаш да можете да се вратите на оригиналот и секој да може да види точно што е направено. Секоја промена треба да се направи во скрипта што ја чита суровата датотека и запишува нова, исчистена датотека.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Зошто на чекорот <code>filter()<\/code> му треба проверка како <code>setdiff()<\/code>?<\/p>\n","answer":"<p><code>%in%<\/code> не пријавува грешка кога шифрата не се совпаѓа со ништо, па погрешно напишана шифра едноставно отстранува држава без предупредување. <code>setdiff()<\/code> ги наведува шифрите од вашата листа што ги нема во податоците, со што проблемот се открива.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Која е разликата меѓу <code>left_join()<\/code> и <code>inner_join()<\/code>?<\/p>\n","answer":"<p><code>left_join()<\/code> ги задржува сите редови од левата табела и додава совпаднати информации од десната, оставајќи недостасувачки вредности каде што нема совпаѓање. <code>inner_join()<\/code> ги задржува само редовите што постојат во двете табели.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Зошто аргентинските бројки за инфлацијата од 2007 до 2015 можеле да влијаат и врз други статистички показатели?<\/p>\n","answer":"<p>Многу статистички показатели се пресметуваат од инфлацијата. Ако инфлацијата е потценета, реалните плати, реалниот раст и бројот на сиромашни се погрешно прикажани, бидејќи секој од нив зависи од прилагодување на паричен износ за цените.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Кој спор го запре пописот во Северна Македонија во 2011 и зошто дефиницијата е толку важна во попис?<\/p>\n","answer":"<p>Спорот беше за тоа кој треба да се брои и се однесуваше на луѓето што живеат во странство: дали копии од лични документи предадени од роднини се доволни некој што бил отсутен повеќе од една година да се брои како жител. Дефинициите се важни бидејќи одлучуваат кој е во населението, а таа бројка влегува во речиси секој показател изразен по жител и влијае врз застапеноста на групите.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Зошто треба да ги проверувате шифрите на податочните множества дадени од четбот?<\/p>\n","answer":"<p>Четботите можат да измислат шифри на податочни множества или да дадат стари шифри. Шифрата може и да постои, но да покажува на погрешна променлива, единица или територија. Проверката кај изворот е единствениот начин да се знае.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Што е пакет за репродуцибилност и кои се три причини за негово изработување?<\/p>\n","answer":"<p>Тоа е една папка што ги содржи податоците, кодот и упатствата потребни за друго лице повторно да го добие секој резултат. Открива грешки; ви помага кога треба да објасните бројка неколку месеци подоцна; ги прави резултатите веродостојни; и сè почесто го бараат списанијата и институциите.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Ако најдете грешка во датотека со необработени податоци, што треба да направите?<\/p>\n","answer":"<p>Не менувајте ја суровата датотека. Направете ја поправката во кодот, создавајќи нова датотека во <code>data/clean<\/code>, и запишете што сте промениле и зошто.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Што треба да содржи README?<\/p>\n","answer":"<p>Што репродуцира пакетот и кој го напишал; од каде потекнува секое податочно множество, кога е добиено и под какви услови може да се споделува; потребниот софтвер и пакети и приближно колку време трае кодот; точните чекори за извршување на кодот; и која скрипта ја создава која табела и кој графикон.<\/p>\n"},{"kind":"q","n":19,"ask":"<p>Како би ја споделиле вашата работа ако дел од податоците се доверливи?<\/p>\n","answer":"<p>Не ставајте доверливи податоци во јавен пакет и не вметнувајте ги во јавен четбот. Споделете го кодот и списокот на променливи, објаснете како некој со дозвола може да ги добие истите податоци и наведете во README што недостасува и зошто.<\/p>\n"},{"kind":"q","n":20,"ask":"<p>Зошто пакетот мора да се распакува од својата zip-датотека и да се отвори преку неговата датотека <code>.Rproj<\/code> пред да се изврши?<\/p>\n","answer":"<p>Од внатрешноста на zip-датотека, R не може правилно да пристапи до другите датотеки, па пакетот не успева. Отворањето преку датотеката <code>.Rproj<\/code> ја поставува работната папка на папката на пакетот, така што работат релативните патеки како <code>data/GDP.xls<\/code>.<\/p>\n"},{"kind":"q","n":21,"ask":"<p>Во разработениот пример, зошто погрешно напишаната шифра <code>&quot;MVA&quot;<\/code> не предизвика грешка? Кој излез го откри проблемот?<\/p>\n","answer":"<p><code>%in%<\/code> едноставно не наоѓа совпаѓање за <code>&quot;MVA&quot;<\/code>, па Молдавија се отстранува без предупредување, што R не го смета за грешка. Проблемот го откри бројот на редови: <code>nrow(df_gdp_eu)<\/code> испечати 40 наместо 41, а и зачуваната CSV-датотека имаше 40 редови.<\/p>\n"},{"kind":"q","n":22,"ask":"<p>При повторно извршување на пакет добивате бројка малку поинаква од објавената. Што би провериле и по кој редослед?<\/p>\n","answer":"<p>Прво проверете дали не сте менувале код или податоци, така што ќе извршите новопреземен пакет. Потоа споредете ја <code>session_info.txt<\/code> со README за да видите дали се разликуваат верзиите на R или на пакетите. Следно проверете дали кодот користи случајни броеви со seed и дали податоците се ревидирани (ако сте презеле нова копија). Дури потоа заклучете дека објавениот резултат можеби е погрешен и пријавете точно што се разликува.<\/p>\n"},{"kind":"q","n":23,"ask":"<p>Зошто ревизиите на бројките за грчкиот дефицит за 2009 година имаа толку сериозни последици?<\/p>\n","answer":"<p>Проценката на дефицитот за 2009 порасна од 3.7 проценти од БДП на 15.4 проценти. Инвеститорите што позајмувале врз основа на старите бројки повеќе не знаеле во што да веруваат, а загрижените заемодавачи бараат повисоки каматни стапки. Трошоците за задолжување на Грција нагло се искачија, до пролетта 2010 државата не можеше да се задолжува по прифатлива цена и ѝ требаше спасување, а сомнежите се проширија на другите држави од еврозоната.<\/p>\n"},{"kind":"q","n":24,"ask":"<p>Што се промени во Грција и во ЕУ по ревизиите и зошто е важна независноста на националната статистичка служба?<\/p>\n","answer":"<p>Грција ја направи својата статистичка служба независна и повторно ја основа како ЕЛСТАТ, а ЕУ му даде на Eurostat право да ги проверува сметките на државните тела каде што бројките предизвикуваат сериозни сомнежи. Во ноември 2010 Eurostat ги оцени ревидираните бројки како веродостојни. Независноста е важна затоа што владите често имаат интерес за тоа како изгледаат бројките. Ако врз луѓето што произведуваат статистика може да се врши притисок или да бидат казнети за непосакуван резултат, никој не може да им верува на бројките, а секоја одлука изградена врз нив е ослабена. Судскиот прогон на Андреас Георгиу (Andreas Georgiou) покажува зошто статистичките здруженија низ светот го бранеа ова начело.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Класифицирајте ги податоците.<\/strong> Табелата подолу прикажува месечни податоци за две продавници. Секој ред е една продавница во еден месец.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">store_id<\/th>\n<th align=\"left\">month<\/th>\n<th align=\"right\">sales_eur<\/th>\n<th align=\"right\">customers<\/th>\n<th align=\"right\">inventory_​end_​units<\/th>\n<th align=\"right\">is_promo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">ABV<\/td>\n<td align=\"left\">2024-01<\/td>\n<td align=\"right\">12500<\/td>\n<td align=\"right\">410<\/td>\n<td align=\"right\">320<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">ABV<\/td>\n<td align=\"left\">2024-02<\/td>\n<td align=\"right\">11800<\/td>\n<td align=\"right\">390<\/td>\n<td align=\"right\">295<\/td>\n<td align=\"right\">1<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">ABV<\/td>\n<td align=\"left\">2024-03<\/td>\n<td align=\"right\">13250<\/td>\n<td align=\"right\">430<\/td>\n<td align=\"right\">280<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">VGD<\/td>\n<td align=\"left\">2024-01<\/td>\n<td align=\"right\">8400<\/td>\n<td align=\"right\">260<\/td>\n<td align=\"right\">210<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">VGD<\/td>\n<td align=\"left\">2024-02<\/td>\n<td align=\"right\">9100<\/td>\n<td align=\"right\">275<\/td>\n<td align=\"right\">190<\/td>\n<td align=\"right\">1<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">VGD<\/td>\n<td align=\"left\">2024-03<\/td>\n<td align=\"right\">8700<\/td>\n<td align=\"right\">268<\/td>\n<td align=\"right\">205<\/td>\n<td align=\"right\">0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Променливите се: <code>store_id<\/code> (името на продавницата), <code>month<\/code> (месецот на набљудување), <code>sales_eur<\/code> (вкупната продажба во месецот, во евра), <code>customers<\/code> (бројот купувачи во месецот), <code>inventory_end_units<\/code> (залихата на крајот од месецот, како број непродадени производи) и <code>is_promo<\/code> (дали имало промоција во месецот: 0 = не, 1 = да).<\/p>\n<p>a. Утврдете кои колони се ID-променливи. Дали е потребна комбинација од повеќе променливи за единствена идентификација на ред?\nb. За секоја променлива класифицирајте дали е квантитативна или квалитативна и наведете ја нејзината мерна скала (номинална, ординална, интервална или соодносна).\nc. Утврдете кои променливи се текови, а кои состојби. Објаснете зошто во една реченица.\nd. Дали овие податоци се пресечни, временска серија или панел? Објаснете во една реченица.<\/p>\n","answer":"<p><strong>a.<\/strong> <code>store_id<\/code> и <code>month<\/code> се идентификациски променливи. Потребна е комбинација, бидејќи ниту една сама не е единствена: секоја продавница се појавува три пати, а секој месец двапати. Заедно ги идентификуваат сите шест редови.<\/p>\n<p><strong>b.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Променлива<\/th>\n<th align=\"left\">Вид<\/th>\n<th align=\"left\">Скала<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\"><code>store_id<\/code><\/td>\n<td align=\"left\">Квалитативна<\/td>\n<td align=\"left\">Номинална<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>month<\/code><\/td>\n<td align=\"left\">Квантитативна (датум)<\/td>\n<td align=\"left\">Интервална<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>sales_eur<\/code><\/td>\n<td align=\"left\">Квантитативна<\/td>\n<td align=\"left\">Рациона<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>customers<\/code><\/td>\n<td align=\"left\">Квантитативна<\/td>\n<td align=\"left\">Рациона<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>inventory_end_units<\/code><\/td>\n<td align=\"left\">Квантитативна<\/td>\n<td align=\"left\">Рациона<\/td>\n<\/tr>\n<tr>\n<td align=\"left\"><code>is_promo<\/code><\/td>\n<td align=\"left\">Квалитативна (бинарна)<\/td>\n<td align=\"left\">Номинална<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>c.<\/strong> <code>sales_eur<\/code> и <code>customers<\/code> се текови, бидејќи се акумулираат во текот на месецот. <code>inventory_end_units<\/code> е состојба, бидејќи се мери во еден момент. Останатите не се ниту едното ниту другото.<\/p>\n<p><strong>d.<\/strong> Панел-податоци, бидејќи неколку продавници се набљудуваат низ неколку месеци.<\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Уредна табела од WDI.<\/strong> Целта е да се преземат податоци од WDI (Светска банка) и да се подготви уредна табела за анализа. Користете ги следниве држави (ISO3-шифри): MKD (Северна Македонија), SRB (Србија), ALB (Албанија), DEU (Германија) и ITA (Италија). Користете ги овие показатели:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">WDI-шифра<\/th>\n<th align=\"left\">Опис<\/th>\n<th align=\"left\">Единици<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">NY.GDP.PCAP.CD<\/td>\n<td align=\"left\">БДП по жител (номинален, тековни цени)<\/td>\n<td align=\"left\">САД-долари по жител<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">FP.CPI.TOTL.ZG<\/td>\n<td align=\"left\">Инфлација, индекс на потрошувачки цени (Consumer Price Index, CPI; годишна стапка)<\/td>\n<td align=\"left\">проценти<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">SL.UEM.TOTL.ZS<\/td>\n<td align=\"left\">Невработеност, вкупна (моделирана процена на МОТ)<\/td>\n<td align=\"left\">проценти<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Преземете податоци за периодот од 2010 до 2024 (вклучително) за сите држави и сите три показатели. Подгответе уредна табела во која секој ред е комбинација од држава и година, со колоните <code>country_code<\/code>, <code>country_name<\/code>, <code>year<\/code>, <code>gdp_pc_usd<\/code>, <code>inflation_pct<\/code> и <code>unemployment_pct<\/code>. Во една или две реченици објаснете зошто е важно да се провери дали има недостасувачки вредности и дали единиците се споредливи меѓу државите.<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(dplyr)\n\nraw &lt;- WDI(\n  country = c(&quot;MK&quot;, &quot;RS&quot;, &quot;AL&quot;, &quot;DE&quot;, &quot;IT&quot;),\n  indicator = c(gdp_pc_usd = &quot;NY.GDP.PCAP.CD&quot;,\n                inflation_pct = &quot;FP.CPI.TOTL.ZG&quot;,\n                unemployment_pct = &quot;SL.UEM.TOTL.ZS&quot;),\n  start = 2010, end = 2024\n)\n\ntidy &lt;- raw %&gt;%\n  transmute(country_code = iso3c, country_name = country, year,\n            gdp_pc_usd, inflation_pct, unemployment_pct) %&gt;%\n  arrange(country_code, year)\n\nnrow(tidy)          # should be 5 countries x 15 years = 75\ncolSums(is.na(tidy))\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026. Табелата има <strong>75 редови<\/strong> (5 држави за 15 години), без <strong>недостасувачки вредности<\/strong> за овие држави и години. Во 2024, на пример:<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">БДП по жител (US$)<\/th>\n<th align=\"right\">Инфлација (%)<\/th>\n<th align=\"right\">Невработеност (%)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Албанија<\/td>\n<td align=\"right\">11,374<\/td>\n<td align=\"right\">2.2<\/td>\n<td align=\"right\">10.7<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Германија<\/td>\n<td align=\"right\">56,104<\/td>\n<td align=\"right\">2.3<\/td>\n<td align=\"right\">3.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Италија<\/td>\n<td align=\"right\">40,430<\/td>\n<td align=\"right\">1.0<\/td>\n<td align=\"right\">6.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Северна Македонија<\/td>\n<td align=\"right\">9,292<\/td>\n<td align=\"right\">3.5<\/td>\n<td align=\"right\">12.3<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Србија<\/td>\n<td align=\"right\">13,678<\/td>\n<td align=\"right\">4.7<\/td>\n<td align=\"right\">7.2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Недостасувачките вредности се важни бидејќи средната вредност или графикот може без предупредување да изостават некои комбинации држава-година, па споредбите не се еднородни. Единиците се важни бидејќи долари, проценти и индексни броеви не може директно да се споредуваат, а бројка во тековни долари не е иста со бројка во постојани цени.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Вежба 3: Табела од Евростат.<\/strong> Користејќи официјални податоци од Евростат, подгответе табела за сите европски држави во 2022 со следниве колони: ISO3-шифрата на државата, годината, стапката на невработеност и инфлацијата. Табелата треба да биде уредна, да содржи еден ред за секоја држава и да биде подготвена за понатамошна анализа во R. Кои држави недостасуваат и зошто?<\/p>\n","answer":"<p>Користете го кодот од решениот пример со Eurostat во поглавјето: табелата <code>tps00203<\/code> за невработеност и <code>prc_hicp_aind<\/code> со единицата <code>RCH_A_AVG<\/code> и ставката <code>CP00<\/code> за инфлација. Запомнете да ги промените шифрите <code>EL<\/code> и <code>UK<\/code> на Eurostat во <code>GR<\/code> и <code>GB<\/code> пред претворањето во ISO3.<\/p>\n<p>Резултатот, <code>eurostat_2022_tidy.csv<\/code> во придружните материјали, има <strong>33 редови<\/strong>. Осумте држави од листата на 41 држава во книгата што недостасуваат се Албанија, Босна и Херцеговина, Белорусија, Обединетото Кралство, Молдавија, Црна Гора, Русија и Украина. <code>inner_join()<\/code> задржува држава само ако има податоци во двете табели, а Eurostat главно ги опфаќа членките на ЕУ и некои партнерски држави, па на овие држави им недостасува барем еден од двата показатели. Обединетото Кралство ја напушти ЕУ во 2020.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Вежба 4: Споредете два извора.<\/strong> Преземете ја стапката на невработеност за Северна Македонија и пет други држави за 2023 и од Евростат (<code>une_rt_a<\/code>) и од Светска банка (<code>SL.UEM.TOTL.ZS<\/code>). Спојте ги во една табела и додајте колона со разликата. Каде е разликата најголема? Прочитајте ја дефиницијата на секој показател и објаснете ги разликите.<\/p>\n","answer":"<p>Податоци од Светската банка, преземени на 10 ноември 2026. Бројките на Eurostat се за возраст од 15 до 74 години.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Држава<\/th>\n<th align=\"right\">Eurostat (%)<\/th>\n<th align=\"right\">Светска банка (%)<\/th>\n<th align=\"right\">Разлика<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Србија<\/td>\n<td align=\"right\">9.5<\/td>\n<td align=\"right\">8.27<\/td>\n<td align=\"right\"><strong>1.23<\/strong><\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Северна Македонија<\/td>\n<td align=\"right\">13.1<\/td>\n<td align=\"right\">13.17<\/td>\n<td align=\"right\">−0.07<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Италија<\/td>\n<td align=\"right\">7.7<\/td>\n<td align=\"right\">7.63<\/td>\n<td align=\"right\">0.07<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Германија<\/td>\n<td align=\"right\">3.1<\/td>\n<td align=\"right\">3.07<\/td>\n<td align=\"right\">0.03<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Шпанија<\/td>\n<td align=\"right\">12.2<\/td>\n<td align=\"right\">12.18<\/td>\n<td align=\"right\">0.02<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Турција<\/td>\n<td align=\"right\">9.4<\/td>\n<td align=\"right\">9.39<\/td>\n<td align=\"right\">0.01<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">library(WDI)\nwb &lt;- WDI(country = c(&quot;MK&quot;, &quot;RS&quot;, &quot;TR&quot;, &quot;DE&quot;, &quot;IT&quot;, &quot;ES&quot;),\n          indicator = c(worldbank = &quot;SL.UEM.TOTL.ZS&quot;),\n          start = 2023, end = 2023)\n# Merge with the Eurostat figures by iso2c, then:\n# merged$difference &lt;- merged$eurostat - merged$worldbank\n<\/code><\/pre>\n<p><strong>Јазот е најголем за Србија<\/strong>, а многу мал за другите пет држави. Дефинициите објаснуваат зошто може да настанат разлики. Бројката на Eurostat доаѓа од анкетите за работната сила за возраст од 15 до 74 години, додека <code>SL.UEM.TOTL.ZS<\/code> на Светската банка е <strong>моделирана проценка на МОТ<\/strong> за возраст од 15 и повеќе години, па е прилагодена за споредливост и може да вклучува моделирање.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Вежба 5: МакСтат.<\/strong> На веб-страницата на МакСтат најдете ја табелата со просечни бруто-плати по сектор (табела 125, во истата папка како табелата за нето-плати што се користи во ова поглавје). Преземете ја преку API или како датотека, претворете ја во уредна форма со <code>pivot_longer()<\/code>, спојте ја со податоците за нето-платите и пресметајте го соодносот на нето и бруто-платите за вкупната економија. Како се менувал низ времето?<\/p>\n","answer":"<p>Табелата е <code>125_PazTrud_Mk_bruto_ml.px<\/code>, во истата папка како и табелата со нето-плати.<\/p>\n<pre><code class=\"language-r\">library(httr)\nlibrary(dplyr)\nlibrary(tidyr)\n\nfolder &lt;- &quot;https://makstat.stat.gov.mk/PXWeb/api/v1/en/MakStat/PazarNaTrud/Plati/MesecnaBrutoNeto/&quot;\nquery &lt;- '{&quot;query&quot;: [], &quot;response&quot;: {&quot;format&quot;: &quot;csv&quot;}}'\nres &lt;- POST(paste0(folder, &quot;125_PazTrud_Mk_bruto_ml.px&quot;), body = query, content_type_json())\ngross &lt;- read.csv(text = content(res, as = &quot;text&quot;, encoding = &quot;latin1&quot;), check.names = FALSE)\nnet &lt;- read.csv(&quot;data/mk_net_wages_wide.csv&quot;, check.names = FALSE)\n\ntotal &lt;- function(d, name) {\n  x &lt;- d[grepl(&quot;Total&quot;, d[[1]]), ] %&gt;%\n    pivot_longer(-1, names_to = &quot;month&quot;, values_to = name)\n  x[[1]] &lt;- NULL\n  x\n}\n\nwages &lt;- inner_join(total(net, &quot;net&quot;), total(gross, &quot;gross&quot;), by = &quot;month&quot;) %&gt;%\n  mutate(ratio = net / gross)\n<\/code><\/pre>\n<p>Соодносот меѓу нето и бруто плати за вкупната економија порасна од <strong>0.591 во јануари 2005 на околу 0.68 од 2010 до 2018<\/strong>, а оттогаш се намали на <strong>0.665 во август 2026<\/strong>. Најголемото зголемување се случи околу 2008 и 2009. Бидејќи соодносот покажува колкав дел од бруто-платата стигнува до вработениот, оваа шема укажува на промени во даноците и придонесите, што може да го проверите во соодветното законодавство. Бруто-табелата има 260 месеци, а нашата нето-табела 257, па <code>inner_join()<\/code> задржува 257 од нив.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Вежба 6: Состојба и тек.<\/strong> Од податочното множество <code>gov_10dd_edpt1<\/code> на Евростат преземете ги годишното државно салдо и државниот долг на една држава, двата како процент од БДП. Кое е состојба, а кое тек? Зошто промената на соодносот на долгот од една година до следната може да се разликува од дефицитот?<\/p>\n","answer":"<p>Билансот е <strong>тек<\/strong> (во текот на годината), а долгот е <strong>состојба<\/strong> (на крајот на годината). Пример за Грција, како процент од БДП (<code>B9<\/code> е билансот, а <code>GD<\/code> е долгот):<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Година<\/th>\n<th align=\"right\">Биланс<\/th>\n<th align=\"right\">Долг<\/th>\n<th align=\"right\">Промена на долгот<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">2022<\/td>\n<td align=\"right\">−2.7<\/td>\n<td align=\"right\">177.8<\/td>\n<td align=\"right\">−19.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2023<\/td>\n<td align=\"right\">−1.5<\/td>\n<td align=\"right\">164.0<\/td>\n<td align=\"right\">−13.8<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2024<\/td>\n<td align=\"right\">1.4<\/td>\n<td align=\"right\">153.5<\/td>\n<td align=\"right\">−10.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2025<\/td>\n<td align=\"right\">2.0<\/td>\n<td align=\"right\">145.4<\/td>\n<td align=\"right\">−8.1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\">url &lt;- paste0(&quot;https://ec.europa.eu/eurostat/api/dissemination/sdmx/3.0/data/dataflow/ESTAT/&quot;,\n              &quot;gov_10dd_edpt1/1.0?format=csvdata&amp;compress=false&quot;,\n              &quot;&amp;c[geo]=EL&amp;c[unit]=PC_GDP&amp;c[sector]=S13&amp;c[na_item]=B9,GD&quot;)\ng &lt;- read.csv(url)\n<\/code><\/pre>\n<p>Соодносот може да се промени многу повеќе од дефицитот бидејќи се менува и именителот, БДП: силниот номинален раст го намалува соодносот дури и без суфицит. Покрај тоа, некои трансакции го менуваат долгот без да влезат во дефицитот, како купување финансиски средства или промени во вредноста на долгот. Во 2023, на пример, соодносот на долгот на Грција падна за 13.8 поени и покрај дефицит од 1.5 проценти.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Вежба 7: Вашиот прв пакет за репродуцибилност.<\/strong> Претворете ја работата од Вежба 2 во пакет. Создајте ја структурата на папки од Оддел 3.5, зачувајте ги преземените податоци во <code>data/raw<\/code>, напишете една скрипта што ги презема податоците, една што ја создава уредната табела во <code>data/clean<\/code> и една што зачувува сумарна табела во <code>output/tables<\/code>. Додајте <code>run_all.R<\/code>, зачувајте го излезот од <code>sessionInfo()<\/code> и напишете README на една страница. Избришете ги <code>data/clean<\/code> и <code>output<\/code> и проверете дали <code>run_all.R<\/code> повторно ги создава. Потоа разменете ги пакетите со колега од студиите и обидете се да ја извршите работата еден на друг без никаква помош. Запишете што не успеало.<\/p>\n","answer":"<p>Точната работа ја има структурата на папки од Оддел 3.5. Скриптите мора да се извршуваат по ред од <code>run_all.R<\/code>, суровите податоци мора да останат неизменети, а подредената табела мора да се појави во <code>data/clean<\/code> откако ќе се избрише и повторно изгради. README треба да ги опфати изворите, датумите на преземање, софтверот и чекорите. Листата на неуспеси од вашиот партнер е највредниот дел, а вообичаени причини се апсолутните патеки, ненаведените пакети и рачните чекори.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Вежба 8 (AI): Вратете се на тестот од Поглавје 2.<\/strong> Во Поглавје 2 побаравте од четбот код за преземање на БДП на Северна Македонија од Евростат. Сега употребете го барањето за API или пакет од ова поглавје за повторно да прашате, вклучувајќи ја точната шифра на податочното множество. Споредете ги двата одговора. Потоа проверете го кодот според списокот за проверка во Оддел 3.6 и пријавете ја секоја поправка што моравте да ја направите.<\/p>\n","answer":"<p>Одговорот зависи од она што ќе го произведе четботот. Проверете ги точната шифра и територија (Eurostat користи <code>MK<\/code>), единицата, периодот и бројот на редови, користејќи ја листата за проверка од Оддел 3.6. Пријавете ја секоја поправка и кажете дали додавањето на шифрата на податочното множество го подобрило одговорот во однос на вашиот обид од Поглавје 2.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Вежба 9 (AI): Откријте ја погрешната единица.<\/strong> Побарајте од четбот да напише код што ја дава стапката на инфлација за 2022 за секоја држава од табелата <code>prc_hicp_aind<\/code> на Евростат. Која единица ја избра? Ако избра <code>INX_A_AVG<\/code>, како би ја откриле грешката без да ги знаете шифрите на единиците?<\/p>\n","answer":"<p>Точната единица е <code>RCH_A_AVG<\/code>, годишната просечна стапка на промена. <code>INX_A_AVG<\/code> е ниво на индекс. За 2022, вредностите за Германија се <strong>8.7 проценти<\/strong> со <code>RCH_A_AVG<\/code> и <strong>118.7<\/strong> со <code>INX_A_AVG<\/code>.<\/p>\n<p>Грешката би можеле да ја откриете и без да ги знаете шифрите: инфлација од околу 118 проценти во Германија е неверојатна, а сите вредности би биле збиени малку над 100, како кај индекс. Споредете една бројка со вредност што ја знаете и секогаш печатете ги различните вредности на <code>unit<\/code>.<\/p>\n"},{"kind":"e","n":10,"ask":"<p><strong>Вежба 10 (AI): Проверете пакет.<\/strong> Употребете го барањето „Подгответе нацрт на README, па проверете го пакетот“ врз пакетот од Вежба 7. Дали четботот измисли нешто или го означи со <code>[НЕДОСТАСУВА]<\/code> како што побаравте? Кои негови предупредувања за вашиот код беа точни? Следете го неговото README во нова R-сесија и евидентирајте го секој чекор што не функционирал.<\/p>\n","answer":"<p>Одговорот зависи од вашиот пакет. Добриот извештај наведува дали четботот напишал <code>[MISSING]<\/code> или измислил детали како URL-адреси, верзии и датуми; кои предупредувања за апсолутни патеки, рачни чекори, seed и невчитани пакети биле оправдани; и секој чекор што не успеал кога сте го следеле README во нова R-сесија.<\/p>\n"},{"kind":"e","n":11,"ask":"<p><strong>Вежба 11: Бидете рецензент.<\/strong> Следете ги сите девет чекори од разработениот пример во Оддел 3.5. Доставете ја вредноста на <code>nrow(my_table)<\/code> од Чекор 7, населението на држава по ваш избор како што е прикажано во <code>output/wb_cleaned_data.csv<\/code>, редот од Data catalogue што ја документира <code>POP.xls<\/code> и еден ред од вашиот <code>session_info.txt<\/code> што се разликува од верзиите наведени во README. Потоа отстранете уште една држава од <code>europe_iso3<\/code>, повторно извршете го пакетот и соопштете колку редови добивате. Вратете го кодот во првобитната состојба кога ќе завршите.<\/p>\n","answer":"<p>Вашиот <code>nrow(my_table)<\/code> треба да биде <strong>41<\/strong>. На пример, населението на Северна Македонија во датотеката е 1,831,712. Редот во каталогот треба да ја прикажува <code>POP.xls<\/code> како јавно преземање од Светската банка за вкупното население (<code>SP.POP.TOTL<\/code>).<\/p>\n<p>Редот што се разликува во <code>session_info.txt<\/code> зависи од вашиот компјутер и често е верзијата на R или оперативниот систем. Со отстранување уште една држава од <code>europe_iso3<\/code> се добиваат <strong>40<\/strong> редови, а со отстранување две држави 39. Секогаш потоа вратете го кодот.<\/p>\n"},{"kind":"e","n":12,"ask":"<p><strong>Вежба 12 (AI): Објаснете пакет што не сте го напишале.<\/strong> Залепете го <code>run_all.R<\/code> од пакетот за Поглавје 3 во четбот и побарајте: „Објасни што прави секој ред на студент што користи R две недели и кажи ми што би тргнало наопаку ако ја извршам оваа скрипта без прво да ја отворам датотеката <code>.Rproj<\/code>.“ Потоа тестирајте го одговорот. Отворете го <code>run_all.R<\/code> без проектот, во нова сесија на RStudio, извршете го и споредете ја вистинската порака со предвидувањето на четботот. Кои од неговите објаснувања можете да ги потврдите со извршување на кодот, а кои не можете?<\/p>\n","answer":"<p>Четботот треба да објасни дека скриптата проверува дали постои датотеката со код, ја создава <code>output<\/code>, го вчитува подесувањето, ги праќа графиците во <code>figures.pdf<\/code>, ги праќа отпечатените резултати во <code>results.txt<\/code>, го извршува кодот на поглавјето и го запишува употребениот софтвер.<\/p>\n<p>Без проектот, работната папка на R обично е на друго место. Вистинскиот резултат е пораката на самата скрипта: <code>Open the .Rproj file in this folder first.<\/code> Што се случува може да потврдите со извршување на кодот, а што прави секој ред може да прочитате со тестирање еден по еден. Објаснувањата за причините на авторите или за однесувањето на други компјутери не може да се потврдат со едно извршување.<\/p>\n"}],"title_mk":"Податоци и работа со податоци","part_mk":"I. Основи","check":{"status":"Reproduced","seconds":1,"book_lines":67,"matched":67,"message":""},"zip_kb":322},{"number":4,"title":"Visualising Economic Data","part":"II. Describing the economy","folder":"ch04-visualisation","has_code":true,"code_lines":255,"datasets":["europe_map.csv","gdp_balkans.csv","mk_gdp_nominal_real.csv","ten_countries_panel.csv","us_phillips.csv","wb_cleaned_data.csv"],"packages":["dplyr","ggplot2","ggrepel","knitr","moments","readxl","scales","tidyr","treemapify"],"figures":20,"tables":0,"stories":2,"closers":1,"prompts":3,"exercises":9,"questions":18,"solutions":[{"kind":"q","n":1,"ask":"<p>Imagine you have data on GDP, inflation and unemployment for 15 countries over 25 years. Would you show them all in one chart? Explain your decision.<\/p>\n","answer":"<p>No. A single chart with 15 countries, three indicators and 25 years would overwhelm the reader. Decide on the message first, then divide the information among several simple charts, for example one indicator per chart, or a small selection of countries.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Why is a line chart a better choice than a pie chart for showing change over time?<\/p>\n","answer":"<p>A line chart shows how a value develops from one period to the next, with time on the horizontal axis. A pie chart shows the shares of a whole at one moment, so it has no way to show growth or decline.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Name the three most common mistakes in making a visualisation and explain them with examples.<\/p>\n","answer":"<ul>\n<li><strong>The wrong type of chart:<\/strong> showing GDP growth over time with a pie chart.<\/li>\n<li><strong>Too much information:<\/strong> four indicators for ten countries over twenty years in one figure.<\/li>\n<li><strong>Unsuitable colours:<\/strong> a map of GDP using unrelated, equally strong colours, which hide which countries are larger.<\/li>\n<\/ul>\n"},{"kind":"q","n":4,"ask":"<p>What happens when a visualisation contains too much information?<\/p>\n","answer":"<p>Viewers do not know where to focus their attention, and they cannot quickly grasp the main message. Establish what matters to the audience, keep only what supports the point, and split the rest across several charts.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Explain how the choice of colour can affect the interpretation of a visualisation.<\/p>\n","answer":"<p>Colour directs attention and can suggest order. A single colour moving from light to dark shows at once which values are larger, while unrelated bright colours say nothing about order. Too many similar colours cause misreadings, and red and green cannot be separated by colour-blind readers unless you add labels or line types.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Can a visualisation ever be deliberately made to lead to a wrong conclusion? How?<\/p>\n","answer":"<p>Yes. A truncated axis on a bar chart makes small differences look huge, and an inverted axis can make a rise look like a fall. Choosing only a favourable period, using a log scale without saying so, and omitting context are other ways. A chart can mislead without containing one false number.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>What are the three main components in the structure of the <code>ggplot<\/code> package in R?<\/p>\n","answer":"<p>The <strong>data<\/strong>, the <strong>aesthetic mapping<\/strong> (<code>aes()<\/code>), which links variables to visual features such as <code>x<\/code>, <code>y<\/code> and colour, and the <strong>geometric object<\/strong> (<code>geom_*<\/code>), which determines the type of chart. Additional layers such as <code>labs()<\/code> and <code>theme()<\/code> adjust the result.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>What is the difference between the calls <code>geom_point()<\/code> and <code>geom_line()<\/code> in the <code>ggplot<\/code> package in R?<\/p>\n","answer":"<p><code>geom_point()<\/code> draws a separate point for each observation, as in a scatter plot. <code>geom_line()<\/code> connects the observations with a line, in order of the x-axis, as in a time series.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>You have data on exports by sector (agriculture, industry, services) over a period of 10 years. Which chart would you choose to show (a) the structure of exports in one year, and (b) how the structure changes over time? Explain the difference in your choice.<\/p>\n","answer":"<p>(a) A bar chart, or a pie chart since there are only three parts, because you are showing shares of a whole at one moment. (b) A stacked area chart, since it shows shares and how they change over time. The first question has one time period and the second has ten.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Is a treemap always a better alternative to a pie chart? In which situations would you choose one or the other?<\/p>\n","answer":"<p>No. A pie chart is quick and works well with a few parts. A treemap is better with many parts, or when the parts have a hierarchy, because many thin slices of pie cannot be read.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>You have data on inflation in 30 countries in one year. Which chart would be most suitable if you wanted (a) to compare the countries, and (b) to see the distribution of inflation? Explain the difference.<\/p>\n","answer":"<p>(a) A sorted bar chart, which shows each country's value and ranks them. (b) A histogram or boxplot, which shows how values are spread and hides individual countries. The first answers &quot;who is where?&quot;, while the second answers &quot;what does the spread look like?&quot;.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>If you want to show that two economic variables are strongly related, why is a bar chart not a good choice?<\/p>\n","answer":"<p>A bar chart compares categories, so it can show only one variable per category clearly. A scatter plot places every observation on both variables at once, so that the direction and strength of the relationship become visible.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>A stacked area chart shows both a total value and a structure. Explain in what situation this chart can be misinterpreted.<\/p>\n","answer":"<p>Only the bottom band has a flat baseline. The upper bands sit on top of the bands below, so a band can appear to rise or fall simply because the ones beneath it changed. Comparing the size of upper bands over time is therefore easy to get wrong.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Why should the axis of a bar chart begin at zero? Does the same rule apply to a line chart?<\/p>\n","answer":"<p>Bars show size through their length, so an axis that does not start at zero distorts the ratios between them. A line chart shows change through position and slope rather than length, so the same rule does not apply, although the axis must be labelled clearly and should not exaggerate small movements.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>What did Florence Nightingale's diagram show, and why did she draw it instead of publishing a table?<\/p>\n","answer":"<p>It showed that far more soldiers died of preventable diseases than of battle wounds. She drew it because officials were unlikely to read long tables, whereas a picture made the point immediately. It was designed as an argument for an audience able to act, and sanitary reform followed.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>What happened to the Phillips curve in the 1970s, and what does it teach us about relationships seen in charts?<\/p>\n","answer":"<p>Inflation and unemployment rose together, which the curve said should not happen. The correlation was −0.83 for 1961 to 1969 and −0.08 for 1970 to 1983. Expected inflation is built into wages, and oil price shocks raised costs. A pattern seen in a chart may not last, so look at the dates.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Why did North Macedonia's GDP fall in dollars in 2015 while real GDP rose?<\/p>\n","answer":"<p>The denar is pegged to the euro, and in 2015 the euro fell sharply against the dollar. The dollar value of everything produced fell by 11.4 percent, while output measured at constant denar prices grew by 3.9 percent. Fewer dollars measured the same or greater production.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Why is it useful to state the story in a prompt to an AI chatbot, instead of just asking for a chart?<\/p>\n","answer":"<p>The story tells the chatbot what the chart must show. A bare request produces a generic picture, whereas a stated message leads to a suitable type of chart, highlighting and title.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Exercise 1: Growth in the Western Balkans.<\/strong> Download data from the World Bank on GDP growth (annual %, <code>NY.GDP.MKTP.KD.ZG<\/code>) for North Macedonia (MKD), Serbia (SRB) and Albania (ALB) for the period 2000 to 2022. Draw a line chart showing economic growth over time, with each country in a different colour. Add a title and label the axes. Then answer these questions. Did all three countries react similarly in 2008 to 2009, during the financial crisis? Which country has the largest fluctuations over time? Was there a period of negative growth for all the countries?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(ggplot2)\n\ngrowth &lt;- WDI(country = c(&quot;MKD&quot;, &quot;SRB&quot;, &quot;ALB&quot;),\n              indicator = c(growth = &quot;NY.GDP.MKTP.KD.ZG&quot;),\n              start = 2000, end = 2022)\n\nggplot(growth, aes(year, growth, color = country)) +\n  geom_line() +\n  geom_hline(yintercept = 0, linetype = &quot;dashed&quot;) +\n  labs(title = &quot;GDP growth in the Western Balkans, 2000 to 2022&quot;,\n       x = NULL, y = &quot;Annual growth (%)&quot;, color = NULL)\n\n# To measure the size of the fluctuations:\naggregate(growth ~ country, growth, sd)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Year<\/th>\n<th align=\"right\">Albania<\/th>\n<th align=\"right\">North Macedonia<\/th>\n<th align=\"right\">Serbia<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">2008<\/td>\n<td align=\"right\">6.9<\/td>\n<td align=\"right\">5.5<\/td>\n<td align=\"right\">5.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2009<\/td>\n<td align=\"right\">2.7<\/td>\n<td align=\"right\">−0.4<\/td>\n<td align=\"right\">−3.1<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2010<\/td>\n<td align=\"right\">3.0<\/td>\n<td align=\"right\">3.4<\/td>\n<td align=\"right\">1.6<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2020<\/td>\n<td align=\"right\">−3.3<\/td>\n<td align=\"right\">−4.7<\/td>\n<td align=\"right\">−1.0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The three did not react alike in 2009.<\/strong> Albania kept growing at 2.7 percent, North Macedonia was almost flat at −0.4 percent and Serbia shrank by 3.1 percent. <strong>Serbia has the largest fluctuations<\/strong>, with a standard deviation of 3.2 points, against 2.8 for Albania and 2.7 for North Macedonia. <strong>2020 is the only year in which all three had negative growth.<\/strong><\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Exercise 2: Comparing incomes.<\/strong> Download data from the World Bank on GDP per capita (current US$, <code>NY.GDP.PCAP.CD<\/code>) for Germany (DEU), Poland (POL) and Bulgaria (BGR) for 2022. Draw a bar chart comparing income per capita in these three countries. Make sure that the y-axis starts at 0, add a title and label the axes. Then answer these questions. How large is the difference between Germany and the other two countries? Is Poland closer to Germany or to Bulgaria in income per capita? Why is a bar chart a better choice than a pie chart for this kind of comparison?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(ggplot2)\nd &lt;- WDI(country = c(&quot;DEU&quot;, &quot;POL&quot;, &quot;BGR&quot;),\n         indicator = c(gdp_pc = &quot;NY.GDP.PCAP.CD&quot;), start = 2022, end = 2022)\nggplot(d, aes(reorder(country, -gdp_pc), gdp_pc)) +\n  geom_col(fill = &quot;steelblue&quot;) +\n  scale_y_continuous(limits = c(0, NA), labels = scales::comma) +\n  labs(title = &quot;GDP per capita, 2022&quot;, x = NULL, y = &quot;Current US$&quot;)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026. GDP per person in 2022 was <strong>US$50,507 in Germany, US$18,891 in Poland and US$14,000 in Bulgaria<\/strong>. Germany's income is 2.7 times Poland's and 3.6 times Bulgaria's. <strong>Poland is much closer to Bulgaria<\/strong>: it is US$4,891 above Bulgaria and US$31,616 below Germany.<\/p>\n<p>A bar chart is better because we compare lengths from a common baseline. A pie chart would show shares of a total that has no economic meaning: the sum of three countries' income per person.<\/p>\n"},{"kind":"e","n":3,"ask":"<p><strong>Exercise 3: The structure of exports.<\/strong> Download data from the World Bank on exports of goods and services (current US$, <code>NE.EXP.GNFS.CD<\/code>) for Germany (DEU), France (FRA), Italy (ITA), Spain (ESP) and the Netherlands (NLD) for 2022. Draw a treemap in which the size of each tile is proportional to the value of exports, with the name of the country shown in the tile. Add a suitable title. Then answer these questions. Which country has the largest share of the total exports of these five? Does one country dominate significantly? Does the treemap allow you to see the structure of exports more clearly than a bar chart would? Why?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(ggplot2)\nlibrary(treemapify)\nd &lt;- WDI(country = c(&quot;DEU&quot;, &quot;FRA&quot;, &quot;ITA&quot;, &quot;ESP&quot;, &quot;NLD&quot;),\n         indicator = c(exports = &quot;NE.EXP.GNFS.CD&quot;), start = 2022, end = 2022)\nd$share &lt;- round(100 * d$exports / sum(d$exports), 1)\nggplot(d, aes(area = exports, label = paste0(country, &quot;\\n&quot;, share, &quot;%&quot;))) +\n  geom_treemap(fill = &quot;steelblue&quot;, color = &quot;white&quot;) +\n  geom_treemap_text(color = &quot;white&quot;, place = &quot;centre&quot;) +\n  labs(title = &quot;Exports of goods and services, 2022&quot;)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">Exports (US$ billion)<\/th>\n<th align=\"right\">Share of the five (%)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Germany<\/td>\n<td align=\"right\">1,916.9<\/td>\n<td align=\"right\">36.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">France<\/td>\n<td align=\"right\">1,023.3<\/td>\n<td align=\"right\">19.4<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Netherlands<\/td>\n<td align=\"right\">1,009.3<\/td>\n<td align=\"right\">19.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Italy<\/td>\n<td align=\"right\">738.5<\/td>\n<td align=\"right\">14.0<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Spain<\/td>\n<td align=\"right\">574.8<\/td>\n<td align=\"right\">10.9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Germany has the largest share<\/strong>, and at 36.4 percent it is almost twice as large as the next country, but it does not account for a majority. With only five countries a bar chart makes differences easier to compare, because lengths are read more accurately than areas. France and the Netherlands, for instance, are hard to separate in a treemap. The treemap's advantage is showing the parts of a whole, and it becomes more valuable as the number of parts increases.<\/p>\n"},{"kind":"e","n":4,"ask":"<p><strong>Exercise 4: Renewable energy, your choice of chart.<\/strong> Download data from the World Bank on renewable energy consumption (% of total final energy consumption, <code>EG.FEC.RNEW.ZS<\/code>) for 2021 for Germany (DEU), Poland (POL), North Macedonia (MKD), Serbia (SRB), Albania (ALB), the United States (USA), China (CHN) and India (IND). Choose and draw the chart that you think best shows the difference in the share of renewable energy between these countries. Then write a short analysis answering these questions. Which type of chart did you choose, and why? Are there clear differences between developed and developing countries? Does any country deviate significantly from the others?<\/p>\n","answer":"<p>A sorted horizontal bar chart is the best choice, since we are comparing one number across eight countries.<\/p>\n<pre><code class=\"language-r\">library(WDI)\nlibrary(ggplot2)\nd &lt;- WDI(country = c(&quot;DEU&quot;, &quot;POL&quot;, &quot;MKD&quot;, &quot;SRB&quot;, &quot;ALB&quot;, &quot;USA&quot;, &quot;CHN&quot;, &quot;IND&quot;),\n         indicator = c(renewables = &quot;EG.FEC.RNEW.ZS&quot;), start = 2021, end = 2021)\nggplot(d, aes(renewables, reorder(country, renewables))) +\n  geom_col(fill = &quot;steelblue&quot;) +\n  labs(title = &quot;Renewable energy, 2021&quot;, x = &quot;% of final energy consumption&quot;, y = NULL)\n<\/code><\/pre>\n<p>World Bank data, downloaded on 10 November 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Country<\/th>\n<th align=\"right\">Renewables, % of final energy use, 2021<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Albania<\/td>\n<td align=\"right\">41.9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">India<\/td>\n<td align=\"right\">34.9<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Serbia<\/td>\n<td align=\"right\">27.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">North Macedonia<\/td>\n<td align=\"right\">19.5<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Germany<\/td>\n<td align=\"right\">17.6<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">China<\/td>\n<td align=\"right\">15.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Poland<\/td>\n<td align=\"right\">15.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">United States<\/td>\n<td align=\"right\">10.9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>There is <strong>no simple split between developed and developing countries<\/strong>. The richest countries here are among the lowest, while India and Albania are the highest. <strong>Albania stands out<\/strong>, thanks largely to hydropower, and India's share includes traditional biomass. A high share can therefore reflect modern wind and solar, hydropower or a reliance on traditional fuels, so a high value does not by itself indicate a &quot;green&quot; or a rich economy.<\/p>\n"},{"kind":"e","n":5,"ask":"<p><strong>Exercise 5: A Phillips curve for Europe.<\/strong> Use the table you prepared in Chapter 3 (Exercise 3), with official Eurostat data for all European countries in 2022, containing the ISO3 code of the country, the year, the unemployment rate and inflation. Choose and draw the chart that best shows the relationship between inflation and unemployment in Europe in 2022. Think about which type of chart best shows a relationship between two quantitative variables. Add a title, label the axes and, if you think it appropriate, add a trend line. Then answer these questions. Is there a negative relationship between inflation and unemployment, as the Phillips curve predicts? Are there countries that deviate significantly from the general pattern? (Consider what Türkiye does to your chart.)<\/p>\n","answer":"<p>A <strong>scatter plot<\/strong> is the right chart. Using <code>eurostat_2022_tidy.csv<\/code> (33 countries):<\/p>\n<pre><code class=\"language-r\">library(ggplot2)\ne &lt;- read.csv(&quot;data/eurostat_2022_tidy.csv&quot;)\nggplot(e, aes(unemployment_rate, inflation_rate, label = iso3c)) +\n  geom_point() + geom_text(vjust = -0.6, size = 2.5) +\n  geom_smooth(method = &quot;lm&quot;, se = FALSE) +\n  labs(title = &quot;Inflation and unemployment in Europe, 2022&quot;,\n       x = &quot;Unemployment rate (%)&quot;, y = &quot;Inflation (%)&quot;)\n<\/code><\/pre>\n<p>There is <strong>no negative relationship<\/strong>. The correlation is <strong>+0.27<\/strong> with all countries. Türkiye, at 72.3 percent inflation, stretches the vertical axis and drives that result, and without it the correlation is only <strong>+0.06<\/strong> (32 countries). Other notable points are North Macedonia (14.4 percent unemployment and 14.0 percent inflation) and Estonia, Lithuania and Latvia, with inflation of 17 to 19 percent. A single year across countries is not a test of the Phillips curve in any case, because countries differ in institutions and expected inflation, and 2022 was dominated by an energy price shock.<\/p>\n"},{"kind":"e","n":6,"ask":"<p><strong>Exercise 6: Wages in North Macedonia (MakStat).<\/strong> Using the tidy <code>wages<\/code> table from Chapter 3, draw a line chart of the net wage in three sectors of your choice since 2005. Label the lines directly instead of using a legend. Then look for a price index in MakStat and redraw the chart in real terms. How does the story change?<\/p>\n","answer":"<p>Using agriculture, manufacturing and finance as examples, the annual average net wage changed as follows. Prices are from Eurostat's harmonised index for North Macedonia, which rose from 80.44 in 2005 to 149.14 in 2025 (<code>prc_hicp_aind<\/code>, <code>INX_A_AVG<\/code>, <code>CP00<\/code>). MakStat's own consumer price index is an alternative source and may give slightly different results.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Sector<\/th>\n<th align=\"right\">2005 (denars)<\/th>\n<th align=\"right\">2025 (denars)<\/th>\n<th align=\"right\">Nominal multiple<\/th>\n<th align=\"right\">Real multiple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">Agriculture<\/td>\n<td align=\"right\">9,760<\/td>\n<td align=\"right\">35,239<\/td>\n<td align=\"right\">3.61<\/td>\n<td align=\"right\">1.95<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Manufacturing<\/td>\n<td align=\"right\">10,223<\/td>\n<td align=\"right\">39,986<\/td>\n<td align=\"right\">3.91<\/td>\n<td align=\"right\">2.11<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">Finance<\/td>\n<td align=\"right\">26,098<\/td>\n<td align=\"right\">62,143<\/td>\n<td align=\"right\">2.38<\/td>\n<td align=\"right\">1.28<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<pre><code class=\"language-r\"># real wage = nominal wage / (price index / 100)\nwages$real &lt;- wages$net_wage / (wages$price_index / 100)\n<\/code><\/pre>\n<p>To label lines directly, use <code>annotate(&quot;text&quot;, ...)<\/code> or <code>geom_text()<\/code> on the last point of each line, and set <code>guide = &quot;none&quot;<\/code> on the colour scale.<\/p>\n<p>The story changes in two ways. Real gains are much smaller than the nominal numbers suggest, because prices rose by about 85 percent. The gap between sectors also narrowed: finance grew far more slowly in real terms than manufacturing and agriculture.<\/p>\n"},{"kind":"e","n":7,"ask":"<p><strong>Exercise 7: Fix a bad chart.<\/strong> Take the data from the figure in the chapter. Decide on one message you want to convey, and draw the simplest chart that shows it. Explain in two sentences what you removed and why.<\/p>\n","answer":"<p>There are many valid answers. One clear message is that <strong>the 2009 crisis hit almost every country at once, and Poland escaped<\/strong>. Growth in 2009 was between about −3 and −6 percent in the other nine countries, but +2.6 percent in Poland.<\/p>\n<pre><code class=\"language-r\">library(dplyr)\nlibrary(ggplot2)\nd &lt;- read.csv(&quot;data/ten_countries_panel.csv&quot;, check.names = FALSE) %&gt;%\n  filter(year == 2009)\nggplot(d, aes(`GDP growth`, reorder(country, `GDP growth`),\n              fill = country == &quot;Poland&quot;)) +\n  geom_col(show.legend = FALSE) +\n  labs(title = &quot;Poland alone grew in 2009&quot;, x = &quot;GDP growth (%)&quot;, y = NULL)\n<\/code><\/pre>\n<p>I removed three indicators and nineteen years because they did not bear on the message. I replaced the ten overlapping lines with a sorted bar chart that makes the one exception stand out.<\/p>\n"},{"kind":"e","n":8,"ask":"<p><strong>Exercise 8 (AI): The harsh critic.<\/strong> Choose your chart from Exercise 4 and use the &quot;Ask for a harsh critic&quot; prompt. Which suggestions do you accept, and which do you reject? Why? Include both versions of the chart.<\/p>\n","answer":"<p>The result depends on your chart. Typical valid suggestions are to sort the bars, to add the unit and year, and to state the source. Reject suggestions that add decoration, or claims about causes that your data cannot support. Include both versions, and give a specific reason for each decision.<\/p>\n"},{"kind":"e","n":9,"ask":"<p><strong>Exercise 9 (AI): Catch the chatbot's chart.<\/strong> Ask a chatbot to write code for a bar chart of the population of the Western Balkan countries, without specifying anything else. Run it, then apply the checklist in Section 4.6. Next, ask it to produce a chart that makes the differences between the countries look as large as possible. What did it change? How would you spot this in someone else's chart?<\/p>\n","answer":"<p>Check the result against the book's checklist: the right data, an axis starting at zero, units, a stated source, and colours that carry meaning. When asked to exaggerate differences, a chatbot will typically <strong>truncate the y-axis<\/strong>, or sometimes use area or a three-dimensional effect. In someone else's chart, look first at the number where the axis begins, and compare the bar lengths with the numbers actually shown.<\/p>\n"}],"solutions_mk":[{"kind":"q","n":1,"ask":"<p>Замислете дека имате податоци за БДП, инфлацијата и невработеноста за 15 држави во текот на 25 години. Дали би ги прикажале сите во еден графикон? Објаснете ја вашата одлука.<\/p>\n","answer":"<p>Не. Еден график со 15 држави, три показатели и 25 години би го преоптоварил читателот. Прво одлучете ја пораката, а потоа поделете ги информациите на неколку едноставни графици, на пример по еден показател на график или мал избор на држави.<\/p>\n"},{"kind":"q","n":2,"ask":"<p>Зошто линискиот графикон е подобар избор од кружниот за прикажување промени низ времето?<\/p>\n","answer":"<p>Линискиот график покажува како вредноста се развива од еден период до следниот, со времето на хоризонталната оска. Кружниот график ги прикажува уделите во целината во еден момент, па нема начин да покаже раст или опаѓање.<\/p>\n"},{"kind":"q","n":3,"ask":"<p>Наведете ги трите најчести грешки при изработка на визуализација и објаснете ги со примери.<\/p>\n","answer":"<ul>\n<li><strong>Погрешен вид график:<\/strong> прикажување на растот на БДП низ времето со кружен график.<\/li>\n<li><strong>Премногу информации:<\/strong> четири показатели за десет држави низ дваесет години на еден графикон.<\/li>\n<li><strong>Несоодветни бои:<\/strong> карта на БДП со неповрзани, подеднакво силни бои, што кријат кои држави се поголеми.<\/li>\n<\/ul>\n"},{"kind":"q","n":4,"ask":"<p>Што се случува кога визуализацијата содржи премногу информации?<\/p>\n","answer":"<p>Гледачите не знаат каде да го насочат вниманието и не можат брзо да ја сфатат главната порака. Утврдете што е важно за публиката, задржете го само она што ја поддржува поентата, а остатокот поделете го на неколку графици.<\/p>\n"},{"kind":"q","n":5,"ask":"<p>Објаснете како изборот на боја може да влијае врз толкувањето на визуализацијата.<\/p>\n","answer":"<p>Бојата го насочува вниманието и може да укаже на редослед. Една боја што оди од светла кон темна веднаш покажува кои вредности се поголеми, додека неповрзани светли бои не кажуваат ништо за редоследот. Премногу слични бои предизвикуваат погрешно читање, а црвената и зелената не можат да ги разликуваат далтонистите, освен ако не додадете ознаки или видови линии.<\/p>\n"},{"kind":"q","n":6,"ask":"<p>Дали некоја визуализација може намерно да се направи така што ќе води до погрешен заклучок? Како?<\/p>\n","answer":"<p>Да. Скратена оска на столбест график прави мали разлики да изгледаат огромни, а превртена оска може пораст да го прикаже како пад. Други начини се избор само на поволен период, користење логаритамска скала без да се каже и изоставување на контекстот. Графикот може да заведува без да содржи ниту една лажна бројка.<\/p>\n"},{"kind":"q","n":7,"ask":"<p>Кои се трите главни компоненти во структурата на пакетот <code>ggplot<\/code> во R?<\/p>\n","answer":"<p><strong>Податоците<\/strong>, <strong>естетското пресликување<\/strong> (<code>aes()<\/code>), кое ги поврзува променливите со визуелни својства како <code>x<\/code>, <code>y<\/code> и боја, и <strong>геометрискиот објект<\/strong> (<code>geom_*<\/code>), кој го одредува видот на графикот. Дополнителни слоеви како <code>labs()<\/code> и <code>theme()<\/code> го прилагодуваат резултатот.<\/p>\n"},{"kind":"q","n":8,"ask":"<p>Која е разликата меѓу повиците <code>geom_point()<\/code> и <code>geom_line()<\/code> во пакетот <code>ggplot<\/code> во R?<\/p>\n","answer":"<p><code>geom_point()<\/code> црта посебна точка за секое набљудување, како кај дијаграм на расејување. <code>geom_line()<\/code> ги поврзува набљудувањата со линија, по редослед на оската x, како кај временска серија.<\/p>\n"},{"kind":"q","n":9,"ask":"<p>Имате податоци за извозот по сектори (земјоделство, индустрија, услуги) за период од 10 години. Кој графикон би го избрале за да прикажете (а) структура на извозот во една година и (б) како структурата се менува низ времето? Објаснете ја разликата во изборот.<\/p>\n","answer":"<p>(а) Столбест график, или кружен график бидејќи има само три дела, затоа што прикажувате удели во целината во еден момент. (б) Натрупан површински график, бидејќи ги прикажува уделите и како тие се менуваат низ времето. Првото прашање има еден временски период, а второто десет.<\/p>\n"},{"kind":"q","n":10,"ask":"<p>Дали дрвовидната карта е секогаш подобра алтернатива на кружниот графикон? Во кои ситуации би го избрале едниот или другиот?<\/p>\n","answer":"<p>Не. Кружниот график е брз и добро функционира со неколку делови. Дрвовидната карта е подобра со многу делови или кога деловите имаат хиерархија, бидејќи многу тенки парчиња од круг не може да се прочитаат.<\/p>\n"},{"kind":"q","n":11,"ask":"<p>Имате податоци за инфлацијата во 30 држави во една година. Кој графикон би бил најсоодветен ако сакате (а) да ги споредите државите и (б) да ја видите распределбата на инфлацијата? Објаснете ја разликата.<\/p>\n","answer":"<p>(а) Подреден столбест график, кој ја прикажува вредноста на секоја држава и ги рангира. (б) Хистограм или кутиест дијаграм, кој покажува како се распределени вредностите и ги крие поединечните држави. Првиот одговара на „кој каде е?“, а вториот на „како изгледа распределбата?“.<\/p>\n"},{"kind":"q","n":12,"ask":"<p>Ако сакате да покажете дека две економски променливи се силно поврзани, зошто столбестиот графикон не е добар избор?<\/p>\n","answer":"<p>Столбестиот график споредува категории, па може јасно да прикаже само една променлива по категорија. Дијаграмот на расејување го поставува секое набљудување според двете променливи одеднаш, така што стануваат видливи насоката и јачината на врската.<\/p>\n"},{"kind":"q","n":13,"ask":"<p>Графиконот со наслагани површини покажува и вкупна вредност и структура. Објаснете во која ситуација овој графикон може погрешно да се протолкува.<\/p>\n","answer":"<p>Само долната лента има рамна основа. Горните ленти лежат врз лентите под нив, па една лента може да изгледа дека расте или опаѓа само затоа што се промениле оние под неа. Затоа е лесно да се згреши при споредување на големината на горните ленти низ времето.<\/p>\n"},{"kind":"q","n":14,"ask":"<p>Зошто оската на столбест графикон треба да почнува од нула? Дали истото правило важи и за линиски графикон?<\/p>\n","answer":"<p>Столбовите ја прикажуваат големината преку должината, па оска што не почнува од нула ги искривува соодносите меѓу нив. Линискиот график ја прикажува промената преку положба и наклон, а не преку должина, па истото правило не важи, иако оската мора да биде јасно означена и не треба да преувеличува мали движења.<\/p>\n"},{"kind":"q","n":15,"ask":"<p>Што покажувал дијаграмот на Флоренс Најтингејл и зошто таа го нацртала наместо да објави табела?<\/p>\n","answer":"<p>Покажа дека многу повеќе војници умреле од болести што можеле да се спречат отколку од рани во битка. Таа го нацрта бидејќи службените лица тешко дека би читале долги табели, додека графиконот веднаш ја искажувал поентата. Беше дизајниран како аргумент за публика способна да дејствува, а следеше санитарна реформа.<\/p>\n"},{"kind":"q","n":16,"ask":"<p>Што се случило со Филипсовата крива во 1970-тите и што нè учи тоа за врските што ги гледаме во графиконите?<\/p>\n","answer":"<p>Инфлацијата и невработеноста растеа заедно, што според кривата не требаше да се случи. Корелацијата беше −0.83 за 1961 до 1969 и −0.08 за 1970 до 1983. Очекуваната инфлација се вградува во платите, а шоковите на цената на нафтата ги зголемија трошоците. Шема видена на график можеби нема да трае, затоа погледнете ги датумите.<\/p>\n"},{"kind":"q","n":17,"ask":"<p>Зошто БДП на Северна Македонија се намалил во долари во 2015 додека реалниот БДП пораснал?<\/p>\n","answer":"<p>Денарот е врзан за еврото, а во 2015 еврото нагло падна во однос на доларот. Доларската вредност на сето произведено падна за 11.4 проценти, додека производството мерено во постојани денарски цени порасна за 3.9 проценти. Помалку долари го мереа истото или поголемо производство.<\/p>\n"},{"kind":"q","n":18,"ask":"<p>Зошто е корисно приказната да се наведе во промптот до четбот со AI наместо само да се побара графикон?<\/p>\n","answer":"<p>Приказната му кажува на четботот што мора да покаже графикот. Голото барање дава општа слика, додека наведената порака води кон соодветен вид график, истакнување и наслов.<\/p>\n"},{"kind":"e","n":1,"ask":"<p><strong>Вежба 1: Растот во Западен Балкан.<\/strong> Преземете податоци од Светската банка за растот на БДП (годишен %, <code>NY.GDP.MKTP.KD.ZG<\/code>) за Северна Македонија (MKD), Србија (SRB) и Албанија (ALB) за периодот од 2000 до 2022. Нацртајте линиски графикон што го покажува економскиот раст низ времето, со различна боја за секоја држава. Додајте наслов и означете ги оските. Потоа одговорете на следниве прашања. Дали сите три држави реагирале слично во 2008 до 2009, за време на финансиската криза? Која држава има најголеми осцилации низ времето? Дали имало период на негативен раст во сите држави?<\/p>\n","answer":"<pre><code class=\"language-r\">library(WDI)\nlibrary(ggplot2)\n\ngrowth &lt;- WDI(country = c(&quot;MKD&quot;, &quot;SRB&quot;, &quot;ALB&quot;),\n              indicator = c(growth = &quot;NY.GDP.MKTP.KD.ZG&quot;),\n              start = 2000, end = 2022)\n\nggplot(growth, aes(year, growth, color = country)) +\n  geom_line() +\n  geom_hline(yintercept = 0, linetype = &quot;dashed&quot;) +\n  labs(title = &quot;GDP growth in the Western Balkans, 2000 to 2022&quot;,\n       x = NULL, y = &quot;Annual growth (%)&quot;, color = NULL)\n\n# To measure the size of the fluctuations:\naggregate(growth ~ country, growth, sd)\n<\/code><\/pre>\n<p>Податоци од Светската банка, преземени на 10 ноември 2026.<\/p>\n<table>\n<thead>\n<tr>\n<th align=\"left\">Година<\/th>\n<th align=\"right\">Албанија<\/th>\n<th align=\"right\">Северна Македонија<\/th>\n<th align=\"right\">Србија<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td align=\"left\">2008<\/td>\n<td align=\"right\">6.9<\/td>\n<td align=\"right\">5.5<\/td>\n<td align=\"right\">5.2<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2009<\/td>\n<td align=\"right\">2.7<\/td>\n<td align=\"right\">−0.4<\/td>\n<td align=\"right\">−3.1<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2010<\/td>\n<td align=\"right\">3.0<\/td>\n<td align=\"right\">3.4<\/td>\n<td align=\"right\">1.6<\/td>\n<\/tr>\n<tr>\n<td align=\"left\">2020<\/td>\n<td align=\"right\">−3.3<\/td>\n<td align=\"right\">−4.7<\/td>\n<td align=\"right\">−1.0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Трите држави не реагираа исто во 2009.<\/strong> Албанија продолжи да расте со 2.7 проценти, Северна Македонија беше речиси без промена со −0.4 проценти, а Србија се намали за 3.1 проценти. <strong>Србија има најголеми флуктуации<\/strong>, со стандардна девијација од 3.2 поени, наспроти 2.8 за Албанија и 2.7 за Северна Македонија. <strong>2020 е единствената година во која сите три имаа негативен раст.<\/strong><\/p>\n"},{"kind":"e","n":2,"ask":"<p><strong>Вежба 2: Споредување на доходите.<\/strong> Преземете податоци од Светската банка за БДП по жител (GDP per capita; тековни американски долари, <code>NY.GDP.PCAP.CD<\/code>) за Германија (DEU), Полска (POL) и Бугарија (BGR) за 2022. Нацртајте столбест графикон што го споредува доходот по жител во ов
